ia":0,"flag":"asked_who_the_gap_is_for","next":""},{"text":"不问。先把她放笔这个动作记下来","affectionWho":"艾莉丝","affection":1,"insomnia":0,"flag":"noted_pen_down","next":""}]},{"type":"narration","text":"她说完就把手放在文件上，手指压着那行红笔圈。压的位置正好是「预计」两个字。","label":"l04"},{"type":"narration","text":"我把这个动作记住了：她不信预测，可她在按着它。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"还有一件。今晚不要吃药。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"为什么？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"因为你已经四个星期没睡了。药只会让你躺在床上睁着眼。今晚你会经历第一次真正的失眠，我想知道它会给你看什么。"},{"type":"narration","text":"她说这句话的时候，语气还是没有温度。可我注意到，她多解释了一句，而不是像前面那样只给结论。"},{"type":"choice","text":"","prompt":"今晚不要吃药。她说这话时多解释了一句。","options":[{"text":"问她：不吃药的话，我会看见什么","affectionWho":"艾莉丝","affection":3,"insomnia":1,"flag":"asked_what_he_will_see","next":""},{"text":"不问。把她多说的那半句记牢","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"kept_the_extra_half","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"如果看到画面，记住三样东西：是谁的视角，是什么时候，还有画面里有没有你。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"为什么要有我？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"因为在别人的记忆里出现你自己的时候，那段记忆就已经不是别人的了。"},{"type":"narration","text":"我把这句话记住了。我记住的方式是把整句话连着她说这话时的样子一起存起来，包括她袖口上那颗掉了一半漆的袖扣。"},{"type":"choice","text":"","prompt":"她要我记住三样东西。我要不要问最后一句？","options":[{"text":"问最后一个问题：为什么画面里要有我","affectionWho":"艾莉丝","affection":2,"insomnia":1,"flag":"asked_why_me_in_frame","next":""},{"text":"把三样东西在心里排好顺序","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"ordered_the_three_things","next":""}]},{"type":"narration","text":"离开实验舱的时候，走廊还是那么安静。我回头看了一次，她已经在写下一份文件了，头也没抬。"},{"type":"narration","text":"走到闸机口，那个负责登记的人把通行卡收走，顺手递给我一张打印单。上面是我的睡眠记录，最后一行用红笔圈了一道。"},{"type":"narration","text":"圈里的字是：预计今晚进入首次完全失眠。旁边是手写的小注，字很小：观测对象自愿，无需召回。"},{"type":"narration","text":"我把打印单对折，塞进外套内袋。纸很薄，折起来的时候能感觉到兜里那块碎片隔着布料顶了一下，像有人在里面轻轻应了一声。"},{"type":"choice","text":"","prompt":"打印单上写着观测对象自愿。我要怎么处置这四个字？","options":[{"text":"把「自愿」两个字折进最里面","affectionWho":"艾莉丝","affection":-2,"insomnia":1,"flag":"folded_the_word_voluntary","next":""},{"text":"对着那行小注问一句：谁问过我","affectionWho":"艾莉丝","affection":3,"insomnia":1,"flag":"asked_who_consented","next":""}]},{"type":"narration","text":"自愿。我确实没有拒绝，因为我根本不知道自己被问过同意。"},{"type":"narration","text":"上车的时候是正午。玻璃幕墙上的反光扫过我的脸，我在车窗里看见自己的眼睛，颜色比早上深了一点，深得不太像蓝。"},{"type":"narration","text":"车开出去两百米，我从兜里摸出那张读者卡看了一眼。塑封上的裂纹比昨晚长了一点，像是被谁在夜里轻轻推着往前爬。"},{"type":"narration","text":"我把卡按回兜里，没有再拿出来。车窗外的街一栋一栋往后退，每一栋楼的外墙都干净得像是刚刚被人重新誊写过一遍。"}]},"1-3":{"sceneId":"1-3","chapter":"第一幕·异变初现","title":"第一次失眠","background":"bg_dorm_night","bgm":"bgm_insomnia","dense":true,"next":"1-4","lines":[{"type":"narration","text":"第三天，三月十四日。白天我什么都没做。"},{"type":"narration","text":"老周便条上写的是别来上班。我真的没去。我在宿舍里坐了一整天，把地板上的灰推成一条线，又从中间划开。"},{"type":"narration","text":"研究生宿舍是单人间，四平米多一点，一张床，一张桌子，一扇朝北的窗。没有室友，这是我当初选它的理由。"},{"type":"narration","text":"今天这个理由变成了另一种东西。没有人可以问我现在是几点，也没有人可以替我说一句你今天看起来不太对。"},{"type":"choice","text":"","prompt":"便条上写着别来上班。白天我打算怎么过？","options":[{"text":"把屋子收拾一遍，让手别停下来","affectionWho":"","affection":0,"insomnia":-2,"flag":"cleaned_the_room","next":""},{"text":"坐在窗边等天黑，什么也不做","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_for_night","next":""}]},{"type":"narration","text":"研究所那张打印单我贴在墙上。最后一行被红笔圈着，预测今晚进入首次完全失眠。"},{"type":"narration","text":"下午三点我试着睡。躺了四十分钟，闭上眼也能看见天花板的裂缝，连眼睛闭没闭都不确定了。"},{"type":"narration","text":"傍晚下了一场雨。雨停之后，宿舍楼下的路灯亮起来，光是橙的，从窗帘缝里切进来一道，落在我的被子上，像一条很窄的河。"},{"type":"narration","text":"十一点熄灯。我躺下，把手放在胸口，开始数心跳。"},{"type":"narration","text":"一二三，一二三。数到两百多的时候我停了，因为那个节奏变了。"},{"type":"choice","text":"","prompt":"心跳的节奏变了。我要不要停下来听清楚？","options":[{"text":"停下来数那个节奏，数到它能对上表","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_new_rhythm","next":"#l01"},{"text":"不管它，继续躺着等天亮","affectionWho":"","affection":0,"insomnia":0,"flag":"ignored_the_rhythm","next":""}]},{"type":"narration","text":"我数到两百下的时候，它停了半秒。那半秒里我听见了别的东西。","label":"l01"},{"type":"narration","text":"是很浅的呼吸。它不在房间里，在我耳朵后面，和心跳用同一个位置。"},{"type":"narration","text":"心跳从一二三变成了二点七秒一次。我不用看表就知道，这个数字已经在我身上待了两天。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"房间开始不正常地亮。不是灯亮，是每一样东西的边缘亮起来，桌角、门缝、杯子口，全都在微微发白。"},{"type":"narration","text":"我睁开眼。天花板上的裂缝有七条，我数过很多次。今晚有九条。"},{"type":"narration","text":"多出来的两条很细，从灯座往两边分，分出去的方向正好对着窗户和门。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"……我在数天花板。天花板也在数我。"},{"type":"choice","text":"","prompt":"天花板多出两条裂缝，方向对着窗和门。我要起来看吗？","options":[{"text":"起来，顺着裂缝的方向看一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_the_cracks","next":""},{"text":"躺着不动，把它当成眼花","affectionWho":"","affection":0,"insomnia":0,"flag":"called_it_an_illusion","next":""}]},{"type":"narration","text":"楼道里有脚步声。很轻，一步一顿，从走廊那头过来，走到我门口的时候慢了一下，然后又继续往前。"},{"type":"narration","text":"第二遍的时候，我听见那个脚步在我门口完全停住了。停了大概十秒，接着走了。"},{"type":"narration","text":"第三遍它没有来。换成了一种更近的声音——钟表走针的声音，就在我的房间里。"},{"type":"narration","text":"这间房里没有钟。我看过，桌子底下、床板背面、柜子顶上都看过。可针走的声音很清楚，一秒一下，一点都不马虎。"},{"type":"choice","text":"","prompt":"钟表声在屋里，可这间房没有钟。我要不要找它？","options":[{"text":"起来找，把每一个角落都翻一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"searched_for_the_clock","next":""},{"text":"先躺回去，等那个声音自己停","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_for_the_clock_to_stop","next":""}]},{"type":"narration","text":"我坐起来去摸手机。屏幕上四点十七分，可显示屏的光是冷的，冷得偏蓝。"},{"type":"narration","text":"然后我第一次注意到，手机上的时间在走，但走得不匀速。有时一秒跳两下，有时三秒跳一下。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"手机坏了吗。"},{"type":"narration","text":"我说完这句话，才听见自己说话的时候声音绕了一点弯，像有半句话是从别人嘴里出来的。"},{"type":"narration","text":"味道先来的。粉笔灰，食堂炸东西的油，还有一点点洗衣粉。这三样东西不可能出现在我的宿舍里。"},{"type":"choice","text":"","prompt":"屋里有三种不属于这里的味道。我先追哪一样？","options":[{"text":"先追粉笔灰，它最不像宿舍的东西","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_chalk_dust","next":""},{"text":"先追洗衣粉，那说明有人动过我的衣服","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_soap_smell","next":""}]},{"type":"narration","text":"我掀开被子下床，摸到桌边的杯子。杯子里的水是温的，可我一整天没有烧过水。"},{"type":"narration","text":"第一个片段是这时候出现的。很干净，不到两秒：一间教室，下午，窗户开着，黑板右下角写着值日生的名字。"},{"type":"narration","text":"我没有上过那间教室。桌子是浅木色的，边缘有掉漆，我们学校的桌子是深灰的。"},{"type":"narration","text":"第二个片段长一点。有人的手在翻一本书，翻得很快，翻到某一页停下来，用铅笔在旁边画了一道。"},{"type":"choice","text":"","prompt":"第一个片段是间陌生教室。我要不要先看桌子？","options":[{"text":"低头看桌沿的掉漆，认一认是哪一年","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_desk_edge","next":""},{"text":"只看黑板上的名字，别的地方不碰","affectionWho":"","affection":0,"insomnia":0,"flag":"read_only_the_names","next":""}]},{"type":"narration","text":"那本书的封面是墨绿的，画着一堆管线的走向。我看清了几个字：新东京地下管网图。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"我心里咯噔了一下。那种咯噔不在脑子里，在胃里，往下一沉，然后整个人清醒了半度。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"苏禾借过这本书。二一一〇年十一月三日。"},{"type":"narration","text":"我说出这个日期的时候，舌头一点也不绕。可这个日期我从来没有背过，我只在前天晚上看过一眼卡片背面。"},{"type":"narration","text":"第三个片段最清楚。有人站在一栋楼的外面，抬头看。楼很高，玻璃幕墙上嵌着很细的金属线。天是灰的。"},{"type":"choice","text":"","prompt":"第二个片段里有人翻那本管网图。我要跟上去吗？","options":[{"text":"跟着那双手，看它翻到第几页","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_the_hands","next":"#l02"},{"text":"退开半步，先记住封面那几个字","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_cover_title","next":""}]},{"type":"narration","text":"那双手翻到第三区那一页就停了。停的地方有一个铅笔画的圈，圈里写着两个字：别进。","label":"l02"},{"type":"narration","text":"写字的人和借书的人不是同一个。这一点我从笔画的力气上看得出来。"},{"type":"narration","text":"那是研究所。角度是从马路对面看过去的，比我今天站的位置远一些，也低一些，像是有人蹲在路边仰着头看。"},{"type":"choice","text":"","prompt":"第三个片段拍的是研究所。画面里那个人是谁？","options":[{"text":"先记下那个人在朝哪一边看","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_the_girl_gaze","next":""},{"text":"明天问艾莉丝：十年前谁站在研究所门口","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"asked_alice_about_the_girl","next":""},{"text":"先不追人，把校服的年份记牢","affectionWho":"","affection":0,"insomnia":0,"flag":"held_the_uniform_year","next":""}]},{"type":"narration","text":"然后那个人转过头。不是转过来看我，是转过去看别的方向。可我看见了她的侧脸：眉骨高，嘴角往下压着。"},{"type":"narration","text":"她穿的校服领子，是十年前的那一款。袖口有墨点。"},{"type":"narration","text":"画面到这里断了。不是黑掉，是被叠上一层我自己的房间，两种画面同时存在，谁都没有把谁盖住。"},{"type":"choice","text":"","prompt":"第三个片段里她转过头。我要不要记住那张脸？","options":[{"text":"记住她的侧脸，眉骨和嘴角都记","affectionWho":"","affection":0,"insomnia":1,"flag":"memorized_her_profile","next":""},{"text":"只记校服款式，脸留着以后再看","affectionWho":"","affection":0,"insomnia":1,"flag":"kept_only_the_uniform","next":""}]},{"type":"narration","text":"我看见我的桌子和那间教室叠在一起，我的椅子下面是一块浅木色的地板。"},{"type":"narration","text":"我伸手去按桌边，手穿过去，摸到的是很凉的木头，凉得不像我这张桌子的温度。"},{"type":"narration","text":"我把手抽回来，摊开。掌纹里最深那一条正在发烫，和前天晚上那块碎片烫的位置一模一样。"},{"type":"narration","text":"记忆里的细节比我自己的记忆清楚。我记得不清今天中午吃了什么，却知道那间教室黑板右下角写的值日生叫阮宁。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"阮宁。我不认识叫阮宁的人。"},{"type":"choice","text":"","prompt":"值日生的名字叫阮宁。我为什么要说出它？","options":[{"text":"再说一遍这个名字，说给自己听","affectionWho":"","affection":0,"insomnia":1,"flag":"said_ruanning_twice","next":""},{"text":"闭上嘴，把这个名字先压下去","affectionWho":"","affection":0,"insomnia":0,"flag":"swallowed_the_name","next":""}]},{"type":"narration","text":"可我说出这个名字的时候，胸口轻轻动了一下，像是有人在我的肋骨上敲了一记。"},{"type":"narration","text":"我站起来，走到窗边。窗帘缝里那道橙光还在，位置没有变。我盯着它看了很久，才意识到一件事。"},{"type":"narration","text":"路灯不会一直停在同一个位置。它会随着时间移动，因为地球在转，光在变。这道光没动，说明时间没有在动。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"四点十七分。还是四点十七分。"},{"type":"narration","text":"我看手机，屏幕上仍然是四点十七分。秒数在走，分针没有动。"},{"type":"choice","text":"","prompt":"四点十七分不动了。我要不要跟自己确认一次？","options":[{"text":"对着表念一遍：四点十七分，没走","affectionWho":"","affection":0,"insomnia":1,"flag":"confirmed_the_stopped_time","next":""},{"text":"把手机扣在桌上，不去看它","affectionWho":"","affection":0,"insomnia":0,"flag":"turned_the_phone_over","next":""}]},{"type":"narration","text":"我坐在床边，开始怀疑自己是不是已经睡着过一段时间，只是这间房不肯让我出来。"},{"type":"narration","text":"第四个片段来了。这一次有声音，很低，像是从水里传上来的。"},{"type":"narration","text":"有人在叫一个名字。我听不清，但我知道那两个字不是阮宁，也不是苏禾。是一个我从来没有见过的人的名字，可我听的时候，眼眶热了一下。"},{"type":"choice","text":"","prompt":"有人在叫一个我不认识的名字。我要不要应声？","options":[{"text":"在心里应一声，看会有什么反应","affectionWho":"","affection":0,"insomnia":1,"flag":"answered_the_calling","next":""},{"text":"把耳朵堵上，等那个声音过去","affectionWho":"","affection":0,"insomnia":1,"flag":"blocked_the_calling","next":""}]},{"type":"narration","text":"为什么会热。这个问题比所有画面都让我害怕——身体认得的东西，脑子却不认得。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"不是我在做梦。是有人借着我的眼睛看东西。"},{"type":"narration","text":"我把这两句话说出来的时候，房间里的钟表声停了一拍，然后接着走。"},{"type":"narration","text":"我把水杯里的温水喝了。水还是有洗衣粉的味道。杯子放下的时候，我看见玻璃柜门上自己的脸。"},{"type":"choice","text":"","prompt":"话一出口，柜门上起了一小片雾。我承认吗？","options":[{"text":"承认，并且把这句话再说一遍","affectionWho":"","affection":0,"insomnia":1,"flag":"admitted_the_borrowed_eyes","next":"#l03"},{"text":"咽回去，先喝口水把心安下来","affectionWho":"","affection":0,"insomnia":0,"flag":"swallowed_the_admission","next":""}]},{"type":"narration","text":"那句话出口的时候，柜门的玻璃上起了一小片雾，像有人对着它呼吸。","label":"l03"},{"type":"narration","text":"雾散得比我呼出的任何一次都慢。它等了两秒才退，像在等我先说完。"},{"type":"narration","text":"柜门的玻璃很旧，反光一向很糊。可这一次它把我的眼睛照得很清楚。"},{"type":"narration","text":"瞳孔是蓝的。不是那种灯光映出来的蓝，是从瞳孔内部往外透的，像有人把一小块很薄的东西嵌在里面。"},{"type":"fx","fx":"flash","text":""},{"type":"choice","text":"","prompt":"瞳孔是蓝的。我要不要凑近看清楚？","options":[{"text":"凑近玻璃，看清那块蓝的形状","affectionWho":"","affection":0,"insomnia":1,"flag":"looked_close_at_the_blue","next":""},{"text":"后退一步，先把柜门关上","affectionWho":"","affection":0,"insomnia":1,"flag":"closed_the_cabinet_door","next":""}]},{"type":"cg","background":"cg_awaken_eye","text":"我凑近去看。凑得越近，那块蓝越清楚，它的形状和前天晚上我手心里那块碎片是同一种——边缘不整齐，中间有一点更亮的地方在慢慢转。"},{"type":"narration","text":"我后退一步。玻璃里的我也后退一步，但慢了一点点，慢的时间不长，大概就是半口气的长度。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"镜子里的你，慢半拍。"},{"type":"narration","text":"我一直以为那半拍是心跳在数。现在我看见它在镜子里出现了，出现在另一个人身上。"},{"type":"narration","text":"我把柜门关上，关上的一刻听见对面的声音停了。"},{"type":"choice","text":"","prompt":"镜子里的我慢半拍。我要不要再看一次？","options":[{"text":"再后退一次，看那半拍会不会变大","affectionWho":"","affection":0,"insomnia":1,"flag":"tested_the_half_beat","next":""},{"text":"不看第二遍，把这件事先记下来","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_down_the_half_beat","next":""}]},{"type":"narration","text":"房间里安静下来，只剩下钟表走针的声音。它还在，一秒一下，很稳。"},{"type":"narration","text":"我搬开桌子找它。桌子底下没有。我掀开床板，床板下面只有一层薄灰和一根干掉的鞋带。"},{"type":"narration","text":"最后我找到了。声音是从我自己的胸口出来的。"},{"type":"narration","text":"那个节奏和我心跳不一样。心跳在耳朵里，钟表声在胸口正中，两个节奏并排跑，互不干扰，像两个人各走各的路。"},{"type":"narration","text":"我坐回床上，把被子拉到腿上。窗外天还没有要亮的意思，那道橙光钉在那里，一动不动。"},{"type":"choice","text":"","prompt":"钟表声在我胸口。我要不要按住它？","options":[{"text":"把手按在胸口正中，压住那个节奏","affectionWho":"","affection":0,"insomnia":1,"flag":"pressed_the_chest_beat","next":""},{"text":"松开手，让两个节奏自己跑","affectionWho":"","affection":0,"insomnia":1,"flag":"let_both_rhythms_run","next":""}]},{"type":"narration","text":"我开始串词。想说的话到嘴边就换了别的词，比如我想说我睡不着，出口的是我数不着；我想说我害怕，出口的是我不认识我。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我数不着。我不认识我。"},{"type":"narration","text":"这两句话说出来，我居然觉得比原来那两句准确。我在心里给自己打了个分：语言正在失守，可是意思到了。"},{"type":"narration","text":"那间教室又浮上来一次。这一次我看见自己坐在最后一排的角落里，手里拿着一张借阅条。"},{"type":"narration","text":"借阅条上的字是我写的。写的是苏禾的名字，借的是那本管网图。"},{"type":"choice","text":"","prompt":"借阅条上的字是我写的。我要不要认这笔账？","options":[{"text":"认下这笔账，把条子上的字念一遍","affectionWho":"","affection":0,"insomnia":1,"flag":"owned_the_borrow_slip","next":""},{"text":"不认。那不是我活过的年份","affectionWho":"","affection":0,"insomnia":0,"flag":"denied_the_borrow_slip","next":""}]},{"type":"narration","text":"我不在那个年代。二一一〇年的时候我还没有出生。可我的手在写那张条子，写得比现在这双手还稳。"},{"type":"narration","text":"画面沉下去的时候，我发现自己在流汗。后背全湿了，被子粘在皮肤上，很难受。"},{"type":"narration","text":"我拧开台灯。灯是暖白的，照在手上的时候，我发现手指尖有一点点透明的光，很薄，像涂了一层水。"},{"type":"narration","text":"那层光往上一小段就没了。我举手对着灯看，光就停在我指节的位置，像一条无形的水位线。"},{"type":"choice","text":"","prompt":"指尖到指节那一段在发光。我要不要量一量？","options":[{"text":"用指甲在光停住的地方掐一道印","affectionWho":"","affection":0,"insomnia":1,"flag":"marked_the_glowing_span","next":"#l04"},{"text":"放下手，把台灯关掉再说","affectionWho":"","affection":0,"insomnia":0,"flag":"turned_off_the_desk_lamp","next":""}]},{"type":"narration","text":"掐下去的时候没有痛，只有一点凉。那道印留在指节上，比画上去的还直。","label":"l04"},{"type":"narration","text":"我把手举到灯下再看，光已经退了，印还在。它比记忆耐放。"},{"type":"narration","text":"也就是说，正在被时间动过的地方，是我从指尖到指节的这一段。"},{"type":"narration","text":"我不知道这意味着什么。我只知道我该做点什么，而不是坐在床上等那间教室自己再浮上来。"},{"type":"narration","text":"窗帘外面，天边有一点非常淡的灰。虽然那道橙光还没有动，但最远的云已经换了一层颜色。"},{"type":"narration","text":"我看了看那个不肯往前走的四点十七分，又看了看镜子里那双变蓝的眼睛。"},{"type":"choice","text":"","prompt":"指尖在发光，教室的画面又浮上来了。你要不要跟着它走完？","options":[{"text":"闭眼，跟着那段记忆走到底","affectionWho":"","affection":0,"insomnia":1,"flag":"followed_borrowed_memory","next":"1-3a"},{"text":"站起来，把灯全部打开，撑到天亮","affectionWho":"艾莉丝","affection":3,"insomnia":-2,"flag":"resisted_memory","next":""}]},{"type":"narration","text":"我照着选的那条路做了。结果差别很明显：房间里的钟表声要么停了，要么变得更响，中间没有第三种可能。"},{"type":"narration","text":"撑到最后的时候，四点半终于来了。手机上的分钟跳了一下，那道橙光跟着往被子上挪了半寸。"},{"type":"narration","text":"时间一恢复，我就开始发抖。不是冷的抖，是整夜绷着的东西忽然松开，身体不知道该把力气放在哪里。"},{"type":"narration","text":"天亮以后，我洗了脸，把镜子上的一层雾擦掉。眼睛是正常的深褐色，什么都不像。"},{"type":"choice","text":"","prompt":"天亮了，眼睛又变回深褐色。我要不要照第二遍？","options":[{"text":"照第二遍，确认那点蓝是不是藏起来了","affectionWho":"","affection":0,"insomnia":1,"flag":"checked_eyes_twice","next":""},{"text":"不照了。先把墙上那张单子补完","affectionWho":"","affection":0,"insomnia":0,"flag":"finished_the_wall_note","next":""}]},{"type":"narration","text":"我盯着镜子里的自己看了很久，直到确认那两只眼睛里有我认识的那个林晓，才把毛巾挂回去。"},{"type":"narration","text":"墙上那张打印单还在。我在红笔圈底下的空白处，用铅笔补了一行字：三月十四日，未睡，看见三个片段，其中一个是别人的。"},{"type":"narration","text":"写完我把铅笔放下。桌上有一张便签，是我自己昨晚写的：白天别睡，晚上会有人来找。"},{"type":"narration","text":"我不记得自己写过这张便签。可字迹是我的，和借阅簿上那三页、和借阅条上那一行，一模一样。"}]},"1-3a":{"sceneId":"1-3a","chapter":"第一幕·异变初现","title":"借来的记忆","background":"bg_memory_white","bgm":"bgm_sad","dense":true,"next":"1-4","lines":[{"type":"narration","text":"我闭了眼。这一次不是躺下，是往下落。"},{"type":"narration","text":"那种落没有失重感，也没有风。只是脚下的东西一层一层被抽掉，抽到最后连自己的重量都没有了。"},{"type":"fx","fx":"timeline","text":""},{"type":"narration","text":"睁开的时候，我在一间教室里。下午三点，第二节课刚下课，窗户开着，风把讲台上的粉笔灰吹起来一小片。"},{"type":"narration","text":"我没有身体。更准确地说，我有一个身体，但它不是我的——我比现在矮，比他矮，书包带子勒在左肩上。"},{"type":"choice","text":"","prompt":"我站在她的身体里，比现在矮。要不要先认这个名字？","options":[{"text":"先在心里把她的名字念一遍","affectionWho":"","affection":0,"insomnia":3,"flag":"spoke_her_name_inside","next":"#l01"},{"text":"不认。先看她接下来做什么","affectionWho":"","affection":0,"insomnia":5,"flag":"kept_her_at_arms_length","next":""}]},{"type":"narration","text":"念到第二个字的时候，喉咙自己动了一下，像我本来就会这个声音。","label":"l01"},{"type":"narration","text":"我停下来。可她还在往前走，脚步一点没乱。"},{"type":"narration","text":"我知道她的名字。这个名字就在我嘴里，随时可以喊出来，喊出来的时候舌头的动作太熟了，像已经喊过一万次。"},{"type":"narration","text":"黑板右下角写着值日生的名字，两个：苏禾，阮宁。"},{"type":"narration","text":"阮宁是坐在她左边的人。一个爱说话的女孩，说话的时候会把笔捏在手里转，转得不好，经常掉。"},{"type":"narration","text":"阮宁说，晚上去不去游戏厅。她说，不去，晚上要去图书馆。阮宁说，你天天去图书馆，图书馆又不会给你发糖。"},{"type":"choice","text":"","prompt":"阮宁在劝她去游戏厅。我要不要替她答一句？","options":[{"text":"在心里替她答：图书馆比较重要","affectionWho":"","affection":0,"insomnia":4,"flag":"answered_for_suhe","next":""},{"text":"不插话，听她自己怎么回","affectionWho":"","affection":0,"insomnia":2,"flag":"let_suhe_answer_alone","next":""}]},{"type":"narration","text":"她没有回答这句话。她把桌上的书塞进书包，动作很快，塞的时候先把一本墨绿封面的册子放在最里面，压在别的书下面。"},{"type":"narration","text":"那本册子的一角露出来，我看见了几个字：新东京地下管网图。"},{"type":"narration","text":"她的书包里为什么要有这个。这个问题在她脑子里待的时间比我想的要长——从教室一直跟到校门口。"},{"type":"narration","text":"出了校门往右，过两个路口，是历史图书馆。她走这段路走得很熟，路边的店换了招牌她都没看一眼。"},{"type":"choice","text":"","prompt":"她把管网图压在书包最里面。要不要看清那一角？","options":[{"text":"盯着露出的那一角，记住书名","affectionWho":"","affection":0,"insomnia":4,"flag":"fixed_on_the_book_corner","next":""},{"text":"看她的脸，别被那本书吸走","affectionWho":"","affection":0,"insomnia":2,"flag":"watched_her_face_instead","next":""}]},{"type":"narration","text":"她脸上什么表情都没有。可她走出校门的时候，右手一直捏着书包带子。","label":"l02"},{"type":"narration","text":"捏到发白的地方，是那道带子最细的一截。她自己大概不知道。"},{"type":"narration","text":"她心里想的是另一个人。这一个人在她的记忆里没有脸，只有一个动作：把手里的烟盒压扁，塞进书架后面的缝里。"},{"type":"narration","text":"她记得这个人姓陈。她记得他每次值夜班都会给她留一杯热水。她记得他教她怎么把旧报纸按年份压实。"},{"type":"narration","text":"她还记得，这个人忽然有一天就不见了。全馆的人都记得那排书架本来少一个位置，没有一个人觉得少了人。"},{"type":"choice","text":"","prompt":"她记得一个被全馆忘掉的人。我要不要替她数一遍？","options":[{"text":"在心里替她数：一个人，一杯热水","affectionWho":"","affection":0,"insomnia":4,"flag":"counted_for_her","next":""},{"text":"不数。先看她会不会说出口","affectionWho":"","affection":0,"insomnia":2,"flag":"waited_for_her_words","next":""}]},{"type":"narration","text":"只有她记得。这不是勇敢，是身体上的别扭——她每次走到那排书架旁边，都会下意识地往旁边让半步，因为那里原来站着一个人。"},{"type":"narration","text":"昨天她在旧报纸堆里翻到一页剪报，报纸上没有日期，只有一句话：地下管网第三区有流速异常，请勿靠近。"},{"type":"narration","text":"她认出了那句话的笔迹。那是姓陈的笔迹，那种写横的时候会往上飘一点的写法，她见过无数次。"},{"type":"narration","text":"所以她今天要借那本管网图。她不是为了看管道，她是为了找一个人留下的路线。"},{"type":"choice","text":"","prompt":"她借管网图是为了找一条路线。我要不要跟到底？","options":[{"text":"跟到底，看那条路线通向哪里","affectionWho":"","affection":0,"insomnia":5,"flag":"followed_her_route_to_the_end","next":""},{"text":"先退开，记住她借书的理由就行","affectionWho":"","affection":0,"insomnia":3,"flag":"kept_only_her_reason","next":""}]},{"type":"narration","text":"图书馆的门口有一排旋转栏杆。她进来的时候，前台的登记机上亮了一下，走出来一个年轻的管理员，二十来岁，头发很短。"},{"type":"narration","text":"那是老周。四十年以前的老周。我看见他的时候，胸口闷了一下——原来他年轻的时候也是那种说话的调子，说到一半就停。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"这本图不借。上面标的地方，去年塌过一次。"},{"type":"narration","text":"她说，塌过更要看。她说话的时候没有抬头，眼睛一直停在册子封面那几个字上。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你天天来。你到底在找谁。"},{"type":"choice","text":"","prompt":"老周问她到底在找谁。我要不要听她说出那个姓？","options":[{"text":"等她答。我想听她说出那个姓","affectionWho":"","affection":0,"insomnia":4,"flag":"waited_for_the_surname","next":""},{"text":"替她把嘴闭上，别点出那个人","affectionWho":"","affection":0,"insomnia":3,"flag":"kept_the_name_off_the_record","next":""}]},{"type":"narration","text":"她没有回答。有些问题一旦答了，就等于把人从名册上又点出来一次。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"这本图，四十年里只有两个人借过。前一个，已经不在了。"},{"type":"narration","text":"老周看了她三秒，把书给她了。给的时候他的手在封面上停了一下，像是还想说点什么，最后什么也没说。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"三天还回来。别拖着。"},{"type":"narration","text":"她抱着书往三楼走。三楼的灯管坏了一根，走廊一半亮一半暗，亮的那一半里，灰在慢慢地落。"},{"type":"choice","text":"","prompt":"老周说四十年里前一个已经不在了。我要问他吗？","options":[{"text":"问老周：前一个是谁","affectionWho":"老周","affection":4,"insomnia":3,"flag":"asked_zhou_who_was_first","next":""},{"text":"不问。把那句话先记下来","affectionWho":"老周","affection":2,"insomnia":2,"flag":"wrote_down_the_first_one","next":""}]},{"type":"narration","text":"她坐到最里面那排书架底下。这个位置很好，背靠着书架，前面是过道，谁从楼梯上来她都能先看见。"},{"type":"narration","text":"她翻开管网图。图很旧，印得也不清楚，地下的线路一格一格铺开，像一张没有人脸的血管图。"},{"type":"narration","text":"她用铅笔在第三区那一块画了一道。画的时候手很稳，比我稳。"},{"type":"narration","text":"然后她抬起头，朝空无一人的走廊说话。"},{"type":"narration","text":"她说：陈叔，我找到你走的那条路了。她说话的声音很轻，轻到只有她自己能听见。"},{"type":"choice","text":"","prompt":"她对着空走廊叫了一声陈叔。我要不要应她？","options":[{"text":"在心里应一声，让她听见","affectionWho":"","affection":0,"insomnia":5,"flag":"answered_her_call","next":""},{"text":"不出声。让她自己把话说完","affectionWho":"","affection":0,"insomnia":2,"flag":"let_her_finish_alone","next":""}]},{"type":"narration","text":"走廊没有回声。她说完就低下头继续看书，好像刚才那句话不需要人回答。"},{"type":"narration","text":"我在她身体里站着，站了很久。我第一次明白，什么叫记得一个人——不是想起来，是每次经过那个位置都要让半步。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"画面开始串。图书馆的灯管变成了我宿舍天花板上的裂缝，接着又变回来，两种光叠在一起，谁都不肯退。"},{"type":"narration","text":"我掐了自己一下，没有手可以掐。痛觉不在，时间却在我身上往下走，像水在往下漏。"},{"type":"choice","text":"","prompt":"画面开始串了。我要不要掐自己一下？","options":[{"text":"掐自己，试痛觉还在不在","affectionWho":"","affection":0,"insomnia":4,"flag":"tested_for_pain","next":""},{"text":"任画面串，先记住灯管的颜色","affectionWho":"","affection":0,"insomnia":3,"flag":"noted_the_flickering_lights","next":""}]},{"type":"narration","text":"天黑了。图书馆闭馆的铃响了三声。她合上书，把它抱在怀里，站起来的时候膝盖有点麻，站了两秒才站稳。"},{"type":"narration","text":"她下楼的时候没有走正门。她往员工通道走，那道铁门后面有楼梯，往下一直通到废架。"},{"type":"narration","text":"她在地下的走法和我前天晚上的走法一样。第七排，停下，蹲下，从一个废架底下摸出一样东西。"},{"type":"narration","text":"那是一把钥匙，铜的，用一根很旧的绳拴着。她把钥匙攥在手里，攥得指节发白。"},{"type":"choice","text":"","prompt":"她从废架底下摸出一把铜钥匙。我要看清它吗？","options":[{"text":"看清那把钥匙，和绳子的结","affectionWho":"","affection":0,"insomnia":4,"flag":"memorized_the_key","next":""},{"text":"只看她的手，攥得有多紧","affectionWho":"","affection":0,"insomnia":2,"flag":"watched_her_knuckles","next":""}]},{"type":"narration","text":"她开始说话。这一次声音大了一点，像是在背一段要背下来的东西。"},{"type":"narration","text":"她说：如果我明天回不来，谁来数这些架子，谁就知道我数到哪儿了。她说：第七排，一百四十二个牛皮纸包，最底下一包是空的。"},{"type":"narration","text":"她说：最底下一包是空的，因为里面的人被拿走了。"},{"type":"narration","text":"我听见这句话的时候，发现自己心里很平静。不是她的平静压着我，是这句话本来就该说出口——她想了很久，今天终于说出来了。"},{"type":"choice","text":"","prompt":"她开始背第七排的数目。我要不要跟着背？","options":[{"text":"跟着背：第七排，一百四十二包","affectionWho":"","affection":0,"insomnia":5,"flag":"memorized_the_row_count","next":""},{"text":"不背。先听她把空的那包说完","affectionWho":"","affection":0,"insomnia":3,"flag":"listened_to_the_empty_pack","next":""}]},{"type":"narration","text":"她出了图书馆，往地铁口走。地铁过了两站，下车，出口的扶梯是坏的，她走台阶上去。"},{"type":"narration","text":"地面上是一条很宽的马路。对面有一栋玻璃幕墙的楼，玻璃里嵌着很细的金属线，远看像一张被拉平的网。"},{"type":"narration","text":"墙上有徽记。三角形里套着一道裂缝。二一一〇年的时候，这个徽记就已经挂在那里了。"},{"type":"narration","text":"原来他们不是最近才开始看。原来他们看的比谁都久。"},{"type":"narration","text":"她在楼下站了一会儿，没有进去。她只是抬头看，一直看到脖子酸。"},{"type":"choice","text":"","prompt":"她站在研究所楼下只抬头看。我要拉她走吗？","options":[{"text":"在心里拉她走，别进那栋楼","affectionWho":"","affection":0,"insomnia":5,"flag":"tried_to_pull_her_away","next":""},{"text":"陪她站着，看她能看多久","affectionWho":"","affection":0,"insomnia":3,"flag":"stood_with_her_at_the_wall","next":""}]},{"type":"narration","text":"然后她转身，往第三区的方向走。她走得很快，抱着那本管网图，像是抱着一个已经决定好的答案。"},{"type":"narration","text":"第三区的地面入口在一条旧街的尽头。铁栅栏上挂了锁，锁是锈的，一掰就断——她掰的时候几乎没有用力。"},{"type":"narration","text":"底下的空气立刻变了。铁锈、霉，和很久没有流动过的水。和废架里一模一样的味道。"},{"type":"narration","text":"她在管道里走了大概二十分钟。管壁上有标记，每隔一段一个白漆的三角，是检修用的。"},{"type":"choice","text":"","prompt":"她掰断了第三区入口的锈锁。我要不要拦她？","options":[{"text":"拦她一次，哪怕她听不见","affectionWho":"","affection":0,"insomnia":5,"flag":"tried_to_stop_her_at_the_gate","next":""},{"text":"不拦。跟着她下到管道里","affectionWho":"","affection":0,"insomnia":4,"flag":"followed_her_underground","next":""}]},{"type":"narration","text":"走到某个地方，白漆的三角忽然断了。再往前三步，管道里多了光。"},{"type":"narration","text":"那光不照东西。它照到管壁上的时候，管壁还是暗的，只有光自己在往前铺，铺成一条很窄的路。"},{"type":"narration","text":"她站住了。她把管网图抱得更紧，紧到纸边被压出一条折痕。"},{"type":"narration","text":"光里面有人。很多人。他们排着队往前走，谁也不看谁，脚步整齐得不像人走出来的。"},{"type":"narration","text":"队伍最前面有一个背影，男的，中等个头。她认得那个背影。她看了两秒就认出来了。"},{"type":"choice","text":"","prompt":"光里排着队。她认出了最前面那个背影。","options":[{"text":"顺着她的眼睛，一起认那个背影","affectionWho":"","affection":0,"insomnia":5,"flag":"recognized_the_back","next":""},{"text":"只看队伍的形状，不去看人","affectionWho":"","affection":0,"insomnia":3,"flag":"watched_the_queue_shape","next":""}]},{"type":"narration","text":"她喊了那个姓。没有回应。队伍继续往前，一格，又一格。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"别进去。"},{"type":"narration","text":"我说出来了。用的是她的嗓子，她的耳朵听见了，脚步停了大概两秒。"},{"type":"narration","text":"然后她继续往前走。她大概把那两秒当成了自己心里的犹豫，谁都会有的那种犹豫。"},{"type":"narration","text":"她开始往前走。走的不是路，是那条光铺出来的窄道。她走进去的时候，管道里的水声全停了。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"我想伸手。我确实伸了——在这段记忆里，我第一次感觉到自己的手，它从她身后伸出来，朝她的肩膀去。"},{"type":"choice","text":"","prompt":"我叫了一声别进去。她只停了两秒。","options":[{"text":"再叫一次，用更大的声音","affectionWho":"","affection":0,"insomnia":6,"flag":"called_out_twice","next":""},{"text":"不再叫。看她自己怎么走","affectionWho":"","affection":0,"insomnia":3,"flag":"fell_silent_at_the_light","next":""}]},{"type":"narration","text":"我的手穿过去了。像穿过一层水，又像穿过一层纸。她的手还在往前，她的手没有感觉到我。"},{"type":"narration","text":"她的线在我眼前断掉了。从胸口往下，断成两截，中间那一截悬在光里，摆动了一下，然后被什么东西拿走了。"},{"type":"narration","text":"队伍补位。她身后那个人往前挪了一格，队形一点都没乱。"},{"type":"narration","text":"然后画面回头了。不是她回头，是这段记忆忽然换了一个视角——从她的眼睛里出来，站到旁边，去看那条队伍。"},{"type":"choice","text":"","prompt":"她的线断在我眼前。我要不要伸手去抓？","options":[{"text":"伸手去抓那截断掉的线","affectionWho":"","affection":0,"insomnia":6,"flag":"grabbed_at_the_broken_line","next":""},{"text":"不动。先把断口的样子记住","affectionWho":"","affection":0,"insomnia":4,"flag":"memorized_the_break","next":""}]},{"type":"narration","text":"在这个新的视角里，站在队伍外面的是我。我一个人站在光的边上，脚底下什么也没牵。"},{"type":"narration","text":"而队伍里那个刚刚补位的人，袖口有墨点。"},{"type":"narration","text":"我的胃里翻了一下。我明白了一件事：她不是被拉进去的。她是自己走进去的，因为她在追一个已经被拿走的人。"},{"type":"narration","text":"而她还记得那个人。所以她也成了需要被拿走的那一个。"},{"type":"narration","text":"规则就是这么简单，简单到不需要任何解释：记得被删掉的人的人，就会变成下一个缺口。"},{"type":"choice","text":"","prompt":"规则只有一条：记得被删掉的人，就是下一个缺口。","options":[{"text":"把这条规则在心里写成一行字","affectionWho":"","affection":0,"insomnia":4,"flag":"wrote_the_rule_down","next":"#l03"},{"text":"不写成字，先认了它","affectionWho":"","affection":0,"insomnia":5,"flag":"accepted_the_rule","next":""}]},{"type":"narration","text":"写成一行字的时候，纸上出现了我自己的名字。字比别人的小一圈。","label":"l03"},{"type":"narration","text":"小一圈，是因为写的人不确定该不该留下它。"},{"type":"narration","text":"我记着她。所以书皮上有我的名字，所以那行压痕是我的。不是因为我要被审判，是因为我已经进了名单。"},{"type":"narration","text":"光开始退。她最后回头看了一次，我不知道她看的是谁。她说了三个字，声音很清楚。"},{"type":"narration","text":"她说：别记我。"},{"type":"choice","text":"","prompt":"她走进光里之前说了那三个字。你要答应她吗？","options":[{"text":"在心里回答她：我记你","affectionWho":"","affection":0,"insomnia":8,"flag":"promised_to_remember_suhe","next":""},{"text":"什么都不回答，让她走得干净一点","affectionWho":"艾莉丝","affection":2,"insomnia":3,"flag":"let_suhe_go_quietly","next":""}]},{"type":"narration","text":"我做出回答的时候，那道光已经只剩下一条线宽。线消失的地方，管壁上留下一个很淡的白点，像有人用指甲划过。"},{"type":"narration","text":"我落回自己的床上，后背砸在床板上，砸得肩膀一麻。宿舍里是灰蓝色的，窗帘缝里那道橙光已经退到了被角。"},{"type":"narration","text":"我摸胸口。钟表声不在了，心跳在，很快，快得我数不过来。"},{"type":"narration","text":"天已经亮了一半。手机上是早上六点二十，三月十五日。昨天那行四点十七分终于往前走过了。"},{"type":"choice","text":"","prompt":"我落回床上，天已经亮了一半。要先起来吗？","options":[{"text":"先坐起来，把呼吸数匀","affectionWho":"","affection":0,"insomnia":3,"flag":"sat_up_and_breathed","next":""},{"text":"躺着不动，让发黑的眼前慢慢回来","affectionWho":"","affection":0,"insomnia":4,"flag":"stayed_flat_until_it_cleared","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"三月十五日，早上六点二十。我一夜没睡，走完了一个人的最后一天。"},{"type":"narration","text":"我坐起来的时候眼前发黑，坐了十几秒才恢复。这一夜没有睡，也没有休息，中间那六个小时被人拿去走了一趟地下管道。"},{"type":"narration","text":"我照镜子。眼睛是褐色的。可我看的时候心里很清楚，那点蓝没有走，它只是学会了藏。"},{"type":"narration","text":"桌上那张便签还在。我昨晚写的那行字下面，多了一行更小的字，笔迹和我一样。"},{"type":"narration","text":"上面写着：今天别去图书馆，去喝咖啡。会有人在雨里替你挡一次。"},{"type":"choice","text":"","prompt":"便签上多了一行不像我写的字。我要照做吗？","options":[{"text":"照做。去咖啡馆，看谁在雨里","affectionWho":"小雅","affection":3,"insomnia":3,"flag":"followed_the_note_to_cafe","next":""},{"text":"不照做。先把这行字抄下来","affectionWho":"","affection":0,"insomnia":5,"flag":"copied_the_new_line","next":"#l04"}]},{"type":"narration","text":"抄到一半，我停住了。这行字的收笔和我的一模一样，连最后那个小钩都一样。","label":"l04"},{"type":"narration","text":"一模一样的东西，反而最不能信。可我还是把便签折好放进了兜里。"},{"type":"narration","text":"我把便签翻过来，背面什么都没有。我把它折好放进兜里，和那块碎片、那张读者卡放在一起。"},{"type":"narration","text":"出门的时候我在楼下站了一会儿。天阴着，云压得很低，空气里已经有雨的重量。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"她不是被拉进去的。她是自己走进去的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我不认识她。可我认得她数架子的方式，一个一个数，数到空的那一格。"},{"type":"narration","text":"我不知道那句话是谁写的。但我还是往咖啡馆的方向走了。"}]},"1-4":{"sceneId":"1-4","chapter":"第一幕·异变初现","title":"四个人","background":"bg_cafe_evening","dense":true,"next":"1-5","lines":[{"type":"narration","text":"第四天，下午五点二十。我坐在街角咖啡馆靠窗的位置，面前那杯黑咖啡已经彻底凉了，凉到表面浮着一层薄薄的光。"},{"type":"narration","text":"我从早上九点就在这儿。中间起身三次，一次是去洗手间，另外两次我不记得自己去了哪里，只记得回来的时候鞋底是湿的，而外面没有下雨。"},{"type":"narration","text":"三月十五日。我不停地提醒自己今天是几号，像一个怕走丢的小孩攥着大人给的纸条。三天没合眼之后，日期已经不是背景，是扶手。"},{"type":"choice","text":"","prompt":"凉咖啡撑了三个小时。还要继续坐下去吗？","options":[{"text":"再坐十分钟。今天不和时间对着干","affection":0,"insomnia":-2,"flag":"stayed_with_the_cold_coffee","next":"","affectionWho":""},{"text":"结账走人，趁我还没丢掉下一段时间","affection":0,"insomnia":3,"flag":"tried_to_leave_the_cafe","next":"","affectionWho":""}]},{"type":"narration","text":"这间店在旧街区的一个转角，招牌上的字掉了一半，剩下的一半也没人补。店里有七张桌子，三张有人，收音机一直开着，从没有人换台。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"先生，你的咖啡它自己不想被喝了。"},{"type":"narration","text":"我抬头。店员站在桌边，围裙上别着一张手写的名牌：小雅。字写得很用力，笔尖把纸压出了坑。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"……抱歉。我在想事情。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你想了三个小时零七分钟。我数过，因为我今天实在没什么客人。"},{"type":"choice","text":"","prompt":"那杯热的递过来了。你接不接？","options":[{"text":"接过来，再问她刚才看见的蓝是什么样","affection":4,"insomnia":2,"flag":"asked_xya_about_the_blue","next":"#l01","affectionWho":"小雅"},{"text":"不接。别让一个陌生人记住我的眼睛","affection":-2,"insomnia":-2,"flag":"hid_the_blue_eyes","next":"","affectionWho":"小雅"}]},{"type":"narration","label":"l01","text":"她端着杯子愣了一下，说那种蓝她只见过一次，是在一个睡着的人脸上。"},{"type":"narration","text":"她说这话的时候一点都不像抱怨，倒像在报告一个有趣的天气。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我给你换一杯热的吧。算我请。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你为什么请我？"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"因为你刚才看窗外的时候，眼睛里有蓝色的东西闪了一下。我以为是灯泡。"},{"type":"narration","text":"她说得非常轻松，轻松到我差点错过这句话。"},{"type":"narration","text":"我下意识地摸了摸自己的眼睛，指尖是干的，什么也没有。可我确实记得自己昨天晚上照过镜子，看见瞳孔边缘有一圈很淡的冷色，像冬天结了霜的水。"},{"type":"choice","text":"","prompt":"她说你眼里有蓝色的东西。你认不认？","options":[{"text":"承认：我照过镜子，瞳孔边上确实有一圈冷色","affection":0,"insomnia":3,"flag":"admitted_the_blue_ring","next":"","affectionWho":""},{"text":"否认。是灯，是玻璃，是这家店的光","affection":0,"insomnia":-1,"flag":"blamed_the_cafe_light","next":"","affectionWho":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你看得很清楚。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我眼睛好。我妈说这是坏事，看得太清楚的人不容易高兴。"},{"type":"narration","text":"她把凉咖啡端走了，杯子在托盘上磕了一下，声音很脆。收音机里正好报时，五点二十一。"},{"type":"narration","text":"我不信这个报时。我昨天做过一件事：在手机里存了五次时间截图，早上九点、中午十二点、下午两点、三点、四点，然后一个一个删掉。每次删掉以后，我都觉得刚才那段时间从来没有发生过，连删的动作都被一起删了。"},{"type":"choice","text":"","prompt":"报时说是五点二十一。你信收音机吗？","options":[{"text":"不信。我手机里的截图比它诚实","affection":0,"insomnia":2,"flag":"distrusted_the_radio_clock","next":"","affectionWho":""},{"text":"信一次。至少它每天都在响","affection":0,"insomnia":-2,"flag":"trusted_the_radio_clock","next":"","affectionWho":""}]},{"type":"narration","text":"我不再删截图了。我开始怕自己的手。"},{"type":"narration","text":"窗外的天开始变暗。旧街区的霓虹牌子一盏一盏亮起来，颜色很旧，像被人从别处捡回来的。"},{"type":"narration","text":"然后我看见了那句话。"},{"type":"narration","text":"它贴在我正对着的那根玻璃上，从里面贴的，字是白的。上一秒它不在，我很确定，因为我一直在看那块玻璃。"},{"type":"narration","text":"上面写着：下午五点四十，你会少掉十七分钟。"},{"type":"fx","fx":"wait","text":""},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……什么。"},{"type":"narration","text":"我站起来，椅子腿在地上刮出一道刺耳的声音。整间店的人都抬头看我，只有那个坐在角落的男人没有动。"},{"type":"choice","text":"","prompt":"外面的霓虹一盏一盏亮了起来。你看哪边？","options":[{"text":"看窗外。街上比店里安静","affection":0,"insomnia":-1,"flag":"watched_the_street_outside","next":"","affectionWho":""},{"text":"看玻璃上的自己。我要确认倒影还在","affection":0,"insomnia":2,"flag":"checked_own_reflection","next":"","affectionWho":""}]},{"type":"narration","text":"他坐在最里面的位子，背对着墙，面前什么都没有，连水杯都没有。黑色外套，袖口磨得发白。他一直没有看我，但我知道他在数我。"},{"type":"narration","text":"玻璃上的字还在。我伸手去擦，指尖隔着玻璃摸到自己的倒影。"},{"type":"narration","text":"字在我指尖下面散开了，变成几片很淡的白灰，落回玻璃内侧。像有人在那边轻轻吹了一口气。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你怎么了？玻璃上有东西吗？"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"……你看不到？"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"看到你在吓我。"},{"type":"choice","text":"","prompt":"整间店的人都在看你。你先看谁？","options":[{"text":"看那块玻璃。字还在上面","affection":0,"insomnia":2,"flag":"stared_at_the_words","next":"","affectionWho":""},{"text":"看墙角那个没动的男人。他在数我","affection":1,"insomnia":3,"flag":"noticed_the_man_in_the_corner","next":"","affectionWho":"雷恩"}]},{"type":"narration","text":"她笑了一下，但她的笑没有到眼睛。她也回头看了那块玻璃一眼，看了很久，久到收音机里的报时又响了一次。"},{"type":"narration","text":"我坐下来。我告诉自己这是幻觉，是第六十个不眠小时的标准症状，医生早就说过了。"},{"type":"narration","text":"然后我把手机翻过来，屏幕是黑的，我按下电源键。"},{"type":"narration","text":"五点四十。"},{"type":"narration","text":"我看了一眼窗外，又看了一眼屏幕，再看一眼收音机。收音机上的小液晶屏也是五点四十。可刚才报时的时候，它明明还是五点二十一。"},{"type":"choice","text":"","prompt":"玻璃上的字散成了白灰。你要不要动它？","options":[{"text":"伸手擦干净，就当它从来没出现过","affection":0,"insomnia":3,"flag":"wiped_the_warning_off_the_glass","next":"#l02","affectionWho":""},{"text":"手停住。让它再待一会儿，我要记住是谁写的","affection":0,"insomnia":2,"flag":"memorized_the_warning","next":"","affectionWho":""}]},{"type":"narration","label":"l02","text":"我擦了三下，玻璃内侧留下一道很浅的指痕，像有人从那边回过手。"},{"type":"narration","text":"中间那十七分钟不见了。咖啡是热的，小雅刚端来的那杯，正冒着气。热气是真的，杯子是热的，我手指被烫了一下，也是真的。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"然后整间店开始错位。"},{"type":"narration","text":"第一个错位的是桌子。靠门那张桌子上的客人还在，可他面前的蛋糕切面变了——我记得他切的是角，现在是一道平的横切。"},{"type":"choice","text":"","prompt":"十七分钟没了。你要不要再对一次时间？","options":[{"text":"再看一次。我要亲眼盯着它走","affection":0,"insomnia":3,"flag":"watched_the_clock_tick","next":"","affectionWho":""},{"text":"不看了。看多了它就知道我在数它","affection":0,"insomnia":-2,"flag":"stopped_checking_the_clock","next":"","affectionWho":""}]},{"type":"narration","text":"第二个错位的是墙上的钟。这家店根本没有钟。我进来的时候确认过，因为那时候我在找时间。现在它挂在那儿，指针停在五点四十，秒针在原地抖，走不动也停不下。"},{"type":"narration","text":"第三个错位的是小雅。"},{"type":"narration","text":"她站在吧台后面，正在擦杯子，动作跟我记忆里完全一样。可她的手比我记忆里白一点，袖子长一点，声音低一点。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"这杯还是别喝了。我给你换热的。"},{"type":"choice","text":"","prompt":"小雅被重新铺过一遍。你要不要喊她？","options":[{"text":"喊她的名字，看她会不会接上","affection":3,"insomnia":3,"flag":"called_xya_by_name","next":"","affectionWho":"小雅"},{"text":"不喊。重播里的人听不见","affection":0,"insomnia":1,"flag":"stayed_quiet_for_the_replay","next":"","affectionWho":""}]},{"type":"narration","text":"同一句话。我在心里把它和第一次听的那句叠起来，一个字都没有挪位置，连尾音落下去的那个气口都一样。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"她甚至用了同样的语气，同样的停顿，名牌上同样的那道坑。她不知道自己在重播，她眼里的时间是连贯的。"},{"type":"narration","text":"我盯着她。我第一次感觉到一种比恐惧更冷的东西——不是她变了，是这个世界把她重新铺了一遍，铺得比原件粗糙一点点。"},{"type":"choice","text":"","prompt":"她是重播的，她自己不知道。你恨得起来吗？","options":[{"text":"恨这个世界，不恨她","affection":0,"insomnia":2,"flag":"blamed_the_world_not_xya","next":"","affectionWho":""},{"text":"什么都不想。脑子里的声音已经够多了","affection":0,"insomnia":-2,"flag":"let_the_mind_go_blank","next":"","affectionWho":""}]},{"type":"narration","text":"角落里的男人站了起来。"},{"type":"narration","text":"他走得不快，但每一步都正好踩在我心跳的间隔上。走到我桌边的时候，他伸手把我的椅子按住了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"别动。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你是谁。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"数三下之后你会想站起来。不用起来。"},{"type":"narration","text":"他没回答我的问题。他的手很重，压得我肩胛骨发麻。"},{"type":"narration","text":"一。"},{"type":"narration","text":"我听见自己的膝盖在发抖。墙上的钟往后退了一格，玻璃上的白灰又浮起来一层。"},{"type":"narration","text":"二。"},{"type":"narration","text":"吧台后面的小雅停下了。她不是在停手，是整个动作被切掉了中间的一段，抹布悬在半空，她的手指还在用力，可布没有动。"},{"type":"choice","text":"","prompt":"他已经数到二了。你打算站起来吗？","options":[{"text":"不起来。就按他说的做","affection":4,"insomnia":-2,"flag":"obeyed_raine_and_stayed","next":"","affectionWho":"雷恩"},{"text":"偏要起来。我不喜欢被人按着","affection":-2,"insomnia":4,"flag":"tried_to_stand_anyway","next":"","affectionWho":"雷恩"}]},{"type":"narration","text":"三。"},{"type":"narration","text":"我没有站起来。我想站起来，我的腿已经准备好了，可我没有。他按着我的那只手在那一瞬间变凉了，凉得像刚从水里捞出来。"},{"type":"narration","text":"然后他从外套里拿出一样东西，放在我面前的桌上。"},{"type":"narration","text":"很小的一块，透明的，边缘不整齐，像谁把一块冰摔碎了挑出来的那一角。它在桌面上没有影子。"},{"type":"cg","background":"cg_raine_rescue","text":"他用两根手指把它按在桌面上，压得指节发白。整间店的光暗了半秒——不是灯坏了，是光被挪走了一点点，像有人从屋子里舀走一勺水。"},{"type":"choice","text":"","prompt":"桌上那块东西没有影子。你敢碰吗？","options":[{"text":"伸手碰一下。我要知道它冷不冷","affection":0,"insomnia":3,"flag":"touched_the_shard","next":"","affectionWho":""},{"text":"收回手。不该碰的东西不碰","affection":0,"insomnia":-2,"flag":"kept_hands_off_the_shard","next":"","affectionWho":""}]},{"type":"narration","text":"我听见一声很轻的裂响，像结了霜的窗玻璃终于撑不住。"},{"type":"narration","text":"那声音不是从那块东西里出来的，是从他身上出来的。"},{"type":"narration","text":"他的手腕内侧纹着一圈很细的线，像被划开过又长好了。那圈线在暗光里亮了一下，然后顺着小臂往上跑，跑到袖口里就看不见了。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"钟不见了。蛋糕的切面回到角。小雅的手腕上多了一道橡皮筋的勒痕，她自己低头看了一眼，很困惑，然后把袖子拉下来盖住了。"},{"type":"choice","text":"","prompt":"墙上的钟回到了原样。你要不要找位置？","options":[{"text":"找。刚才挂钟的地方应该有钉眼","affection":0,"insomnia":3,"flag":"looked_for_the_nail_hole","next":"","affectionWho":""},{"text":"不找。它已经不在了","affection":0,"insomnia":-1,"flag":"accepted_the_clock_was_gone","next":"","affectionWho":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"……刚才是不是停电了？"},{"type":"narration","text":"没有人回答她。收音机重新开始播歌，是一首很老的曲子，唱到一半。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"……你刚才应该站起来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你说不用起来。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"我骗你的。"},{"type":"narration","text":"他松开手。我看见他的右手在抖，抖得很细很密，像一台快没电的机器。他把那块东西收进口袋，口袋一沉，他那条手臂整个往下坠了一下。"},{"type":"narration","text":"他终于抬眼看我。他的眼睛是褐色的，很干，一点都不像刚经历过什么的人。"},{"type":"choice","text":"","prompt":"他说他在骗你。这句你信不信？","options":[{"text":"信。他骗我是为了让我别站起来","affection":5,"insomnia":1,"flag":"believed_the_lie_was_kind","next":"","affectionWho":"雷恩"},{"text":"不信。他不知道骗我要付什么代价","affection":-3,"insomnia":3,"flag":"distrusted_raine","next":"","affectionWho":"雷恩"}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"它本来是冲你来的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"什么冲我来的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"抹除。少掉一段，少掉一个人，少掉一次呼吸。看它心情。"},{"type":"narration","text":"他说得太平了，平静到像在念一份检修单。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你为什么替我挡。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"……你已经少过一次了。"},{"type":"narration","text":"这句话我没有听懂，但我身上某个地方懂了。我的手自己攥紧了，攥得指甲扎进掌心。"},{"type":"narration","text":"外面开始下雨。雨来得很快，从旧街区的楼顶一路砸下来，砸在遮阳布上，砸出一片很吵的白声。"},{"type":"choice","text":"","prompt":"外面已经下起雨了。你要跟他出去吗？","options":[{"text":"跟上去。他替我挡的东西我还没还","affection":4,"insomnia":3,"flag":"followed_raine_into_the_rain","next":"#l03","affectionWho":"雷恩"},{"text":"先回头看一眼小雅，再跟出去","affection":3,"insomnia":1,"flag":"looked_back_at_xya_first","next":"","affectionWho":"小雅"}]},{"type":"narration","label":"l03","text":"我先把他按过的那把椅子推回原位，椅腿在地上拖出一声很短的响。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"走。雨里它不敢跟。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"等一下，你手上的东西——"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"碎片。能借一点时间。借多了要还。"},{"type":"narration","text":"他先走出去。雨直接浇在他肩上，他连领子都没有拉，走得像一件本来就该被淋的东西。"},{"type":"narration","text":"小雅追到门口，手里还拿着那块抹布。她看了我一眼，又看了雨里的他，忽然说了一句很清醒的话。"},{"type":"choice","text":"","prompt":"小雅说你们身上像烧过的纸。你回她什么？","options":[{"text":"说实话：我今天闻不到任何味道","affection":3,"insomnia":2,"flag":"told_xya_the_truth_about_smell","next":"","affectionWho":"小雅"},{"text":"什么都不说，把外套拉起来走进雨里","affection":-2,"insomnia":-1,"flag":"left_xya_without_an_answer","next":"","affectionWho":"小雅"}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你们两个人身上的味道是一样的。像烧过的纸。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"……你也闻得到？"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"今天才闻得到。前天这条街上还没有这个味道。"},{"type":"narration","text":"我把外套拉起来，跟着他走进雨里。雨点打在手背上，很疼，疼得非常正常。我第一次觉得疼是件好事。"},{"type":"narration","text":"街道湿了之后反而清楚。霓虹的反光在水面上摊开，一层一层，像有人把这座城市复制了很多份，摆在不同的水深里。"},{"type":"choice","text":"","prompt":"雨把这座城市复制了很多份。你信哪一份？","options":[{"text":"信脚下这一份，因为它是湿的","affection":0,"insomnia":-2,"flag":"trusted_the_wet_street","next":"","affectionWho":""},{"text":"哪一份都不信，包括我自己站的这份","affection":0,"insomnia":3,"flag":"trusted_no_copy_of_the_city","next":"","affectionWho":""}]},{"type":"narration","text":"我回头看了一眼咖啡馆。玻璃上什么也没有。小雅还在门口，把抹布捏成一团。"},{"type":"narration","text":"我记住了她那张名牌上被压出的坑。这是我今天唯一能确定没有被人重新铺过一遍的东西。"},{"type":"narration","text":"然后我数了一下自己的心跳。没用，心跳和我一样，已经不太清楚它站在哪一段时间里了。"},{"type":"narration","text":"我该拿这件事怎么办。"},{"type":"choice","text":"","prompt":"雨里的那个人只肯走，不肯解释。你要怎么开口？","options":[{"text":"追上去，问清楚他到底是谁、为什么替我挡","affectionWho":"雷恩","affection":6,"insomnia":3,"flag":"asked_raine_who","next":""},{"text":"先不问，把他刚才按在桌上的那块东西重新看一遍","affectionWho":"雷恩","affection":3,"insomnia":6,"flag":"studied_shard_first","next":""}]},{"type":"narration","text":"我在雨里快走两步，跟他并排，雨声太大，我只能提高声音。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"你刚才说我已经少过一次了。少掉的是什么？"},{"type":"narration","text":"他没有马上回答。我们走了大半条街，走到一盏坏掉的路灯下面，他才停下来。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我不知道。我只看得见缺口，看不见缺的那个人。"},{"type":"narration","text":"他伸出右手，把袖口往上卷了一寸。那圈细线在湿透的皮肤上看起来像一道没长平的旧伤。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"缺口会咬人。谁靠近就先咬谁。"},{"type":"choice","text":"","prompt":"她说那是今天唯一没被重铺过的东西。留吗？","options":[{"text":"记住那道坑。今晚我要靠它认路","affection":0,"insomnia":2,"flag":"held_onto_the_nameplate_dent","next":"","affectionWho":""},{"text":"别记了。记得越多，丢的时候越疼","affection":0,"insomnia":-2,"flag":"refused_to_keep_more_details","next":"","affectionWho":""}]},{"type":"narration","text":"我低头看自己摊开的手掌。掌心里还留着刚才攥出来的四个月牙，红得很清楚。清楚，就是还在这儿，还没有被谁替我铺过一遍。"},{"type":"narration","text":"雨还在下。我想起咖啡馆玻璃上那行字：五点四十，你会少掉十七分钟——它写对了。有人提前知道，有人提前来挡。"},{"type":"narration","text":"那么写那行字的人，和站在雨里替我挡住的人，是不是同一伙的。这个问题我没敢问出口。"},{"type":"choice","text":"","prompt":"他卷起袖子给你看那道旧伤。还问下去吗？","options":[{"text":"问下去：那道线是谁划的","affection":4,"insomnia":3,"flag":"asked_about_the_scar_line","next":"","affectionWho":"雷恩"},{"text":"不问。有些缺口不该被手指碰","affection":0,"insomnia":-2,"flag":"left_the_scar_alone","next":"","affectionWho":"雷恩"}]},{"type":"narration","text":"我把手插进口袋，跟着他往街的尽头走。街尽头的天很脏，像一块被人反复擦过又擦不干净的玻璃。"},{"type":"narration","text":"第四天的雨落在新东京的旧街区上。我数不清这十七分钟里我到底少了什么，但我知道从今晚起，我会开始数人。"}],"bgm":"bgm_warm"},"1-5":{"sceneId":"1-5","chapter":"第一幕·异变初现","title":"第一次裂缝","background":"bg_street_rain","bgm":"bgm_tension","dense":true,"next":"1-5a","lines":[{"type":"narration","text":"第五天，早上七点四十。我站在旧街区往城际车站的天桥上，看着底下的人流往前推。"},{"type":"narration","text":"昨天那场雨没有停。它下了一整夜，把整座城市泡成一团发白的雾，高架上的车灯在雾里排成一串看不懂的符号。"},{"type":"narration","text":"我一夜没回去。雷恩把我带到车站旁边一家通宵开的便利店，买了两罐热的，自己一罐都没喝。天快亮的时候他接了个电话，走之前只留了一句话。"},{"type":"choice","text":"","prompt":"他走得那么急。你站在这里，到底图什么？","options":[{"text":"我是来看它发生的，看完就走","affectionWho":"","affection":0,"insomnia":2,"flag":"watched_for_it_to_happen","next":""},{"text":"我不图什么，我只是不能站着不动","affectionWho":"","affection":0,"insomnia":-2,"flag":"could_not_stand_still","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"今天这里会出裂缝。别下去。"},{"type":"narration","text":"我问为什么，他已经走了。他的背影在雨里没有变淡，反而像被雨洗得更清楚了一点。"},{"type":"narration","text":"我没有听他的。我站在天桥上，是因为我怕事情发生的时候我不在。"},{"type":"narration","text":"雷恩说话从来不给第二遍。他把危险摆在你面前，然后转身就走，剩下的那一半要你自己去要。"},{"type":"choice","text":"","prompt":"「别下去」还在耳朵里。你用什么理由下去？","options":[{"text":"下去是为了它发生时我在场","affectionWho":"","affection":0,"insomnia":2,"flag":"went_down_to_be_present","next":""},{"text":"下去只是想知道裂缝长什么样","affectionWho":"","affection":0,"insomnia":3,"flag":"went_down_out_of_curiosity","next":""}]},{"type":"narration","text":"五天前的我，还只是个被医生打发的学生。现在的我，口袋里放着一块会自己跳的碎片，正在等一场灾难。"},{"type":"narration","text":"七点四十六。车站的广播开始报早高峰，女声念站台号，念得很整齐。底下的人开始往上挤，广告屏、行李箱、学生的背包、抱着孩子的女人。"},{"type":"narration","text":"广播每念一个站台号，人群里就有一小片人朝同一个方向歪过去，像被风推过的草。"},{"type":"narration","text":"我数了一下。十秒钟里，有三十七个陌生人从我眼皮底下走过。"},{"type":"choice","text":"","prompt":"广播每念一个站台号，人群就朝那边歪一片。你要数下去吗？","options":[{"text":"数。数到三十七就停","affectionWho":"","affection":0,"insomnia":2,"flag":"counted_the_crowd_to_thirty_seven","next":""},{"text":"不数。数字记多了会变成负担","affectionWho":"","affection":0,"insomnia":-2,"flag":"refused_to_count_the_crowd","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"……别下去。说得倒容易。"},{"type":"narration","text":"我下到站台层。空气里有铁锈和雨水的味道，还有一种说不清的干，像有人在这层楼里烤过东西。"},{"type":"narration","text":"站台的应急灯亮着，白得过头。所有广告屏上的画面都在同一个小动作上卡住：一个女人举起杯子，永远举不起来。"},{"type":"narration","text":"我看了两秒，然后意识到不对——不是屏卡了，是我看慢了。我的眼睛还在按正常速度看，这个世界已经比刚才快了一点点。"},{"type":"choice","text":"","prompt":"世界比你先动了半拍。这一帧你要看穿吗？","options":[{"text":"盯住广告屏，把卡住的那一帧看穿","affectionWho":"","affection":0,"insomnia":4,"flag":"stared_at_the_frozen_frame","next":"#l01"},{"text":"移开眼睛，看久了会分不清","affectionWho":"","affection":0,"insomnia":-3,"flag":"looked_away_from_the_screen","next":""}]},{"type":"narration","text":"我盯着那块屏，把杯子被举起来的轨迹在脑子里放了两遍。"},{"type":"narration","text":"第二遍比第一遍快了半秒。变快的不是杯子。"},{"type":"narration","text":"不管看没看穿，那半秒都已经从我这里过去了。","label":"l01"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"人群的脚步开始变得不在一个拍子上。有人走三步，后面的人已经走了五步；有人张嘴说话，声音比嘴唇晚半秒才到。"},{"type":"choice","text":"","prompt":"眼睛已经开始跟不上这个世界了。你要停下来吗？","options":[{"text":"不停。让眼睛继续追","affectionWho":"","affection":0,"insomnia":4,"flag":"let_the_eyes_keep_chasing","next":""},{"text":"闭上两秒，重新对一次焦","affectionWho":"","affection":0,"insomnia":-3,"flag":"blinked_to_refocus","next":""}]},{"type":"narration","text":"这种乱我看得见，站台上的两百个人看不见。他们低着头，看手机，赶检票，像什么都没变。"},{"type":"choice","text":"","prompt":"两百个人里只有你看得见。这一点怎么用？","options":[{"text":"把不对的节奏一条一条记下来","affectionWho":"","affection":0,"insomnia":3,"flag":"memorized_the_broken_rhythm","next":""},{"text":"不看。记住的就跑不掉","affectionWho":"","affection":0,"insomnia":-3,"flag":"refused_to_memorize_the_rhythm","next":""}]},{"type":"narration","text":"我口袋里的碎片开始发烫。"},{"type":"narration","text":"我把它掏出来。透明的，冷的，跳得比昨天快。它跳的方向不是往上往下的，是往里——往站台尽头那面墙里跳。"},{"type":"choice","text":"","prompt":"碎片在替你指方向。你信它吗？","options":[{"text":"信。往它指的那面墙走","affectionWho":"","affection":0,"insomnia":2,"flag":"followed_the_fragment_to_the_wall","next":""},{"text":"捂住口袋。别让它牵着我","affectionWho":"","affection":0,"insomnia":-2,"flag":"covered_the_fragment_in_the_pocket","next":""}]},{"type":"narration","text":"尽头是检修口，挂着黄色的牌子，牌子下面靠着一个穿灰外套的老人，手里拎着装菜的袋子。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"大爷，那边不能站。"},{"type":"narration","text":"他没有听见。他在看检票口的方向，可能在等人。"},{"type":"choice","text":"","prompt":"他在等人。你要不要先喊他一声？","options":[{"text":"喊。喊错了也得让他回头","affectionWho":"","affection":0,"insomnia":3,"flag":"shouted_a_name_at_the_old_man","next":"#l02"},{"text":"不喊。先跑过去，抓到人再说","affectionWho":"","affection":0,"insomnia":2,"flag":"ran_without_calling","next":""}]},{"type":"narration","text":"我喊了一声大爷。他回头了，隔着几十个人朝我点了点头，像认得我。"},{"type":"narration","text":"我不认得他。可他点头的样子太熟了，熟得像我们见过。"},{"type":"narration","text":"喊不喊都一样，我离他还隔着七八步。","label":"l02"},{"type":"narration","text":"我往那边跑。跑了七八步，脚下的地砖忽然软了一下，像踩在一层很薄的冰上。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"那不是地软。那是声音消失了。整座车站的噪音在零点几秒里被抽走：广播、脚步、列车、雨，全都抽走，只剩我自己的鞋底在地砖上蹭出的那一点干响。"},{"type":"choice","text":"","prompt":"所有的声音都被抽走了。你先动哪一步？","options":[{"text":"抬脚。用尽力气往前跨","affectionWho":"","affection":0,"insomnia":4,"flag":"lunged_forward","next":""},{"text":"站住。先看清脚下","affectionWho":"","affection":0,"insomnia":-2,"flag":"planted_the_feet","next":""}]},{"type":"narration","text":"然后裂缝张开了。"},{"type":"cg","background":"cg_crack_open","text":"它不在墙上，它在那面墙的前面——像有人把一张纸对折，折缝上裂开了一道口子。口子边缘没有光，反而把周围的光吸进去。"},{"type":"narration","text":"空气朝那道口子里流。老人的灰外套被拉起来了，菜袋子的提手绷直，一颗白菜滚出去，在半空中就不见了。"},{"type":"choice","text":"","prompt":"白菜在半空就没了。你还往前伸手吗？","options":[{"text":"伸。手比脑子快","affectionWho":"","affection":0,"insomnia":5,"flag":"reached_out_faster_than_thought","next":""},{"text":"缩手。这一下会把我也带走","affectionWho":"","affection":0,"insomnia":1,"flag":"pulled_the_hand_back","next":""}]},{"type":"narration","text":"他转过身。他的脸很普通，皱纹很深，看见我的时候还微微愣了一下，像在辨认是不是认识我。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"抓住我！"},{"type":"narration","text":"我伸出手。我的手和他的手之间隔着大概一米。"},{"type":"choice","text":"","prompt":"一米。你打算怎么跨过去？","options":[{"text":"把手伸到最长，别的什么都不想","affectionWho":"","affection":0,"insomnia":4,"flag":"stretched_the_arm_to_the_limit","next":""},{"text":"先盯住他的手，盯死那一只手","affectionWho":"","affection":0,"insomnia":3,"flag":"fixed_on_his_hand","next":""}]},{"type":"narration","text":"那一米是很长的。我在那一米里看见了很多东西：他手背上的一块老年斑，袖口磨起来的那圈线，他指甲缝里的一点泥。还有他另外一只手上，一张被捏皱的纸。"},{"type":"choice","text":"","prompt":"那一米里的东西太多了。你先记住哪一样？","options":[{"text":"记住那张纸。上面的地址是我楼下","affectionWho":"","affection":0,"insomnia":3,"flag":"memorized_the_wrinkled_paper","next":"#l03"},{"text":"记住他手背上的老年斑","affectionWho":"","affection":0,"insomnia":2,"flag":"memorized_the_age_spot","next":""}]},{"type":"narration","text":"我记住了那张纸。折痕压得很深，地址那一行是手写的。"},{"type":"narration","text":"写那行字的人手很稳，稳得像早就写熟了。"},{"type":"narration","text":"可记住什么，都不能让他慢下来。","label":"l03"},{"type":"narration","text":"纸上写着一个地址，和两个字，我认得那两个字。那是我宿舍楼下的路口。"},{"type":"narration","text":"他在等我。他从早上就在这里等我。"},{"type":"narration","text":"我的指尖碰到他的指尖。"},{"type":"fx","fx":"flash","text":""},{"type":"choice","text":"","prompt":"指尖已经碰到了。你要用力往回拉吗？","options":[{"text":"拉。把他整个人拽出来","affectionWho":"","affection":0,"insomnia":5,"flag":"tried_to_pull_him_out","next":""},{"text":"不拉。先别松手","affectionWho":"","affection":0,"insomnia":2,"flag":"refused_to_let_go","next":""}]},{"type":"narration","text":"很轻的一碰。然后他的手在我手指之间变成了一把灰。"},{"type":"narration","text":"不是散开，不是碎掉，是灰。有温度的那种灰，还带着人手上的暖气。灰从他手腕往上走，走到肩膀，走到领口，走到那张脸。"},{"type":"choice","text":"","prompt":"灰还在往上走。你还抓得住吗？","options":[{"text":"抓着。哪怕最后只剩一把灰","affectionWho":"","affection":0,"insomnia":5,"flag":"held_the_ash","next":""},{"text":"松手。不让灰走到我身上","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_go_of_the_ash","next":""}]},{"type":"narration","text":"他最后看我的那一眼里没有害怕。他很平静，平静得让人恨——好像他早就知道会这样，好像他只是来把某样东西交给我。"},{"type":"choice","text":"","prompt":"他把某样东西交给你了。那是什么？","options":[{"text":"是那张纸。他把地址留下了","affectionWho":"","affection":0,"insomnia":3,"flag":"the_paper_was_the_thing","next":""},{"text":"是他看我的这一眼","affectionWho":"","affection":0,"insomnia":4,"flag":"the_look_was_the_thing","next":""}]},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"裂缝在灰落尽的一瞬间合上了。合得很快、很干净，连边上的墙皮都没有掉一块，站台的灯还亮着，地砖还是那几块地砖。"},{"type":"narration","text":"声音回来了。"},{"type":"narration","text":"广播报下一班车，拖行李箱的轮子从瓷砖上滚过，小孩在哭，扫码闸机一遍一遍地说请通过。世界像什么都没发生一样轰轰地转起来。"},{"type":"choice","text":"","prompt":"世界又转起来了。你先做什么？","options":[{"text":"低头看手心。那里应该还有东西","affectionWho":"","affection":0,"insomnia":3,"flag":"looked_at_the_palm_first","next":""},{"text":"抬头找人。刚才旁边明明有人","affectionWho":"","affection":0,"insomnia":2,"flag":"looked_up_for_witnesses","next":""}]},{"type":"narration","text":"我跪在地上。我的右手还伸着，手心里是空的，只有一点灰。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……有人吗。"},{"type":"narration","text":"没有人回答我。但我听见了自己声音里的抖，抖得很不像话。"},{"type":"choice","text":"","prompt":"你的声音在抖。要不要再问一次？","options":[{"text":"再问一次，问得更响","affectionWho":"","affection":0,"insomnia":3,"flag":"asked_again_louder","next":""},{"text":"不问了。抖着的声音没人会信","affectionWho":"","affection":0,"insomnia":-2,"flag":"stopped_asking","next":""}]},{"type":"narration","text":"旁边一个穿西装的男人绕过我，边走边看表，走出三步又回头看了我一眼。他不是在看一个刚失去什么的人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"刚才这里有个老人。灰外套，拎着菜。"},{"type":"choice","text":"","prompt":"他看你的眼神里只有困惑。你要怎么问他？","options":[{"text":"追上去，把老人的样子全说一遍","affectionWho":"","affection":0,"insomnia":3,"flag":"described_the_old_man","next":""},{"text":"不问了。他答不上来","affectionWho":"","affection":0,"insomnia":-2,"flag":"gave_up_on_bystanders","next":""}]},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"这里没有老人。"},{"type":"narration","text":"回答我的不是那个西装男人。声音很轻，从我左边来，又像从我后脑勺里来。"},{"type":"narration","text":"我猛地转头。站台上全是人，一个挨着一个，没有一个在看我们。"},{"type":"choice","text":"","prompt":"那个声音不属于现场任何一个人。你要找它吗？","options":[{"text":"盯着声音来的方向，等它再说一句","affectionWho":"","affection":0,"insomnia":5,"flag":"waited_for_the_voice_again","next":""},{"text":"不问。装作没听见","affectionWho":"","affection":0,"insomnia":-2,"flag":"pretended_not_to_hear","next":""}]},{"type":"narration","text":"西装男人愣住了，他也在看我，眼神里有一点被冒犯的困惑。他开口的时候，语气很平常，平常得让人发冷。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"他没有看见那位老人。整层站台，只有你看见。"},{"type":"choice","text":"","prompt":"她说只有你看见。你要承认这一点吗？","options":[{"text":"承认。我确实看见了","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"admitted_only_i_saw_him","next":""},{"text":"不承认。也许是她弄错了","affectionWho":"艾莉丝","affection":-4,"insomnia":1,"flag":"denied_that_only_i_saw_him","next":""}]},{"type":"narration","text":"她站在站台的柱子边上，深色的工作外套，手腕上绑着一台薄薄的仪器，屏幕上一串小字在飞快地滚。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你怎么会在这里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"研究所监测到三点七秒的时间异常。我负责到场。这不是偶遇。"},{"type":"choice","text":"","prompt":"她不是偶遇，是来办事的。你先问哪一句？","options":[{"text":"先问她：里面那个人算什么","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"asked_what_he_counts_as","next":""},{"text":"先问她：那三点七秒从哪一秒算起","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"asked_when_the_three_seven_started","next":""}]},{"type":"narration","text":"她走过来，绕过我跪着的地方，直接走到那面检修口的墙前面。她把仪器贴上去，屏幕上的数字往上跳了一格。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"裂缝已经闭合。闭合时间，七点五十三分十一秒。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"里面那个人呢。"},{"type":"choice","text":"","prompt":"那个人的下落她还没答。你要追问吗？","options":[{"text":"追问：他现在算活着，还是算没来过","affectionWho":"艾莉丝","affection":4,"insomnia":1,"flag":"pressed_for_his_status","next":""},{"text":"不追问。等她先开口","affectionWho":"艾莉丝","affection":0,"insomnia":2,"flag":"waited_for_alice_to_speak","next":""}]},{"type":"narration","text":"她没有立刻回答。她把仪器收进袖口，才转过来看我。她的表情没有变化，但她多解释了一句——后来我才知道，她很少对人多解释一句。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"被裂缝吞进去的存在，会从时间线上被移除。不是死亡。死亡留下尸体、留下记录、留下别人记得的脸。"},{"type":"choice","text":"","prompt":"她说那不是死亡。这个说法你能接受吗？","options":[{"text":"接受。可我还是要一个名字","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"wanted_a_name_for_him","next":""},{"text":"不接受。没人记得也不等于没死过","affectionWho":"艾莉丝","affection":-3,"insomnia":1,"flag":"refused_the_definition","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"被移除什么都不留。连刚才站在你旁边那个人，回家以后都不会觉得今天少了什么。"},{"type":"narration","text":"我站起来。腿是麻的，我扶着柱子站了两秒。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我记得他。我记得那张纸，记得他在等我。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我知道。这就是问题。"},{"type":"choice","text":"","prompt":"「这就是问题」。你要顺着问下去吗？","options":[{"text":"顺着问：记得他算什么「问题」","affectionWho":"艾莉丝","affection":4,"insomnia":1,"flag":"asked_why_remembering_is_a_problem","next":""},{"text":"不问了。她其实在替我担心","affectionWho":"艾莉丝","affection":3,"insomnia":-1,"flag":"let_alice_have_the_last_word","next":""}]},{"type":"narration","text":"她说这话的时候在看我的眼睛。她的目光很直，直得像一束探照灯，照进来，不收拾，也不安慰。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"正常人不会记得被抹除的对象。你记得。你口袋里的东西在跳。"},{"type":"choice","text":"","prompt":"她提到了我口袋里那块东西。你要交出来吗？","options":[{"text":"交。把它放在她手心里","affectionWho":"艾莉丝","affection":6,"insomnia":-2,"flag":"handed_over_the_fragment","next":""},{"text":"不交。那块东西只认我","affectionWho":"艾莉丝","affection":-3,"insomnia":2,"flag":"kept_the_fragment_hidden","next":""}]},{"type":"narration","text":"我把手按在口袋上。碎片跳得又慢又重，像累了。它刚才吸进去了一点东西，我不想知道那是什么。"},{"type":"narration","text":"站台上的人潮还在往前推。他们撞过我的肩膀，绕开我，绕过那面检修口的墙。有个孩子经过的时候抬头看了那面墙一眼，什么都没看见，又低头去看他手里的糖。"},{"type":"choice","text":"","prompt":"那个孩子什么都没看见。你要告诉他吗？","options":[{"text":"不告诉。让他留着手里那颗糖","affectionWho":"","affection":0,"insomnia":-2,"flag":"spared_the_child","next":""},{"text":"告诉他：这里刚才站着一个人","affectionWho":"","affection":0,"insomnia":4,"flag":"told_the_child_about_the_man","next":""}]},{"type":"narration","text":"我开始发抖，不是因为冷。是因为我意识到刚才那七点五十三分十一秒里，全站台只有我一个人伸手了。"},{"type":"narration","text":"而我没抓住。"},{"type":"choice","text":"","prompt":"「而我没抓住」这句话，你打算怎么办？","options":[{"text":"记下来，记在能看见的地方","affectionWho":"","affection":0,"insomnia":4,"flag":"wrote_down_the_failure","next":""},{"text":"咽下去，不许自己再想","affectionWho":"","affection":0,"insomnia":-2,"flag":"swallowed_the_failure","next":""}]},{"type":"narration","text":"我低头看自己的手。掌心里有一粒灰，很小。我用另一只手的指尖去碰它，它化了，化成一点水。"},{"type":"narration","text":"我不知道该怎么办。我只知道从今天起，我不可能再假装自己只是在失眠。"},{"type":"choice","text":"","prompt":"手心里那点灰还在。你要怎么处理刚才那七秒？","options":[{"text":"跟艾莉丝回研究所，把手上的东西全部交给他们看","affectionWho":"艾莉丝","affection":8,"insomnia":-2,"flag":"went_with_alice","next":""},{"text":"留在站台，把那个老人被抹掉的痕迹找出来","affectionWho":"","affection":0,"insomnia":7,"flag":"stayed_at_station","next":""},{"text":"先不走。把刚才那七秒在心里从头走一遍","affectionWho":"","affection":0,"insomnia":3,"flag":"replayed_the_seven_seconds","next":"#l04"}]},{"type":"narration","text":"另外两条路的分量我都称过：跟她走，或者一个人留下来。"},{"type":"narration","text":"称到最后，我发现自己在偷看手机上还剩多少时间。"},{"type":"narration","text":"不管选哪一条，都得先站稳。","label":"l04"},{"type":"narration","text":"我选了。"},{"type":"narration","text":"艾莉丝没有说服我，也没有阻止我。她只是把仪器从袖口里又拿出来，打开了一页空白的记录。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你说，我记。只记事，不做判断。"},{"type":"narration","text":"我开口的时候才发现自己讲了很久。我把灰外套、菜袋子、那颗在半空消失的白菜、那张写着地址的纸，一件一件讲出来。讲到那张纸的时候我停了一下。"},{"type":"choice","text":"","prompt":"讲到那张纸的时候你停了一下。要继续讲吗？","options":[{"text":"讲。那张纸是整件事里最不对的地方","affectionWho":"艾莉丝","affection":3,"insomnia":1,"flag":"told_alice_about_the_paper","next":""},{"text":"跳过它。先把别的讲完","affectionWho":"艾莉丝","affection":-3,"insomnia":0,"flag":"skipped_the_paper","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"地址是你住的地方。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"对。所以他不是路过。他在等我。"},{"type":"narration","text":"她的笔停了半秒，然后继续写。她写字很快，横平竖直，一点都不像在记录一件刚刚发生过的事。"},{"type":"choice","text":"","prompt":"她的笔停了半秒。你要不要问她为什么停？","options":[{"text":"问。那半秒比整页记录都重要","affectionWho":"艾莉丝","affection":4,"insomnia":1,"flag":"asked_why_her_pen_stopped","next":""},{"text":"不问。她写的字比她的话诚实","affectionWho":"艾莉丝","affection":3,"insomnia":-1,"flag":"trusted_her_handwriting","next":""}]},{"type":"narration","text":"检修口那面墙上有一块很淡的痕迹，比周围白一点，像被人擦过。我伸手去碰，指腹是凉的。"},{"type":"narration","text":"我忽然想起昨天咖啡馆玻璃上的那行字。有人提前十七分钟通知了我。今天没有人通知我，只留了一个老人站在墙边等我。"},{"type":"choice","text":"","prompt":"昨天有人通知你，今天没有。这两件事差在哪？","options":[{"text":"差在我今天没有听话","affectionWho":"","affection":0,"insomnia":3,"flag":"blamed_himself_for_not_listening","next":""},{"text":"差在通知我的人换了","affectionWho":"","affection":0,"insomnia":4,"flag":"suspected_a_different_messenger","next":""}]},{"type":"narration","text":"留字的人和等人的人，用的可能是同一种笔。"},{"type":"narration","text":"车站的广播又报了一次时间。七点五十八分。距离裂缝张开，过去了五分钟。这五分钟是真的，我一秒都没有少。"},{"type":"narration","text":"而我宁愿它少掉。"},{"type":"narration","text":"我抬起头，看见广告屏上那个女人终于把杯子举起来了，然后画面翻过去，开始播下一段广告。"}]},"1-5a":{"sceneId":"1-5a","chapter":"第一幕·异变初现","title":"被少掉的人","background":"bg_library_day","bgm":"bgm_mystery","dense":true,"next":"1-6","lines":[{"type":"narration","text":"第五天下午，我回到了历史图书馆。"},{"type":"narration","text":"我需要一个地方坐下来，把今天早上那七秒写清楚。图书馆有桌子、有暖气、有四百多页干净的登记簿，还能让我翻旧报纸。"},{"type":"narration","text":"白天的馆里和夜里完全是两个地方。白天到处是人，学生占着靠窗的长桌，管理员推着小车来回走，日光灯亮得很硬，把每一粒灰都照出来。"},{"type":"narration","text":"灰尘其实一直在。只是夜里没有这么多双眼睛盯着它。"},{"type":"choice","text":"","prompt":"白天馆里到处是人，灯亮得很硬。先坐下吗？","options":[{"text":"先找靠窗的长桌坐下","affectionWho":"","affection":0,"insomnia":-1,"flag":"sat_by_the_window_first","next":""},{"text":"先把二层走一圈","affectionWho":"","affection":0,"insomnia":0,"flag":"walked_the_second_floor_first","next":""}]},{"type":"narration","text":"白天的图书馆什么都清楚，清楚得让我有点不习惯。"},{"type":"narration","text":"我上了二层，在历史区的最后一排坐下，把口袋里的纸摊开。上面是我画的站台，歪歪扭扭，菜袋子、检修口、那道折缝。"},{"type":"narration","text":"然后我开始做一件很笨的事。我在纸上写下那七秒里我看见的所有东西，一件一件，写到没有东西可写为止。"},{"type":"narration","text":"写到第五件的时候，我停住了。"},{"type":"choice","text":"","prompt":"写到第五件，笔停住了。要不要接着写？","options":[{"text":"把那五件从头念一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_five_items_again","next":""},{"text":"接着往下写，能写多少写多少","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_writing_past_the_fifth","next":""}]},{"type":"narration","text":"字越写越小，写到后来连我自己都要凑近才认得。"},{"type":"narration","text":"那张写着地址的纸，是我最确定的东西。可现在我在回忆的时候，脑子里浮出来的不只是一张纸——还有一个人的手，正在把那张纸递给我。"},{"type":"narration","text":"那只手比老人家的手年轻。指甲剪得很短，食指侧面有一小块烫伤的疤。"},{"type":"narration","text":"我盯着自己写下的这行字看了很久。我没有见过那只手。半分之一的把握都没有。"},{"type":"choice","text":"","prompt":"我记得那只手上的疤，可我没见过那只手。","options":[{"text":"在纸上把那只手也画出来","affectionWho":"","affection":0,"insomnia":0,"flag":"drew_the_hand_with_the_scar","next":""},{"text":"跳过它，先写别的","affectionWho":"","affection":0,"insomnia":-1,"flag":"skipped_the_hand_for_now","next":"#l01"}]},{"type":"narration","label":"l01","text":"跳过也一样。那只手已经按在这张纸上了，指节的位置比我想的短。"},{"type":"narration","text":"可我知道那块疤的形状，圆圆的，像一枚小小的月牙。这种知道不在脑子里，在舌头上——我知道它，就像知道我自己的名字。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"日光灯开始变软。不是闪烁，是变软，边缘糊开一圈白。周围学生的说话声拖长了一点，像录音机转速慢了。"},{"type":"narration","text":"我知道这是什么。这是第三天的老朋友。我数了一下：从三月十二号晚上到现在，第五天，我已经连续清醒了九十六个小时。"},{"type":"choice","text":"","prompt":"九十六个小时没睡，医生早就有交代。","options":[{"text":"把医生的话在纸上抄一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_the_doctor_warning","next":""},{"text":"不看那句话，把纸翻过去","affectionWho":"","affection":0,"insomnia":-2,"flag":"turned_the_paper_over","next":""}]},{"type":"narration","text":"抄的时候手很稳，稳得不像一个九十六小时没合眼的人。"},{"type":"narration","text":"医生说过，到这个程度会出现「结构性错觉」——就是大脑会自己造人物、造对话、造手续，造得比真的还齐。"},{"type":"narration","text":"我告诉自己：那只手就是结构性错觉。"},{"type":"narration","text":"然后我翻开了桌上的旧报纸。"},{"type":"narration","text":"我不是要查裂缝。我是想找一个借口，让眼睛和手都忙起来，别去想七点五十三分那一把灰。"},{"type":"choice","text":"","prompt":"我需要一件事让眼睛和手忙起来。翻报纸吗？","options":[{"text":"翻八年前旧街区改造那两版","affectionWho":"","affection":0,"insomnia":0,"flag":"searched_the_eight_year_old_news","next":""},{"text":"先翻最近一个月的社会版","affectionWho":"","affection":0,"insomnia":0,"flag":"searched_recent_pages_first","next":""}]},{"type":"narration","text":"报纸很厚，翻起来哗哗响，响得旁边两个学生抬头看了我一眼。"},{"type":"narration","text":"报纸装订成很厚的合订本，纸边发黄，翻起来有一股旧纸和霉混在一起的味。八年前的旧街区改造报道，占了整整两版。"},{"type":"narration","text":"第二版下面有一张合影。新东京第七中学，旧校舍拆除前留影。下面那行小字里列了六个名字。"},{"type":"narration","text":"六个人站成一排，最右边那个位置——"},{"type":"fx","fx":"flash","text":""},{"type":"choice","text":"","prompt":"六个人的队形里，最右边留了一个人的宽度。","options":[{"text":"数一数地上那排鞋贴标记","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_shoe_marks","next":""},{"text":"先看照片背面有没有字","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_back_of_the_photo","next":""}]},{"type":"narration","text":"我把照片翻过来，背面只有一行印上去的日期，别的什么都没有。"},{"type":"narration","text":"最右边那个位置是空的。"},{"type":"narration","text":"不是没人站，是那块地方本来就是空的。六个人的队形里，最右边留了一个刚好一个人的宽度，前面地上还有一双鞋贴的位置标记。"},{"type":"narration","text":"照片洗出来的时候应该是有人的。我见过很多老照片，我知道那种「后来被人修掉」会留下什么——那会留下一块比周围干净的空白，边缘有一圈生硬的过渡。"},{"type":"choice","text":"","prompt":"这张留白的地方和旁边的地砖一样脏。","options":[{"text":"不急着下结论，先看名字","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_the_names_first","next":""},{"text":"把报纸举到灯下照一照","affectionWho":"","affection":0,"insomnia":0,"flag":"held_the_page_against_the_lamp","next":""}]},{"type":"narration","text":"灯下看更清楚，留白那块的颗粒跟旁边完全一样，一颗都不缺。"},{"type":"narration","text":"这张照片没有。这张照片从一开始就是这样洗的。留白的地方跟旁边的地砖一样粗糙、一样脏、一样有颗粒。"},{"type":"narration","text":"像是这个人走的时候，连这片胶片都被重新感了一次光。"},{"type":"narration","text":"我把报纸凑近看那六个名字。我一个个念，念到第五个的时候我停住了。"},{"type":"narration","text":"第五个名字我认得。因为那是我认识的一个人的姓氏。而照片上站着的六个人里，没有一个人有那个人的脸。"},{"type":"choice","text":"","prompt":"念到第五个名字的时候我停住了。","options":[{"text":"把那六个名字一个个抄下来","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_all_six_names","next":""},{"text":"先记住那个姓，别的不管","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_surname_in_mind","next":""}]},{"type":"narration","text":"抄到第五个的时候，笔尖在纸上停了一下，墨水洇出一小团。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……不对。"},{"type":"narration","text":"我说不清楚哪里不对。我只知道自己正在为一张照片费这么大劲，这本身就说明照片里少了个人。"},{"type":"narration","text":"可如果照片里真的少了人，那被少掉的是谁？这个问题的答案不在报纸上，应该在我脑子里。而我的脑子里只有一块边缘很整齐的空白。"},{"type":"narration","text":"我合上报纸，去找管理员。"},{"type":"choice","text":"","prompt":"合上报纸去找管理员，还是自己再想想？","options":[{"text":"去找管理员查借阅记录","affectionWho":"","affection":0,"insomnia":0,"flag":"went_to_the_administrator","next":""},{"text":"先在原地把六个名字念一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_names_once_more","next":""}]},{"type":"narration","text":"穿过自习室的时候暖气吹在脸上，有一瞬间我几乎觉得自己是正常的。"},{"type":"narration","text":"白班的管理员不是老周，是个三十多岁的女人，姓什么我不知道，胸牌上写着临时工。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"打扰一下，第八排第三层那本旧报纸合订本，今年的借阅记录能查吗。"},{"type":"narration","text":"她抬头看我，眼神里有一点为难，但还是拿起了终端。"},{"type":"narration","text":"她敲了几下，屏幕上跳出一行很短的东西。她读了一遍，又读了一遍，然后把屏幕转向我。"},{"type":"choice","text":"","prompt":"她读了两遍才把屏幕转向我。要不要先问？","options":[{"text":"先让她自己说，不要催","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_her_speak_first","next":""},{"text":"凑过去自己看那行字","affectionWho":"","affection":0,"insomnia":0,"flag":"leaned_in_to_read_the_screen","next":""}]},{"type":"narration","text":"屏幕上那两条横线很细，细得像被人用指甲从表格里划出去的。"},{"type":"narration","text":"借阅记录那一栏是空的。不是「无人借阅」，是那一整年的格子都被删掉了，只剩两条横线，像表格在那一格自己长住了。"},{"type":"narration","text":"「系统里没有，」她说，「要不你去问问周师傅？他管旧报纸。」"},{"type":"narration","text":"然后她又补了一句。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"小林。你找旧东西，找我。"},{"type":"narration","text":"老周不知道什么时候站在我旁边了，手里推着那辆装还书的小车。他今天没穿胶鞋，穿了一双布鞋，走路一点声都没有。"},{"type":"choice","text":"","prompt":"老周换了布鞋，走路一点声音都没有。","options":[{"text":"先问他今天怎么不穿胶鞋","affectionWho":"老周","affection":2,"insomnia":0,"flag":"asked_about_the_footwear","next":""},{"text":"不问鞋，直接问那个人","affectionWho":"老周","affection":0,"insomnia":0,"flag":"asked_about_the_person","next":""}]},{"type":"narration","text":"他推着小车站在那儿，车上的书码得整整齐齐，一本都没有歪。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"周叔，我想问一个人。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"问吧。问出来就说明还算数。"},{"type":"narration","text":"我张了张嘴。就在这时，我卡住了。"},{"type":"narration","text":"这就是最要命的地方。我在脑子里有一个很清楚的形状：一个人，比我矮一点，说话快，冬天也穿很薄的外套，每次见面都会先拍一下我的肩。"},{"type":"narration","text":"形状完整，声音完整，动作完整。就是没有名字。"},{"type":"choice","text":"","prompt":"形状、声音、动作都在，就是没有名字。","options":[{"text":"先把那个形状写下来","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_shape_down","next":""},{"text":"不写，怕写下来的都是假的","affectionWho":"老周","affection":1,"insomnia":-1,"flag":"refused_to_write_the_shape","next":""}]},{"type":"narration","text":"写下来的形状比我脑子里的矮一点，连这一点我都拿不准。"},{"type":"narration","text":"那个名字躺在什么地方了。我知道它躺在那儿，就像知道抽屉里有一把钥匙，可整只手伸进去摸到的全是底板的木头纹路。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……我忘了他的名字。"},{"type":"narration","text":"老周没有说话。他推着小车走了两步，把那本合订本重新拿起来，翻到那张合影，用手指在那块空的地方按了一下。"},{"type":"choice","text":"","prompt":"他把手指按在那块空的地方，按了一下。","options":[{"text":"问他那块地方还能不能补","affectionWho":"老周","affection":3,"insomnia":0,"flag":"asked_if_the_gap_could_be_filled","next":""},{"text":"不问，看他按了多久","affectionWho":"老周","affection":0,"insomnia":0,"flag":"watched_his_finger_press","next":""}]},{"type":"narration","text":"他按下去的时候指尖往上顶了一点，像要把纸底下什么东西顶出来。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"你不是忘了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"照片上那块空的地方，是谁。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"是他被人从名字那一格上抠走了。剩下的部分还挂在你这儿，所以你才会觉得少。"},{"type":"narration","text":"我站在原地，手指有点发凉。第一次有人不把我当成需要吃药的病人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"周叔，你为什么知道。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"我在这栋楼里放了四十年书。书被抽走一本，架子会往外歪一点点。你这几天进来，往那边看的时候一直在歪。"},{"type":"choice","text":"","prompt":"他说我进门的时候一直在往那边歪。","options":[{"text":"承认：我确实一直往那边看","affectionWho":"老周","affection":3,"insomnia":0,"flag":"admitted_the_pull_sideways","next":""},{"text":"嘴硬：我只是在找旧报纸","affectionWho":"老周","affection":-2,"insomnia":0,"flag":"denied_the_pull_sideways","next":""}]},{"type":"narration","text":"他听完没有笑，也没有点头，只是把小推车往旁边挪了半步。"},{"type":"narration","text":"他推车走了。走了两步又回头像上次那样，只是这次他回头了。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"别去问别人。你一问，别人就会开始帮你想那个人。想出来的都是假的。"},{"type":"narration","text":"我坐回桌边，把那张合影拍了下来。照片在屏幕里的时候更明显——那块留白的边缘比别人都清楚，因为它周围六个人的轮廓都很糊。"},{"type":"choice","text":"","prompt":"照片在屏幕里，留白的边缘比谁都清楚。","options":[{"text":"放大那块留白，看它的颗粒","affectionWho":"","affection":0,"insomnia":0,"flag":"zoomed_into_the_blank_space","next":""},{"text":"先把六个人的轮廓存下来","affectionWho":"","affection":0,"insomnia":0,"flag":"saved_the_six_silhouettes","next":"#l02"}]},{"type":"narration","label":"l02","text":"存下来的轮廓还是糊的。只有那块空的地方清楚，清楚得不像旧照片。"},{"type":"narration","text":"我开始在馆里走动。我没有去问别人，我换了方式：我找不该少的东西。"},{"type":"narration","text":"第一层自习室有六张长桌，每张四人。第六排最后那把椅子换了新漆，颜色比旁边深一档。管理员说这批椅子是七年前一起买的，从没换过。"},{"type":"narration","text":"二层饮水机旁边的杯子架上，有一个卡口是空的。那种卡口是专门用来挂搪瓷杯的，挂钩上还有一圈没洗掉的茶渍，下面的隔板上有一圈圆的印子。"},{"type":"choice","text":"","prompt":"杯架上的卡口空着，挂钩上还留着茶渍。","options":[{"text":"把三样东西的位置都量一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"measured_the_three_spots","next":""},{"text":"去找管理员问那只杯子","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_about_the_missing_cup","next":""}]},{"type":"narration","text":"量下来我才发现，三样东西差不多在一条直线上，偏差不超过半拃。"},{"type":"narration","text":"三层靠窗的桌子上刻了一行字：借我两块钱，下周还。字迹工整，刻得很浅。我摸了一下，刻痕是烫的——不是热，是烫，像有人刚刚刻完。"},{"type":"narration","text":"我把这三样东西的位置记在纸上，画成一张很潦草的地图。三个点连起来，正好是一张椅子的位置：正对三层靠窗的桌子，斜对着饮水机，背后就是旧报纸那一排。"},{"type":"narration","text":"那是一个人常年坐的位置。"},{"type":"narration","text":"这栋楼把这个人的位置记得很牢。只有人不在了。"},{"type":"choice","text":"","prompt":"这栋楼把这个人的位置记得很牢。","options":[{"text":"把这句话写进纸上那行字里","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_line_into_the_note","next":""},{"text":"不写，先站起来看看周围","affectionWho":"","affection":0,"insomnia":0,"flag":"stood_up_to_look_around","next":""}]},{"type":"narration","text":"我把这句话写完，纸上已经排了四行，一行比一行短。"},{"type":"fx","fx":"timeline","text":""},{"type":"narration","text":"然后我看见了整栋楼。"},{"type":"narration","text":"不是眼睛看见的。是我站在大厅中央抬头的那一瞬间，整栋楼在我眼前摊平了——每一层都薄成一张纸，叠在一起，我能同时看见今天、上周、去年、八年前。"},{"type":"narration","text":"在这些叠起来的楼层里，有一个影子一直在同一张桌子边坐着。影子的边是模糊的，越靠近现在越淡，越往前越清楚。"},{"type":"choice","text":"","prompt":"影子越靠近现在越淡，像被擦过。","options":[{"text":"盯住最淡的那一段看","affectionWho":"","affection":0,"insomnia":0,"flag":"stared_at_the_faintest_part","next":""},{"text":"先看八年前那一段最清楚的","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_the_clearest_year","next":""}]},{"type":"narration","text":"我越看越确定，那不是影子在变淡，是有人一直在擦。"},{"type":"narration","text":"八年前他坐在这儿，五年前他也坐在这儿，三个月前——三个月前他的影子开始缺一块，像被人用橡皮在这张纸上蹭了很多遍。"},{"type":"narration","text":"我看着那个影子抬手，在自己的本子上写了什么，然后抬头，朝我这个方向笑了一下。"},{"type":"narration","text":"那一笑我看懂了。他在说：你终于来了。"},{"type":"choice","text":"","prompt":"他在说：你终于来了。要不要回应？","options":[{"text":"在纸上回一句：我来了","affectionWho":"","affection":0,"insomnia":1,"flag":"answered_on_the_paper","next":""},{"text":"抬起头，直视他那个方向","affectionWho":"","affection":0,"insomnia":1,"flag":"looked_straight_at_him","next":"#l03"}]},{"type":"narration","label":"l03","text":"抬头的瞬间楼层重新叠回来，他的笑被压回纸里，只剩一层薄薄的白。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"楼层重新叠回原样。我扶着桌子站稳，眼前一阵一阵地黑。这是我的失眠在报警，我知道，可我没有闭上眼睛。"},{"type":"narration","text":"我反而做了另一件事。我掏出手机，把刚才那段画面用最快的速度写下来，一句一句，怕它像今天早上的灰一样漏掉。"},{"type":"narration","text":"写到最后，我在纸上补了一行：这个人三个月前开始消失，而三个月前，我丢了三十个小时。"},{"type":"choice","text":"","prompt":"他三个月前开始消失，我三个月前丢了小时。","options":[{"text":"把这两个日期并排写下来","affectionWho":"","affection":0,"insomnia":1,"flag":"wrote_both_dates_side_by_side","next":""},{"text":"先不比较，把纸折起来","affectionWho":"","affection":0,"insomnia":-1,"flag":"folded_the_paper_without_comparing","next":""}]},{"type":"narration","text":"两个日期放在一起，中间那段空白比字还显眼。"},{"type":"narration","text":"同一段时间。同一个人。"},{"type":"narration","text":"我坐在那张不属于任何人的椅子旁边，第一次觉得，我丢掉的三十个小时可能不是我的。它们是有人替我保管着的一段，而保管的人正在被擦掉。"},{"type":"narration","text":"谁在擦他。为什么连我也只记得形状，不记得名字。是他的名字先被擦掉，还是我和他之间的那条线先被剪断。"},{"type":"narration","text":"我不像在查一个案子。我像在给自己的记忆做缝合，可线太短，针太粗，每缝一针都从旁边的布上带出一点线头。"},{"type":"choice","text":"","prompt":"线太短，针太粗，每缝一针都带出线头。","options":[{"text":"继续缝，哪怕带出更多线头","affectionWho":"","affection":0,"insomnia":1,"flag":"kept_stitching_the_memory","next":""},{"text":"先停下来，把针放下","affectionWho":"","affection":0,"insomnia":-2,"flag":"put_the_needle_down","next":"#l04"}]},{"type":"narration","label":"l04","text":"针放下也一样。缝过的地方都留下线头，风一吹就动。"},{"type":"narration","text":"傍晚的馆里开始收人。学生一批批走了，日光灯一盏盏灭，只剩靠窗那几盏。影子从走廊尽头拉过来，慢慢爬到我脚边。"},{"type":"narration","text":"我把工具收好：一张潦草的地图、一张合影的照片、一行刚刚刻好的字。这就是我关于那个人的全部。一个人的全部，装进了三张纸。"},{"type":"narration","text":"我抬起头，对着那个空座位说了一句话。声音很小，小到只有我自己听见。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_sleep","text":"我会把你找回来。"},{"type":"choice","text":"","prompt":"我对着那把空椅子说了一句话。","options":[{"text":"再说一遍，说大声一点","affectionWho":"","affection":0,"insomnia":1,"flag":"said_it_again_louder","next":""},{"text":"不说了，只是看着那把椅子","affectionWho":"老周","affection":0,"insomnia":-1,"flag":"kept_silent_by_the_chair","next":""}]},{"type":"narration","text":"说完以后我站了一会儿，等着那把椅子有没有什么反应。"},{"type":"narration","text":"没有回答。但饮水机那边「咕」地响了一声，像有人在接水。"},{"type":"narration","text":"我走过去，卡口还是空的。而杯架上多了一点湿。"},{"type":"narration","text":"我在杯架前站了一会儿，把手按在卡口上，那里还留着一圈凉。"},{"type":"choice","text":"","prompt":"你已经有了三张纸。今晚怎么做？","options":[{"text":"去研究所把三张纸交给艾莉丝，让她用设备查时间线","affectionWho":"艾莉丝","affection":7,"insomnia":0,"flag":"shard_clue_to_alice","next":""},{"text":"留在图书馆，守到闭馆以后，看那个人会不会自己回来","affectionWho":"老周","affection":4,"insomnia":1,"flag":"waited_in_library","next":""}]},{"type":"narration","text":"我选了以后做了准备。我把三张纸复印了一份，一份塞进外套内袋，一份留在桌面上，用一本厚字典压着。"},{"type":"narration","text":"如果我也被少掉，至少纸还在。纸被少掉，至少字典压过它的印子还在。这是我这几天学会的唯一一种保存方式。"},{"type":"choice","text":"","prompt":"复印的那份留在桌面上，用字典压着。","options":[{"text":"再压一本，把纸角也压平","affectionWho":"","affection":0,"insomnia":0,"flag":"pressed_the_copy_with_another_book","next":""},{"text":"不压了，把多余那份带走","affectionWho":"","affection":0,"insomnia":0,"flag":"took_the_copy_with_him","next":""}]},{"type":"narration","text":"我把桌面收拾干净，连一根头发都没留下。"},{"type":"narration","text":"闭馆的音乐响起来的时候，老周推着车从走廊那头过来，停在离我三米远的地方，不出声。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"小林，明天别来图书馆。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"为什么。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"明天这里会有人说一些话。他们说的话，你听了会想动手。"},{"type":"narration","text":"我问他是什么人。他推车走了，轮子在木地板上滚出很轻的一串声音。"},{"type":"narration","text":"走到门口的时候他停了一下，没有回头，只说了一句我到现在还记得的话。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"记住你现在这句：要把人找回来。以后你会想改这句。"}]},"1-6":{"sceneId":"1-6","chapter":"第一幕·异变初现","title":"第一次交锋","background":"bg_library_basement","bgm":"bgm_lord","dense":true,"next":"1-7","lines":[{"type":"narration","text":"第六天，三月十七号，早上十点。我没听老周的话，我还是来了图书馆。"},{"type":"narration","text":"我告诉自己是因为那三张纸还压在三层的字典下面。真实的原因是我想看看，到底谁会来。"},{"type":"narration","text":"馆里比平时安静。不是没人的那种安静，是有人但都不出声的那种安静。自习室坐着十几个人，翻页的声音整齐得像被人指挥过。"},{"type":"narration","text":"我上到三层，把那本厚字典抬起来。三张纸还在。最上面那张的边缘被人对齐过，整齐得不像是被风弄的。"},{"type":"choice","text":"","prompt":"三张纸被人对齐过。你要先查这道边吗？","options":[{"text":"看对齐的边，判断是手还是风","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_aligned_edges","next":""},{"text":"不查纸，先看谁上了三层","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_who_came_upstairs","next":""}]},{"type":"narration","text":"我抬头。那六个陌生人坐在大厅的六把椅子上，围成一个不完整的圈。他们穿着很普通的旧衣服，脸上没有任何标记，安静地坐着手放在膝盖上。"},{"type":"narration","text":"圈缺了一角。缺的那个位置正好对着旧报纸那一排。"},{"type":"narration","text":"我走过去。走到离他们三米的地方，最靠里那个男人开口了。他很年轻，大概三十出头，说话的时候不抬眼睛。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你们在等人？"},{"type":"narration","text":"他抬起眼睛看我。他的眼球很干净，干净得不太像活人，但那是错觉，只是他把睡眠补得很好。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"我们在等你。"},{"type":"choice","text":"","prompt":"声音不是从那六个人嘴里出来的。你要出声吗？","options":[{"text":"出声问一句：刚才是谁在说话","affectionWho":"时间领主","affection":-2,"insomnia":0,"flag":"asked_who_spoke_through_them","next":""},{"text":"不出声，先记下声音来的方向","affectionWho":"","affection":0,"insomnia":0,"flag":"marked_where_the_voice_came_from","next":""}]},{"type":"narration","text":"又来了。那个声音。它从大厅的穹顶落下来，从我脚下升上来，从中间那根柱子后面过来，但没有一个字是从这些年青人的嘴里出来的。"},{"type":"narration","text":"我环视四周。自习室那十几个人依然在翻页，没有一个人抬头。他们听不见。"},{"type":"narration","text":"年轻男人站起来。他站得很慢，像在遵守某种礼节。他摊开双手，掌心朝上，手上什么都没有。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"你昨天看见的那把灰，你觉得那是死。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"不是。那是一道算错的题被擦掉了。草稿纸上写错了，你不擦，后面的整页都会歪。"},{"type":"choice","text":"","prompt":"他那句话太顺了。你要不要把心里那句说出来？","options":[{"text":"说出来：这不是擦草稿，是擦人","affectionWho":"时间领主","affection":-3,"insomnia":0,"flag":"said_it_was_erasing_people","next":""},{"text":"咽回去。跟他吵只会记得更牢","affectionWho":"","affection":0,"insomnia":0,"flag":"swallowed_the_rebuttal","next":""}]},{"type":"narration","text":"我说不上话。不是被他震住，是这句话太顺了，顺到像有人替我把最坏的那种心安理得念了出来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"那个人在等我。他有地址。他有菜。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"都是错的答案。等待是错，地址是错，菜是错。错的东西凑在一起，看起来就像一个人。"},{"type":"narration","text":"六个陌生人同时低下头。动作一致，像一个人被复制了六次。"},{"type":"narration","text":"然后他们开始动。不是扑上来，是散开。两个人往大厅两侧走，两个往下楼的楼梯口走，两个朝旧报纸那一排走。"},{"type":"choice","text":"","prompt":"他们散开的方向全是出口。你先做什么？","options":[{"text":"先喊自习室那十几个人","affectionWho":"","affection":0,"insomnia":0,"flag":"shouted_at_the_reading_room","next":"#l01"},{"text":"先退，把碎片按在胸口","affectionWho":"","affection":0,"insomnia":0,"flag":"pressed_the_shard_to_the_chest","next":""}]},{"type":"narration","text":"我喊了两声。翻页的声音没有停，那十几个人连头都没有抬，像隔着一层很厚的玻璃。","label":"l01"},{"type":"narration","text":"有一个人抬了头。他看的不是我，是我身后那面墙；看完他就低头，把那一页翻回去。"},{"type":"choice","text":"","prompt":"他们围过来的速度不快。你先动哪只脚？","options":[{"text":"往旧报纸那一排闪，那边人少","affectionWho":"","affection":0,"insomnia":0,"flag":"dodged_toward_the_old_papers","next":""},{"text":"往楼梯口退，先离开这三层","affectionWho":"","affection":0,"insomnia":0,"flag":"retreated_toward_the_stairs","next":""}]},{"type":"narration","text":"他们的围法很整齐。我很快就明白了：他们不是要抓我，他们是要清场。清场的意思是——把图书馆三层这一片，从时间上摘下来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"楼里还有人。自习室有十几个。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"他们不在此次修改范围内。你才在。"},{"type":"narration","text":"他把我一个人圈进了范围。绕过那两排书架，就在那面墙的前面。墙的位置，正好是我昨天看见那张空座位的地方。"},{"type":"narration","text":"我口袋里的碎片开始烫。它在往那面墙跳，跳得比上次更急。它认得这个地方。"},{"type":"choice","text":"","prompt":"再退两步就是昨天那个空位置。你停不停？","options":[{"text":"停住，把脚钉在原地","affectionWho":"","affection":0,"insomnia":0,"flag":"stopped_before_the_empty_seat","next":""},{"text":"再退一步，看那里到底有没有人","affectionWho":"","affection":0,"insomnia":0,"flag":"stepped_toward_the_empty_seat","next":""}]},{"type":"narration","text":"我退后一步。退错了方向——再退两步，我会退到自己昨天坐过的位置。那个位置已经空了，那里本来就缺一个人。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"后楼梯的门被撞开了。"},{"type":"narration","text":"不是被撞开的。是被一
