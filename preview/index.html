<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>时光之痕 · 剧本试玩</title>
<!--
  player-template.html —— 试玩播放器的「页面」本体，由 build-preview.js 注入数据后产出单文件试玩版。
  占位符注入（由 build-preview.js 完成，共 5 处：剧本数据、内嵌美术表、结局规则表、
  人物顺序、next 写法解析器）。替换失败就该报错，不要静默留着。
  硬约束：
    · 本页只允许存在一段可执行脚本标签（冒烟门禁用正则抓第一段脚本来跑；注释里连写标签
      都会被抓错，所以这里一律不写标签原文）
    · 只使用最小 DOM 桩里存在的 API：getElementById / createElement / appendChild /
      textContent / className / classList / style / dataset / addEventListener /
      new Image / localStorage / requestAnimationFrame / setTimeout
      —— 不要用 document.querySelector、window.*、createTextNode、setAttribute、closest
      （脚本标签之外的地方写文字说明是安全的）
-->
<style>
  /* ============ 设计令牌：深夜蓝底 + 古铜金（时间）+ 青（记忆）============= */
  :root{
    --bg:#05070c;
    --ink:#eef2f8;           /* 正文 */
    --dim:#a7b0c2;           /* 次要（对比度 ≥7:1） */
    --faint:#8b94a3;
    --gold:#d8b878;          /* 时间/主线 */
    --gold-ink:#f4e2b4;
    --gold-deep:#8c6a30;
    --cyan:#7fd6e6;          /* 记忆/时间线 */
    --violet:#b39ad6;        /* 时间领主 */
    --panel:rgba(9,12,20,.74);
    --panel-solid:rgba(7,9,15,.94);
    --line:rgba(216,184,120,.22);
    --line-soft:rgba(255,255,255,.10);
    --shadow:0 26px 64px rgba(0,0,0,.58);
    --r:16px;
    --font-ui:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    --font-nar:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  ::selection{background:rgba(216,184,120,.35)}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  #app{position:relative;width:100vw;height:100vh;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,#0d1220 0%,#05070c 62%)}

  /* ============ 舞台：满屏沉浸（橙光式铺满，不再留 16:9 黑边）============ */
  /* 背景与 CG 都是 object-fit:cover，铺满不变形；美术按 16:9 出图，
     在 16:10 / 4:3 的窗口里只是上下各裁掉一点，比留两条黑带更像在"玩"。 */
  #stage-wrap{position:absolute;inset:0}
  #stage{position:absolute;inset:0;background:#080a10;overflow:hidden}
  .layer{position:absolute;inset:0}

  /* ---- 背景 / CG：交叉淡入，轻微呼吸位移 ---- */
  #bg,#cglayer{overflow:hidden;background:#080a10}
  #cglayer{display:none;z-index:2}
  #bg .art,#cglayer .art{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;opacity:0;transition:opacity .55s var(--ease);
    filter:saturate(.94) brightness(.9) contrast(1.03)}
  #bg .art.in,#cglayer .art.in{opacity:1}
  #bg .art.in{animation:drift 56s ease-in-out infinite alternate}
  @keyframes drift{
    from{transform:scale(1.02) translate3d(-.6%,-.4%,0)}
    to{transform:scale(1.09) translate3d(.8%,.6%,0)}
  }
  /* 占位图/缺图时的文字层（占位美术是浅色卡片，这里给它压下去） */
  .art-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-ui);font-size:clamp(14px,1.4vw,22px);letter-spacing:.18em;
    color:rgba(238,242,248,.30);background:
      radial-gradient(90% 70% at 50% 30%,rgba(56,72,104,.55),rgba(7,9,15,.92)),
      repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px);
    transition:opacity .5s var(--ease);pointer-events:none}
  #portrait .art-fallback{font-size:0}

  /* ---- 立绘：底部压边、落地阴影、轻微上浮入场 ---- */
  #portrait{overflow:hidden;pointer-events:none;z-index:3}
  #portrait .art{position:absolute;left:50%;bottom:-2%;height:82%;width:auto;max-width:none;
    transform:translateX(-50%) translateY(14px);opacity:0;
    transition:opacity .4s var(--ease),transform .5s var(--ease);
    filter:drop-shadow(0 26px 44px rgba(0,0,0,.72)) drop-shadow(0 0 1px rgba(255,255,255,.22))}
  #portrait .art.in{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- 电影感遮罩：任何美术都能压出层次 ---- */
  #scrim{z-index:4;pointer-events:none;background:
    linear-gradient(180deg,rgba(4,6,11,.76) 0%,rgba(4,6,11,.30) 24%,rgba(4,6,11,.12) 42%,rgba(4,6,11,.70) 76%,rgba(4,6,11,.95) 100%),
    radial-gradient(112% 84% at 50% 44%,transparent 38%,rgba(3,4,8,.78) 100%),
    linear-gradient(180deg,transparent 34%,rgba(4,6,11,.30) 60%,rgba(4,6,11,.55) 100%)}
  #tint{opacity:0;transition:opacity .7s var(--ease);mix-blend-mode:screen;z-index:5;pointer-events:none}
  #grain{opacity:0;transition:opacity .7s var(--ease);z-index:6;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);
    background-size:3px 3px}
  #vignette{pointer-events:none;z-index:7;box-shadow:inset 0 0 220px rgba(0,0,0,.78)}
  #flash{background:#fff;opacity:0;pointer-events:none;z-index:8}

  /* ============ HUD：顶部一条窄信息带（章节 / 失眠 / 进度 / 用时）============ */
  /* 入口按钮全部搬到右缘菜单栏，这里只留信息；右边留出菜单条的宽度，别被压住。 */
  #hud{position:absolute;top:0;left:0;right:0;z-index:9;display:flex;justify-content:space-between;
    align-items:center;gap:16px;padding:12px 84px 24px 20px;pointer-events:none;
    background:linear-gradient(180deg,rgba(3,5,10,.66),transparent)}
  .hud-left{display:flex;flex-direction:column;gap:4px;min-width:0;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  #hud-chapter{font-size:12px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
  #hud-title{font-size:13px;color:var(--dim);letter-spacing:.06em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:38ch}
  .hud-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .meter{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;color:var(--dim);
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .meter .lbl{color:var(--faint)}
  .meter .bar{position:relative;width:104px;height:5px;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .meter .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
    background:linear-gradient(90deg,#7fd6e6,#d8b878);transition:width .6s var(--ease),background .6s}
  .meter b{font-weight:600;color:var(--ink);min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
  .meter[data-tier="2"] .bar i{background:linear-gradient(90deg,#a98bd6,#d8b878)}
  .meter[data-tier="3"] .bar i{background:linear-gradient(90deg,#e0708a,#d8b878)}
  #hud-progress{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);
    letter-spacing:.08em;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  #hud-progress .pbar{position:relative;width:74px;height:5px;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.12)}
  #hud-progress .pbar i{position:absolute;inset:0 auto 0 0;background:var(--gold);opacity:.75;
    transition:width .5s var(--ease)}
  #hud-time{font-size:12px;color:var(--faint);letter-spacing:.08em;font-variant-numeric:tabular-nums}
  /* ============ 右缘竖排菜单栏（橙光式：贴在画面右边）============ */
  /* 只写两字中文标签、不塞图标字体：任何系统都能正常渲染，也不会出现方块豆腐。 */
  #rail{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:11;
    display:flex;flex-direction:column;gap:4px;padding:8px 7px;border-radius:14px;
    background:rgba(6,9,16,.5);border:1px solid var(--line-soft);backdrop-filter:blur(10px)}
  .rail-btn{display:block;width:54px;min-height:44px;padding:0;border-radius:10px;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--dim);
    font-size:12px;letter-spacing:.16em;text-indent:.16em;
    transition:color .18s,border-color .18s,background .18s}
  .rail-btn:hover{color:var(--gold-ink);border-color:var(--line-soft);background:rgba(30,25,14,.68)}
  .rail-sep{height:1px;margin:5px 8px;
    background:linear-gradient(90deg,transparent,var(--line-soft),transparent)}

  /* ============ 对话框 ============ */
  /* 底部通宽对话条：右边缘让开菜单栏（8 + 54 + 14 ≈ 76px），正文不会被菜单压住 */
  #dialog{position:absolute;left:3%;right:78px;bottom:2.6%;z-index:9;
    padding:26px 30px 20px;min-height:22%;max-height:56%;overflow:auto;
    background:linear-gradient(180deg,var(--panel),rgba(5,7,12,.94));
    border:1px solid var(--line-soft);border-top-color:var(--line);
    border-radius:var(--r);backdrop-filter:blur(16px) saturate(140%);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
    display:none;animation:rise .3s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #dialog::before{content:"";position:absolute;left:32px;right:32px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
  #dialog.cg-mode{padding-top:22px;text-align:center}
  /* 快进中（长按 / Z）：右上角给个角标，免得画面自己往前跑看着发慌 */
  #dialog.fast::after{content:"快进中";position:absolute;right:16px;top:12px;
    font-size:11px;letter-spacing:.24em;color:var(--gold);opacity:.85}
  /* 姓名板：面板内左上角的名牌。
     别用 top:-18px 压在边框上——#dialog 是 overflow:auto，会把名牌上沿裁掉一半。 */
  #speaker{display:inline-block;max-width:60%;padding:6px 16px;margin:0 0 10px;
    border-radius:9px;font-size:16px;font-weight:600;letter-spacing:.1em;
    color:#140f04;background:linear-gradient(180deg,#f0d9a8,#cfa964);
    box-shadow:0 10px 24px rgba(0,0,0,.55);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #speaker.empty{display:none}
  #dialog-text{white-space:pre-wrap}
  #body{font-family:var(--font-nar);font-size:clamp(15px,1.45vw,23px);font-weight:400;
    line-height:1.95;letter-spacing:.02em;color:var(--ink);
    text-shadow:0 1px 14px rgba(0,0,0,.6)}
  #dialog.narration #body{color:#d3dae7}
  #dialog.cg-mode #body{color:#f2f5fb}
  #caret{display:inline-block;margin-left:2px;color:var(--gold);opacity:0;
    animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .dialog-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px;
    min-height:20px}
  #next-hint{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.14em;
    color:var(--faint);opacity:0;transition:opacity .3s}
  #next-hint .chev{display:inline-block;font-size:15px;color:var(--gold);animation:bob 1.5s var(--ease) infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(3px);opacity:1}}

  /* ============ 选项 ============ */
  #choices{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:6%;
    background:radial-gradient(120% 100% at 50% 58%,rgba(4,6,11,.58),rgba(4,6,11,.9));
    backdrop-filter:blur(3px)}
  #choice-prompt{font-family:var(--font-nar);font-size:clamp(16px,1.6vw,24px);line-height:1.8;
    color:var(--gold-ink);text-align:center;max-width:34em;margin-bottom:4px;
    text-shadow:0 2px 18px rgba(0,0,0,.8)}
  #choice-list{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
  .choice{display:flex;align-items:center;gap:14px;width:min(760px,80%);min-height:56px;
    padding:15px 20px;text-align:left;cursor:pointer;font-family:var(--font-nar);
    font-size:clamp(15px,1.3vw,20px);line-height:1.6;color:var(--ink);
    background:linear-gradient(180deg,rgba(20,25,38,.86),rgba(11,14,22,.9));
    border:1px solid var(--line-soft);border-left:3px solid rgba(216,184,120,.35);
    border-radius:12px;backdrop-filter:blur(10px);
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    animation:choice-in .32s var(--ease) backwards;
    transition:transform .16s var(--ease),border-color .18s,background .18s,box-shadow .18s}
  @keyframes choice-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .choice:hover,.choice:focus-visible{transform:translateX(7px);border-color:var(--gold);
    border-left-color:var(--gold);background:linear-gradient(180deg,rgba(34,30,16,.9),rgba(18,18,16,.94));
    box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 1px rgba(216,184,120,.28)}
  .choice .key{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:flex;
    align-items:center;justify-content:center;font-family:var(--font-ui);font-size:14px;
    font-weight:600;color:#150f03;background:linear-gradient(180deg,#ecd39c,#c9a25f)}
  .choice .label{flex:1}
  .choice .kbd{flex:0 0 auto;font-family:var(--font-ui);font-size:11px;letter-spacing:.1em;
    color:var(--faint);border:1px solid var(--line-soft);border-radius:6px;padding:3px 7px}

  /* ============ 覆盖层：回想 / 存档 / 调试 ============ */
  .overlay{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;
    padding:4%;background:rgba(3,4,8,.72);backdrop-filter:blur(6px)}
  .overlay.open{display:flex}
  .sheet{width:min(880px,92%);max-height:82%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(11,14,23,.96),rgba(6,8,14,.98));
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
    animation:rise .26s var(--ease)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .sheet-head h3{margin:0;font-size:14px;font-weight:600;letter-spacing:.3em;color:var(--gold)}
  .sheet-body{padding:16px 20px 20px;overflow:auto}
  .sheet-foot{padding:12px 20px 16px;border-top:1px solid var(--line-soft);display:flex;
    justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--faint)}
  .xbtn{min-width:44px;min-height:44px;border-radius:10px;cursor:pointer;border:1px solid var(--line-soft);
    background:transparent;color:var(--dim);font-size:15px}
  .xbtn:hover{border-color:var(--gold);color:var(--gold-ink)}

  #backlog-list{display:flex;flex-direction:column;gap:14px}
  .log-row{display:flex;gap:12px;align-items:baseline}
  .log-who{flex:0 0 5.5em;text-align:right;font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.06em}
  .log-who.none{color:#98a2b6;font-weight:400}
  .log-text{flex:1;font-family:var(--font-nar);font-size:15px;line-height:1.85;color:#dfe5f0;white-space:pre-wrap}
  .log-row.current .log-text{color:var(--gold-ink)}

  /* 固定两列：auto-fit 在 880px 宽的弹层里会排成 3+1，第 4 个槽位掉到滚动区外面去 */
  #slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .slot{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;
    border:1px solid var(--line-soft);background:rgba(16,20,32,.6)}
  .slot .slot-name{font-size:12px;letter-spacing:.2em;color:var(--gold)}
  .slot .slot-meta{font-size:13px;line-height:1.7;color:var(--dim);min-height:3.4em}
  .slot .slot-meta .empty{color:var(--faint)}
  .slot .slot-btns{display:flex;gap:8px}
  .mini{flex:1;min-height:44px;border-radius:9px;cursor:pointer;font-size:13px;
    border:1px solid var(--line-soft);background:rgba(255,255,255,.04);color:var(--ink)}
  .mini:hover{border-color:var(--gold);color:var(--gold-ink)}
  .mini:disabled{opacity:.38;cursor:not-allowed}
  /* 存档改名（橙光的存档可以起名字，配 取消 / 确定） */
  .slot-input{width:100%;min-height:40px;padding:8px 12px;border-radius:9px;font-size:14px;
    font-family:var(--font-ui);letter-spacing:normal;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--gold)}

  /* ---- 设置面板 ---- */
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:13px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
  .set-k{font-size:13px;letter-spacing:.24em;color:var(--dim)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{min-width:92px;min-height:44px;padding:0 14px;border-radius:9px;cursor:pointer;
    font-size:13px;letter-spacing:.1em;border:1px solid var(--line-soft);
    background:rgba(255,255,255,.04);color:var(--ink);
    transition:border-color .18s,color .18s,background .18s}
  .seg button:hover{border-color:var(--gold);color:var(--gold-ink)}
  .seg button[aria-pressed="true"]{color:#1a1305;border-color:#efd8a4;
    background:linear-gradient(180deg,#f2dda9,#cda65f)}
  .set-note{margin-top:16px;font-size:12px;line-height:2.1;color:var(--faint);letter-spacing:.04em}
  .set-note kbd{font-family:var(--font-ui);font-size:11px;color:var(--dim);
    border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px;margin:0 2px}

  /* ============ 标题 / 结局 ============ */
  #title,#ending{position:absolute;inset:0;z-index:14;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:6%;text-align:center;
    background:radial-gradient(120% 100% at 50% 16%,rgba(10,15,28,.74),rgba(4,5,10,.95));
    backdrop-filter:blur(22px) saturate(1.1);animation:fade .4s var(--ease)}
  /* 标题页背后多半是占位卡：重度模糊把它揉成色块，再补一层自发光，
     页面就不至于空成一块黑板（占位卡上的文件名也就读不出来了）。 */
  #title::before,#ending::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(58% 44% at 50% 32%,rgba(216,184,120,.13),transparent 72%),
      radial-gradient(86% 62% at 50% 104%,rgba(127,214,230,.10),transparent 74%)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #ending{display:none}
  .kicker{font-size:11px;letter-spacing:.5em;color:var(--gold);text-transform:uppercase}
  .hr{display:flex;align-items:center;gap:12px;width:min(520px,80%);margin:2px 0}
  .hr::before,.hr::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .hr i{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);opacity:.8}
  #title h1{margin:0;font-family:var(--font-nar);font-size:clamp(38px,5.6vw,76px);font-weight:600;
    letter-spacing:.18em;text-indent:.18em;line-height:1.05;
    background:linear-gradient(180deg,#fdf3dc 8%,var(--gold) 58%,#9c7a3c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 12px 34px rgba(0,0,0,.75))}
  #title .sub{font-family:var(--font-nar);font-size:clamp(13px,1.2vw,17px);color:var(--dim);
    letter-spacing:.14em;margin:0}
  #title-meta{font-size:12px;letter-spacing:.16em;color:var(--faint)}
  .title-stats{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
  .title-stats .st{display:flex;flex-direction:column;gap:3px;min-width:74px}

<body>
<div id="app">
  <div id="stage-wrap"><div id="stage">
    <div class="layer" id="bg"></div>
    <div class="layer" id="cglayer"></div>
    <div class="layer" id="portrait"></div>
    <div class="layer" id="scrim"></div>
    <div class="layer" id="tint"></div>
    <div class="layer" id="grain"></div>
    <div class="layer" id="vignette"></div>
    <div class="layer" id="flash"></div>

        <div id="hud-progress"></div>

    </div>

    <div id="dialog" aria-live="polite">
      <div id="speaker" class="empty"></div>

        <div id="next-hint"><span class="chev">›</span><span>点击 / V 继续</span></div>
      </div>
    </div>

    <div id="choices">
      <div id="choice-prompt"></div>
      <div id="choice-list"></div>
    </div>

    <!-- 右缘菜单栏（橙光式竖排入口）：整条 no-advance，点它不会推进剧情 -->
    <div id="rail" class="no-advance">
      <button class="rail-btn no-advance" id="btn-slots" type="button" title="存档 (S)">存档</button>
      <button class="rail-btn no-advance" id="btn-load" type="button" title="读档 (L)">读档</button>
      <button class="rail-btn no-advance" id="btn-backlog" type="button" title="回想 (H)">回想</button>
      <button class="rail-btn no-advance" id="btn-settings" type="button" title="设置 (P)">设置</button>

    </div>

    <!-- 回想 -->
    <div class="overlay no-advance" id="backlog">
      <div class="sheet">
        <div class="sheet-head">
          <h3>回想</h3>
          <button class="xbtn no-advance" id="btn-backlog-close" type="button" title="关闭 (Esc)">✕</button>
        </div>
        <div class="sheet-body"><div id="backlog-list"></div></div>
        <div class="sheet-foot"><span>本次游玩已读过的台词，最新的在最下面</span></div>
      </div>
    </div>

    <!-- 存档 / 读档 -->
    <div class="overlay no-advance" id="slots">
      <div class="sheet">
        <div class="sheet-head">
          <h3>存档 / 读档</h3>
          <button class="xbtn no-advance" id="btn-slots-close" type="button" title="关闭 (Esc)">✕</button>
        </div>
        <div class="sheet-body"><div id="slot-grid"></div></div>
        <div class="sheet-foot">
          <span>槽位 0 是自动存档（每进一场自动写入），快捷键 S = 存到槽 1，L = 读槽 1</span>
          <span id="slot-hint"></span>
        </div>
      </div>
    </div>

    <!-- 设置：字速三档 + 全屏 + 快捷键（照橙光的操作口径） -->
    <div class="overlay no-advance" id="settings">
      <div class="sheet">
        <div class="sheet-head">
          <h3>设置</h3>
          <button class="xbtn no-advance" id="btn-settings-close" type="button" title="关闭 (Esc)">✕</button>
        </div>
        <div class="sheet-body" id="settings-body"></div>
        <div class="sheet-foot"><span>设置存在本机浏览器，与存档互不影响</span></div>
      </div>
    </div>

    <div id="toast"></div>
    <div id="dev"></div>

    <div id="title">
      <div class="kicker">剧本试玩版 · PREVIEW</div>
      <h1>时光之痕</h1>
      <div class="hr"><i></i></div>
      <p class="sub">一部关于失眠、时间，与被借走的记忆的视觉小说</p>
      <div class="title-stats" id="title-stats"></div>
      <p id="title-meta"></p>
      <div class="btns">
        <button class="btn primary" id="btn-new" type="button">开始新游戏</button>
        <button class="btn" id="btn-continue" type="button">继续上次</button>
      </div>
      <p class="foot">
        <kbd>单击</kbd><kbd>V</kbd> 下一句　<kbd>长按</kbd><kbd>Z</kbd> 快进　<kbd>1</kbd>–<kbd>4</kbd> 选择
        <kbd>H</kbd> 回想　<kbd>S</kbd> 存档　<kbd>L</kbd> 读档　<kbd>P</kbd> 设置　<kbd>F</kbd> 全屏
        <kbd>Esc</kbd> 关闭面板　<kbd>F1</kbd> 调试面板<br>
        网页版立绘/背景为程序生成的占位图，补齐 Assets/Resources/Art 后重新打包即可替换
      </p>
      <p id="title-build" class="kicker" style="color:var(--faint)"></p>
    </div>

    <div id="ending">
      <div class="card">
        <div class="kicker">结局</div>
        <h2 id="ending-title"></h2>
        <div class="hr"><i></i></div>
        <div class="body" id="ending-body"></div>
        <div id="ending-meta"></div>
        <button class="btn" id="btn-again" type="button">回到标题</button>
      </div>
    </div>
  </div></div>
</div>
<script>
const DATA = {"scenes":{"1-1":{"sceneId":"1-1","chapter":"第一幕·异变初现","title":"历史图书馆","background":"bg_library_night","bgm":"bgm_ambient","dense":true,"next":"1-2","lines":[{"type":"narration","text":"雨点砸在图书馆的穹顶上，像有人在很远的地方敲一面鼓。声音顺着六层楼高的书架落下来，落在我的后颈上。"},{"type":"narration","text":"二一五〇年三月十二日，晚上九点四十七分。闭馆前十三分钟。我还差最后两排书架没有上完。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"小林，今天早点走。这种天气，书架会自己挪位置。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"周叔，您上次也是这么说的。上次是上周四。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"上周四有人没听。"},{"type":"narration","text":"他把钥匙串塞进工装裤的口袋，转身往楼梯口走。走了两步又停下来，没有回头。"},{"type":"choice","text":"","prompt":"他走进楼梯间的背影还没消失。那句话是真话吗？","options":[{"text":"追上去问清楚第三层到底有什么","affectionWho":"老周","affection":4,"insomnia":0,"flag":"asked_zhou_about_floor3","next":"#l01"},{"text":"不追。他的话我从来不追问","affectionWho":"老周","affection":-2,"insomnia":2,"flag":"let_zhou_walk_away","next":""}]},{"type":"narration","text":"我还是追了上去。楼梯间的灯坏了一盏，只亮最上面那一盏，把老周的肩膀压成一个斜的方块。","label":"l01"},{"type":"narration","text":"他停在第一级台阶上，手一直插在口袋里，像那串钥匙是他唯一愿意拿出来的东西。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"不该往上放的东西，放上去就多一本。多出来的那本，写的不是同一个人。"},{"type":"narration","text":"我问是谁写的。他没答，只把口袋里的手按紧了一点，走下台阶，出楼。"},{"type":"narration","text":"第三层别往上放。放上去的书，第二天会变成两本一模一样的。"},{"type":"choice","text":"","prompt":"楼梯间的门合上了。你要不要先给自己找个说法？","options":[{"text":"承认：我上次真正睡着是四天前","affectionWho":"","affection":0,"insomnia":-3,"flag":"counted_the_sleepless_nights","next":""},{"text":"打住。想这些只会更清醒","affectionWho":"","affection":0,"insomnia":3,"flag":"refused_to_count_nights","next":""}]},{"type":"narration","text":"我笑了一下，把推车推到最后一排。老周今年六十一岁，在这栋楼里待了四十年，说话向来只说一半。剩下的那一半，你得自己去书架上找。"},{"type":"choice","text":"","prompt":"那串钥匙的口袋声还在楼梯间里。你想不想跟下去？","options":[{"text":"跟下去，听他把话说完","affectionWho":"老周","affection":3,"insomnia":0,"flag":"followed_zhou_downstairs","next":""},{"text":"不跟。今晚还有两排书要上","affectionWho":"老周","affection":-1,"insomnia":1,"flag":"stayed_with_the_cart","next":""}]},{"type":"narration","text":"图书馆的夜班是我自己申请来的。安静、有暖气、没人问我为什么三十个小时没合眼。"},{"type":"choice","text":"","prompt":"三十个小时没合眼这件事，要不要说出口？","options":[{"text":"在心里说给自己听：我确实没睡","affectionWho":"","affection":0,"insomnia":-2,"flag":"admitted_the_sleepless_hours","next":""},{"text":"不说。说出来就像承认自己坏了","affectionWho":"","affection":0,"insomnia":2,"flag":"hid_the_sleepless_hours","next":""}]},{"type":"narration","text":"上个月开始，我睡不着了。不是那种翻来覆去睡不着的睡不着，是闭上眼睛还能听见自己心跳、听见楼道里别人的脚步、听见很久以前有人说过的话——一句一句，清楚得像刚录下来。"},{"type":"choice","text":"","prompt":"那些「刚录下来的声音」又来了。要不要听下去？","options":[{"text":"听。它比药有用","affectionWho":"","affection":0,"insomnia":3,"flag":"listened_to_the_recorded_voices","next":""},{"text":"捂上耳朵。听见就记得，记得就跑不掉","affectionWho":"","affection":0,"insomnia":-3,"flag":"covered_ears_to_the_voices","next":""}]},{"type":"narration","text":"医生说是压力，开了药。药没有用。吃完药以后我更清醒，清醒到能听见自己的血液在耳朵里拐弯。"},{"type":"narration","text":"四个星期里，我丢过三十个小时。不是睡着，是从周三下午直接跳到周四凌晨，中间那段时间没人见过我，包括我自己。"},{"type":"choice","text":"","prompt":"医生说是压力。你信这个诊断吗？","options":[{"text":"不信。压力不会让人丢三十个小时","affectionWho":"","affection":0,"insomnia":3,"flag":"rejected_the_diagnosis","next":""},{"text":"信一半，至少它是个解释","affectionWho":"","affection":0,"insomnia":-1,"flag":"half_believed_the_diagnosis","next":""}]},{"type":"narration","text":"灰尘在应急灯的绿光里浮着，很慢。慢得不正常。"},{"type":"narration","text":"我伸出手，指尖停在一粒灰上。它没有落。"},{"type":"narration","text":"它悬在那儿，像被谁按住了。周围所有的灰都停住了，整排书架的空气像一块正在凝固的玻璃。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"然后所有的声音一起退远了。雨声、暖气管道、我自己的呼吸，全都退到很远的地方，只剩下心跳。"},{"type":"choice","text":"","prompt":"所有的声音都退了。你要不要动一下？","options":[{"text":"不出声，看它会不会自己落下来","affectionWho":"","affection":0,"insomnia":1,"flag":"let_the_dust_hang","next":""},{"text":"呼吸重一点，用力把它震下来","affectionWho":"","affection":0,"insomnia":3,"flag":"breathed_at_the_dust","next":""}]},{"type":"narration","text":"我低头看工作台。借阅登记簿摊开着，最后一行是今天的日期，落款是我自己的笔迹。"},{"type":"narration","text":"上面写着一个人的名字：苏禾。借走的是这本书的编号——而那一栏，本该是空的。"},{"type":"choice","text":"","prompt":"那行字的墨还没干。趁它还在，你要不要留下点什么？","options":[{"text":"拿手机拍下来，留个证据","affectionWho":"","affection":0,"insomnia":2,"flag":"photographed_the_ledger","next":""},{"text":"不拍。拍下来的东西会变","affectionWho":"","affection":0,"insomnia":-2,"flag":"refused_to_photograph_the_ledger","next":""}]},{"type":"narration","text":"我盯着那三个字看了很久。我完全没有写过这一行。可笔尖顿下去的地方，墨还没干。"},{"type":"narration","text":"四楼那口钟也不见了。上个月它还在，铜的，走得比谁都准。今天我问了三个同事，三个人都说这栋楼从来没有过钟。"},{"type":"choice","text":"","prompt":"那口钟到底在不在？你更信自己，还是更信三个人？","options":[{"text":"信自己。我上个月还给它上过发条","affectionWho":"","affection":0,"insomnia":3,"flag":"trusted_own_memory_of_clock","next":"#l02"},{"text":"信他们。也许是我记错了","affectionWho":"","affection":0,"insomnia":-2,"flag":"doubted_own_memory_of_clock","next":""}]},{"type":"narration","text":"我确实给它上过发条。上个月十一号，梯子架在四楼西侧，铜壳是凉的，指针压在我拇指上有点重。","label":"l02"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"三个人都说没有过。三个人不至于一起骗我。"},{"type":"narration","text":"可他们说这话的时候太平了，像在背一段背熟的东西。"},{"type":"narration","text":"被删掉的钟不会喊疼。被删掉的人，大概也不会。"},{"type":"narration","text":"我在心里记了一遍：四楼，西侧，铜的，走得准。记下来至少还在我这里。"},{"type":"narration","text":"第三层，最里面那个位置，摆着一本不属于这里的书。"},{"type":"narration","text":"封面是空的。没有书名，没有编号，没有馆藏标签。可它上面的灰比别的书都薄——有人一直在翻它。"},{"type":"choice","text":"","prompt":"第三层那本书在等。你要不要现在就翻它？","options":[{"text":"现在翻。先看第一页写了什么","affectionWho":"","affection":0,"insomnia":2,"flag":"opened_the_nameless_book_now","next":"#l03"},{"text":"先不翻。记下它的位置，明天再来","affectionWho":"","affection":0,"insomnia":-1,"flag":"pinned_the_book_for_tomorrow","next":""}]},{"type":"narration","text":"我还是把它抽了出来。书很轻，轻得不像纸，像一层被人反复翻软的布。","label":"l03"},{"type":"narration","text":"第一页只有一行字，笔迹是我的。写的是今天的日期，后面的名字空着。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我从来没往书上写过字。"},{"type":"narration","text":"我把书合上，放回原位。灰立刻重新落在封面上，快得像有人催它。"},{"type":"narration","text":"我把手放上去。"},{"type":"cg","background":"cg_first_fragment","text":"指尖一凉。我看见这栋楼白天的时候：有个女孩坐在这排书架下面写东西，写了一会儿抬起头，朝空无一人的走廊说话。"},{"type":"choice","text":"","prompt":"那个女孩在朝空走廊说话。你想先看清她在写什么吗？","options":[{"text":"凑近去看她手里那张纸","affectionWho":"","affection":0,"insomnia":3,"flag":"read_what_she_was_writing","next":""},{"text":"停住。不该靠那么近","affectionWho":"","affection":0,"insomnia":-2,"flag":"kept_distance_from_her_page","next":""}]},{"type":"narration","text":"她说了三个字。我听不见，但我知道她说的是什么——那种知道，不在耳朵里，在骨头里。"},{"type":"narration","text":"画面的边缘裂开一道细缝。缝里漏出来的不是光，是时间本身的颜色——像被水泡久了的旧照片。"},{"type":"narration","text":"缝的另一边有人。很多人。他们排着队往前走，谁也不看谁。队伍最前面那个背影很小，穿校服，袖口有墨点。"},{"type":"narration","text":"我想叫她，喉咙里却像塞了棉花。她回过头。"},{"type":"choice","text":"","prompt":"她的脸就要转过来了。你想记住什么？","options":[{"text":"死死记住那张脸，哪怕记不住","affectionWho":"","affection":0,"insomnia":4,"flag":"tried_to_remember_her_face","next":""},{"text":"看她的袖口。墨点比脸更可靠","affectionWho":"","affection":0,"insomnia":1,"flag":"fixed_on_the_ink_marks","next":""},{"text":"闭上眼睛。不该看的东西看多了会出事","affectionWho":"","affection":0,"insomnia":-3,"flag":"shut_eyes_on_the_vision","next":""}]},{"type":"narration","text":"她的脸是空的。五官都在，可凑不成一张能被记住的脸。"},{"type":"fx","fx":"flash","text":""},{"type":"choice","text":"","prompt":"画面碎在黑里。你要不要叫住她？","options":[{"text":"喊她的名字——随便喊一个","affectionWho":"","affection":0,"insomnia":3,"flag":"called_a_name_into_the_dark","next":""},{"text":"不出声。她回头也认不出我","affectionWho":"","affection":0,"insomnia":1,"flag":"stayed_silent_in_the_dark","next":""}]},{"type":"narration","text":"我的手心里多了一小块东西。透明的，冷的，还在轻轻跳。跳的节奏和我心跳不一样，慢半拍。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……这是什么。"},{"type":"narration","text":"没有人回答。整层楼的灯管一起闪了一下，从远处往近处，像有人在替我数楼层。"},{"type":"choice","text":"","prompt":"手心那块东西在跳，慢半拍。它跳给谁听？","options":[{"text":"把它贴到耳朵上，听清楚它在数什么","affectionWho":"","affection":0,"insomnia":4,"flag":"listened_to_the_fragment","next":""},{"text":"先收起来再说。这种东西不该握在手里","affectionWho":"","affection":0,"insomnia":-2,"flag":"pocketed_the_fragment","next":""}]},{"type":"narration","text":"我数了一下那个节奏：一、二、三。数到第三层就停了。这栋楼如果真有人替我数，那他停的地方和我站的地方是同一层。"},{"type":"narration","text":"手心里那块东西在升温。它跳得更快了，快得像刚跑完一段路。它认得这栋楼，或者认得我刚才看见的那个女孩。"},{"type":"choice","text":"","prompt":"那件东西认得这栋楼，也认得她。你打算拿它怎么办？","options":[{"text":"握紧它，用它换一段更清楚的画面","affectionWho":"","affection":0,"insomnia":5,"flag":"squeezed_the_fragment_for_more","next":""},{"text":"松开手，别再让它牵着我走","affectionWho":"","affection":0,"insomnia":-3,"flag":"loosened_the_grip_on_the_fragment","next":""}]},{"type":"narration","text":"白天的那个女孩又出现了一次。这一次她离我很近，近到我能看清她校服袖口上的墨点。"},{"type":"narration","text":"她抬头看着我，嘴唇动了动。"},{"type":"choice","text":"","prompt":"她又要开口了。这次要不要回答她？","options":[{"text":"回答她：我不想再看见有人从纸上被擦掉","affectionWho":"","affection":0,"insomnia":3,"flag":"promised_not_to_lose_anyone","next":""},{"text":"反问她：苏禾是不是就是你","affectionWho":"","affection":0,"insomnia":1,"flag":"asked_if_she_was_suhe","next":""}]},{"type":"narration","text":"她说：你也是被留下来的人吗。"},{"type":"narration","text":"苏禾。我在心里把这两个字念了一遍，很轻。念出来的时候舌头的动作太熟了，像已经念过一千遍——可我确实不认识任何一个叫这个名字的人。"},{"type":"choice","text":"","prompt":"苏禾。这个名字太熟了。你要不要真的把它写下来？","options":[{"text":"写在手心内侧，写在别人看不见的地方","affectionWho":"","affection":0,"insomnia":1,"flag":"wrote_the_name_on_the_palm","next":""},{"text":"不写。写下来就成了我的责任","affectionWho":"","affection":0,"insomnia":2,"flag":"refused_to_write_the_name","next":""}]},{"type":"narration","text":"登记簿往回翻。三月十一日，空。三月十日，空。三月九日那一行被人用钢笔划掉了，划得很用力，纸都戳破了。"},{"type":"narration","text":"破口底下露出上一层的字：还是苏禾，还是同样的笔迹。同一个人，同一个名字，同一支笔，隔着不知道多久又写了一遍。"},{"type":"narration","text":"我把整本登记簿抱到工作台上。四百多页，绝大多数干净得像新印的。只有三页有字，三页都是苏禾，三页都是我的字。"},{"type":"narration","text":"我的三个月，被人从里面掏走了，还替我在借阅簿上留下了收据。"},{"type":"choice","text":"","prompt":"三页都是你的字。你敢不敢承认这一笔？","options":[{"text":"认。是我写的，只是我不记得","affectionWho":"","affection":0,"insomnia":2,"flag":"claimed_the_handwriting","next":""},{"text":"不认。有人借了我的手","affectionWho":"","affection":0,"insomnia":3,"flag":"blamed_a_borrowed_hand","next":""}]},{"type":"narration","text":"楼上有脚步声。很轻，一步一顿，从四楼顺着楼梯往下走，不慌不忙。"},{"type":"narration","text":"它停下的位置正好是那口钟原来挂着的地方。我抬头看天花板，什么也没有，脚步声却在那个点上站住了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"周叔？"},{"type":"narration","text":"没有人应。脚步声彻底停了。整栋楼安静得像被谁捂住了嘴，连雨都听不见了，只剩下手心里那块东西在跳。"},{"type":"choice","text":"","prompt":"脚步声停了。它到底停在几楼？要不要数清楚？","options":[{"text":"走到楼梯口，一级一级数上去","affectionWho":"","affection":0,"insomnia":2,"flag":"counted_the_footsteps_on_the_stairs","next":""},{"text":"不数。它停的地方我大概知道","affectionWho":"","affection":0,"insomnia":-1,"flag":"guessed_the_floor_and_stayed","next":""}]},{"type":"narration","text":"楼梯扶手上有一串湿脚印。鞋底很宽，是老周那双胶鞋。可脚印是往上的，而老周明明是往下走的。"},{"type":"narration","text":"我低头看自己的手。指甲缝里有一点干掉的墨，黑色的，很旧。"},{"type":"choice","text":"","prompt":"那点旧墨到底是什么时候沾上的？你会怎么处理它？","options":[{"text":"留着。也许明天它就不见了","affectionWho":"","affection":0,"insomnia":2,"flag":"kept_the_old_ink_under_the_nail","next":""},{"text":"去洗手间，把它洗掉","affectionWho":"","affection":0,"insomnia":-2,"flag":"washed_the_old_ink_away","next":""}]},{"type":"narration","text":"我不记得自己什么时候碰过墨。登记簿上那行字被戳破的地方也是这样的墨点。也许是我写的，也许不是。区别很大——如果是我写的，那我丢掉的东西就不只是三十个小时。"},{"type":"narration","text":"我丢掉的是一个活人。她在这栋楼里借过书，写过字，喊过我的名字——然后有人把她从纸面上擦掉了，只剩一个还没干透的落款。"},{"type":"fx","fx":"insomnia","text":""},{"type":"choice","text":"","prompt":"世界开始串味，蝉在三月里叫。你要不要信这声音？","options":[{"text":"信。三月没有蝉，可它就在窗外","affectionWho":"","affection":0,"insomnia":4,"flag":"believed_the_out_of_season_cicadas","next":""},{"text":"不信。这就是缺觉的幻觉","affectionWho":"","affection":0,"insomnia":-2,"flag":"dismissed_the_cicadas_as_symptoms","next":""}]},{"type":"narration","text":"世界开始串味。窗外的雨声里混进了夏天的蝉，而今天是三月。天花板的灯在往下沉，书架的影子朝四个方向散开。我知道这是我三天没睡的症状，可我第一次觉得，症状也许不是病。"},{"type":"narration","text":"光散掉的时候，走廊里只剩我一个人，还有手心里那块还在跳的东西。"},{"type":"choice","text":"","prompt":"老周的钥匙留在了前台。它算是他给你的，还是你拿的？","options":[{"text":"放回原处，等他回来自己拿","affectionWho":"老周","affection":5,"insomnia":-2,"flag":"left_the_keys_on_the_desk","next":"#l04"},{"text":"收进兜里。今晚说不定要用","affectionWho":"老周","affection":0,"insomnia":3,"flag":"took_the_keys_tonight","next":""}]},{"type":"narration","text":"我把钥匙串放回登记簿的旁边，摆正，让铜的齿朝外，像他随时会回来取。","label":"l04"},{"type":"narration","text":"后来我才知道，这一晚他把钥匙留下，本来就是要给我用的。"},{"type":"narration","text":"我替一个已经出了楼的人守着钥匙，守到天亮。"},{"type":"narration","text":"老周的钥匙串放在前台桌上。他没有走。或者——他把钥匙留下了，而我不记得他是什么时候留下的。"},{"type":"narration","text":"楼下的门被风推了一下。整栋图书馆里只剩下我，和一个刚刚才被我想起来的名字：苏禾。"},{"type":"narration","text":"我把登记簿翻回上一页，又一页。写了苏禾的地方，纸面陷下去一点点，像是被反复写过很多次，又被人用橡皮擦掉过很多次。"},{"type":"choice","text":"","prompt":"写了苏禾的地方，纸面都陷下去一点。你想先看哪一处？","options":[{"text":"先看被戳破的那一处，从破口读起","affectionWho":"","affection":0,"insomnia":2,"flag":"read_from_the_torn_spot","next":"#l05"},{"text":"先看位置最正的那一处","affectionWho":"","affection":0,"insomnia":0,"flag":"read_from_the_centered_spot","next":""}]},{"type":"narration","text":"破口边缘是毛的。我用指甲压了压，纸背是亮的，亮痕从破口的正下方穿过去，一直伸到装订线上。","label":"l05"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"这不是划掉。这是有人在同一个地方写了很多遍。"},{"type":"narration","text":"写了很多遍，又擦掉很多遍。擦的人不肯让它留下，写的人不肯让它消失。"},{"type":"narration","text":"我把这一页折了个角，很小，藏在书脊那一侧。至少今晚它还在这儿。"},{"type":"narration","text":"擦不干净的那种痕迹，在纸上是亮的。我站在应急灯下把它举起来，隔着光看——三页纸，三个亮痕，位置一模一样。"},{"type":"choice","text":"","prompt":"三页纸，三个亮痕。你要不要折个角，记住这一页？","options":[{"text":"折角，藏在书脊那一侧，记下位置","affectionWho":"","affection":0,"insomnia":1,"flag":"kept_the_torn_page_by_folding_it","next":"#l06"},{"text":"把折角按平。书里不该留折角","affectionWho":"","affection":0,"insomnia":-1,"flag":"flattened_the_folded_corner","next":""}]},{"type":"narration","text":"我隔着光又看了一遍，然后把这一页折了个很小的角，位置正好在亮痕的下方。","label":"l06"},{"type":"narration","text":"折角这事不合规矩，可我今晚已经不太在乎规矩了。"},{"type":"narration","text":"以后翻到这一页，我会先看见那个角。它会替我想起今晚。"},{"type":"narration","text":"楼下传来开门的声音，很重，像是有人故意让我听见，又不想让我听得太清楚。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"小林——第三层，别回头。"},{"type":"narration","text":"声音是从门厅传来的。可他的钥匙明明留在前台桌上，胶鞋的湿脚印明明在往楼上走。"},{"type":"choice","text":"","prompt":"门厅那个声音不让他回头。你听不听他的？","options":[{"text":"听。不回头，哪怕背后在发生什么","affectionWho":"老周","affection":4,"insomnia":-3,"flag":"obeyed_zhou_and_did_not_turn","next":""},{"text":"回头。他今晚的每句话都只说了一半","affectionWho":"老周","affection":-3,"insomnia":4,"flag":"looked_back_anyway","next":""}]},{"type":"narration","text":"我没有回头。于是我看不见背后发生了什么，只听见那排书架的灰重新开始往下落，很轻，像谁终于松开了手。"},{"type":"narration","text":"时间恢复了。雨声回到穹顶上，暖气回到管道里，心跳回到我自己的胸腔里。"},{"type":"choice","text":"","prompt":"那排书架的灰重新落下来了。你要不要打断这个节奏？","options":[{"text":"出声问一句：刚才说话的是您吗","affectionWho":"老周","affection":2,"insomnia":1,"flag":"asked_if_zhou_had_spoken","next":""},{"text":"不出声。让它落完","affectionWho":"","affection":0,"insomnia":-2,"flag":"let_the_dust_finish_falling","next":""}]},{"type":"narration","text":"但松手的那个人还在楼里。我能感觉到他，就像感觉到自己少掉的那三十个小时——不在眼前，可一直在。"},{"type":"narration","text":"我该做点什么。"},{"type":"narration","text":"我先摸口袋。手机不在，它留在充电台上，屏幕亮着，有两条未读消息。"},{"type":"choice","text":"","prompt":"两条未读消息还在屏幕上。你先看哪一条？","options":[{"text":"先看早的那条：四楼的钟在不在","affectionWho":"","affection":0,"insomnia":1,"flag":"checked_the_early_message_first","next":""},{"text":"先看晚的那条：他说根本没有钟","affectionWho":"","affection":0,"insomnia":2,"flag":"checked_the_late_message_first","next":""}]},{"type":"narration","text":"两条都是今晚值班的同事发来的。第一条问我四楼那口钟今天在不在，第二条比它晚两个小时，说我记错了，四楼本来就没有钟。"},{"type":"narration","text":"我给两个人各回了一个字：有。发出去以后那两条对话就没了，像从来没有发过。"},{"type":"choice","text":"","prompt":"两条消息消失了。你还要发第三遍吗？","options":[{"text":"再发一遍，把日期和钟的位置都写清楚","affectionWho":"","affection":0,"insomnia":3,"flag":"insisted_on_the_sent_messages","next":""},{"text":"算了。记不住的东西，发多少遍都一样","affectionWho":"","affection":0,"insomnia":-2,"flag":"gave_up_on_the_messages","next":""}]},{"type":"narration","text":"我把登记簿合上，又打开。合上那两秒里，我担心再翻开时那一页会变样。"},{"type":"narration","text":"它没变。三页纸，三个名字，三处亮痕。这大概是今晚唯一一件诚实的东西。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"周叔，您还在吗。"},{"type":"narration","text":"我的声音在六层高的书架之间转了一圈才回来。回来的那一句比我说出去的更低，像有人替我压低过。"},{"type":"choice","text":"","prompt":"钥匙上多了一把「地下」。你打算怎么处置它？","options":[{"text":"明天闭馆以后，一个人下去试试","affectionWho":"","affection":0,"insomnia":2,"flag":"planned_to_test_the_basement_key","next":""},{"text":"先问清楚再说，不急着试","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_before_using_the_basement_key","next":""}]},{"type":"narration","text":"我拿起前台桌上那串钥匙。钥匙圈上多了一把小的，铜的，齿很新，标签上是老周的字：地下。"},{"type":"narration","text":"我在这里工作了两年，从来不知道这栋楼还有地下。"},{"type":"narration","text":"手心里的碎片跳了一下。它跳的方向是楼梯口——往下。"},{"type":"narration","text":"可那本没有名字的书也在等我。灰重新落在它封面上，落得比别的书慢。"},{"type":"choice","text":"","prompt":"两条路都在等。今晚先走哪一条？","options":[{"text":"先上楼，把那本书再看一眼","affectionWho":"","affection":0,"insomnia":1,"flag":"looked_at_the_book_once_more","next":""},{"text":"先下楼，去门厅看看那扇门","affectionWho":"","affection":0,"insomnia":2,"flag":"checked_the_front_door_first","next":""}]},{"type":"narration","text":"我站在楼梯口。两条路都在那儿，钥匙在我手上，书在三层。今晚得由我自己选一条。"},{"type":"choice","text":"","prompt":"手里的东西还在跳，登记簿上的墨还没干。你怎么做？","options":[{"text":"下楼去找老周，把看到的一切都告诉他","affectionWho":"老周","affection":6,"insomnia":-2,"flag":"told_zhou_truth","next":"1-1a"},{"text":"留在原地，翻那本没有名字的书","affectionWho":"","affection":0,"insomnia":4,"flag":"opened_nameless_book","next":"1-1b"}]}]},"1-1a":{"sceneId":"1-1a","chapter":"第一幕·异变初现","title":"闭馆之后","background":"bg_library_night","bgm":"bgm_ambient","dense":true,"next":"1-2","lines":[{"type":"narration","text":"我没回头。脚步声在我背后停了一会儿，然后转身往楼下走，一级一级，踩得很满，像是故意给我数着筋。"},{"type":"narration","text":"门厅的灯只开了一半。老周站在伞架旁边，肩膀湿了一大片，手里拎着一把铜钥匙——不是我放在前台桌上的那一串。"},{"type":"choice","text":"","prompt":"他手里那把铜钥匙不是我的。问还是不问？","options":[{"text":"直接问他：刚才上楼的是谁","affectionWho":"","affection":0,"insomnia":2,"flag":"asked_zhou_who_went_upstairs","next":""},{"text":"不问。他从来只说一半","affectionWho":"老周","affection":0,"insomnia":-2,"flag":"held_back_the_question","next":"#l01"}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"钥匙有两把。一把挂在前台，一把在我兜里揣了四十年。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"那刚才上楼的那个……"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"那是另一件事。别问，问了我也不会答。"},{"type":"narration","label":"l01","text":"不管问没问出口，他把钥匙换了只手，铜的齿朝外，像怕我伸手。"},{"type":"narration","text":"钥匙串在他手里响了一声。他说过有两把，另一把一直没给我看。"},{"type":"narration","text":"他把伞靠在墙上，从裤兜里摸出老花镜戴上，先看我的手，再看我的脸。看了大概有七八秒，然后说了一句我完全没准备的话。"},{"type":"choice","text":"","prompt":"他架着老花镜看了我七八秒。要不要先开口？","options":[{"text":"先开口：我在三楼摸到过一块会跳的东西","affectionWho":"","affection":0,"insomnia":3,"flag":"spoke_first_about_the_shard","next":""},{"text":"不说，等他把话说完","affectionWho":"老周","affection":2,"insomnia":-1,"flag":"waited_for_zhou_to_finish","next":""}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"你摸到它了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"您知道那是什么东西。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"我不给它起名字。起了名字的东西，就不肯再走了。"},{"type":"narration","text":"他转身往员工通道走，走了三步又停下，回头看我。那一眼里没有害怕，只有一种很旧的疲惫，像一件穿了太久的衣服。"},{"type":"choice","text":"","prompt":"他往员工通道走，又回头看我。跟不跟？","options":[{"text":"跟上去。有些话不能在楼上说","affectionWho":"老周","affection":3,"insomnia":0,"flag":"followed_into_the_passage","next":""},{"text":"站着不动，先问他要去哪","affectionWho":"老周","affection":-2,"insomnia":2,"flag":"asked_where_before_following","next":""}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"跟上。有些话不能在楼上说。"},{"type":"narration","text":"员工通道的尽头有一道铁门，上面挂着锁，锁是开的，锁舌被人推进去了一半。门后面是楼梯，往下，一直通到这四年我从没下去过的地方。"},{"type":"narration","text":"空气换了一个味道。楼上是纸和暖气，楼下是铁锈、霉，和很久没有流动过的水。"},{"type":"narration","text":"老周在墙上摸到开关，按了两下，第二下才亮。地下书库的灯管从头顶一路排到看不见的尽头，亮的只有前面三根。"},{"type":"choice","text":"","prompt":"铁门后面是往下走的楼梯。还要继续吗？","options":[{"text":"继续往下。我想知道底在哪","affectionWho":"","affection":0,"insomnia":2,"flag":"went_deeper_into_the_basement","next":""},{"text":"停在门口，把门敞着","affectionWho":"","affection":0,"insomnia":-2,"flag":"kept_the_iron_door_open","next":""}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"这是本馆的废架。系统里只写剔除两个字，东西其实都在这儿。"},{"type":"narration","text":"一排一排的金属架，上面码着牛皮纸包好的旧卷宗，编号和楼上完全不是一套。这里的号不按年份排，按进来的顺序排。"},{"type":"narration","text":"我伸手想碰最近的那一包。老周没有回头，声音却像拍在我手背上。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"别碰。这里的灰落一次，你就得多想一件事。"},{"type":"choice","text":"","prompt":"地下书库的灯只亮前面三根。往里走还是等？","options":[{"text":"往里走，走到灯照不到的地方","affectionWho":"","affection":0,"insomnia":3,"flag":"walked_past_the_third_lamp","next":""},{"text":"站在第三根灯管下等他","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_under_the_third_lamp","next":""}]},{"type":"narration","text":"我把手收回来。手心里那块东西还在跳，比上楼时快了一点，像是闻到了什么味道。"},{"type":"narration","text":"我们走到第七排。老周停下，从架子上抽出一个铁皮盒，盒盖贴着手写标签，只有三个字：内部档。"},{"type":"narration","text":"盒子里是一叠装订好的表格。纸角发黄卷起，最上面那张的抬头写着：在职与在册人员动态核对表。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"我学徒那年就开始填这张表。填了四十年。"},{"type":"choice","text":"","prompt":"表上少了一个人，笔迹却一模一样。先看什么？","options":[{"text":"把两张表并排对着看","affectionWho":"","affection":0,"insomnia":3,"flag":"compared_the_two_ledgers","next":""},{"text":"先问他：不见的是谁","affectionWho":"老周","affection":2,"insomnia":1,"flag":"asked_who_was_missing","next":""}]},{"type":"narration","text":"我翻第一页。二一一〇年，图书馆在职人员，十一个名字。第二页，同一年，同一张表，同样的位置，只剩十个人。"},{"type":"narration","text":"不是有人被划掉。是整张表被重新誊了一遍，字号、行距、笔迹全都一样，只是少了一行，后面所有的行往上顶了一格。"},{"type":"narration","text":"没有涂改，没有空行，什么都没有。就像这张表从落笔那天起，本来就只写过十个人。"},{"type":"choice","text":"","prompt":"那张表干净得像新印的。你信它吗？","options":[{"text":"信。字迹不会骗人","affectionWho":"","affection":0,"insomnia":1,"flag":"trusted_the_ledger_handwriting","next":""},{"text":"不信。太干净就是不对","affectionWho":"","affection":0,"insomnia":3,"flag":"distrusted_the_perfect_ledger","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"不见的是谁？"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"他姓陈。名字两个字，我记得住。可每次我要张嘴，嘴都先说出别的词。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"去年我还记得他抽完烟会把烟盒压扁，塞在书脊后头。上个月我去找，那一排书架里一个压扁的烟盒都没有。"},{"type":"narration","text":"他说这话的时候眼睛没有看我，看的是那个铁皮盒。他的手指在盒沿上敲，敲的节奏比心跳慢。"},{"type":"choice","text":"","prompt":"他姓陈，可每次要说出口都换了别的词。","options":[{"text":"替他把这个姓记住","affectionWho":"","affection":0,"insomnia":3,"flag":"kept_the_surname_chen","next":""},{"text":"不记。记住被删的东西有代价","affectionWho":"","affection":0,"insomnia":-2,"flag":"refused_to_keep_the_surname","next":""}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"他不见的那天，全馆十一个人都记得那排书架本来就少一个位置。没有一个人觉得少了人。"},{"type":"narration","text":"这句话比楼上所有东西加起来都冷。不是有人被删掉了，是删掉以后，所有人的记忆自己动手把窟窿补好了。"},{"type":"choice","text":"","prompt":"所有人的记忆自己把窟窿补好了。这句要放下吗？","options":[{"text":"放不下，追问他那排书架","affectionWho":"老周","affection":3,"insomnia":2,"flag":"pressed_about_the_missing_shelf","next":""},{"text":"先不提，让他自己缓一下","affectionWho":"老周","affection":1,"insomnia":-1,"flag":"let_the_chen_moment_pass","next":""}]},{"type":"narration","text":"手心里那块东西猛地跳了一下。我摊开手掌，透明的小块贴在我的掌纹上发抖，像一只被人拎起来的虫子。"},{"type":"narration","text":"光从它内部透出来，照见的不是我的手，是第七排和第八排之间那条空隙。"},{"type":"narration","text":"空隙里站着一个人。我看不清他，因为那里明明什么都没有。"},{"type":"fx","fx":"shake","text":""},{"type":"choice","text":"","prompt":"空隙里站着一个人。要告诉老周吗？","options":[{"text":"告诉他：空隙里有个人","affectionWho":"老周","affection":4,"insomnia":4,"flag":"told_zhou_about_the_gap","next":"#l02"},{"text":"不说。先把手合上","affectionWho":"","affection":0,"insomnia":-2,"flag":"closed_the_hand_silently","next":""}]},{"type":"narration","text":"老周的手按在我肩膀上，很重。他的手在抖，抖得比我的手还明显。"},{"type":"narration","label":"l02","text":"手心里的光收回去，那条空隙还在。第七排和第八排之间什么都没有，可我知道它在那儿。"},{"type":"narration","text":"老周的手还压在我肩上，压了两秒才松开。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"收起来。这里的东西会顺着光往上看。"},{"type":"narration","text":"我把手合上。灯管又闪了一下，这一次是从近处往远处闪，一、二、三，和三楼那一次是同一个节奏。"},{"type":"choice","text":"","prompt":"灯管闪着同样的节奏。要不要数下去？","options":[{"text":"数下去，把这个节奏记牢","affectionWho":"","affection":0,"insomnia":2,"flag":"counted_the_lamp_rhythm","next":""},{"text":"不数。这个节奏我在三楼听过","affectionWho":"","affection":0,"insomnia":3,"flag":"recognized_the_third_floor_rhythm","next":""}]},{"type":"narration","text":"老周从铁皮盒最底下抽出一张纸。那不是核对表，是一份复印件，抬头印着一个我见过的徽记：三角形里套着一道裂缝。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"时空异常研究所。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"每次有人少掉，他们都会来一趟。来的人不查人，只查时间。"},{"type":"narration","text":"复印件上是一张事故登记表。日期那一栏被人用黑笔涂掉了，只剩下编号还看得清：A-三一七。底下盖着收讫章，章的日期是去年冬至。"},{"type":"choice","text":"","prompt":"日期被涂掉了，只剩一串编号。抄不抄？","options":[{"text":"把编号抄在便条背面","affectionWho":"","affection":0,"insomnia":2,"flag":"copied_the_case_number","next":""},{"text":"不抄。记在脑子里更安全","affectionWho":"","affection":0,"insomnia":1,"flag":"memorized_the_case_number","next":""}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"这是第一条。你要查，就从这串编号查起。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"您四十年都没查，为什么让我查？"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"因为我四十年没摸到过那种东西。你今天摸到了。"},{"type":"narration","text":"他把铁盒推回架上，推得很深。盒盖和金属碰了一声，很闷，闷得像是从这个地下书库里发出来的最后一声回音。"},{"type":"choice","text":"","prompt":"他把铁盒推得很深。为什么是我来查？","options":[{"text":"承认：因为我摸到过那种东西","affectionWho":"","affection":0,"insomnia":3,"flag":"accepted_being_the_one","next":""},{"text":"反问：四十年了，为什么是今天","affectionWho":"老周","affection":3,"insomnia":0,"flag":"asked_why_only_today","next":"#l03"}]},{"type":"narration","text":"我问他，楼上那本没有名字的书是什么。他沉默了很久，久到我以为他不会答了。"},{"type":"narration","label":"l03","text":"他没有立刻答。灯管在他头顶响了一声，像替他数着这次停顿。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"那是留给下一个人用的。谁的名字被写进去，谁就开始被擦。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"那书上现在写的是谁？"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"你比我清楚。"},{"type":"choice","text":"","prompt":"「你比我清楚」。这个名字念出来太熟了。","options":[{"text":"承认：我念过很多遍","affectionWho":"","affection":0,"insomnia":3,"flag":"admitted_the_name_is_familiar","next":""},{"text":"不承认。我不认识叫苏禾的人","affectionWho":"","affection":0,"insomnia":1,"flag":"denied_knowing_suhe","next":""}]},{"type":"narration","text":"苏禾。我在心里把这两个字念了一遍。念的时候舌尖自己找到了位置，太熟，熟到让我有点恶心。"},{"type":"narration","text":"老周走到第七排尽头，从一个废架底下拖出纸箱。箱子里是读者卡，塑封的，颜色全退成了灰绿，一摞压着一摞。"},{"type":"choice","text":"","prompt":"箱子里全是退成灰绿的读者卡。先翻哪一摞？","options":[{"text":"翻最底下那一摞","affectionWho":"","affection":0,"insomnia":2,"flag":"checked_the_bottom_stack","next":""},{"text":"翻最上面那一摞","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_top_stack","next":""}]},{"type":"narration","text":"他翻得很久，最后抽出一张递给我。照片上是个穿校服的女孩，眉骨高，嘴角往下压着，像是不太爱笑。"},{"type":"narration","text":"姓名栏被人用剪刀剪掉了，剪得方方正正。可剪之前有人在塑封上描过一遍铅笔，现在还能看见压痕：苏禾。"},{"type":"choice","text":"","prompt":"姓名栏被剪掉了，压痕还留着那两个字。","options":[{"text":"用指腹按一按压痕","affectionWho":"","affection":0,"insomnia":3,"flag":"traced_the_pencil_marks","next":""},{"text":"不碰。她已经被剪过一次了","affectionWho":"","affection":0,"insomnia":-1,"flag":"did_not_touch_the_cut_card","next":""}]},{"type":"narration","text":"卡片背面只有一条借阅记录：二一一〇年十一月三日，借出《新东京地下管网图》，未还。"},{"type":"narration","text":"二一一〇年。和老周说的那一年，是同一年。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"苏禾是二一一〇年的人。可她那件校服，是现在的款式。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"校服每十年换一次样子。她那张照片上的领子，是十年前的。"},{"type":"choice","text":"","prompt":"照片上的领子是十年前的。这条线索可信吗？","options":[{"text":"信。校服比照片更不会说谎","affectionWho":"","affection":0,"insomnia":2,"flag":"trusted_the_uniform_collar","next":""},{"text":"不信。先把卡翻过来看背面","affectionWho":"","affection":0,"insomnia":1,"flag":"flipped_the_card_first","next":"#l04"}]},{"type":"narration","text":"我把卡片翻过来又翻过去。塑封边缘有一道很细的裂纹，裂纹里的光不像是反光，倒像是从卡片内部漏出来的。"},{"type":"narration","label":"l04","text":"背面那条借阅记录我早看过一遍，一模一样的日期，没有多一个字。"},{"type":"narration","text":"我把它举到眼睛前面。裂纹里有东西在动，很慢，很轻，像水底下的草。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"一张不会动的卡，里面已经有东西住进去了。"},{"type":"choice","text":"","prompt":"老周伸手要把卡拿回去。你给不给？","options":[{"text":"让给他。这本来是馆里的东西","affectionWho":"老周","affection":4,"insomnia":-1,"flag":"gave_the_card_back","next":""},{"text":"不给。我得自己拿着它","affectionWho":"老周","affection":-3,"insomnia":3,"flag":"kept_the_reader_card","next":""}]},{"type":"narration","text":"他伸手要把卡拿回去。我往后退了半步。那一瞬间我听见自己的心跳快了一下——不是害怕，是不想给。"},{"type":"narration","text":"老周看着我的手，没有生气。他把手放下来，放得很慢，像是给一个不肯吃药的小孩让步。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你自己拿着也行。但记住两件事。"},{"type":"choice","text":"","prompt":"他给了两条规矩。先记哪一条？","options":[{"text":"先记第一件：别在人多的地方摊开手","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_first_rule","next":""},{"text":"先记第二件：别在睡不着的时候看它","affectionWho":"","affection":0,"insomnia":2,"flag":"kept_the_second_rule","next":""}]},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"第一，别在人多的地方摊开手。第二，别在睡不着的时候看它。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"为什么是第二件？"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"因为醒着太久的人，会分不清哪一段记忆是自己的。"},{"type":"narration","text":"他说完就往上走。上楼比下楼慢得多，每一级台阶他都踩得很满，像是怕踩空，又像是怕踩到什么不干净的东西。"},{"type":"choice","text":"","prompt":"他上楼了，脚步踩得很满。你要再留一会儿吗？","options":[{"text":"再站一会儿，把灯管的嗡嗡声听完","affectionWho":"","affection":0,"insomnia":-1,"flag":"stayed_under_the_humming_lamps","next":""},{"text":"马上跟上去，不在下面多留","affectionWho":"","affection":0,"insomnia":2,"flag":"followed_up_immediately","next":""}]},{"type":"narration","text":"我在地下书库又站了一会儿。灯管在头顶嗡嗡响，那声音和我的心跳叠在一起，过了半晌才慢慢分了家。"},{"type":"narration","text":"我把读者卡放进口袋，和那块碎片隔着一层布。两样东西都在跳，节奏不一样，一前一后，像两个人并排走路却不肯对齐步子。"},{"type":"choice","text":"","prompt":"两张东西都在跳，节奏对不齐。分不分开？","options":[{"text":"把卡片换到另一只口袋","affectionWho":"","affection":0,"insomnia":0,"flag":"separated_card_from_shard","next":""},{"text":"不分开。让它们互相看着","affectionWho":"","affection":0,"insomnia":2,"flag":"kept_card_and_shard_together","next":""}]},{"type":"narration","text":"铁门在我身后合上的时候，我在最后一秒回头看了一眼第七排。"},{"type":"narration","text":"那条空隙里确实什么都没有。可我清楚地感觉到，有一个位置因为我看了它一眼，往旁边挪了半寸。"},{"type":"narration","text":"回到一楼，前台的钥匙串还挂在钩子上。钩子下面压着一张便条，是老周的字：明天别来上班，你会有别的客人。"},{"type":"choice","text":"","prompt":"钩子下面压着老周的便条。信不信他？","options":[{"text":"信。明天按他说的不来上班","affectionWho":"老周","affection":2,"insomnia":-1,"flag":"obeyed_zhou_note","next":""},{"text":"不信。明天照常来上班","affectionWho":"老周","affection":-2,"insomnia":2,"flag":"ignored_zhou_note","next":""}]},{"type":"narration","text":"便条下面还有一行，字更小，像是后来才补上去的：他们来的时候，别撒谎，也别全说。"},{"type":"fx","fx":"wait","text":""},{"type":"narration","text":"我把便条折起来塞进兜里。走出图书馆的时候雨已经小了，街对面停着一辆没有标志的车，车里坐着人，看不清脸。"},{"type":"narration","text":"我撑开伞往前走。走出十几步，那辆车发动了，却没有跟上来，只是掉了个头，往另一个方向开走。"},{"type":"choice","text":"","prompt":"那辆车掉头开走了。你追不追？","options":[{"text":"追出去，看清它的牌照","affectionWho":"","affection":0,"insomnia":3,"flag":"chased_the_unmarked_car","next":""},{"text":"不追。站在原地看它走远","affectionWho":"","affection":0,"insomnia":1,"flag":"watched_the_car_leave","next":""}]},{"type":"narration","text":"等我反应过来已经太晚了。它开走的方向，是研究所。"},{"type":"narration","text":"口袋里那张卡片贴着我的腿，随着走路的节奏一下一下拍着我，像是有人在后面轻轻推我。"},{"type":"narration","text":"走回宿舍的路上我一直在数路灯，数到第七盏，口袋里的卡片又跳了一下。"},{"type":"choice","text":"","prompt":"老周给了两条规矩，可兜里的东西一直在跳。今晚怎么过？","options":[{"text":"把读者卡掏出来，在路灯下看清那个女孩的脸","affectionWho":"","affection":0,"insomnia":4,"flag":"shard_reader_card","next":""},{"text":"按老周说的做，什么都不看，直接回宿舍","affectionWho":"老周","affection":3,"insomnia":-2,"flag":"obeyed_zhou_warning","next":""}]},{"type":"narration","text":"那天晚上我选了其中一条。回到宿舍之后我才发现，两条路其实通向同一个地方——我躺下的时候，天花板上的裂纹和卡片上的裂纹，走向一模一样。"},{"type":"narration","text":"凌晨三点，我把手机翻过来。屏幕上有一条未读短信，号码没有归属地，只有一行字：登记编号 A-三一七，明日九时到所说明情况。"}]},"1-1b":{"sceneId":"1-1b","chapter":"第一幕·异变初现","title":"一个人的第三层","background":"bg_library_night","bgm":"bgm_mystery","dense":true,"next":"1-2","lines":[{"type":"narration","text":"我没有回头。我做了相反的事：我往前走了两步，站到那排书架最里面。"},{"type":"narration","text":"楼下的门响了一声，很重，像是有人故意让我听见，又不想让我听清楚。然后整栋楼就安静了。"},{"type":"narration","text":"这一次的安静和刚才不一样。刚才是有东西在动，声音退远了；现在是连退远的声音都没有了，像有人把整栋楼的声音装进一个盒子盖上了盖。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"小林——别回头，继续往里走。"},{"type":"choice","text":"","prompt":"楼下喊话的人叫我不回头，脚印却朝上。","options":[{"text":"回头看一眼门厅的方向","affectionWho":"","affection":0,"insomnia":2,"flag":"looked_back_toward_the_hall","next":""},{"text":"不回头，把手往书上伸","affectionWho":"老周","affection":1,"insomnia":-2,"flag":"kept_hand_on_the_book","next":""}]},{"type":"narration","text":"不管回不回头，那声音落下去以后，楼里的人声就彻底停了。"},{"type":"narration","text":"他的声音是从门厅传来的。可我刚才看见他的胶鞋印在往楼上走。两件事都成立，那就说明我正在听的，不是现在。"},{"type":"narration","text":"我把手伸向那本书。封面是空的，摸上去却不是纸的质感，比纸冷，比布硬，像有人把一层皮钉在硬壳上。"},{"type":"narration","text":"我翻开第一页。空白。第二页，空白。第三页开始有字了——只有日期，一年一年往下排，每年一行。"},{"type":"choice","text":"","prompt":"书到第三页才开始有字，一年只有一行。","options":[{"text":"一页一页翻到二一一〇年","affectionWho":"","affection":0,"insomnia":2,"flag":"paged_to_year_2110","next":""},{"text":"先摸封面，再决定翻不翻","affectionWho":"","affection":0,"insomnia":-2,"flag":"felt_the_cover_first","next":""}]},{"type":"narration","text":"手指停在页边上，纸很凉，凉得像刚从外面拿进来。"},{"type":"narration","text":"二一一〇年那一行被反复描过，纸都被描薄了。旁边没有任何内容，就一个年份，自己站在那儿。"},{"type":"narration","text":"我把手指按在那行字上。手心里那块东西跳得几乎要烫起来，跳的节奏和纸下面某个东西的节奏对上了。"},{"type":"narration","text":"灰重新开始往下落。落得很慢，慢到我能看清每一粒在空中转了几个圈才肯落到书页上。"},{"type":"choice","text":"","prompt":"碎片已经在指尖上，纸就在下面。按还是收？","options":[{"text":"把碎片按在二一一〇年那一行","affectionWho":"","affection":0,"insomnia":3,"flag":"pressed_shard_on_the_year","next":""},{"text":"先把手收回来，看清楚再动","affectionWho":"","affection":0,"insomnia":-2,"flag":"withdrew_the_shard_first","next":"#l01"}]},{"type":"narration","label":"l01","text":"收手也一样。光已经顺着指缝爬上来，白得发细。"},{"type":"narration","text":"我把碎片从手心挪到指尖，轻轻碰上纸面。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"光散掉的时候，图书馆不见了。不是变暗，是被抽掉了一层。地板还在脚下，可地板下面的东西露出来了。"},{"type":"narration","text":"不是地下室，不是管道。是线。"},{"type":"fx","fx":"timeline","text":""},{"type":"narration","text":"每一样东西下面都牵着一条线，桌子、书架、灯管、我的鞋尖，全都牵着。线很细，颜色不一样，粗细也不一样。"},{"type":"choice","text":"","prompt":"每样东西下面都牵着线。先看哪一条？","options":[{"text":"看自己鞋尖底下那一条","affectionWho":"","affection":0,"insomnia":2,"flag":"checked_the_line_under_his_shoe","next":""},{"text":"看灯管和书架上面那几条","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_lines_above","next":""}]},{"type":"narration","text":"线都在动，可我盯住哪一条，哪一条就慢一点，像知道有人在看。"},{"type":"narration","text":"线往同一个方向流。我顺着它看过去，看见了很远的地方有一条更粗的线，横着铺开，一眼望不到头。"},{"type":"narration","text":"那不是河。河会分岔，它不会。它只是往前，很稳，很整齐，像有人已经替它排好了位置。"},{"type":"narration","text":"线上站满了人。密密麻麻的，肩挨着肩，谁也不说话，谁也没回头。"},{"type":"narration","text":"他们不是在走，是被推着走。每往前一格，脚底下那条线就往前挪一格，人就跟着挪一格，姿势完全不变。"},{"type":"choice","text":"","prompt":"队伍里没有人回头。要不要跟着挪一格？","options":[{"text":"跟着往前挪一格试试","affectionWho":"","affection":0,"insomnia":3,"flag":"stepped_one_square_with_the_queue","next":""},{"text":"站在原地，先看这队排到哪","affectionWho":"","affection":0,"insomnia":-1,"flag":"stayed_out_of_the_queue","next":""}]},{"type":"narration","text":"我没动。队伍从我身边挪过去，肩膀擦着肩膀，一点声音都没有。"},{"type":"narration","text":"我在队伍里找。找穿校服的，找眉骨高的，找嘴角往下压着的。找了很久，找到了一个背影。"},{"type":"narration","text":"她站在队伍靠后的位置，袖口有墨点。她身上的线是断的——从胸口往下，线断成两截，中间那一截悬着，没能接上。"},{"type":"narration","text":"我想叫她。喉咙里像塞了棉花，一个字都挤不出来。我只能看着，看着她的线在风里一样的东西里摆动。"},{"type":"narration","text":"然后我低头找我自己。"},{"type":"choice","text":"","prompt":"所有人都在线上，只有我站在外面。先找谁？","options":[{"text":"先找那个穿校服的背影","affectionWho":"","affection":0,"insomnia":2,"flag":"looked_for_the_school_uniform","next":""},{"text":"先摸清自己身上那条线","affectionWho":"","affection":0,"insomnia":3,"flag":"checked_his_own_line_first","next":""}]},{"type":"narration","text":"低头的时候我看见自己的鞋尖悬着，踩不到底下那条线。"},{"type":"narration","text":"我在队伍外面。所有人都站成一条线，只有我站在旁边，脚底下是空的，什么也没牵。"},{"type":"narration","text":"我抬脚踩了踩。空的，踩不实。好像我不属于这条线，也不属于这条线以外的地方。"},{"type":"narration","text":"我伸手摸自己的胸口。那一段线还在，从头往下，只有中间有一小截颜色不对，比别处浅，接了两次，接口不齐。"},{"type":"narration","text":"三十个小时。接口的宽度，正好是我丢掉的那三十个小时的宽度。"},{"type":"choice","text":"","prompt":"接口的宽度刚好是三十个小时。要不要说出来？","options":[{"text":"把那句话说出来：有人剪过我的线","affectionWho":"","affection":0,"insomnia":4,"flag":"said_the_line_was_cut","next":""},{"text":"不说，先把这个宽度记住","affectionWho":"","affection":0,"insomnia":2,"flag":"memorized_the_thirty_hours","next":""}]},{"type":"narration","text":"那句话在喉咙里转了一圈，最后又掉回肚子里。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……有人剪过我的线。"},{"type":"narration","text":"没有人回答。队伍继续往前挪，一格，又一格，脚步声整齐得不像人走出来的。"},{"type":"narration","text":"我沿着那条线往尽头看。尽头有一个口子，队伍到那里就少一个人，后面的自动补上前一格，队形一点都不会乱。"},{"type":"narration","text":"每一次补位，周围所有人的身影都会亮一下，像被人替他们擦了擦。亮完以后，最前面那个人的空缺就彻底没有了。"},{"type":"choice","text":"","prompt":"每补上一个人，周围所有人都亮一下。还看吗？","options":[{"text":"继续看，看清补位是怎么完成的","affectionWho":"","affection":0,"insomnia":4,"flag":"watched_the_refill_to_the_end","next":""},{"text":"移开眼睛，先看别的地方","affectionWho":"","affection":0,"insomnia":-2,"flag":"looked_away_from_the_refill","next":""}]},{"type":"narration","text":"我一直看到第三个人被补上，才明白这个口子每天都在吃人。"},{"type":"narration","text":"这就是老周说的补全。不是有人忘了谁，是整个世界都同意那个人没有来过。"},{"type":"narration","text":"我想往前挤，想挤到那个女孩身边。脚下的地板软了一下，我整条腿陷进去半寸。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"我立刻把脚抽回来。鞋面上多了一道细细的白痕，像是被什么划过的纸边割的。"},{"type":"narration","text":"手心里那块东西在发抖，抖得比我厉害。我忽然明白它为什么一直跳——它不是在响，它是在认路。"},{"type":"choice","text":"","prompt":"手里的东西不是在响，是在认路。跟不跟？","options":[{"text":"跟着它指的方向往尽头看","affectionWho":"","affection":0,"insomnia":3,"flag":"followed_where_the_shard_pointed","next":""},{"text":"停下来，问它要找的是谁","affectionWho":"","affection":0,"insomnia":1,"flag":"asked_the_shard_who_it_wanted","next":"#l02"}]},{"type":"narration","label":"l02","text":"问也问不出声音。它只会跳，跳得更快就是催我往前走。"},{"type":"narration","text":"它不是碎掉的一小块时间。它是被剪下来的那一截，被谁从线上捡走，藏进了一本书的夹层里。"},{"type":"narration","text":"而它现在要找一个人。一个还记得那个缺口的人。"},{"type":"narration","text":"队伍里那个穿校服的背影忽然停了一下。所有人都往前挪，只有她没动，于是她和前面那个人之间多出了一格空隙。"},{"type":"narration","text":"她慢慢地转过头，动作像是费了很大的力气，脖子转得很慢，很涩。"},{"type":"choice","text":"","prompt":"那个背影转过头来了。要不要走近一步？","options":[{"text":"走近一步，看清她的脸","affectionWho":"","affection":0,"insomnia":4,"flag":"stepped_closer_to_the_face","next":""},{"text":"不走近，站在原地等她说","affectionWho":"老周","affection":0,"insomnia":-1,"flag":"waited_for_her_to_speak","next":""}]},{"type":"narration","text":"我停在原地。她的脖子还在转，转得很慢，像卡住的门轴。"},{"type":"narration","text":"她的脸是空的。五官都在原来的位置上，可凑不成一张能被记住的脸。我盯着看了三秒，已经开始记不清她的眉骨是什么形状。"},{"type":"narration","text":"她说了三个字。我听不见声音，但我知道她说什么。那种知道不在耳朵里，在骨头里。"},{"type":"narration","text":"她说的是：你也少过。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"我睁开眼的时候，人还站在第三层。书摊在我手里，翻在二一一〇年那一页。"},{"type":"choice","text":"","prompt":"睁眼还在第三层，书还摊在手里。先做什么？","options":[{"text":"先看页面右下角多了什么","affectionWho":"","affection":0,"insomnia":2,"flag":"checked_the_page_corner","next":""},{"text":"先合上书，看封面有没有变","affectionWho":"","affection":0,"insomnia":0,"flag":"closed_the_book_first","next":""}]},{"type":"narration","text":"书页上那股凉气散得很慢，散到后来，指尖都麻了。"},{"type":"narration","text":"页面右下角多了一行字。不是印刷体，是手写的，笔尖顿下去的地方墨还没干：缺一，待补。"},{"type":"narration","text":"缺一。我第一反应是图书馆少了一本书。第二反应是我知道自己想错了，这个一指的是一个人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"缺一。缺的那个人，是不是已经被写在这本书上了。"},{"type":"narration","text":"书没有回答。整层的灰又落下来半寸，落在我肩上一小片，很轻，凉得像雪。"},{"type":"choice","text":"","prompt":"灰落了一小片在肩上。要不要拍掉？","options":[{"text":"不拍，让它留在肩上","affectionWho":"","affection":0,"insomnia":2,"flag":"left_the_ash_on_his_shoulder","next":""},{"text":"拍掉，把袖子抖干净","affectionWho":"","affection":0,"insomnia":-2,"flag":"brushed_the_ash_away","next":""}]},{"type":"narration","text":"灰很轻，落在肩上没有一点分量，可我知道它落下来了。"},{"type":"narration","text":"我把书合上。封面还是空的。可我把它对着应急灯举起来的时候，光从纸背透过去，照出了一行被写过很多次的压痕。"},{"type":"narration","text":"压痕一层压着一层，最下面的几乎平了，最上面那一层很新，笔画很深。"},{"type":"narration","text":"那两个字是我的名字。不是苏禾。是我。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……写在书上的是我。"},{"type":"narration","text":"我站在那儿，握着那本书，握了很久。第三层的灯管只剩最后一根还亮着，光偏黄，把我的影子拉得很长，一直拉到第七排书架里。"},{"type":"choice","text":"","prompt":"影子的尽头站着一个没有影子的轮廓。","options":[{"text":"顺着影子看过去，盯住它","affectionWho":"","affection":0,"insomnia":4,"flag":"stared_at_the_shadowless_shape","next":""},{"text":"收回视线，先看手里的书","affectionWho":"","affection":0,"insomnia":-1,"flag":"pulled_his_eyes_back_to_the_book","next":""}]},{"type":"narration","text":"它占着那一小块地方，不靠近，也不退，像在等谁先动。"},{"type":"narration","text":"影子的尽头，书架的空隙里，站着一个没有影子的轮廓。它不动，也不靠近，只是在那个位置占着一小块地方。"},{"type":"narration","text":"我没有跑。跑了就等于承认它是对的。"},{"type":"narration","text":"我把书塞回第三层，塞得很深，然后转身下楼。第一级台阶踩下去的时候，整层的灰终于一起落了下来。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"灯关了没有。关了就出来，别站在架子里面。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"周叔，我看见那条线了。我也看见我的名字了。"},{"type":"choice","text":"","prompt":"我喊出去了，楼下没有回答。还要再喊吗？","options":[{"text":"再喊一遍，把名字也喊出来","affectionWho":"老周","affection":2,"insomnia":4,"flag":"called_zhou_a_second_time","next":""},{"text":"不喊了，先下楼去看灯","affectionWho":"老周","affection":0,"insomnia":-1,"flag":"stopped_calling_and_went_down","next":""}]},{"type":"narration","text":"楼上楼下都很静，静到我能听见自己的膝盖在响。"},{"type":"narration","text":"楼下没有回答。回答我的是灯——第四根灯管灭了，走廊往深处缩了一格。"},{"type":"narration","text":"那声音像一屋子的纸同时叹气。我没有回头。"},{"type":"narration","text":"门厅里没有人。前台的钥匙串挂在钩子上，老周的伞不见了，伞架下面留着一圈湿印。"},{"type":"narration","text":"湿印是往门外去的。伞是干的，印子却是湿的，这两件事凑不到一起，可它们就摆在我眼前。"},{"type":"choice","text":"","prompt":"干伞底下留着湿印，两件事凑不到一起。","options":[{"text":"顺着湿印跟到门口去看","affectionWho":"","affection":0,"insomnia":3,"flag":"followed_the_wet_print_outside","next":""},{"text":"先回前台，看钥匙串少没少","affectionWho":"老周","affection":0,"insomnia":1,"flag":"went_back_to_check_the_keys","next":"#l03"}]},{"type":"narration","label":"l03","text":"查也白查。钩子上的钥匙串在，绳子的结却被人重新打过一次。"},{"type":"narration","text":"我掏出手机，想给老周打电话。通讯录里没有他的号码，一条都没有。我明明存过，我上周还打给他问过排班。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"不对。我上周打的那通电话，是什么时候？"},{"type":"narration","text":"我想不起来。想起来的东西是空的，只有动作，没有内容。就像有人把一段录音擦成了静音，长度还在，声音没了。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"窗外的雨声里混进了一声蝉。三月不该有蝉。我站在门厅里，听见夏天的声音从冬天的雨里穿过去。"},{"type":"choice","text":"","prompt":"三月的雨里有蝉声。要不要听下去？","options":[{"text":"站着把那一声蝉听完","affectionWho":"","affection":0,"insomnia":3,"flag":"listened_to_the_cicada","next":""},{"text":"不想听，推门走出去","affectionWho":"","affection":0,"insomnia":-2,"flag":"walked_out_of_the_door","next":""}]},{"type":"narration","text":"蝉声只有一声，随后被雨声盖回去了，像没出现过。"},{"type":"narration","text":"灯管开始拉长，走廊朝四个方向散。我知道这是三天没睡的症状。可刚才那一层楼的线还挂在我眼睛里，怎样眨眼都掉不下去。"},{"type":"narration","text":"我扶着柜台站了一会儿。柜台上的借阅登记簿还摊着，苏禾那一行还在，墨还没干。"},{"type":"narration","text":"我拿起笔，想在自己的名字后面补一句说明。笔尖落在纸上，纸面自己往下陷了半毫米。"},{"type":"narration","text":"然后我看见我的字，和苏禾那一行是同一个笔迹。不是像，是同一个。连顿笔抖一下的毛病都一样。"},{"type":"choice","text":"","prompt":"我的字和苏禾那一行是同一个笔迹。","options":[{"text":"再写一遍，看笔迹会不会变","affectionWho":"","affection":0,"insomnia":4,"flag":"wrote_the_line_again","next":""},{"text":"把登记簿合上，不再动笔","affectionWho":"","affection":0,"insomnia":-1,"flag":"closed_the_register","next":""}]},{"type":"narration","text":"我又拿起笔，在废纸上写了两个字，笔尖抖得一模一样。"},{"type":"narration","text":"我把笔扔在柜台上。笔滚了两圈，停在木板的裂缝边上，没有再动。"},{"type":"narration","text":"外面的街上很空。凌晨的雨把整条路洗得发亮，几层高架上的车灯从头顶划过去，一辆接一辆，谁也不往下看。"},{"type":"narration","text":"我锁门的时候，玻璃门上映出我的脸。眼睛里有一点点蓝，很淡，像灯管的余色，眨眼就没了。"},{"type":"narration","text":"我以为是看错了。我把它归到没睡够上，并且很努力地希望它是没睡够。"},{"type":"choice","text":"","prompt":"玻璃门映出的眼睛有一点点蓝。","options":[{"text":"凑近玻璃，把那点蓝看清","affectionWho":"","affection":0,"insomnia":3,"flag":"leaned_in_to_see_the_blue","next":""},{"text":"转身走开，当自己看错了","affectionWho":"","affection":0,"insomnia":-2,"flag":"walked_away_from_the_glass","next":""}]},{"type":"narration","text":"凑近时那点蓝退进瞳孔最里面，眨一下就不见了。"},{"type":"narration","text":"我锁门的时候，外套左边口袋硌了一下。我掏出来，是一个牛皮纸信封，边角压得很平，封口没有粘。"},{"type":"narration","text":"里面三样东西。一张塑封的读者卡，照片上的女孩比登记簿里那一行字年轻；一份「A-三一七」的复印件，纸边裁得很齐；还有一张便条，上面只有四个字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"「别来上班。」"},{"type":"choice","text":"","prompt":"信封里那张便条写着「别来上班」。听他的吗？","options":[{"text":"明天照常上班，把话当面问清","affectionWho":"老周","affection":-2,"insomnia":3,"flag":"planned_to_show_up_anyway","next":""},{"text":"听他的，明天先不回图书馆","affectionWho":"老周","affection":3,"insomnia":-1,"flag":"planned_to_stay_away_tomorrow","next":"#l04"}]},{"type":"narration","label":"l04","text":"不回也一样。这栋楼少了谁都照常开灯，只是灯会记得少过一个人。"},{"type":"narration","text":"字是老周的。他写「班」字的时候最后一横总往上挑，我看了四年，不会认错。"},{"type":"narration","text":"他没有当面给我。这东西是在我上楼以后才进我口袋的——他知道，当着面，我不会接。"},{"type":"narration","text":"我把信封按回口袋里，按得很用力。街上的雨还在下，高架上的车灯一辆一辆往北划过去，谁也不往下看。"},{"type":"choice","text":"","prompt":"书里写的是你的名字，可你现在有两条路。今晚怎么处理这件事？","options":[{"text":"把碎片和书都带走，自己查下去","affectionWho":"","affection":0,"insomnia":5,"flag":"shard_taken_home","next":""},{"text":"把书锁进前台抽屉，先当作没发生过","affectionWho":"老周","affection":4,"insomnia":-1,"flag":"locked_nameless_book","next":""}]},{"type":"narration","text":"我做完了这个决定，才发现自己一直在数那个节奏：一、二、三。数到第三层就停。"},{"type":"narration","text":"这栋楼从上到下正好六层。替我数数的那个人，每一次都停在我在的那一层。"},{"type":"narration","text":"剩下的三层我从来没上去过，今晚也不会上去。"},{"type":"choice","text":"","prompt":"替我数数的那个人，每次都停在我这一层。","options":[{"text":"上楼的时候自己数一遍","affectionWho":"","affection":0,"insomnia":3,"flag":"counted_the_floors_himself","next":""},{"text":"不数，把这个念头压住","affectionWho":"","affection":0,"insomnia":-2,"flag":"refused_to_count_the_floors","next":""}]},{"type":"narration","text":"我数到第三层的时候，脚自己停了半拍，像是被谁按住。"},{"type":"narration","text":"回到宿舍已经四点。我躺下，没有闭眼，因为一闭眼那条线就自己铺开来，队伍排得整整齐齐，等着往前挪一格。"},{"type":"narration","text":"天快亮的时候手机亮了。一个没有归属地的号码，一行字：登记编号 A-三一七，明早九时，到时空异常研究所说明情况。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"缺一，待补。要补的那个人，大概已经挑好了。"},{"type":"choice","text":"","prompt":"一条没有归属地的短信，只给了时间地点。","options":[{"text":"回一条短信，问他是谁","affectionWho":"","affection":0,"insomnia":3,"flag":"replied_to_the_number","next":""},{"text":"不回，把手机扣在枕头上","affectionWho":"老周","affection":0,"insomnia":-2,"flag":"left_the_message_unanswered","next":""}]},{"type":"narration","text":"手机一直黑着，我没有回。那行字却已经落进脑子里，跟登记簿上那两行、书上那一行排在一起，像三条线并排往前，谁也不肯先断。天已经亮了，我还躺着不动，数着墙上的裂纹，等九点自己走过来，也等那本书里的人先动。"},{"type":"narration","text":"我没有回。我把手机扣在枕头上，看着窗外的天色从黑变成灰，再变成一种很薄的、几乎不算颜色的蓝。"}]},"1-2":{"sceneId":"1-2","chapter":"第一幕·异变初现","title":"时空研究所","background":"bg_institute_day","bgm":"bgm_tension","dense":true,"next":"1-3","lines":[{"type":"narration","text":"三月十三日，上午八点四十。楼下停着一辆没有标志的车，和昨晚从我面前开走的那一辆是同一种灰。"},{"type":"narration","text":"车里下来两个人，穿深色制服，袖子上印着一个三角形套着一道裂缝。他们没有按门铃，只站在楼下抬头看我的窗户。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我自己下去。你们不用上楼。"},{"type":"narration","text":"我在楼道里把兜里那点重量确认了一遍。它们还在，硬的一小块，和一张塑封的卡片，隔着一层布各跳各的。"},{"type":"narration","text":"研究所的楼比我想象的矮，也比我想象的宽。整面墙是玻璃，玻璃里嵌着很细的金属线，远看像一张被拉平的网。"},{"type":"choice","text":"","prompt":"车还在楼下等着。你要自己下去，还是让他们上楼？","options":[{"text":"自己下去。别让他们看见我的房间","affectionWho":"","affection":0,"insomnia":-2,"flag":"went_down_alone","next":""},{"text":"先把兜里那两样东西换到内侧口袋","affectionWho":"","affection":0,"insomnia":0,"flag":"stashed_shard_inside","next":""}]},{"type":"narration","text":"门口的闸机测了我的体温、脉搏、瞳孔。第三项的时候机器响了一声，负责登记的人抬头看了我一眼，然后又低头补了一句备注。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"上面写了什么？"},{"type":"narration","text":"他没有回答，把平板扣过去，递给我一张临时通行卡。卡面是白的，只有编号和一行小字：限时四小时。"},{"type":"choice","text":"","prompt":"平板被扣了过去。你要追问那句备注吗？","options":[{"text":"追问那句备注到底写了什么","affectionWho":"艾莉丝","affection":-2,"insomnia":0,"flag":"asked_gate_note","next":"#l01"},{"text":"不问。先把通行卡接过来收好","affectionWho":"艾莉丝","affection":0,"insomnia":0,"flag":"took_pass_quietly","next":""}]},{"type":"narration","text":"他最后还是把平板翻开了一角。备注那一行只有四个字：瞳孔待复核。","label":"l01"},{"type":"narration","text":"复核两个字写得很轻，像是随手补上去的。可这一栏本来不该有。"},{"type":"narration","text":"走廊比外面安静得多。地毯很厚，鞋底踩上去的声音被吃掉一半，剩下的那一半在耳朵里反弹，像谁在很远的地方敲门。"},{"type":"narration","text":"我被带进一间实验舱。墙是三面白、一面玻璃，玻璃后面是设备。房间里只有一把椅子，椅子上放着一份已经摊开的文件。"},{"type":"choice","text":"","prompt":"屋里只有一把椅子。你要先坐下，还是先站着看文件？","options":[{"text":"先站着，把那份折线图看完","affectionWho":"","affection":0,"insomnia":0,"flag":"read_chart_standing","next":""},{"text":"坐下来，把文件翻到最后一页","affectionWho":"","affection":0,"insomnia":0,"flag":"flipped_to_last_page","next":""}]},{"type":"narration","text":"文件第一页是我的名字、年龄、职业，第二页是一张折线图，横轴是时间，纵轴是睡眠时长。"},{"type":"narration","text":"折线从四个星期前开始往下掉，掉到零以后就没有再起来。最后一段是虚线，标注写着：待确认。"},{"type":"narration","text":"然后门开了。进来的人没有看我，先看了我的文件，然后才抬头。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"林晓。从三月九日到今天，你一共少掉三十个小时。这个数字是我算的，不是你说的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你们怎么算得出来？我自己都记不清丢了几天。"},{"type":"choice","text":"","prompt":"她进来先看文件，再看我。你要不要先开口？","options":[{"text":"先开口，把话头抢在自己手里","affectionWho":"艾莉丝","affection":-2,"insomnia":0,"flag":"spoke_before_alice","next":""},{"text":"等她先把那三十个小时说完","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"let_alice_speak_first","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你不用记得。你的手机记得，闸机记得，便利店的支付记录记得。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"一个人丢掉的不是记忆，是记录。记录比人诚实。"},{"type":"narration","text":"她说到这儿才坐下，把笔帽拔开，动作很熟，像是这套动作她已经做过几千次。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"现在描述你昨天晚上在三楼书架上摸到的东西。光是什么颜色，跳的频率快还是慢，碰到手的时候先凉还是先烫。"},{"type":"choice","text":"","prompt":"她不问我怕不怕，只要颜色和频率。我怎么答？","options":[{"text":"照实描述：偏白，边缘发青，先凉后烫","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"described_light_honestly","next":""},{"text":"只冲她想知道的部位说：掌纹最深那条","affectionWho":"艾莉丝","affection":-1,"insomnia":0,"flag":"gave_only_frequencies","next":""}]},{"type":"narration","text":"她记的时候没有抬头。我看见她把先凉后烫那四个字圈了一下，圈得很重。","label":"l02"},{"type":"narration","text":"圈完她又在旁边补了两个字：掌纹。她连烫的位置都记住了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你不问我是不是害怕。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"害怕测不出来。颜色可以。"},{"type":"narration","text":"我被这句话刺了一下。不是被冒犯，是被那种毫不绕路的准确刺了一下——她知道自己在做什么，也不打算假装在意别的。"},{"type":"narration","text":"我把光描述了一遍。偏白，边缘发青，跳得比心跳慢半拍，先凉，凉过之后才烫，烫的部位是掌纹里最深的那一条。"},{"type":"choice","text":"","prompt":"她翻回前一页又翻回来，抽出一张打印纸。你要凑近看吗？","options":[{"text":"凑过去，看那两组数字并排的样子","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"leaned_over_numbers","next":""},{"text":"坐着不动，等她先说出结论","affectionWho":"艾莉丝","affection":-1,"insomnia":0,"flag":"waited_for_verdict","next":""}]},{"type":"narration","text":"她一直在写。写到一半停下，翻回前一页，又翻回来，然后从桌角抽出一张打印纸，把两组数字并排放在一起。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"二点七秒一次。我们三年前在城区边缘收过一块一样的，频率是二点七零。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"一样？同一块？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不是同一块。是同一个缺口上掉下来的碎片，形状不一样，频率一样。"},{"type":"choice","text":"","prompt":"频率一样这件事还没有说完。我要不要打断她？","options":[{"text":"打断她：另外那两块认的是谁","affectionWho":"艾莉丝","affection":0,"insomnia":1,"flag":"pressed_about_third_shard","next":""},{"text":"不打断，先把二点七零这个数记下","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"memorized_270","next":""}]},{"type":"narration","text":"她抬眼看我，这一次看得比刚才久。眼神很直，没有敌意，也没有温度，像一间刚打扫过、什么都没有的房间。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"但频率一样这件事，不该发生在一个普通市民手里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"它出现在你手里，说明它认了你。我们收过一百四十多块，只有三块会认人。"},{"type":"narration","text":"她说完又低下头写，笔尖压得比刚才重一点。我注意到她换了握笔的位置——这大概是她唯一一次没控制住的小动作。"},{"type":"choice","text":"","prompt":"三块碎片认人，其中一块认的是她自己。我怎么看？","options":[{"text":"把她刚才那句停顿记在心里","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"noticed_alice_pause","next":""},{"text":"追问：那块认了你的，是什么感觉","affectionWho":"艾莉丝","affection":2,"insomnia":1,"flag":"asked_how_it_felt","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"另外两块呢？认了谁？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"一块认了一个已经不在名单上的人。另一块认了研究员，就是我。"},{"type":"narration","text":"她说这句话的时候没有任何起伏，像是在报一个实验编号。可她说完之后停了两秒才继续写，那两秒里她什么也没做。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"所以你现在的情况是：身上带着一块会认人的东西，并且已经四个星期没有真正睡过。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你还能站在这里跟我说话，已经算是运气。"},{"type":"choice","text":"","prompt":"她起身走向玻璃墙按了一个键。我要跟过去吗？","options":[{"text":"跟到玻璃墙前面，看清那些盒子","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"went_to_the_shelf","next":""},{"text":"留在椅子上，先数盒子的数量","affectionWho":"","affection":0,"insomnia":1,"flag":"counted_boxes_from_chair","next":""}]},{"type":"narration","text":"她起身走到玻璃墙前面，按了一个键。玻璃另一侧的灯亮起来，照着一排架子的透明盒。每个盒子里都是一小块偏白的结晶。"},{"type":"cg","background":"cg_alice_lab","text":"她站在那排盒子前面回头看我的时候，我忽然发现她站的姿势和老周在地下书库里的姿势是同一个：肩膀往前，重心压低，像是随时准备把盖子合上。"},{"type":"narration","text":"玻璃里的光很薄。薄得像一层纸，我甚至能看见她侧脸边上那道很淡的轮廓线。"},{"type":"choice","text":"","prompt":"玻璃后面的结晶一块比一块白。我要问那是什么吗？","options":[{"text":"问：这些是从谁身上拿下来的","affectionWho":"艾莉丝","affection":-2,"insomnia":1,"flag":"asked_whose_crystals","next":""},{"text":"不问。先把研究所的立场听完","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"heard_institute_position","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"研究所的立场很简单：把裂缝量清楚，封起来，让名单不要再变短。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"名单？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我们登记每一例异常。编号按顺序发，没有跳号，也没有退回。"},{"type":"narration","text":"我口袋里那张复印件上的编号在我脑子里亮了一下。A-三一七。去年冬至的章。"},{"type":"choice","text":"","prompt":"编号是按顺序发的。我要不要把 A-三一七 报出来？","options":[{"text":"报出 A-三一七，看她的反应","affectionWho":"艾莉丝","affection":4,"insomnia":1,"flag":"quoted_a317","next":""},{"text":"先不提编号，问名单现在有多长","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"asked_list_length","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"A-三一七，这条记录里是谁？"},{"type":"narration","text":"她的手停了。这一次停得比刚才久，笔尖悬在纸上，没有落下去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你怎么知道这个编号。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"有人给了复印件。他说你们每次有人少掉，都会来一趟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这个人现在还在吗。"},{"type":"narration","text":"这个问题问得很平，可我听出来她是在核对一件事：给复印件的人有没有被擦掉。"},{"type":"choice","text":"","prompt":"她问给复印件的人还在不在。我怎么回答？","options":[{"text":"把老周的名字说得一字不漏","affectionWho":"老周","affection":6,"insomnia":0,"flag":"staked_zhou_full_name","next":"#l03"},{"text":"只说他在，其余的先留一手","affectionWho":"老周","affection":2,"insomnia":1,"flag":"kept_zhou_details_back","next":""}]},{"type":"narration","text":"她听完在纸上写了一个字：桩。然后她画了一道竖线，把老周的名字钉在那道线上。","label":"l03"},{"type":"narration","text":"她说，有人会被擦掉，是因为从来没有人替他打过桩。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"在。他叫老周，历史图书馆管理员，六十一岁，在那栋楼里待了四十年。"},{"type":"narration","text":"我在心里把老周的名字说得很完整。我不知道为什么，我就是觉得说出来要说得一丝不漏，像是给他打一个桩。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"记下了。现在换你回答我一个问题。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你在那栋楼里，除了那块碎片，还看见了什么不该在的东西。"},{"type":"choice","text":"","prompt":"她问我除了碎片还看见什么。我先说哪一件？","options":[{"text":"先说那本没有名字的书","affectionWho":"艾莉丝","affection":-2,"insomnia":1,"flag":"mentioned_the_nameless_book","next":""},{"text":"先说那张描了两遍名字的读者卡","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"mentioned_the_reader_card","next":""}]},{"type":"narration","text":"我看着她。她等着，笔尖已经回到纸面上，姿势很标准，标准到没有任何余地。"},{"type":"narration","text":"我在心里过了一遍：一本没有名字的书，一个把名字描了两遍的读者卡，一个穿校服的背影，一页写着缺一待补的纸。"},{"type":"narration","text":"还有那两个字。苏禾。那两个字太熟了，熟得不像是我刚认识的，倒像是我一直揣着的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你的瞳孔在放大。这不是害怕的放大，是想隐瞒的时候血液往内脏走造成的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我不是审讯官，我只是不想在我写记录的时候被人喂假数据。"},{"type":"choice","text":"","prompt":"她说她不想被喂假数据。你要把苏禾说出来吗？","options":[{"text":"把苏禾这个名字，还有登记簿上的三页字都告诉她","affectionWho":"艾莉丝","affection":8,"insomnia":0,"flag":"told_alice_truth","next":""},{"text":"只承认碎片，把苏禾留在自己这里","affectionWho":"艾莉丝","affection":-4,"insomnia":1,"flag":"hid_suhe_from_alice","next":""}]},{"type":"narration","text":"我做出选择之后，她安静了三秒。三秒在这样一间房里很长，长到我能数清头顶灯管的闪烁次数。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"好。我按你说的记。这一段我不会写进系统。"},{"type":"narration","text":"她把笔搁下。这是她进这间房以来第一次把笔放下，也是第一次有一件事不在她的表格里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"今天到这里。你的通行卡四小时后失效，出去的时候会有人收走。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"就这样？你们请我来一趟，问几个问题，然后放我回去？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"放你回去是因为你没有可观察的价值——不，你很有价值，但你没有可控制的必要。"},{"type":"choice","text":"","prompt":"她把笔搁下了，这是她第一次放下笔。我要问吗？","options":[{"text":"问她：不写进系统的那一段，是给谁的","affectionWho":"艾莉丝","affection":4,"insomn
