脚踩开的，铁门撞在墙上弹回来两次。雷恩站在门口，浑身湿透，肩上还挂着雨。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"往这边。"},{"type":"narration","text":"我没有问为什么。我这一次直接跑了。这是我这几天做的第一件正确的事。"},{"type":"narration","text":"我们往楼下跑。楼梯间的应急灯一层一层亮起来，从远处往近处，和我第一天夜里看见的那种亮法一模一样。"},{"type":"choice","text":"","prompt":"六个人的脚步齐得像一双鞋。你要回头吗？","options":[{"text":"回头数，确认是六个人","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_pursuers","next":""},{"text":"不回头，盯住雷恩的背","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"kept_eyes_on_raine","next":""}]},{"type":"narration","text":"六个人的脚步在背后追过来。他们的脚步很齐，齐得像六个人共用一双鞋，踩在木楼梯上一下一下，很重。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"地下室。别停。"},{"type":"narration","text":"他把楼梯口的消防栓一脚踹开，抓出里面一卷老旧的水带，飞快地扯出来撒在台阶上。我记得他腰上别着一把很短的工具，不是刀，像一把撬棍。"},{"type":"narration","text":"我们冲进地下书库。那扇铁门在他身后关上，他拿撬棍卡住门轴，动作快得练过一百遍。"},{"type":"narration","text":"铁门外面「砰」地响了一下。门上的铁皮往里凹了一小块，凹得很干净，像被一把很大的手按了一下。"},{"type":"fx","fx":"shake","text":""},{"type":"choice","text":"","prompt":"铁门裂了。你要不要提醒他？","options":[{"text":"提醒：门撑不住第三下","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"warned_about_the_door","next":""},{"text":"不出声，听第二下从哪个位置来","affectionWho":"","affection":0,"insomnia":1,"flag":"listened_to_the_second_blow","next":""}]},{"type":"narration","text":"第二下。凹坑更深了，门缝里开始漏出很细的白灰。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"退到我后面。"},{"type":"narration","text":"他把我往墙边一推。我撞在书架上，后脑勺磕了一下，疼得眼前发黑。"},{"type":"narration","text":"然后我看见他从口袋里把昨天那块碎片拿出来，用左手捏着，右手摊开，掌心朝着门。"},{"type":"narration","text":"我不知道他要干什么。我只看见他手腕上那圈细线亮了。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"门被撞开的那一瞬间，从他掌心里爆出来一团没有颜色的东西。不是光，是那种盯久了会让人忘记自己在看什么的那种东西。"},{"type":"choice","text":"","prompt":"那团没有颜色的东西就在门口。你要看它吗？","options":[{"text":"看。看清楚它到底是什么","affectionWho":"","affection":0,"insomnia":1,"flag":"looked_into_the_colorless_thing","next":"#l02"},{"text":"低头护住自己的眼睛","affectionWho":"","affection":0,"insomnia":0,"flag":"shielded_his_eyes","next":""}]},{"type":"narration","text":"我盯着它看。看了不到两秒，我就忘了自己刚才在想什么，连站在哪儿都要重新找一遍。","label":"l02"},{"type":"narration","text":"我赶紧移开视线。先看见雷恩的袖口，再看见自己的鞋；顺序找回来了，东西才重新有了名字。"},{"type":"choice","text":"","prompt":"年轻人越走越慢，脸停在半路上。你要看吗？","options":[{"text":"看他的脸，记下他停在哪一步","affectionWho":"","affection":0,"insomnia":1,"flag":"watched_the_young_man_freeze","next":""},{"text":"移开眼。他马上要散了","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_away_from_the_dissolving","next":""}]},{"type":"narration","text":"冲在最前面的那个年轻人撞进那团东西，整个人慢了下来，慢成了一种很奇怪的姿态：手臂伸着，脚还没落地，脸上的表情在半路上停住。"},{"type":"narration","text":"然后他身上的时间往回走了一步。"},{"type":"narration","text":"我看见他的脸变年轻，又变回来，再变年轻。他的衣服反复变成另一件旧的，再变回来。他站在原地被倒着翻了好几遍，翻到最后整个人散成一把灰，落在书库的水泥地上。"},{"type":"narration","text":"灰落地的声音很轻。剩下的五个人在门口停住了，像一排被按住的人偶。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"守望者。你又在借。"},{"type":"choice","text":"","prompt":"那个声音又下来了。你要不要抬头？","options":[{"text":"抬头，对着天花板回一句","affectionWho":"时间领主","affection":-3,"insomnia":1,"flag":"spoke_back_to_the_ceiling","next":""},{"text":"低头，先看雷恩的右手","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"checked_raines_hand_first","next":""}]},{"type":"narration","text":"那个声音这次是从书库的天花板下来的，落到我们头顶上，很缓慢地散开。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"借来的时间要还。你知道规矩。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我付。"},{"type":"narration","text":"他说完这两个字，抬起了右手。"},{"type":"narration","text":"接下来发生的事情没有声音。他的小臂从手腕开始，往上，一段一段地变淡。"},{"type":"narration","text":"不是变透明，是变淡，像有人拿一块干净的橡皮，从他手臂上擦过去。皮肤、肌肉、那圈细线、袖口磨白的那道边，全都在被擦。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"雷恩！"},{"type":"narration","text":"我扑过去想抓他的胳膊。我的手穿了过去。"},{"type":"choice","text":"","prompt":"你的手穿过去了。再试一次吗？","options":[{"text":"再伸一次手，抓他的袖子","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"tried_to_grab_him_again","next":""},{"text":"把手收回来，确认它还在","affectionWho":"","affection":0,"insomnia":1,"flag":"checked_his_own_hand","next":""}]},{"type":"narration","text":"不是隔空，是真的穿过去。我碰到的地方没有阻力，像伸进一团还没冷透的雾。我的手从他小臂的位置穿到了另一边，指尖是干的。"},{"type":"narration","text":"他的小臂停在了离手肘三指的位置。擦到那儿，就停了。"},{"type":"narration","text":"他的手还在。只是从手腕到手肘之间那一段，变成了影子。灰色的，薄的，贴在那儿的影子。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"……值。"},{"type":"narration","text":"他撑着门框站住。他的额头上全是汗，顺着下巴往下滴，滴在地上。地上那些灰被汗打湿了，变成几点黑。"},{"type":"choice","text":"","prompt":"那五个人退了，年轻男人回头看了你一眼。你要开口吗？","options":[{"text":"开口：让他把手擦干净再走","affectionWho":"","affection":0,"insomnia":1,"flag":"called_after_the_retreating_five","next":""},{"text":"不出声，先扶住雷恩","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"held_raine_instead","next":""}]},{"type":"narration","text":"门口的五个人退了。他们退的时候还是那个整齐的样子，一起退，一起转，一起走进楼道的黑里。"},{"type":"narration","text":"走出最后那个之前，年轻男人回头看了我一眼。他终于不用那种礼节性的站法了，他看我的眼神里有一样很朴素的东西——恨。"},{"type":"dialogue","speaker":"时间领主","sprite":"","text":"你脚下那块地方，本来该是空的。"},{"type":"narration","text":"声音消失以后，地下室安静得只剩下滴水。不知道哪根管子漏水，一下，一下，很稳。"},{"type":"choice","text":"","prompt":"他跪着，右手还捏着那块裂开的碎片。你先看哪样？","options":[{"text":"先看碎片上那道裂缝有多深","affectionWho":"","affection":0,"insomnia":1,"flag":"examined_the_cracked_shard","next":""},{"text":"先看他那只完好的右手","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"looked_at_the_intact_hand","next":""}]},{"type":"narration","text":"我跪在雷恩旁边。他的右手还是完整的，手指很稳地捏着那一小块碎片，碎片上面裂开了一道缝。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你的手……"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"少了一截。不疼。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"怎么会不疼。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"因为它不是被切掉的。是被认为不存在的。不存在的东西不会疼。别人也看不见。"},{"type":"choice","text":"","prompt":"他把袖子放下来，盖住那截影子。你要不要问？","options":[{"text":"问：这个动作你做过几次","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"asked_how_many_times","next":""},{"text":"不问。先把撬棍捡起来","affectionWho":"","affection":0,"insomnia":0,"flag":"picked_up_the_crowbar","next":""}]},{"type":"narration","text":"他把袖子放下来，把那截影子盖住。我注意到他做这个动作的时候很熟练，像已经做 onWho":"","affection":0,"insomnia":0,"flag":"held_the_device_steady","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"因为你是唯一一个带着偏差走进来、还活着的人。","label":"l03"},{"type":"narration","text":"她说完就继续拨号，没有回头。这一秒是她今天多给的第二秒。"},{"type":"choice","text":"","prompt":"仪器还在响。你先管哪一样？","options":[{"text":"先读仪器，把数据按时间记下来","affectionWho":"","affection":0,"insomnia":1,"flag":"read_the_device_first","next":""},{"text":"先看雷恩站不站得住","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"checked_if_raine_could_stand","next":""}]},{"type":"narration","text":"我低头看手里的仪器。屏幕亮起来，第一行字慢慢跳出来：观测者，林晓。关联时间偏移：一百二十小时。"},{"type":"narration","text":"一百二十小时。从三月十二号晚上闭馆那一刻算起，我一共只清醒了这么多。而正常人这六天里应该睡掉的，我算到一半就停了。算这种数没有意义，我的问题不是数错了，是我根本没有睡。"},{"type":"narration","text":"雷恩靠在墙上，用左手把碎片塞回口袋里。他的右臂垂着，那截影子在袖子里看不出厚度。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"他们说的那些话，你别听。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"哪句。"},{"type":"choice","text":"","prompt":"雷恩说别听他们的话。你要问他哪句吗？","options":[{"text":"问他：哪一句最不能听","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"asked_which_sentence","next":""},{"text":"不问，自己把那些话过一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"reviewed_their_words_alone","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"「擦掉是净化」。这句最好听。好听的话最贵。"},{"type":"narration","text":"我说我知道了。其实我不太知道。今天早上那个声音说我脚下那块地方本来该是空的，我到现在还在想这句话——如果那块地方本来该是空的，那我昨天看见的那个坐在空座位旁边的影子，和我之间，到底谁是真的。"},{"type":"narration","text":"研究所的人开始清场。他们拿着仪器一层一层走，把自习室那十几个学生请出去。学生们对着镜头抱怨，说今天什么都没发生。"},{"type":"narration","text":"什么都没发生，确实是他们今天的全部内容。"},{"type":"choice","text":"","prompt":"研究所的人一层一层清场。你先跟谁走？","options":[{"text":"跟着学生们往后门走","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_the_students_out","next":""},{"text":"留下来，找老周问一句","affectionWho":"老周","affection":5,"insomnia":1,"flag":"stayed_to_ask_zhou","next":""}]},{"type":"narration","text":"我跟着人群往后门走。经过三层的时候，我回头看了一眼那张桌子。那本厚字典还压着我的三张纸。"},{"type":"narration","text":"然后我看见老周站在书架后面。他一直没有出来，从头到尾都没有。他今天穿的是那双布鞋，站在六排书架之间，像一堵很旧的墙。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"我说过别来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我想看看是谁。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"看见了吧。他们不杀你，他们只是觉得你不该在这张纸上。"},{"type":"narration","text":"他把那本旧报纸合订本从架子上抽出来，翻到合影那一页，什么都没说，只是把它摊在桌面上，然后走了。"},{"type":"choice","text":"","prompt":"老周把那张合影摊在桌上就走了。你要不要记住那一页？","options":[{"text":"记住合影上的人数","affectionWho":"","affection":0,"insomnia":1,"flag":"memorized_the_group_photo","next":""},{"text":"不去记。照片里的人我认不出","affectionWho":"","affection":0,"insomnia":0,"flag":"refused_to_memorize_the_photo","next":""}]},{"type":"narration","text":"我下楼的时候在想一件事：明天我还会不会记得今天有人替我挡了一下，替我被擦掉了一截手臂。我不确定。不确定性现在成了我最熟悉的一种感觉。"},{"type":"narration","text":"我握紧手里的仪器。它有记录，它记得住。这是我今晚敢闭上眼睛的唯一理由——虽然我知道我闭不上。"},{"type":"choice","text":"","prompt":"车上还有很长的路。你要先问谁？","options":[{"text":"问艾莉丝：什么叫观测者不得干预","affectionWho":"艾莉丝","affection":6,"insomnia":0,"flag":"asked_about_observer_rule","next":""},{"text":"问雷恩：你那条手臂还缺着，多少次了","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"raine_trusts_you","next":""}]},{"type":"narration","text":"车是研究所派来的，黑色，很旧，后座有一股消毒水味。雨又开始了，敲在车顶上像一把小石子。"},{"type":"narration","text":"我坐在中间。左边是艾莉丝，她把手提终端摊开在膝盖上，一页一页地过去。右边是雷恩，他闭着眼睛，右臂放在腿上，那截影子被袖口严严实实地盖着。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"按条例，观测者不得干预。我干预了。"},{"type":"narration","text":"她说话的时候眼睛没有离开屏幕。这是我第一次听她主动讲一句多余的话，她的语速甚至比平时慢了一点点。"},{"type":"choice","text":"","prompt":"她说是措辞，不是撒谎。你信这句话吗？","options":[{"text":"信。归档的语言有自己的规矩","affectionWho":"艾莉丝","affection":5,"insomnia":1,"flag":"accepted_the_wording","next":""},{"text":"不信。措辞不过是假的另一种写法","affectionWho":"艾莉丝","affection":-3,"insomnia":1,"flag":"rejected_the_wording","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我把它记成设备调配，不是干预。记录要经得起人看。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那就是撒谎。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"不。是措辞。人只信能归档的东西。"},{"type":"narration","text":"她翻到下一页，屏幕上跳出一张图：一条很细的线，中间缺了一小段。缺口的形状我很熟，那是我今天早上看见的那面墙。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这不是裂缝第一次出现。七年前也有一次，是在这栋楼里。"},{"type":"narration","text":"七年前。旧报纸的合影是八年前。我算了一下这两个数之间的差值，算到一半，把这些线头先按在纸上。"},{"type":"choice","text":"","prompt":"雷恩闭着眼开口。你要不要接他的话？","options":[{"text":"接：你数次数，我数天数","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"traded_counts_with_raine","next":""},{"text":"不接。听他把七次说完","affectionWho":"","affection":0,"insomnia":0,"flag":"let_him_finish_counting","next":""}]},{"type":"narration","text":"右边，雷恩没有睁眼，但他开口了。他的声音很低，几乎被雨盖住。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"七次。这是第七次。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你还剩多少。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"够用。够用到把人找回来。"},{"type":"narration","text":"他说完这句就不再说话了。雨敲着车顶，一格一格地过去。我在中间坐着，两边各有一个把自己少掉一部分的人。"},{"type":"narration","text":"车往研究所的方向开。城市在雨里退后，旧街区那栋楼的轮廓越来越小，最后变成雾里一块偏暗的方形。"}]},"1-7":{"sceneId":"1-7","chapter":"第一幕·异变初现","title":"基地","background":"bg_base_room","bgm":"bgm_tension","dense":true,"next":"1-8","lines":[{"type":"narration","text":"第八天，三月十九号，早上六点零五分。我醒着。这句话现在不需要加引号了，它就是字面意思。"},{"type":"narration","text":"我试着回想第七天。上午还在：研究所的隔离间，手腕上贴着仪器，窗帘拉着，门外有人走来走去。"},{"type":"narration","text":"下午没有了。不是想不起来，是那半天本身不在——像一张纸中间被裁掉一条，两边的字还接得上，可纸短了。"},{"type":"narration","text":"我算了一下：三月十六号之后，我一共只睡过两次，一次四十分钟，一次十几分钟，加起来不到一小时。"},{"type":"choice","text":"","prompt":"仪器说那九个小时不属于这一天。你要接这句话吗？","options":[{"text":"接：那九个小时我在哪儿","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"asked_where_the_nine_hours_went","next":""},{"text":"不接话，先看屏幕上那条缺口","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_the_gap_on_screen","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"仪器有九个小时没有采集到数。不是故障，是那九个小时不属于这一天。"},{"type":"narration","text":"她说这句话的时候没有看我，眼睛一直停在屏幕上。然后她把终端往我这边推了半寸。"},{"type":"narration","text":"只是半寸。推完她就收手，好像那个动作是别人做的。"},{"type":"narration","text":"这是我们认识以来，她第一次多解释一句。我决定把这半寸记得比那九个小时还清楚。"},{"type":"narration","text":"地址是老周给我的。写在一张借阅条的背面，字歪，最后一笔往下拖，像他写到一半就不想写了。"},{"type":"choice","text":"","prompt":"地址是老周写的，最后一笔拖到了底。你要先问谁？","options":[{"text":"问老周：这地方谁在用","affectionWho":"老周","affection":5,"insomnia":0,"flag":"asked_zhou_who_used_the_pumphouse","next":""},{"text":"问雷恩：守望者为什么不用了","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"asked_raine_why_it_was_abandoned","next":""}]},{"type":"narration","text":"旧城区，一间废弃的地下水泵房，高架桥从它头顶上过。那种地方没有人会看第二眼，看第一眼的人都嫌多。"},{"type":"narration","text":"雷恩在路口等我。他站着，右手插在口袋里，左肩靠着桥墩，像是已经站了很久，也像是打算一直站下去。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"这地方是守望者的。现在没人用了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"没人用，还是没人。"},{"type":"narration","text":"他没有回答。他走在前面，每一步都比该有的轻，踩在井盖上的声音小得几乎听不见——这是他从别人手里活下来以后留下的习惯。"},{"type":"choice","text":"","prompt":"铁梯锈得厉害，下面那七米没有灯。你先走还是后走？","options":[{"text":"走在雷恩前面","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"went_ahead_of_raine","next":""},{"text":"跟在他后面，踩他踩过的地方","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"stepped_where_raine_stepped","next":""}]},{"type":"narration","text":"入口的铁梯锈得厉害，踩上去会掉渣。下了七米，空气换了一种味道：旧水、铁，还有一点很像医院的消毒水。"},{"type":"fx","fx":"wait","text":""},{"type":"narration","text":"他把一扇铁门推开。门后是一间不大不小的房间，四张床，一排没有插电的终端，墙角堆着封了口的水箱。"},{"type":"cg","background":"cg_base_establish","text":"地板是水泥的，扫过，扫得很干净。这里以前有人住，住的时间不短。"},{"type":"narration","text":"墙上钉着一块值班表。表上有名字，可每一个名字都只剩开头一笔：一个竖钩，一个点，一道横。"},{"type":"choice","text":"","prompt":"表上那些名字只剩开头一笔。你要补完吗？","options":[{"text":"补完一个，看看是谁","affectionWho":"","affection":0,"insomnia":0,"flag":"completed_a_name_on_the_board","next":"#l01"},{"text":"收回手，只记笔画的形状","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_only_the_stroke_shapes","next":""}]},{"type":"narration","text":"我把手停在半空。表上那些笔画在等，像在等我往下补完。","label":"l01"},{"type":"narration","text":"我知道补完一个，那个名字就会变成我的记忆——变成我的，还是变成我。"},{"type":"choice","text":"","prompt":"表上的名字补不全。你要问雷恩吗？","options":[{"text":"问他这张表是谁的","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"asked_whose_board_it_was","next":""},{"text":"不问。先把笔画的样子记住","affectionWho":"","affection":0,"insomnia":0,"flag":"memorized_the_stroke_shapes","next":""}]},{"type":"narration","text":"我伸手去读。指尖刚碰到第一个字的头一笔，后面的笔画就在我脑子里自动补完了。"},{"type":"narration","text":"补出来的名字，我一个也不认识。可我补得很顺，顺得像我自己写过那块表。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"别读。读了会记住。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"记住不好吗。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"记住要付。他们付过一次，表才成了现在这样。"},{"type":"narration","text":"我把手收回来。收得很慢，因为我很想读下去——我想知道那些名字里有没有一个姓陈的。"},{"type":"narration","text":"铁门外有脚步声。雷恩的手先动了，摸到腰上那把撬棍，两秒以后才松开。"},{"type":"choice","text":"","prompt":"艾莉丝拎着箱子进来的时候，外套还湿着。你先看哪样？","options":[{"text":"看她那两只箱子","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_alices_cases","next":""},{"text":"看她报休假和报废那两笔账","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"noted_alices_two_ledgers","next":""}]},{"type":"narration","text":"进来的是艾莉丝。她拎着两只箱子，外套肩上还挂着外面的雨。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我按休假报的。设备按报废出库。两笔账都不会有人查。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你在给自己留后路。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我在给你留数据。"},{"type":"narration","text":"她说完就蹲下去开箱子，动作很快，没有再补一句。我站在她背后，忽然觉得那句话比任何一句关心都重。"},{"type":"choice","text":"","prompt":"雷恩带回来一个人。你要不要拦一下？","options":[{"text":"先拦：这里不是谁都能来","affectionWho":"雷恩","affection":-2,"insomnia":0,"flag":"questioned_bringing_a_newcomer","next":""},{"text":"不拦。她手里那桶汤还是热的","affectionWho":"小雅","affection":5,"insomnia":0,"flag":"let_xya_come_in","next":""}]},{"type":"narration","text":"第二个人是跟着雷恩进来的。雷恩出去了一趟，回来时身后多了一个人——小雅，抱着一个保温桶，头发被雨打湿了一半。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我带了汤。还有一件事，你必须听我说完。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"先说汤是什么汤。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"骨头汤，不重要。重要的是昨天有人在我耳朵边点单。"},{"type":"narration","text":"她说那个人点的是一杯四年前就下架的黑咖啡，加两勺糖。店里现在连配那种杯子都找不出来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"他说，再来一杯，记在阿灰账上。"},{"type":"choice","text":"","prompt":"阿灰。这个名字比人先出现。你先做什么？","options":[{"text":"让艾莉丝把这三个字拼进终端","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"had_alice_log_the_name","next":""},{"text":"先问小雅：阿灰是谁","affectionWho":"小雅","affection":5,"insomnia":1,"flag":"asked_xya_who_agui_was","next":"#l02"}]},{"type":"narration","text":"小雅摇头。她说她不认识阿灰，可这三个字她写了很多年，写在每一张点单纸的角上。","label":"l02"},{"type":"narration","text":"她翻出一张点单纸给我看。角上的字很嫩，像刚学会写自己名字那年写的。"},{"type":"choice","text":"","prompt":"那张点单纸怎么处置？","options":[{"text":"让她收好，别交给研究所","affectionWho":"小雅","affection":5,"insomnia":1,"flag":"let_xya_keep_the_slip","next":""},{"text":"让艾莉丝拍照归档","affectionWho":"艾莉丝","affection":4,"insomnia":1,"flag":"photographed_the_slip","next":""}]},{"type":"narration","text":"阿灰。店里没有叫阿灰的人，账本上也没有。可她说这三个字的时候，手指在保温桶把手上捏白了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"名字出现的时间比人早。这种情况我在数据里见过三次，三次都没有下文。"},{"type":"narration","text":"她把这三个字存进终端，存完还念了一遍拼写，像是怕自己以后也会认不出来。"},{"type":"choice","text":"","prompt":"圆桌子上没有主位。你先坐哪一边？","options":[{"text":"坐在艾莉丝和雷恩中间","affectionWho":"","affection":0,"insomnia":1,"flag":"sat_between_alice_and_raine","next":""},{"text":"坐在靠门那一侧，背对着风口","affectionWho":"","affection":0,"insomnia":0,"flag":"sat_with_his_back_to_the_draft","next":""}]},{"type":"narration","text":"四张床，四个人。我们坐下来的时候谁也没有挑位置，可那张桌子是圆的，谁也躲不开谁。"},{"type":"narration","text":"雷恩先开口。他说话一向短，这一次更短。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我要知道借来的时间被谁收走。"},{"type":"narration","text":"守望者用碎片改过七次事情。每一次都有人从身上少掉一截。少掉的那部分去哪儿了，没有人告诉过他。"},{"type":"narration","text":"他说他要找的不是答案，是那个收账的人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我的条件相反。所有行动留记录，记录归我保管。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"没有记录的行动，等于没有发生。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"为什么是等于没有发生。"},{"type":"choice","text":"","prompt":"她说没有记录的东西会被擦掉。你要不要认这句话？","options":[{"text":"认。那就把我们四个都记下来","affectionWho":"艾莉丝","affection":5,"insomnia":1,"flag":"agreed_to_record_everyone","next":""},{"text":"认一半。记下来的人也会被盯上","affectionWho":"艾莉丝","affection":-2,"insomnia":0,"flag":"half_agreed_to_record","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"因为没有记录的东西，会被擦掉。有记录的，至少得一张一张地擦。"},{"type":"narration","text":"她说这句的时候把终端翻过来给我看了一眼。屏幕背面贴着一张很旧的便签，边角磨圆了，上面有一个名字。"},{"type":"narration","text":"她立刻把终端转回去了。转得很快，快到我确定她自己也发现那半秒给多了。"},{"type":"narration","text":"小雅抱着保温桶坐在我旁边。她举手的样子像在上课。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我要知道那个声音是不是人。如果是人，我要知道他为什么只找我。"},{"type":"choice","text":"","prompt":"轮到你开条件了。你要先提谁？","options":[{"text":"先提雷恩要找的那个人","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"opened_with_raines_goal","next":""},{"text":"先提自己要的那张名单","affectionWho":"","affection":0,"insomnia":1,"flag":"opened_with_the_list_demand","next":""}]},{"type":"narration","text":"轮到我了。我想了一会儿才开口，说出来的时候我自己都听见我的声音在抖。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我要一张名单。所有被擦掉的人，一个不漏。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"没有那种名单。记录里不存在的东西，无法被证明存在。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"有那种名单。就是你走路的时候下意识让开的那些半步。"},{"type":"narration","text":"艾莉丝停了两秒。她没有反驳，她把这句记了下来，然后在旁边打了一个问号。"},{"type":"narration","text":"我们定下四条规矩。前三条很快：不擅自用碎片；只留读到的记录，不留做过的记录；每一次行动，四个人里至少两个到场。"},{"type":"choice","text":"","prompt":"第四条卡住了。你要拿谁的说法顶上去？","options":[{"text":"拿雷恩的说法：这条防的是我们中间","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"leaned_on_raines_reason","next":""},{"text":"拿小雅的说法：先记下来再说","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"leaned_on_xyas_memory","next":""}]},{"type":"narration","text":"第四条卡住了。第四条是我提的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"谁少掉了一部分，剩下的人负责记得他。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这条没有数据支持。而且按机制，记得的人自己也会进名单。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"这条最有用。前三条防外面，这条防我们中间。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我同意。我可以先记，我记性很好的。"},{"type":"narration","text":"艾莉丝看了她一眼，没有再说反对。她把终端翻到新的一页，在最上面打了一行字：第四条，生效。"},{"type":"narration","text":"打完之后她停了一下，又在那行字后面加了六个字：从今天算起。"},{"type":"choice","text":"","prompt":"四个人的影子落在同一张桌上。你要不要数？","options":[{"text":"数一遍，确认是四条影子","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_four_shadows","next":""},{"text":"不数。今天已经数得够多了","affectionWho":"","affection":0,"insomnia":0,"flag":"stopped_counting_today","next":"#l03"}]},{"type":"narration","text":"我把视线移开了。影子这种东西，越数越像会少一条。","label":"l03"},{"type":"narration","text":"可我还是用余光扫了一遍桌沿。四条，不多不少，我这才把呼吸放慢。"},{"type":"choice","text":"","prompt":"桌子还空着一半。要拿什么填上吗？","options":[{"text":"把老周那张地址条压在桌角","affectionWho":"老周","affection":4,"insomnia":0,"flag":"anchored_the_table_with_the_slip","next":""},{"text":"留空。空着比填错好","affectionWho":"","affection":0,"insomnia":0,"flag":"left_the_table_half_empty","next":""}]},{"type":"cg","background":"cg_team_first","text":"四个人的影子落在同一张桌子上。我数了一遍——四个人，四条影子，没有一个多余。"},{"type":"narration","text":"这是这几天里第一次，我数出来的东西是对的。"},{"type":"narration","text":"艾莉丝从箱子里抽出一本硬皮记录本，边角包过胶，翻开第一页，那一页什么都没有写。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"第一页空着。留给已经不在、但我们要记的人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"现在就有吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"现在就有。到底有几个我算不出来，但不会少。"},{"type":"narration","text":"我拿过她的笔。笔尖在纸上停了两秒——我不确定该不该写，也不确定写了以后那个名字会不会被我连累。"},{"type":"choice","text":"","prompt":"笔尖在纸上停了两秒。你写不写那个名字？","options":[{"text":"写。用力写在第一页正中","affectionWho":"","affection":0,"insomnia":1,"flag":"wrote_suhe_on_the_first_page","next":""},{"text":"先写别人，把自己留在最后","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_others_first","next":""}]},{"type":"narration","text":"我还是写了。两个字，横竖都很用力，纸的背面被顶出两道浅痕。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"苏禾。这是谁？"},{"type":"narration","text":"我说不上来。我只知道这两个字，不知道她是谁，也不知道她跟我是什么关系。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"那就先记着。写字比记忆便宜。"},{"type":"narration","text":"他说完把靠里那张床让给我，自己去睡靠门的那一张。那张床正对风口，冷得厉害。"},{"type":"narration","text":"我们把东西摊在桌上。两只箱子，一块裂了缝的碎片，一个保温桶，一台还在记数的终端。"},{"type":"narration","text":"这就是我们全部的资本。我原本以为会多一点的，可摊开以后桌子还空着一半。"},{"type":"choice","text":"","prompt":"桌上空着的那一半，谁也没去占。你怎么看它？","options":[{"text":"拿箱子把空位挡住","affectionWho":"","affection":0,"insomnia":1,"flag":"covered_the_empty_half","next":""},{"text":"就让它空着，记住它现在的样子","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_empty_half_visible","next":""}]},{"type":"narration","text":"空着的那一半谁也没去占。我们四个人都很清楚，桌子空一半不是好事，是等着被填。"},{"type":"choice","text":"","prompt":"四条规矩定了，可它们谁先谁后还没定。你说哪一条先办？","options":[{"text":"雷恩那条先办：先把收时间的人找出来","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"priority_find_collector","next":""},{"text":"艾莉丝那条先办：先把记录做厚","affectionWho":"艾莉丝","affection":8,"insomnia":0,"flag":"priority_build_record","next":""},{"text":"小雅那条先办：先查那个点单的声音","affectionWho":"小雅","affection":8,"insomnia":1,"flag":"priority_trace_the_voice","next":""}]},{"type":"narration","text":"我把顺序说出口的时候，三个人都没有反对，只是各自去做自己那一份——原来他们早就想好了要做什么，等我一句话而已。"},{"type":"narration","text":"第八天的下午过得很慢。箱子里拆出来的设备一样一样上了墙，床铺上铺了薄毯子，保温桶里的汤分成了四碗，最后一碗剩了一半。"},{"type":"narration","text":"分汤的时候小雅数了一遍人头，数出四个，然后很放心地把汤盖上。她数得比我快，也比我稳。"},{"type":"narration","text":"夜里十一点，终端亮了。艾莉丝把它转过来给我看。"},{"type":"choice","text":"","prompt":"明天早上五点四十，一条裂缝要张开。谁去？","options":[{"text":"三个都去，按雷恩说的","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"all_three_would_go","next":""},{"text":"只去两个，留一个看基地","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"left_one_on_watch","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"明天早上五点四十，旧商业街地下，一条裂缝会张开。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"影响半径六百米。按我们刚定的规矩，至少两个人到场。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"三个。"},{"type":"narration","text":"我躺在那张没铺床单的床上，闭着眼，听三个人的呼吸。我数了一遍，四个人。又数了一遍，怕自己数漏。"},{"type":"narration","text":"这两遍都是四个人，可我一点也不觉得踏实——我已经不信任自己的数了。"},{"type":"narration","text":"这一夜我还是没有睡着。但黑暗里有人在翻身，有人在轻轻磨牙，第一次，失眠不算一件完全孤独的事。"},{"type":"narration","text":"第八天结束了。明天我们要去封一条裂缝。"},{"type":"choice","text":"","prompt":"第八天结束了。你要不要给明天留一句话？","options":[{"text":"留一句：明天把人带回来","affectionWho":"","affection":0,"insomnia":1,"flag":"left_a_word_for_tomorrow","next":""},{"text":"不留。写下来的话会变成承诺","affectionWho":"","affection":0,"insomnia":0,"flag":"left_no_word_for_tomorrow","next":""}]},{"type":"narration","text":"我那时以为那是一次考试。后来才知道，那是交学费。"}]},"1-8":{"sceneId":"1-8","chapter":"第一幕·异变初现","title":"第一次胜利","background":"bg_ruins","bgm":"bgm_battle","next":"1-9","lines":[{"type":"narration","text":"第九天，三月二十号，凌晨四点五十。终端响的时候，我正躺在床上看天花板上的那道裂缝。"},{"type":"narration","text":"那道裂缝我看了三个小时，形状没有变过。这大概是这几天唯一一件稳定的事。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"五点四十。旧商业街地下一层，通风井正下方。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"影响半径六百米。这个范围里有大约两千个人还睡着。"},{"type":"narration","text":"两千个人睡着，不知道头顶上有一段时间正在被撕开。他们明天早上会照常上班，照常抱怨地铁挤。"},{"type":"narration","text":"那种照常，就是我们要保住的东西。"},{"type":"choice","text":"","prompt":"出发前，你想先攥住哪一样东西？","options":[{"text":"攥住整座城的照常","affectionWho":"","affection":0,"insomnia":0,"flag":"held_the_city_ordinary","next":"#l01"},{"text":"攥住跟着我的这几个人","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"held_the_team_first","next":""}]},{"type":"narration","text":"我把这句话在心里过了两遍。保住什么，说出来是一回事，站到井口底下又是另一回事。","label":"l01"},{"type":"narration","text":"窗外的天还是黑的。我把外套拉链拉到最上面，出门。"},{"type":"narration","text":"车是雷恩开来的，旧面包车，后座拆了一半，地板上焊着两个铁环。他说那是用来固定货物的。"},{"type":"narration","text":"车开出去十分钟我才发现，车上多了一个人。"},{"type":"narration","text":"最年轻的那个坐在靠窗的位置，穿一件不合身的工装外套，手里拎着一台比艾莉丝那台更旧的仪器。"},{"type":"choice","text":"","prompt":"那台仪器比艾莉丝的还旧。你要不要问一句？","options":[{"text":"问他那台机器是从哪儿来的","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_about_the_old_device","next":""},{"text":"不问。旧机器总有一个旧主人","affectionWho":"","affection":0,"insomnia":0,"flag":"guessed_the_old_owner","next":""}]},{"type":"narration","text":"雷恩说这是阿灰。守望者里年纪最小的，十九岁，跟着他跑了两年。"},{"type":"narration","text":"阿灰管雷恩叫「雷哥」。他说他第一次用碎片的时候把手整条弄丢了半天，后来找回来了，自此他每次出任务都带两副耳机。"},{"type":"narration","text":"他把多出来的那一副扔给我。他说，戴着，手不抖。"},{"type":"narration","text":"我没有推。我确实需要一点什么让我相信这一切不是我在失眠里编出来的。"},{"type":"choice","text":"","prompt":"多出来的那副耳机，你戴还是不戴？","options":[{"text":"戴上。我需要点东西压住手","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"wore_the_spare_earphones","next":""},{"text":"挂在脖子上，先不戴","affectionWho":"","affection":0,"insomnia":0,"flag":"hung_the_earphones_on_the_neck","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"耳机有用吗。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"没用。他知道没用。他还是带。"},{"type":"narration","text":"这就是他能做的事。十九岁能做的事不多，他挑了最便宜、也最像话的那一种。"},{"type":"narration","text":"小雅坐在我旁边，抱着她的保温桶。她今天没有笑，手指一直在桶身上打圈。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"那里面有很多人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"很多人是什么意思。"},{"type":"choice","text":"","prompt":"小雅听见的声音，要不要往下问？","options":[{"text":"追问：他们等的是一句什么话","affectionWho":"小雅","affection":5,"insomnia":0,"flag":"pressed_xya_about_the_sentence","next":""},{"text":"先不问，让她自己缓一缓","affectionWho":"小雅","affection":3,"insomnia":-1,"flag":"let_xya_keep_quiet","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"他们在等同一句话。跟昨天那个点单的声音一样，只是更多。"},{"type":"narration","text":"艾莉丝从前面回过头，看了小雅一眼，什么都没说，把她记了下来。"},{"type":"narration","text":"五点二十，我们到了旧商业街。地面入口是一个被铁板盖住的通风井，铁板上写着一行很旧的白漆字：禁止停车。"},{"type":"narration","text":"雷恩和阿灰两个人把铁板抬开。底下的空气涌上来，先是灰的味道，然后是那种空了很久的水的味道。"},{"type":"narration","text":"我们下去。地下通道比想象里宽，两侧的店面都封了卷帘，卷帘上贴着二一一几年的海报。"},{"type":"choice","text":"","prompt":"三个读数点刚立好。谁站缝口，你想过吗？","options":[{"text":"想过。那大概就是我","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"expected_to_stand_at_the_seam","next":""},{"text":"不想。先把仪器看明白","affectionWho":"","affection":0,"insomnia":0,"flag":"learned_the_instruments_first","next":""}]},{"type":"narration","text":"艾莉丝在通道中间立起三台仪器，摆成一个很窄的三角形。她把最后一台交给阿灰，让他抬着手别动。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我读数。林晓站在缝口，负责看清楚发生了什么。雷恩在三十米外拦人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"拦住谁。这个点没人会来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不一定。裂缝会把人吸进去，然后让人觉得他本来就在里面。"},{"type":"choice","text":"","prompt":"他说这个点不一定有人来。你信吗？","options":[{"text":"信。可我还是往缝口挪了半步","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"moved_closer_to_the_seam","next":""},{"text":"不信。裂缝会自己招人","affectionWho":"","affection":0,"insomnia":0,"flag":"expected_someone_to_come","next":"#l02"}]},{"type":"narration","text":"我把手插回兜里，摸到那副耳机。它还是硬的，凉的，像刚从外面拿进来。","label":"l02"},{"type":"narration","text":"通道更深处有什么在响，很轻，像一块铁皮被风翻了个面。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"五点三十九分，通道尽头的空气开始动。不是风吹的那种动，是那一整块空间在往后缩，像有人从里面拉一块布。","sfx":"sfx_crack"},{"type":"cg","background":"cg_crack_open","text":"裂缝张开的时候没有声音。它不是黑的，是空的——像一张照片被人用指头抠掉了一块，剩下的边缘还在发白。"},{"type":"choice","text":"","prompt":"缝口就在前面张开。你先看哪里？","options":[{"text":"看边缘上那个推自行车的人","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_the_cyclist_on_the_edge","next":""},{"text":"看缝里那片空。空的后头有东西","affectionWho":"","affection":0,"insomnia":0,"flag":"stared_past_the_emptiness","next":""}]},{"type":"narration","text":"边缘上有东西在动。是残影：一个人推着自行车走过去，走三步，回到起点，再走三步。"},{"type":"narration","text":"那段路他大概已经走了几十年。他自己不知道，因为对他来说，他刚出门。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"边缘在扩。三分四十秒之后会覆盖整个地下一层。"},{"type":"choice","text":"","prompt":"那个人还在走同一段路。你替他想点什么？","options":[{"text":"替他数一遍：三步，回到起点","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_his_three_steps","next":""},{"text":"别数。数下去自己就出不来了","affectionWho":"","affection":0,"insomnia":-1,"flag":"refused_to_count_the_steps","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"封它的方法只有一个：给裂缝一个锚点，把多出来的那段时间引到碎片里去。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"锚点是人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"是。站在缝口，把线接上。代价是身上少掉一段时间——或者别的部分。"},{"type":"narration","text":"她说「或者别的部分」的时候语速没有变。可她把终端往怀里收了一下，那个动作她做了两次。"},{"type":"choice","text":"","prompt":"「或者别的部分」。这句话要不要追下去？","options":[{"text":"追。要他先把代价说全","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"asked_for_the_full_price","next":""},{"text":"不追。有些代价说出来更重","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"left_the_price_unsaid","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我来。"},{"type":"narration","text":"他往前走。他走的时候把右手从口袋里拿出来，那截影子在袖子里晃了一下。"},{"type":"narration","text":"阿灰比他快。十九岁跑起来是真的快，他一脚跨过仪器，横在雷恩前面。"},{"type":"narration","text":"他说：雷哥，你右手已经没有了。他说的时候还在喘，说完自己先笑了一下，笑得很难看。"},{"type":"narration","text":"他说：我那次丢了半天就找回来了。半天而已。他说：你还有妹妹要找，我没有妹妹。"},{"type":"choice","text":"","prompt":"阿灰把话说到这个份上。你拦不拦？","options":[{"text":"喊他：你才十九岁，回去","affectionWho":"雷恩","affection":6,"insomnia":0,"flag":"tried_to_stop_ahui","next":"#l03"},{"text":"不出声。他比谁都清楚自己在做什么","affectionWho":"","affection":0,"insomnia":0,"flag":"let_ahui_choose","next":""}]},{"type":"narration","text":"我张了嘴，声音没出来。有一瞬间我甚至希望自己喊错了，希望他回头看我一眼。","label":"l03"},{"type":"narration","text":"他没回头。跑起来的人从来不回头。"},{"type":"narration","text":"我记得自己喊了。也可能我只是张了张嘴——这两种可能，我到今天也分不清。"},{"type":"narration","text":"雷恩伸手抓他。他的手穿过去了——和那天我抓雷恩的手时一模一样，只是这次穿过去的是他。"},{"type":"narration","text":"阿灰对林晓喊了一句：耳机你留着，我还有一副。"},{"type":"choice","text":"","prompt":"他冲你喊了那句话。你要不要回他？","options":[{"text":"回他：知道了，我留着","affectionWho":"","affection":0,"insomnia":0,"flag":"answered_ahui_about_the_earphones","next":""},{"text":"喊不出声。只把兜里的耳机攥紧","affectionWho":"","affection":0,"insomnia":0,"flag":"clenched_the_earphones_in_silence","next":""}]},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"然后他站到了缝口。他站得很直，两只脚并在一起，像在站岗。"},{"type":"narration","text":"艾莉丝开始读数。她的声音一开始很稳，念到第三个数字的时候快了半拍，第四个数字她念了两次。"},{"type":"narration","text":"通道里的空气往缝里走。海报一片一片从卷帘上飞起来，飞到一半就消失，没有灰，没有声音。"},{"type":"choice","text":"","prompt":"海报一片片往缝里走。你盯哪一样？","options":[{"text":"盯卷帘上那张二一一几年的海报","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_the_old_poster_go","next":""},{"text":"盯仪器上的读数","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"watched_the_readings","next":""}]},{"type":"narration","text":"我看见一条很细的线从阿灰的胸口被抽出来，抽进缝里。那条线很长，长得不像一个人的一辈子。"},{"type":"narration","text":"然后他整个人往里退了一步。不是走，是退——退得像有人把他在画面上按住，往回拖了一帧。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"裂缝合上了。合得很干净，通道尽头只剩一面水泥墙，墙上有一块被水泡过的印子。"},{"type":"choice","text":"","prompt":"缝合上了。你先做哪一件事？","options":[{"text":"先去看雷恩的脸","affectionWho":"雷恩","affection":6,"insomnia":1,"flag":"checked_on_raine_first","next":""},{"text":"先去看那面水泥墙","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_wall_first","next":""}]},{"type":"narration","text":"那股往回缩的感觉停了。空气重新变得有点凉，远处不知道哪里传来地铁的声音——五点钟的第一班。"},{"type":"narration","text":"城市没有出事。两千个人照旧睡在床上，等六点的闹钟。"},{"type":"narration","text":"通道里少了一个人。"},{"type":"narration","text":"雷恩站在仪器旁边，看着缝口。他看了很久，然后开口数了一个数。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"三。数不下去了。"},{"type":"choice","text":"","prompt":"他数到三就停了。你要不要接下去？","options":[{"text":"接下去，替他数完那几个人","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"finished_the_count_for_raine","next":""},{"text":"不接。数出来的东西不会变回来","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"left_the_count_unfinished","next":""}]},{"type":"narration","text":"我不知道他在数什么。我顺着他的眼睛看过去，那里什么都没有。"},{"type":"narration","text":"直到我看见他弯腰，捡起地上那台旧仪器。他把仪器擦干净，然后不知道往哪儿放。"},{"type":"narration","text":"那台仪器没有主人了。他手上多了一个东西，却没有一个人可以还。"},{"type":"narration","text":"我摸自己的兜。那副耳机在里面，硬的，凉的。" ,{"type":"narration","text":"她把四副手套收起来，一副也没用，叠好塞回包里。"},{"type":"choice","text":"","prompt":"四副手套，她一副都没用。你怎么想？","options":[{"text":"收好。总有一天要还给谁","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"kept_the_gloves_for_someone","next":""},{"text":"别留。留着就是替他们记","affectionWho":"","affection":0,"insomnia":1,"flag":"refused_to_keep_the_gloves","next":""}]},{"type":"narration","text":"我们往地面走。走到通风井底下的时候，艾莉丝的终端又亮了一次。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"封住的这条裂缝不见了。地图上又多了两个。"},{"type":"narration","text":"两个点，分布在这座城市的两头，相隔十一公里。它们不在裂缝上面，它们在同一个东西上面。"},{"type":"narration","text":"她把地图缩小，一直缩到整座城市变成一小块灰。然后她画了一条线，两个点都落在同一条线的方向上。"},{"type":"choice","text":"","prompt":"两个点落在同一条线上。你要不要先说出来？","options":[{"text":"说出来：方向没变，这是线索","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"said_the_line_out_loud","next":""},{"text":"不说。等他自己开口","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"waited_for_raine_to_speak","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"方向不变。我从两年前就在等它指出来。"},{"type":"narration","text":"我们从井口爬上去。天刚亮，旧商业街的卷帘门一家一家往上拉，卖早点的摊子支起来了。"},{"type":"narration","text":"有人在讨论今天的天气。有人抱怨昨晚睡得太沉。没有一个人知道，今天早上有人替他们封住了一条裂缝。"},{"type":"narration","text":"这就是第一次胜利的样子。没有欢呼，没有庆功，只有四个人从井口爬出来，其中一个还抱着没主的仪器。"},{"type":"choice","text":"","prompt":"这就是第一次胜利。你打算怎么记它？","options":[{"text":"记成胜利。至少今天没有人死","affectionWho":"","affection":0,"insomnia":0,"flag":"called_it_a_victory","next":""},{"text":"记成平账。赢一次，丢一个","affectionWho":"","affection":0,"insomnia":1,"flag":"called_it_a_balanced_ledger","next":""}]},{"type":"narration","text":"回基地的路上谁都没说话。第五天我没抓住一个人，第六天雷恩的右小臂在袖子里变淡了一截，第九天我们丢了一个人。"},{"type":"narration","text":"我算了算，我们赢的次数和丢掉的次数是一样的。这不叫胜利，这叫刚好没有输。"}],"dense":true},"1-9":{"sceneId":"1-9","chapter":"第一幕·异变初现","title":"出发","background":"bg_base_room","bgm":"bgm_mystery","next":"2-1","dense":true,"lines":[{"type":"narration","text":"第十天，三月二十一号。我在这张床上躺了三个小时，眼睛一次都没有闭上。"},{"type":"narration","text":"天花板上的裂缝形状还是没变。可今天我看着它，觉得它在往西边偏——这是错觉，我知
