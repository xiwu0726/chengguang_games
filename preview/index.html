rration","text":"念名字的是小雅。她站在开关旁边，捧着本子，手在抖。"},{"type":"narration","text":"艾莉丝和雷恩站在铁梯底下。四十七级，上去要三分钟，一分钟都不能多。"},{"type":"narration","text":"我的手按在开关上。手心里全是汗，铁柄被汗浸得发滑。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"上头开始叫了。他们说地基在往下沉。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"别听。你念你的。念完我把她拉上去。"},{"type":"narration","text":"小雅把本子抬高了一点，声音出来了。念被抹掉的人的名字，要用很平的声调。"},{"type":"narration","text":"她念得慢。每念一个名字之前先吸一口气，念完把气吐掉，再念下一个。"},{"type":"narration","text":"第七个名字念完，井壁上的土往下掉了一层，落在她的鞋面上。"},{"type":"narration","text":"那些名字我一路上都记着。念出来的时候，声音像是从别的地方来的。"},{"type":"narration","text":"我数着。她每念一个，我手底下的开关就轻一点。"},{"type":"narration","text":"名单里有一行是雷小满。念到那三个字的时候，雷恩的手往下压了一下铁梯。"},{"type":"narration","text":"他没有说话。他妹妹已经没了，只是被人从册子上划掉的那一种。"},{"type":"narration","text":"名单里也有苏禾。她在二一一零年坐图书馆四楼靠窗那张桌子，只留了一个名字下来。"},{"type":"narration","text":"小雅念第八个的时候看了我一眼，又低下去念第九个。"},{"type":"narration","text":"灯有节奏地亮了两下，又暗下去。井底最后剩下的是换气的声音。"},{"type":"narration","text":"这本子本来该由我来念。它是从我手里传出去的，一页一页都经过我的手。"},{"type":"narration","text":"剩下最后一个。她停下来，把本子往我这边推了两寸。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"最后一个你念。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"不。你念。我念了，你就得按这个。"},{"type":"narration","text":"她看了我三秒，把本子收回去，低头念了第十一个名字。"},{"type":"narration","text":"最后一个名字念完，那枚压平的钟停住了。井底连换气的声音都没有了。"},{"type":"narration","text":"她伸手去够开关。我先把她的手挡开了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"开关不认你。第一页是我念的。"},{"type":"narration","text":"她看着我，眼睛很亮。她没有再伸手，因为我说的是规矩。"},{"type":"narration","text":"然后门开始动。那扇门开在井壁那一面，铁做的，很高，边上有很深的合页。"},{"type":"narration","text":"门往里合，合得很慢。门缝里的光一点一点变细，变成一条线。"},{"type":"narration","text":"艾莉丝站在门外。她把手掌贴在铁门上，铁门也是凉的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我在上面等你。等到哪天你不在了，我把这一段写进档案。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"别写名字。写井底有一个人。"},{"type":"narration","text":"雷恩一直没说话。他把外套脱下来，从门缝里塞进来，搭在我膝盖上。"},{"type":"narration","text":"那件外套有一股旧街区花坛的味道。他大概在院子里坐了一整夜。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我下周还来。从四十七级下来，看看你还在不在。"},{"type":"narration","text":"门合到只剩一巴掌宽的时候，雷恩伸手把小雅拽了出去。她的鞋跟在铁门上磕了一下。"},{"type":"narration","text":"她抓着门框不肯松。我把本子从那条缝里递出去，塞进艾莉丝手里。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"你回来啊。"},{"type":"narration","text":"我没答。答了她会听出来，我的声音已经掉得接不上了。"},{"type":"narration","text":"门是我从里面推上的。锁舌落下去，声音顺着四十七级台阶往上走到尽头。"},{"type":"narration","text":"井底从此是暗的。钟停在我背后，开关在我手底下，铁柄是凉的。"},{"type":"narration","text":"我试着数日子。数到第三天就乱了，因为这里没有天亮。"},{"type":"narration","text":"我改数名字。十一个名字我一个字一个字数，数完从头再来一遍。"},{"type":"narration","text":"念到最后一个的时候会有回应，很小，像有人在很远的地方把书合上。"},{"type":"narration","text":"被删掉的人不会喊疼。这句话我听过很多次，现在轮到我自己验证。"},{"type":"narration","text":"真的不疼。留下来的那部分不疼，被拿走的那部分，连疼一起被拿走了。"},{"type":"narration","text":"上面的人照常过日子。图书馆四楼那扇窗每天六点亮一次，灯灭了我看得见。"},{"type":"narration","text":"小雅每周来一次，站在井口念两个名字。她念得很慢，跟那天一样。"},{"type":"narration","text":"雷恩把外套拿走了。他说留着没用，先拿回去洗，冬天再拿下来。"},{"type":"cg","background":"cg_ending_e10","text":"井底那一格只剩开关和那枚钟。铁门从里面合着，门上没有把手，门缝里什么也透不进来。"},{"type":"narration","text":"门是从里面合上的。这件事只有一个好处：谁也别想再来换我。"},{"type":"narration","text":"我把手按在开关上，等下一个把名字念完的人。"}],"kind":"ending"},"3-e11":{"sceneId":"3-e11","chapter":"第三幕·最终决战","title":"结局·雷小满","background":"cg_ending_e11","bgm":"bgm_sad","next":"","lines":[{"type":"narration","text":"四月十号凌晨四点，那枚钟走完了最后一格。我抱着本子站在门口。"},{"type":"narration","text":"门已经开在井壁上，是一道竖着的口子。按规矩，这一页送进去，我就跟着进去。"},{"type":"narration","text":"我往前迈了半步。雷恩从后面把我拽住了，拽的是衣领。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"等等。让我换。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"换什么。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"门收一个人。我进去，你出来。这一条我试过，这次能成。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你进去就没了。不是死，是从来没有过。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"我知道。我还有一样东西没换回来。你记着我就行。"},{"type":"narration","text":"他从口袋里掏出一支笔。笔帽上有一道刀痕，他在守望者那边用了很多年。"},{"type":"narration","text":"账上十一个名字。第九行是雷小满。他在那三个字旁边写下自己的名字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你要拿你换她。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我不是换。她本来就在上头。是有人把她划掉的，现在划回来。"},{"type":"narration","text":"他写字的时候左手压在纸上。手腕内侧那圈细线露在外面，露在灯底下。"},{"type":"narration","text":"我没有拦他。拦这件事我做不了，因为我也想让那三个字回到册子上。"},{"type":"narration","text":"这就是我们说好的交易：他把自己交出去，我把他妹妹接回来。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"纸上的字亮了一下，又暗下去。第九行雷小满那三个字慢慢变实。"},{"type":"narration","text":"我看见了雷恩的一段记忆，只有半秒：一个姑娘坐在台阶上，手里捏着一根化了一半的冰棍。"},{"type":"narration","text":"雷恩的手从我衣领上松开。他往门里走，走得一点声音都没有。"},{"type":"narration","text":"门合上的时候，井底所有的灰一起往下落了一层。"},{"type":"narration","text":"灰落完，开关前面没有人了。铁柄上还留着一只手的印子，印子慢慢淡掉。"},{"type":"narration","text":"我手腕内侧那圈细线是那天早上出来的。细得像用针划的，一圈，接得很齐。"},{"type":"narration","text":"我用袖子挡了两天。挡不住，就让它在那儿。"},{"type":"narration","text":"井封了。工程队灌的是水泥，水泥干透要三个月，他们等了三个月才拆围挡。"},{"type":"narration","text":"城里人过得快。四月底街上换了新灯箱，五月初咖啡馆把桌椅摆到了路边。"},{"type":"narration","text":"我手里的本子空了。最后那一页被门收走，剩下的都是空白纸，纸边发毛。"},{"type":"narration","text":"我在电车上坐了一整天。坐到终点站，再坐回来。我不知道该去找谁。"},{"type":"narration","text":"线索是艾莉丝给的。她在档案里翻到一页，上头有一个地址，和一个姓。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这个地址我去过。开门的是一个姑娘，姓雷，十几岁。她不认得我。"},{"type":"narration","text":"我按着地址过去了几次，前两次门都锁着。"},{"type":"narration","text":"第三次去，我坐在门口的台阶上，从中午坐到日头偏西。门开了。"},{"type":"narration","text":"出来的是个十几岁的姑娘。头发比她哥浅，个子比他矮一头。"},{"type":"narration","text":"她看见我，没有躲，也没有问我找谁。她只是看着我。"},{"type":"narration","text":"我说了一个名字。她听完摇头，摇头的时候手在裤子上擦了一下。"},{"type":"narration","text":"我再说一遍。她还是摇头。她不是听不懂，是真的没有这一段。"},{"type":"narration","text":"我从口袋里掏出笔和纸，写了几个字递过去：你认得吗。"},{"type":"narration","text":"她低头看了很久。然后用笔在下面写：这个我认得。别的我不记得了。"},{"type":"narration","text":"我又写：你哥呢。"},{"type":"narration","text":"这一次她写得很快，划得纸响：我没有哥。"},{"type":"narration","text":"我的胳膊一直垂在身侧。写到这一句的时候，我把左手抬起来，袖口往上一推。"},{"type":"narration","text":"那圈细线露出来了。天还没黑透，线在手腕上很淡，看得清是整整齐齐的一圈。"},{"type":"narration","text":"她盯着那圈线。盯着的时候，她的眼睛慢慢亮起来。"},{"type":"narration","text":"她伸手比了一下，隔着半拳的距离，没有碰到我的手腕。"},{"type":"narration","text":"她在纸上写：这个我认得。"},{"type":"narration","text":"写完她停了一会儿，笔尖悬在纸上，又加了一句：我不记得了。"},{"type":"narration","text":"我拿过笔，在纸上写了两个字，推给她。那两个字是雷恩。"},{"type":"narration","text":"她看着那两个字，看了很久，没有念出来。"},{"type":"narration","text":"她把纸对折，再对折，折成很小的一块，收进上衣里面那个口袋。"},{"type":"narration","text":"收好之后她就站着不动了。她眼睛看着街口，像在等人。"},{"type":"narration","text":"我往回走。走了十几步又回头，她还在台阶上。"},{"type":"narration","text":"我把那圈细线的事跟艾莉丝讲了。她听完没有记在本子上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这一段我不归档。整座城只有这一份，放在我抽屉里。"},{"type":"narration","text":"小雅后来跟我讲，那几天她听到的读书声变了。她说多了一个念得慢的。"},{"type":"cg","background":"cg_ending_e11","text":"五月的旧街区，台阶上放着一张折过很多次的纸，纸角被捏得起了毛。窗子里没有点灯。"},{"type":"narration","text":"妹妹从册子上回来了，哥哥没了。"},{"type":"narration","text":"她手腕上还差那一圈线。那件事她没有别人可以问。"},{"type":"narration","text":"门收了一个人。这一笔，谁也划不掉。"}],"kind":"ending"},"3-e12":{"sceneId":"3-e12","chapter":"第三幕·最终决战","title":"结局·账没有平","background":"cg_ending_e12","bgm":"bgm_sad","next":"","lines":[{"type":"narration","text":"门从里面合上的时候没有响声。像有人把一页纸对折，压在另一页上。"},{"type":"narration","text":"折过来那一下，我最后看见的是井口的灰、断掉的铁梯，还有小雅伸出来的手。"},{"type":"narration","text":"她手后面那一格没有亮。我按过它一次。它不认我，也不认她。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"十一个名字。我只念到第十个。"},{"type":"narration","text":"怀里那一页压着我的肋骨。它跟着我进来了，没有跟着她出去。"},{"type":"fx","fx":"shake","text":"黑里没有回音。我用指节敲门壁，等三秒，再敲一下。第二下只等到我自己的呼吸。"},{"type":"narration","text":"还有另一道呼吸。它离我很近，近得像贴着我的后颈。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你手里那一页，缺一个名字。"},{"type":"narration","text":"他的声音不来自任何一个方向。他原来贴在井壁上，现在贴在我进来的这一面。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你替我数过。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我数过所有人。你念错的那一个，我替你记着。"},{"type":"narration","text":"他没有说错在哪个字上。我等了一会儿，等他把话说完。他没有说完的习惯。"},{"type":"narration","text":"我把那一页摸出来。纸边被汗泡软了，摸上去像一块凉下来的布。"},{"type":"narration","text":"我从第一个念起。苏禾。阿灰。后面六个我念得很快。"},{"type":"narration","text":"阮宁的字最工整。陈只有半个字，剩下那半页被人裁掉了。"},{"type":"narration","text":"念到第十个，纸上还剩最后一行，七个字。没数完的人不算。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"十一个。这里只有十个。"},{"type":"narration","text":"第十一个不在纸上。第十一个在墙里等了四十年，只想有人把他的名字念对一次。"},{"type":"narration","text":"我不知道他的名字。本子在我手里的时候，那一行就是空的。"},{"type":"fx","fx":"wait","text":"我在黑里坐下来，把纸摊在膝盖上。膝盖是这里唯一的一张桌子。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那我先记着，你是第十一个。"},{"type":"narration","text":"墙里那道呼吸停了一下。停得很短，像一个人把到嘴边的话咽回去。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"编号不是名字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那就欠着。欠着总比抹掉好。"},{"type":"narration","text":"我用指甲在页脚刻那七个字。纸不认指甲，只留下一道白痕，一擦就平。"},{"type":"narration","text":"这一下我才明白，门里面没有笔。它连笔也收走了。"},{"type":"narration","background":"bg_black","bgm":"bgm_sad","text":"上面这些是我这边的。下面的这些我没有看见，它们是后来一点一点到我手边来的。"},{"type":"narration","background":"bg_dawn_city","bgm":"bgm_ambient","text":"那天早上井口上面，小雅手里是那本被撕掉最后一页的旧本子，艾莉丝手里是登记组的抄件，雷恩手里是半张退路图。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"第一页是苏禾。第二页是阿灰。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"最后一页在他手里。"},{"type":"narration","text":"她把本子合上，抱在胸前，像端平一碗水。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"是我没出去。开关不吃我手里这一本。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"不是你。"},{"type":"narration","text":"雷恩把半张图钉在基地的墙上，用铅笔在边上刻了一道。他没有解释那一道是什么意思。"},{"type":"narration","text":"他后来每天刻一道。刻到第七道，他把铅笔削了一次，刀口朝外放在桌上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"账不平。差一页，差一个名字，差一行字。"},{"type":"narration","text":"她把抄件按顺序排好，最下面空出一格，纸边对齐桌角。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"结案报告这一栏要填结果。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"填未平。"},{"type":"narration","text":"维拉的笔尖停了一下，还是写了。她写得很正，横平竖直，像抄一份不属于她的判决。"},{"type":"narration","background":"bg_library_day","bgm":"bgm_warm","text":"历史图书馆那口钟还在。钟体在，指针早没了。小雅跟馆里要了一张空白时间条，贴在钟摆停住的位置。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"我姓周。你要查哪一年。"},{"type":"narration","text":"他抽屉里那张核对表还是原来的，馆员编号 A-三一七。卡片上是他的名字，字是他自己的字。"},{"type":"narration","text":"他的名字在林晓那一页上，第七个。他不知道自己在那张纸上。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"周先生，你昨天记过一笔吗。"},{"type":"narration","text":"他翻了翻抽屉，说记过，把昨天那张过塑的表推给她。表上的日期是前天的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"那就记今天。今天我在。"},{"type":"narration","text":"她是唯一一个还会主动笑的人。她笑之前先把嘴角压一下，像怕声音惊动谁。"},{"type":"narration","background":"bg_library_night","bgm":"bgm_sad","text":"从五月起，小雅每个月把两半并排放在图书馆长桌上。左边是前面十页，右边是一块空白。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"页码对不上。前面十页，最后一页缺。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"对不上也对。我看着它，它就不算丢。"},{"type":"narration","text":"艾莉丝手腕上那只表还停在四月九号夜里一点四十。钟体一直在，指针早没了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你不修它吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不修。修了就等于把这一笔销掉。"},{"type":"narration","text":"她先说结论，隔两秒才把理由补上。那两秒是留给别人接话的。"},{"type":"narration","text":"小雅把本子放在柜台最里面的抽屉，不上锁。她说上了锁就像把它藏起来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我每天早上翻一页，翻到最后一页前面就停。"},{"type":"narration","text":"她翻得很慢。前面十页上有苏禾的字、阿灰的字、老周的编号，一页比一页新。"},{"type":"narration","background":"bg_base_room","bgm":"bgm_ambient","text":"雷恩回了一趟登记组，把雷小满三个字写在恢复名单第一栏，写完扣上笔帽，没有签自己的名字。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"半张图不够走到门口。"},{"type":"narration","text":"他把那半张退路图从墙上取下来，折成四折，塞进林晓留在基地的那只外套口袋。"},{"type":"narration","text":"口袋朝外翻着放。这样谁进来都看得见，那半张纸在等一个能把它补全的人。"},{"type":"narration","text":"小雅把图书馆的借阅记录也打印出来，夹在抄件后面。她说借出去的书要还。"},{"type":"narration","background":"bg_black","bgm":"bgm_silence","text":"门里面没有白天。我把十一个名字按本子上的顺序排，排完再数一遍，数到第十就停。"},{"type":"narration","text":"我念过倒序。倒着念的时候，第七个和第八个我记不清谁在前。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"账不平。差一个名字，差一行字。"},{"type":"narration","text":"墙里那道呼吸替我数。它数到十就换一口气，正好接上我停下的地方。"},{"type":"narration","text":"我们两个在黑暗里对着一页纸，一个念，一个喘。这本账就这样一天一天记下去。"},{"type":"narration","text":"我是学历史的。我做过的事是给旧书编目：册数、页码、缺损，一行一行填进卡片。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"黑里也有东西可编。一道呼吸，一口门，一页纸。"},{"type":"narration","text":"我给它们编号。第一号是门，第二号是纸，第三号是那道呼吸。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_amused","text":"你在把名字换成数字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我在给没有名字的东西留位置。"},{"type":"narration","text":"我给自己也编了一号。第四号是我。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你不在编号里。你在账上。"},{"type":"narration","text":"二十二年里我抄过的书目，比这一页上的名字多。现在我只背得出十行。"},{"type":"narration","text":"这一次他没有回我。井壁上那一层薄的东西贴着我的后背，凉得像一页没干的纸。"},{"type":"narration","text":"第二号纸上的字，我摸得比自己的脸还熟。可我一想到第十一个，指尖就停在页脚那块空白上。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"页脚够写一个名字。不够写两个。"},{"type":"fx","fx":"wait","text":"我把纸折起来，塞回怀里。折的时候我数了一下，还是那一页，没有多出一张。"},{"type":"narration","background":"bg_institute_night","bgm":"bgm_insomnia","text":"秋天，艾莉丝把研究所的名单重打一遍。打到第十一行，她把键盘放开，让那一行空着。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"缺的那一行不能由我补。"},{"type":"narration","text":"她补过太多次。补一次，门里就少一样东西。这条是她自己写在便签上的。"},{"type":"narration","text":"便签贴在显示器下沿，字很小：不要替他写。"},{"type":"narration","text":"维拉把结案报告的副本寄回研究所。收件人一栏写着十一个名字，第十一行空着。"},{"type":"narration","text":"老周开始在核对表背面写名字。他写的是别人的名字，一张写满就压进抽屉。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"馆里的规矩。丢了人的地方，表要多留一行。"},{"type":"narration","text":"小雅给那本旧本子做了一张借书卡。借阅人一栏她写：等林晓还。"},{"type":"narration","text":"艾莉丝把抄件编了号，第十一格用铅笔写待补。她每月看一次，看完把铅笔头削尖。"},{"type":"narration","background":"bg_corridor","bgm":"bgm_ambient","text":"雷恩把断掉的铁梯修了一节。修到井口那一格他停手了，因为那一格不亮。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"不亮就不修。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你多久没睡了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不数这个。数了也记不进账。"},{"type":"narration","background":"bg_rooftop","bgm":"bgm_ambient","text":"冬天，小雅上了天台，把两半的页码写在纸上压平，对着城里的灯一格一格比。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"林晓，我数到十了。第十一个我先替你留着。"},{"type":"narration","text":"风把纸吹走一角。她按住，按了很久，直到手指发白。"},{"type":"narration","text":"她没有喊。喊是嚎哭的事。她只是把纸折好，放回口袋，下楼。"},{"type":"cg","background":"cg_ending_e12","text":"四月九号夜里一点四十，那口没有指针的钟响了一下。外面三个人同时抬头。钟体没有动。"},{"type":"narration","text":"它没有响。是他们三个都听见了。"},{"type":"narration","text":"这本账后来没有人平掉它。前面十页在图书馆，最后一页在门里，两边都在数，两边都数不完。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你带进来的那一页，我读过。它不平。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我知道。所以我进来了。"},{"type":"narration","text":"钝的地方不流血。它只是每天在同一处，被同一页纸压一下。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"第十一个。等我念到你的时候，你别学他们，把自己缩成七个字。"},{"type":"narration","text":"墙里那道呼吸应了我一下。它没有名字，但它认得有人在等它。"},{"type":"narration","text":"我把那一页摊在膝盖上，从第一个念起。苏禾。阿灰。"},{"type":"narration","text":"念到第十个，我停住。停住的那一秒，外面那座城市正好走完一格。"},{"type":"narration","text":"账没有平。我把纸压在胸口，等第十一个自己走进来。"}],"kind":"ending"},"3-e13":{"sceneId":"3-e13","chapter":"第三幕·最终决战","title":"结局·门留着一条缝","background":"cg_ending_e13","bgm":"bgm_mystery","next":"","lines":[{"type":"narration","text":"四月十号凌晨五点，我做了一件在这个月里最像我的事：我没有把那一页交出去。"},{"type":"narration","text":"我把它折起来，折成一个手掌那么大，塞进外套内袋。内袋里那半张退路图隔着纸碰了碰我的胸口。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你把那一页折起来做什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我在给这本书留一个字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"门要一整页。你少交一个字，它就不算收下。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那就让它差一个字。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"差一个字，这道口子就关不上。关不上它会一直留在这儿。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"一直留在这儿，总比一直少一个人好。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你把纸带走，那十一个名字就还留在这里。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"留在这里也好。留在这里就还有人来念。"},{"type":"narration","text":"我把手从口子边上收回来。那道口子没有合，它收窄了一半，剩下一条竖着的缝。"},{"type":"narration","text":"缝里出来的是纸背面的颜色，很淡，像阴天里的一层亮。"},{"type":"fx","fx":"flash","text":"井底亮了一下。那口钟停在最后一格上，指针斜着，像一步没有走完。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"它要的是一整页，你给的是半个答案。它会一直等。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那就让它等。它四十年都等过，不差这几年。"},{"type":"narration","text":"我们四个人从铁梯上走出去的时候，天正在亮。那道缝跟在我们背后，一直亮到楼里。"},{"type":"narration","text":"四月十号的老城区跟平时没有两样：洒水车刚过去，修路的人蹲在井盖边上抽烟。","background":"bg_dawn_city","bgm":"bgm_ambient"},{"type":"narration","text":"他们不知道这栋楼里留着一条缝。这条缝只有我们四个人看得见，就是我们四个也看得不太清。"},{"type":"narration","text":"四月十一号研究所把这件事结了。结案文件上写的是设备故障引起的区域停电，附了九页数据。","background":"bg_institute_day","bgm":"bgm_ambient"},{"type":"narration","text":"艾莉丝在数据里把我们四个人的名字删掉了。她做这件事没有跟我商量，事后也没有解释。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你在数据里把我们划掉了。"},{"type":"narration","text":"那天下午我在走廊上把那九页数据从头看到尾。第九页最后一行是空的，空行下面连页脚都没有。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你连页脚都留出来了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"留出来了。以后要是有人想把名字写回去，总得有个地方写。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"删掉的是名字，不是人。这两样东西从三月起就不一样了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"那从今天起，我们四个在纸上是没有的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"在纸上是没有的。在路上是四个。"},{"type":"narration","text":"从五月开始，这条街上每个月都会有人丢一次东西。","background":"bg_street_night","bgm":"bgm_mystery"},{"type":"narration","text":"五月是图书馆的一本书少了一页。那本书是我经手的，第七十页和第七十一页之间空了一段。"},{"type":"narration","text":"隔了一天那一段回来了。回来的纸比原来的白一点，白到像刚印出来的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你不是第一次丢东西了吧。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"我不是。可这一次丢的不是我的东西，是这本馆里的东西。"},{"type":"narration","text":"六月是小雅的手套。她把手套搁在冰柜上面，第二天找不到了，第三天在冷冻格里找到，硬得像两块木板。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我上个月还丢过一次钥匙。钥匙是在面粉袋里找到的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"不过我们这儿丢了东西都会回来。回来的时候一件都不少。"},{"type":"narration","text":"七月是艾莉丝的键盘。那个键盘少了一个键帽，少了三天，第四天自己回到了原来的位置上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"这不是巧合。这是有人在替这条街补漏洞，补得不太规整。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你是说门里面的东西在往外漏。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"漏出来的不是东西，是顺序。顺序错了，东西就会先不见一下，再回来。"},{"type":"narration","text":"八月我在车站看见一个中年人。他在自动售票机前面站了半天，然后问旁边的人今天几号。"},{"type":"narration","text":"旁边的人告诉了他日子。他说了一句自己少了十几分钟，说完就笑了。"},{"type":"narration","text":"那个笑我很熟。三月十五号那天，咖啡馆里所有人也是那样笑的。"},{"type":"narration","text":"我在站台边上站了一会儿，把那个人的样子记下来：灰外套，手里拎一个纸袋，袋边有一道折痕。"},{"type":"narration","text":"我掏出手机想拍一张，屏幕上什么也没有。我收起手机，用手在空气里比了一下他的高度。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你在记他。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我在记一个少了十几分钟的人。这条街以后会有很多这样的人。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那我们就一个一个记下来。记下来他们就不会全丢。"},{"type":"narration","text":"那天晚上我在本子上新开了一页，写上八月、车站、十七分钟这几个字。写的时候比别的字慢。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你也看见了。他丢的是时间，不是钱包。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"丢的人自己不当回事，旁边的人也不当回事。这是这条街现在最坏的地方。"},{"type":"narration","text":"我的失眠没有退。九月再测，比七月又高了一截。","background":"bg_institute_night","bgm":"bgm_insomnia"},{"type":"narration","text":"到了这个数的人不能一个人住。艾莉丝给我在研究所的观察室留了一张床，我一星期去住两晚。"},{"type":"narration","text":"观察室的天花板是白的，白的上面有几道很浅的裂纹。我躺着的时候会数那些裂纹，数到第九十九就从头数。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"这个数一到，你就会开始把借来的记忆当成自己的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那我怎么分辨哪一段是我自己的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"分辨不了。你现在确定不了我这句话是不是你自己想出来的。"},{"type":"narration","text":"她说得很平。她说这种话从来不加安慰，这一个月我习惯了。"},{"type":"narration","text":"十月的一天夜里，我梦见自己在图书馆数书。醒来的时候手里是空的，可我记得每一本的编号。"},{"type":"narration","text":"我把那几个编号写下来，第二天去查。那几本书都在架上，只有一本是别人还的，还书日期写着二一一〇年。"},{"type":"narration","text":"我把那一行圈起来，圈得很轻。圈完在旁边写了三个字：还开着。"},{"type":"narration","text":"那一夜我没有睡。我把窗帘拉开一点，让路灯的光落在床脚上，然后用手指在被面上数格子。"},{"type":"narration","text":"数到第五十格的时候我想起艾莉丝说的话：到了这个数的人分不清借来的记忆。"},{"type":"narration","text":"我坐起来，把本子翻到三月十二号那一页。那一页的字是我写的，墨色比后面几页深。"},{"type":"narration","text":"我盯着它看了很久，看到自己都说不清那一页是不是我写的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"你昨晚又没睡。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"睡了两个钟头。我数了三百多格，数完就知道自己没睡。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"下一次数不动了就别数。数东西是把清醒摊薄，摊薄了你会更信自己编的东西。"},{"type":"narration","text":"我把她这句话写在本子的边上。写完发现我写的位置紧挨着三月十三号那条记录。"},{"type":"narration","text":"老城区那片围档十月拆了，十一月又围起来，十二月再拆一次。市政说这块地的手续有问题。","background":"bg_ruins","bgm":"bgm_mystery"},{"type":"narration","text":"我每个月去一次。那栋楼拆掉以后，那条缝留在一堵新修的水泥墙上，只有一个人肩膀那么宽。"},{"type":"narration","text":"我站在缝前面的时候，缝里的光会亮一点，像我走近了它就认得我。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"你每次去，都在那儿站多久。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"十分钟。超过十分钟我就开始想把手伸进去。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"你伸进去过一次。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"三月十六号。那天我从一条裂缝里碰过一个人的手。"},{"type":"narration","text":"雷恩听完没有劝我。他这个人从来不劝人，他只是在旁边站着，站到我说走。"},{"type":"narration","text":"他知道那道缝还在。他是唯一一个从来不问我为什么不去把它关上的人。"},{"type":"narration","text":"冬天的时候小雅在咖啡馆后面贴了一张日历。她在每个月的那一格上画一个小圈。","background":"bg_cafe_evening","bgm":"bgm_warm"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"画圈的是丢东西的月份。你看，一个月都没漏。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"画这样一张日历到底有什么用。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"有用。要是哪个月没画圈，就说明那条缝自己合上了。"},{"type":"narration","text":"我看了那张日历很久。四月那一格她没有画圈，因为四月丢的东西太多，画不下。"},{"type":"narration","text":"一月、二月、三月她画得很整齐，一行三个，像登记簿上的借还记录。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"她这张日历比我的记录本准。我的本上只有数据，没有圈。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那你就照她的抄一份。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我抄过了。抄的时候我发现四月那一格怎么都抄不满。"},{"type":"narration","text":"十二月的最后一天，我一个人去了那堵水泥墙。墙根下积着雪，雪上有两行脚印，不是我的。"},{"type":"narration","text":"我沿着脚印走到缝前面，看见墙根下压着一张小纸，折成四折，边上被雪水泡软了。"},{"type":"narration","text":"我把纸捡起来展开。纸上只有一个字，写得很用力，笔尖把纸划破了指甲大的一小块。"},{"type":"narration","text":"那个字我不认得，可它看起来像一个人的名字被截掉了一半。"},{"type":"narration","text":"我把纸重新折好，压回原来的地方，用一小块石头压住。我没有把它带走。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"你刚才为什么不把那张纸带走。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"因为那不是给我的。写这张纸的人还会回来拿。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"你怎么知道他还会回来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"我不知道。我只是不想让这条街上多一样丢的东西。"},{"type":"narration","text":"我沿着脚印看过去，脚印在缝前面停住，停了大概十分钟的长度，然后原路退了回去。"},{"type":"narration","text":"我没有等那个人。我在缝前面站了十分钟，站到脚冷，然后原路退回去。"},{"type":"cg","background":"cg_ending_e13","text":"缝还在。它一直差一个字，我也一直没把那个字补上。"},{"type":"narration","text":"我今年二十二岁，过了年二十三岁，失眠值还在那个高度，口袋里那一页纸还没有交出去。"},{"type":"narration","text":"有时候我觉得这样也不坏：城市活着，人少了一点点，门没有关。"},{"type":"narration","text":"有时候我夜里醒着，会替别人说一句话。那句话是谁的我不管，反正它说得比我准。"}],"kind":"ending"},"3-e14":{"sceneId":"3-e14","chapter":"第三幕·最终决战","title":"结局·那页纸还在口袋里","background":"cg_ending_e14","bgm":"bgm_ambient","next":"","lines":[{"type":"narration","text":"门留了一条缝。缝的宽度我用一根火柴试过，第一次是火柴头的厚度，第三次还是。"},{"type":"narration","text":"那天我把没有写完的一页折起来，塞进外套左边的内袋。折的时候我数了折痕，四折。"},{"type":"narration","text":"四折以后，纸正好卡在内袋的角上，走路的时候它顶我的肋骨。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你带走了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"我带走了。"},{"type":"narration","text":"她没有说别的。她把那本旧本子往怀里抱了抱，先我一步上了铁梯。"},{"type":"narration","text":"上面这些是当天。后面这些是之后的一个月，还有再之后的那些月。"},{"type":"narration","background":"bg_dorm_night","bgm":"bgm_insomnia","text":"第一个星期，我换了三次衣服。换衣服的时候右手先伸进口袋，摸到纸角才敢走。"},{"type":"narration","text":"第二次我忘摸，走到楼梯口又回来。第三次不是忘，是我故意不摸，想看会不会出事。"},{"type":"narration","text":"没有出事。城市照常亮灯，照常有人迟到。出事的是我，我一整天把手插在那个角上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"它在你口袋里，不在你手上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"先说结论：不要扔。理由在后面，很长。"},{"type":"narration","text":"她真的给了理由。她说门差一个字，纸就少一张；纸少一张，缝就宽一分。这两样她都量过。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我没打算扔。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你打算读它。"},{"type":"narration","text":"我没有回答。回答这个要先承认，我每天晚上把它摊在桌上，摊平了，又不敢翻开读。"},{"type":"narration","text":"折起来的时候朝内的是页脚。页脚那一小块空白，够写一个名字。"},{"type":"narration","text":"我背得出纸上的字。十一个名字，我念到第十个。最后一行七个字，没数完的人不算。"},{"type":"narration","text":"背得出和读是两件事。读要把它打开。打开它，我就得看那块空白。"},{"type":"fx","fx":"wait","text":"我把纸折好，压回内袋。压回去的那一下，纸角顶在原来的位置上。"},{"type":"narration","text":"第二个星期，我开始穿没有口袋的衣服。"},{"type":"narration","text":"我把外套内袋的口子缝死了。缝得很丑，针脚一半在里面一半在外面。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你缝它干嘛。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"省得它掉出来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"它掉不出来。你昨天掏了四次。"},{"type":"narration","text":"她笑之前先压一下嘴角。她是我们里面唯一还会主动笑的人，她笑的时候眼睛不看人，看我的手。"},{"type":"narration","text":"她说得对。我掏了四次。四次都是同一个动作：手指进去，碰到纸角，出来。"},{"type":"narration","text":"第三次我把它带出来了。带出来以后我放在桌上，用一本旧书压住，去洗了脸。"},{"type":"narration","text":"回来的时候书还压着它。我坐在椅子上看了那本书的书脊很久，没有翻开。"},{"type":"narration","text":"我离读它最近的一次，是把它摊到一半。"},{"type":"narration","text":"镇纸压住左边，我用右手把右边抬起两厘米，看了三秒，放回去，折好。"},{"type":"narration","text":"那三秒里我只看清一件事：页脚那块空白，比我在井底时以为的小。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我不问里面写了什么。"},{"type":"narration","text":"她说完这句才补理由。她说问了就等于替我读，替我读就要替我负责那块空白。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"给你。"},{"type":"narration","text":"雷恩递给我一个信封，牛皮纸，没有贴邮票。他只在桌上把它推到我手边，然后走了。"},{"type":"narration","text":"信封是空的。他把空信封推给我，意思是：你可以装，装完可以寄。寄到哪里他没说。"},{"type":"narration","text":"我把纸放进去过。放进去以后我又倒出来。倒出来以后我把它放回内袋。"},{"type":"narration","text":"那个空信封我留在桌上，开口朝上，放了三个月。"},{"type":"narration","text":"我试过把它放在别处。放在抽屉里，我一晚上起来三次。锁进柜子里，第二天一早就取回来。"},{"type":"narration","text":"取回来的路上我把它摊在膝盖上，手掌压着，像压一只不肯睡的鸟。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你口袋里的东西比你的伞还重要。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"伞丢了可以再买。"},{"type":"narration","text":"她没有接这句。她把伞挂在我门后的钩子上，挂得很正，伞尖朝下。"},{"type":"narration","background":"bg_street_night","bgm":"bgm_ambient","text":"第三个星期，我试过一次把它交给别人。"},{"type":"narration","text":"我在面馆把纸掏出来，摊在桌上，对面坐着雷恩。他抬头看了一眼，低下头继续吃。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"我的那半张在你基地的口袋里。"},{"type":"narration","text":"他那半张退路图给过我。给的方式是压在我的杯子底下，压完把碗推开，走了。"},{"type":"narration","text":"我那天没有把我的纸给他。我只是把它折回四折，压回内袋。"},{"type":"narration","text":"折到第四折的时候，纸的折痕起毛了。起毛的地方正好在第七个名字上。"},{"type":"fx","fx":"flash","text":"起毛的那一秒，我指腹下面凹进去一点，像有人在那三个字上写过，又擦掉。"},{"type":"narration","text":"我把手指抬起来。毛边还在，字还在，第七个名字下面多了一道我认不出的笔迹。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"这是谁写的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"不是我。"},{"type":"narration","text":"他把账结了，出门，在门口站了一会儿等我。他等的时候背对着街。"},{"type":"narration","background":"bg_library_day","bgm":"bgm_warm","text":"第四个星期，我把它扔过一次。"},{"type":"narration","text":"我把它塞进图书馆门口的过期报刊筐。放进去以后我上了二楼，从栏杆往下看。"},{"type":"narration","text":"筐里有一叠旧报纸、两个破纸袋，和一张四折的纸。我看了它十分钟。"},{"type":"narration","text":"十分钟以后我下去，把它从筐里拿出来，抖了抖灰，放回内袋。"},{"type":"narration","text":"这不是奇迹。是我自己走下去拿的。我把这件事记成它回来了，这样我好过一点。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你回来了，纸也回来了。两件事是同一个人做的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我知道。纸和我，是同一天回来的。"},{"type":"narration","text":"她知道我知道。她把这句话写进便签，贴在记录本封皮内侧，没有给我看。"},{"type":"narration","text":"第五个星期起，我每月去一次井边。"},{"type":"narration","text":"缝还是那么宽。我蹲下来，把火柴伸进去，火柴头过去一半，卡住。"},{"type":"narration","text":"我不敢往里看。往里看要低头，低头要把手撑在井沿上，撑在井沿上就像要下去。"},{"type":"narration","text":"我每次只做一件事：把火柴收回来，放进口袋，站起来，走。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"下次我跟你去。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你去数格子。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"好。我数到十，你数到十一。"},{"type":"narration","text":"她答应得很快。快得像怕我改口。"},{"type":"narration","text":"那页纸上的第十一个名字，我们两个都没有写。页脚那块空白，我们两个都看过。"},{"type":"narration","background":"bg_institute_night","bgm":"bgm_mystery","text":"后来我学会了一些事。"},{"type":"narration","text":"我知道纸在左边内袋的时候，我走路会稍微往右偏。偏得很小，只有我自己觉出来。"},{"type":"narration","text":"我知道不敢读它的理由不是怕它。是我一读，就得决定写谁。"},{"type":"narration","text":"写谁都不对。写苏禾，阿灰在后面排队。写雷小满，雷恩会把它拿走。写我自己，小雅那句话就成立了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你的名字一落到那一页上，就没人再从外面叫你。"},{"type":"narration","text":"她把这句话说过一次，说完就去扶铁梯。她没有看我。"},{"type":"narration","text":"我把纸折起来带走的那天，她站在最外面，背对着井。她一直背对着井。"},{"type":"fx","fx":"insomnia","text":"那一个月我睡得很少。醒着的时候，口袋那个角顶我的地方一直是热的。"},{"type":"narration","background":"bg_rooftop","bgm":"bgm_ambient","text":"半年后，我买了一件新外套。新外套没有内袋。"},{"type":"narration","text":"我穿着它走了三天。第三天我把它挂回柜子，把旧外套的内袋剪下来，缝在新外套里面。"},{"type":"narration","text":"缝完我穿上，走了两步，纸角顶在肋骨原来的位置。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"你把它做成了身体的一部分。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"它是我没写完的那部分。"},{"type":"narration","text":"她先点了头，才说下一句。她说她不再劝我扔，也不再劝我读。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"结论：留着。理由：门差一个字，你差一页。两边都差，才叫没关。"},{"type":"narration","background":"bg_dawn_city","bgm":"bgm_hope","text":"现在。此刻。"},{"type":"narration","text":"城市照常亮灯。图书馆那口钟还在，钟体在，指针早没了。"},{"type":"narration","text":"艾莉丝手腕上那只表停在四月九号夜里一点四十。她没有修。她说修了就等于替谁把账平了。"},{"type":"narration","text":"雷恩的半张退路图钉在基地墙上，边上刻着一排正字。他不解释那些道。"},{"type":"narration","text":"小雅每天早上翻本子，翻到最后一页前面停住。她说停住的那一页是留给我的。"},{"type":"narration","text":"我梦见自己把它读完了。醒过来第一件事是摸口袋。口袋在，纸在，梦里的字一个也想不起。"},{"type":"narration","text":"枕头是湿的。不是哭湿的。是我把脸压在上面的时间太长了。"},{"type":"cg","background":"cg_ending_e14","text":"我站在图书馆门口，右手插在内袋的角上。口袋里有四折的纸，纸上有十个名字和一块空白。"},{"type":"narration","text":"我没有把它拿出来。今天也没有。"},{"type":"narration","text":"门留一条缝。缝的形状，和一张四折的纸一样大。"},{"type":"narration","text":"我知道把它塞进去，缝就合了。我也知道合了以后，那块空白就永远空在里面。"},{"type":"narration","text":"所以我口袋里有一页纸，门那里有一条缝。它们两个是同一件事的两半。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我不读你。你也别想出去。"},{"type":"narration","text":"我说的是口袋里的纸。也可能是门。那天晚上我分不清。"},{"type":"narration","text":"那十个名字没有走。它们在我口袋里排着队，一个也没有走出去，一个也没有进来。"},{"type":"narration","text":"那页纸还在口袋里。折痕起毛了，第七个名字那一道最毛。"},{"type":"narration","text":"我每天晚上把它压平，早上把它折好。一天一次，做了两年。"},{"type":"narration","text":"它没有变薄，也没有变厚。它只是在我的口袋里，占着一个位置。"},{"type":"narration","text":"门那里还有一条缝。缝里什么都没有，风从里面出来，是凉的。"},{"type":"narration","text":"我不敢读它。我也扔不掉它。这两句是同一句。"}],"kind":"ending"},"3-e15":{"sceneId":"3-e15","chapter":"第三幕·最终决战","title":"结局·每个月丢一件东西","background":"cg_ending_e15","bgm":"bgm_insomnia","next":"","lines":[{"type":"narration","text":"门留了一条缝。缝里塞着一张四折的纸，一半在里面，一半在外面。"},{"type":"narration","text":"我把它塞进去的那天，手指在里面停了半秒。纸没有往里走，也没有往外走。"},{"type":"narration","text":"从那天起，缝就是这个宽度。它合不上，也开不到能让人过去的程度。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"结论：门没有关。理由：它缺的那一页在缝里，不在里面。"},{"type":"narration","text":"她先说结论，停两秒才给理由。那两秒是留给别人接话的，我接了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那我就不用再带着它了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你要带着别的东西。"},{"type":"narration","text":"她说的是这座城。说这话时她没有看我，看的是记录本上那一行空着的行号。"},{"type":"narration","background":"bg_dorm_night","bgm":"bgm_insomnia","text":"从那天开始，我睡得很短。短到什么程度我不写数字，我只写我看见了什么。"},{"type":"narration","text":"凌晨三点以后闭眼，就会看见别人的记忆。第一次我以为是自己的。"},{"type":"fx","fx":"flash","text":"一个女人在登记组窗口前填表，笔尖抖，把姓写成两笔。我闻到她桌上的墨水味。"},{"type":"narration","text":"我睁开眼。天花板是观察室的天花板，裂纹在左边第二条。"},{"type":"narration","text":"我把这件事写下来。写的时候我发现，我把「我闻到了」写成了「她闻到了」。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"串味了。"},{"type":"narration","text":"串味是这个月第三次。句子还是句子，主语不是我的主语。"},{"type":"narration","background":"bg_base_room","bgm":"bgm_ambient","text":"艾莉丝给我一张表，只有两栏。左边写「看见的」，右边写「发生的」。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"分不清就都写。写满一栏再补。"},{"type":"narration","text":"表贴在床头。第一周左边九条，右边两条。第二周左边十七条，右边三条。"},{"type":"narration","text":"右边那三条是：面馆开门、图书馆停电、小雅把日历挂上墙。"},{"type":"narration","text":"走廊的灯有十四盏，第十五盏坏了三个月。我数到十四就翻身，数到十五说明我又坐起来了。"},{"type":"narration","background":"bg_corridor","bgm":"bgm_ambient","text":"雷恩把观察室的床搬到有窗的位置。搬完他没有说话，把窗钩扣上，扣的是能推开的那一档。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你把它挪开了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"是我挪的。它放在你手边碍事。"},{"type":"narration","background":"bg_library_day","bgm":"bgm_warm","text":"小雅在图书馆门口贴了一张日历。日历上每个月画一个圈，圈里写这个月丢了什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"一月，天桥少一根栏杆。"},{"type":"narration","text":"第二天栏杆回来了。回来的是两根。多出来的那根没人认领，老周给它编了号。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"两根都留着吗。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"留着。丢过东西的地方不该只缺一根。"},{"type":"narration","text":"他说这话时正在给一张卡片补数字。他的馆员编号是 A-三一七，那天下班前变成了 A-三一。"},{"type":"narration","text":"他没有发现。发现的是小雅。她把那张卡片翻过来又翻回去，翻了三次。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"周先生，你的七呢。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"七在我这儿。我记着就行。"},{"type":"narration","text":"他把那张卡片放进抽屉最里面，压在过塑的核对表下面，抽屉就没有再开过。"},{"type":"narration","background":"bg_street_night","bgm":"bgm_ambient","text":"二月，面馆招牌少了一个字。少的是「回」。"},{"type":"narration","text":"招牌变成「面馆」两个字。老板骂了一句，第二天「回」自己回来了，位置偏了半厘米。"},{"type":"narration","text":"那半厘米我一直记着。它比原来好看。"},{"type":"fx","fx":"insomnia","text":"那几天我几乎没睡。眼睛已经变色了。小雅给我排了班。"},{"type":"narration","text":"班表写在她的小本子上：上午十点睡两小时，下午六点睡一小时，其余不许闭眼超过二十分钟。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我喊你。我喊你就醒。"},{"type":"narration","text":"她喊的方式是敲三下，停一下，再敲两下。她说这个节奏我认得。"},{"type":"narration","text":"我认得。那是盖章的节奏。她只听我说过一次，就记了一年。"},{"type":"narration","background":"bg_institute_day","bgm":"bgm_mystery","text":"三月，图书馆门口那棵树的影子少了一半。"},{"type":"narration","text":"影子少的那一半正好盖在台阶上。台阶那天晒得比平时烫。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"影子也能丢。丢的是光的角度。"},{"type":"narration","text":"她把这件事写在右边那一栏。那一栏第一次写满。"},{"type":"narration","text":"四月，艾莉丝的记录本少了一行。行号还在，字没了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"那一行是我自己写的。我不记得我写过。"},{"type":"narration","text":"她先说结论，说完停了两秒才补后半句。那两秒比前半句长。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"补一行。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"补了就不是那一行。"},{"type":"narration","text":"她把本子合上，压在显示器下面，让那一页摊着。她说摊着它自己会回来。"},{"type":"narration","background":"bg_cafe_evening","bgm":"bgm_sad","text":"五月，小雅丢了笑的声音。"},{"type":"narration","text":"她还会笑。嘴角先压一下，然后抬起来。抬起来的时候没有声音。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"没事。我记得它长什么样。"},{"type":"narration","text":"她把这件事写进日历的圈里，字很小，写在「手套」那一格下面。"},{"type":"narration","text":"六月，城里的雨少了一场。天气预报说那天有雨，地上是干的。"},{"type":"narration","text":"干的那天我去了井边。缝里那张纸的一角被人摸过，毛边朝外。"},{"type":"narration","text":"我没有把它抽出来，也不敢把它按进去。我只把毛边朝内折了一下。"},{"type":"fx","fx":"wait","text":"折完我在井沿坐了一会儿。坐到我能确定，自己不是坐在别人的记忆里。"},{"type":"narration","background":"bg_ruins","bgm":"bgm_ambient","text":"七月，末班车少了半站。车还是那辆车，报站少了一个名字。"},{"type":"narration","text":"少了的那个站台上还立着牌子。牌子底下坐着一个人，每天坐到没有车来。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"上车。"},{"type":"narration","text":"雷恩把他拉起来了。拉起后他没有解释，把车门关上，自己站在门口一路。"},{"type":"narration","text":"八月，雷恩手上的烙印少了一道。"},{"type":"narration","text":"少的那道在虎口。他用拇指去摸，摸了三次，第四次把手放下来，去看窗外。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"还剩三道。够。"},{"type":"narration","text":"他说够的时候没有回头。他把袖子放下来，扣好，把小满那半张纸压进工具箱。"},{"type":"narration","background":"bg_library_night","bgm":"bgm_silence","text":"九月，老周的编号少了一个数字。这一条我写在左边那一栏。"},{"type":"narration","text":"因为我不确定我看见的是编号，还是我看见的是他自己在数自己。"},{"type":"narration","text":"那天夜里我在观察室醒过来，嘴里有一个名字，不是我的，也不是这里任何人的。"},{"type":"narration","text":"我把它写在纸角上。第二天早上那个名字不见了，纸角是干净的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你写过的纸不要折。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我折了。折四折。"},{"type":"narration","text":"她看了我很久。她看的是我的口袋。我的口袋是空的。"},{"type":"narration","background":"bg_dawn_city","bgm":"bgm_ambient","text":"十月，那口钟的钟体少了一圈刻度。"},{"type":"narration","text":"钟体还在，指针早没了。刻度少了一圈，剩下的那些排得比原来密。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"它是不是在往里收。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"它在往里收。收完就没了。"},{"type":"narration","text":"她说完这两句，回去把一张空白表贴在钟柜上，每天记一格。"},{"type":"narration","background":"bg_dorm_night","bgm":"bgm_insomnia","text":"十一月，我丢了一个梦。"},{"type":"narration","text":"我记得它的形状：一条楼梯，楼梯下面有水声，水声里有人叫我。"},{"type":"narration","text":"我不记得他叫我什么。我把形状画下来，画到第三遍，连楼梯也不见了。"},{"type":"fx","fx":"timeline","text":"那晚句子又串了。我把「我叫林晓」写成「我叫」，中间空了两格。"},{"type":"narration","text":"空的两格我用指甲划了一道。划完把它贴在表下面，让左边那一栏压着它。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你眼睛的颜色不对。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"嗯。我今天看见了三条不是我的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那就三条都写。写完我念给你听。"},{"type":"narration","text":"她真的念。她把本子举得很高，声音是哑的，笑没有声音。"},{"type":"narration","text":"她每月替我在圈里写一个字。写到第十二个圈，她开始写两件。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"两件也记得住。我念，你听着。"},{"type":"narration","text":"我把班表贴在她那张日历旁边。两张纸的边对齐，用同一条胶带。"},{"type":"narration","background":"bg_base","bgm":"bgm_ambient","text":"十二月，城市丢的东西没有人登记。"},{"type":"narration","text":"不是丢了什么。是抬头看门缝的人少了一个。"},{"type":"narration","text":"雷恩去了登记组，小雅留在图书馆，艾莉丝回了研究所。看缝的人变成我一个。"},{"type":"narration","text":"我每个月去一次。去的时候只做一件事：把毛边朝内折一下。"},{"type":"narration","text":"折完我就走。走之前我不往里看。往里看要低头，低头就像要下去。"},{"type":"cg","background":"cg_ending_e15","text":"缝里那张纸的一角朝外。纸上有十个名字，页脚有一小块空白。空白里没有字。"},{"type":"narration","text":"这座城每个月丢一件东西，有时原样回来，有时回得比原来多一根。"},{"type":"narration","text":"我睡很少。醒着的时间被我切成格子，格子里放能放的东西：班表、两栏的表、日历上的圈。"},{"type":"narration","text":"凌晨四点四十，我坐在观察室床沿，等这一天的第一件失物。"},{"type":"narration","text":"它有时是一根栏杆，有时是一个字，有时是我自己的一个梦。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你等的那个东西，明天会少一半。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那就等它回来那一半。"},{"type":"narration","text":"他没有再说。他贴在井壁上，声音从缝里出来，比风还薄。"},{"type":"narration","text":"我不怕丢。我怕的是它回来的时候，我不认得它。"},{"type":"narration","text":"有一回我在别人的记忆里看见这座城没有丢的那件东西：一条巷子，巷口有人喊我。"},{"type":"narration","text":"我把它写在左边那一栏，写完划掉，划掉以后在旁边补一句：这条不是我的。"},{"type":"narration","text":"补完我睡了两小时。醒来的时候天是灰的，缝里那张纸的毛边又朝外了。"},{"type":"narration","text":"所以我每天写两栏。写满一栏再补。"},{"type":"narration","text":"门留一条缝。缝里那张纸，我每个月折一次。"},{"type":"narration","text":"折到第二年，纸的折痕起毛了。毛边朝外，我把它朝内折回去。"},{"type":"narration","text":"这个月城市又丢了一件东西。这次丢的是我数错的一格。"},{"type":"narration","text":"我把它写在右边那一栏：发生的。然后我去睡那两小时。"}],"kind":"ending"},"3-e16":{"sceneId":"3-e16","chapter":"第三幕·最终决战","title":"结局·一个都没少","background":"cg_ending_e16","bgm":"bgm_hope","next":"","lines":[{"type":"narration","text":"四月十号早上五点五十，井底那枚钟只剩最后一格。我在那一格里站着，本子摊开在手上。"},{"type":"narration","text":"十一个名字我念了三十天，从三月十二号念到今天。最后一个名字念完的时候，钟没有立刻动。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"念完了。十一个，一个都没漏。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"漏了一个。墙上那一位还没有名字。"},{"type":"narration","text":"墙里那个人站在阴影里。他等了四十年，等的就是有人肯把这一圈数完。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他刚才说，他不是要那个出口。他是想有人把他的名字念对一次。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"他的名字被擦过一次，剩下一个擦不掉的部分。那部分也得有人念出来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那就念。念一遍不够我就念第二遍。"},{"type":"narration","text":"我翻开本子的第一页。硬皮上第一行是苏禾，第二行是阿灰；老周和阮宁写在后面的页上。"},{"type":"narration","text":"我一行一行念。念到第七个名字的时候，井壁上的灰开始往下掉，掉得比刚才密。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"上面守住了。铁梯还剩两节，我不用再退。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"他在听。你每念一个名字，他就往亮的地方走一步。"},{"type":"narration","text":"我把十一个名字念完，最后一行还是空的。那一行本来就该是这个人的位置。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"你是被人从名字那一格上抠走的。抠走的地方留下了一个坑。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"坑也算一个字。我现在念你。"},{"type":"narration","text":"我念了一个音。那个音很短，短到像是从很远的一张纸上落下来的。"},{"type":"fx","fx":"flash","text":"我念完那一下，井底所有的灰同时落下去，落得干干净净。"},{"type":"narration","text":"墙上那层印子动了。它不是往后退，它是站起来，站到光能够照到的地方。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他笑了。他说他被人从头到尾数完了一次。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"他还说，别把他记成另一个你。他有他自己的那一格。"},{"type":"narration","text":"我点头。这一下点得很轻，轻到只有我自己知道我是在答应谁。"},{"type":"narration","text":"他往亮的地方走。走的时候没有留下一句话，也没有留下影子，只是那层灰没有了。"},{"type":"narration","text":"井底那枚钟在那时候动起来。它往回收，收得很慢，一格一格，把走掉的时间还回来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"它在退。它在往今天退。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"退到今天的日期它就会停。它停下来的那一刻，门就要关。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"门要收一个人才能关。这一次由谁来收。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"先上去。三个人上去，留一个人在门口看着。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"不用留。我们四个一起上去。"},{"type":"narration","text":"我们四个一起往铁梯走。我走在最后，走到一半的时候听见后面有合页的声音。"},{"type":"narration","text":"那道口子在自己合。它合得很慢，像有人在里面把一扇很重的门往里推。"},{"type":"fx","fx":"wait","text":"门合到最后的时候，缝里透出一条光。光落到我背上，然后就没有了。"},{"type":"narration","text":"门关上了。没有谁留在里面，也没有谁被它收走。"},{"type":"narration","text":"往上走之前，我把口袋里那只停着的表掏出来，塞回艾莉丝手腕上。她没说话，只把袖口拉了下来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"它自己关的。没有人替它按。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不是自己关的。是有人数完了。这本书写完，门就不需要人看着。"},{"type":"narration","text":"四月十号早上六点四十，我们四个人从那栋楼的正门走出来。洒水车刚从街对面过去。","background":"bg_dawn_city","bgm":"bgm_hope"},{"type":"narration","text":"洒水车的水打到路沿上，溅起来的水花里有半道很淡的彩虹。"},{"type":"narration","text":"楼下的井盖边上蹲着一个修路的人。他说这一段昨晚又断了一次电，说得像在说天气。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"他们还是什么都不知道。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"知道的人越少越好。这条规矩我今天第一次不想再用。"},{"type":"narration","text":"我们四个人在路口站着，谁都没有急着走。三个人都在，我数了两遍。"},{"type":"narration","text":"我们去了街角那家面馆，四个人挤在一张刚好坐得下四个人的桌子上。"},{"type":"narration","text":"老板问我们几个人，小雅说四个。她说四的时候声音很稳，比三月里任何时候都稳。"},{"type":"narration","text":"面上来的时候她多要了一只空碗，放在桌子最中间。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"这一只给还没回来的人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那今天要不要给它也倒点东西。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"倒一勺汤。汤凉了不算丢，倒掉也不算。"},{"type":"narration","text":"她倒了两勺汤进那只碗里。四个人低头吃面，谁都没有再提昨晚的事。"},{"type":"narration","text":"吃完的时候那只碗是空的。老板收碗的时候说了一句话，说你们这一桌汤喝得挺干净。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"干净好。干净就不用收拾。"},{"type":"narration","text":"我把那半张退路图从内袋里摸出来。纸上的字淡了一点，还认得出。"},{"type":"narration","text":"我没有把它扔掉，也没有交给研究所。我把它夹回了那本书的最后一页。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"那张纸你留下来了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"留下来了。以后有人要找，得有个东西指路。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"指路的东西不能什么都写。写多了会有人照着走。"},{"type":"narration","text":"出门的时候小雅走在最前面。她把录音机挂在肩上，走得比谁都快。"},{"type":"narration","text":"上午九点我回图书馆上班。老周在登记台后面，他先问的是我这一个月去了哪。","background":"bg_library_day","bgm":"bgm_warm"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"这个月你没来几回。书倒是都还了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"周叔，四楼那口钟你上去看过吗。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"上个月看了一眼。没指针，看也看不出什么。"},{"type":"narration","text":"我上楼的时候在四楼的楼梯口停了一下。那口钟还在，钟面上没有指针，只剩两个孔。"},{"type":"narration","text":"我把手放在钟面上。钟面是凉的，凉得比这一层楼的空气还要低一点。"},{"type":"narration","text":"然后我听见了一个声音，很短，像一根很细的针落在木头上。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"艾莉丝，你上来一下。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你叫我上来，是这口钟出了什么事。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这口钟在走。"},{"type":"narration","text":"我们两个人站在楼梯口听了一会儿。钟面底下有很轻的动静，一格一格，跟正常的钟一样。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"它没有指针，也没有齿轮。它不该走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"除非它走的不是它自己的时间，是这条街的时间。"},{"type":"narration","text":"她把表摘下来，放在钟边上。她这块表停在一点四十，从四月九号夜里起就没有动过。"},{"type":"narration","text":"表针在钟边上停了三秒，然后秒针动了一下，往前跳了一格。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cry","text":"一点四十一。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"它开始走了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"它走得很慢。它要把我停掉的那一个月一格一格补回来。"},{"type":"narration","text":"她说完这句就把表戴上。她戴表的时候手很稳，这是这个月里我第一次看见她手不抖。"},{"type":"narration","text":"下午我们在基地那张长桌前面坐下来。四个人，四把椅子，桌上这次真的有四杯热水。","background":"bg_base_room","bgm":"bgm_warm"},{"type":"narration","text":"小雅从包里拿出她那个录音机，放在桌子正中间。她说里面的东西她现在听着不一样了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"以前我听见的都是别人说话。今天我听见的是我自己。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"那是好事。"},{"type":"narration","text":"雷恩把手背上的烙印露出来给我们看。那块褐色的疤比上个月浅，浅到像一层旧墨。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"天冷还是会疼。疼的时候我认得它，不疼的时候我认得慢一点。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你今天还剩几次。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"零。我今天一次都没有借。够用了。"},{"type":"narration","text":"艾莉丝顺手给我测了一次失眠。她把仪器贴在我腕上，读数出来的时候她自己先看了一眼。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"比昨晚低了一截。昨晚那一觉你睡了六个小时。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"降了这么多。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"降这么多是因为有人替你数完了那一遍。你少背了一个人的份量。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那还能不能接着往下降。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"能。慢慢降。这件事我打算记到我的本子上，记三十年。"},{"type":"narration","text":"我把本子拿出来，翻到最后一页。那一页原本记着十一个名字，现在上面一个字都没有。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"那一页上的字都去哪儿了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"名字回到它们该在的地方去了。这本书不用再替它们记着。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那十一个人现在都在吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"在。他们本来就在，只是没有人念他们。现在有人念过了。"},{"type":"narration","text":"我把笔从口袋里摸出来，在最后一页上写了几个字，写完就把本子合上。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你在最后一页上写了什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"写了今天。四月十号。"},{"type":"narration","text":"傍晚我一个人回老城区看了一眼。那栋楼还在，墙上那块告示板还在，板子上贴着排班表。","background":"bg_street_night","bgm":"bgm_ambient"},{"type":"narration","text":"楼后面那片空地现在是一个很小的院子，院墙新刷过，墙根下摆着两盆没人打理的花。"},{"type":"narration","text":"我找了很久，没有找到那道口子。墙上没有缝，地上没有坑，连一处颜色不一样的地方都没有。"},{"type":"narration","text":"门走了。它做完它该做的事就走了，走得很干净，干净得像从来没有来过。"},{"type":"narration","text":"回图书馆的时候天已经黑了。四楼那口钟还在走，声音很轻，轻到站在楼梯口才听得见。","background":"bg_library_night","bgm":"bgm_hope"},{"type":"narration","text":"我在那儿站了一会儿，数了十二下。第十二下走完，钟声停了，又从头开始。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你又上来啦。这钟我年轻的时候响过，后来就不响了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"周叔，它今天回来了。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"回来就好。东西回来了就是好事。"},{"type":"narration","text":"他说完下楼去了。走到三楼的时候他停了半步，像是想起了什么，然后又往下走。"},{"type":"narration","text":"他没有想起什么。他这辈子记住的东西太多，不多这一件也不缺这一件。"},{"type":"narration","text":"我下楼的时候把四楼的灯关掉。关灯之前我看了一眼钟面，两个孔里什么也没有。"},{"type":"cg","background":"cg_ending_e16","text":"可它在走。它一格一格走过今天，走到明天，走回我正在过的这个日子。"},{"type":"narration","text":"我们四个人一个都没有留在里面。十一个名字由我念完，墙里那个人等了四十年，等到的就是这一遍。"},{"type":"narration","text":"这一次没有人被带走。门第一次不用谁留下也能合上，合上以后连一道缝都没有留下。"}],"kind":"ending"},"3-e17":{"sceneId":"3-e17","chapter":"第三幕·最终决战","title":"结局·十一个名字都清了","background":"cg_ending_e17","bgm":"bgm_warm","next":"","kind":"ending","lines":[{"type":"narration","text":"四月十一号早上，闹钟还没响我就醒了。醒来的第一件事是听，屋里没有人在念名字。"},{"type":"narration","text":"窗外有早点摊的声音，油锅在响，有人喊多加糖。这些声音昨天还不归我管。"},{"type":"narration","text":"我躺到闹钟响，又赖了五分钟。这五分钟没有任何代价，我睡得很平。"},{"type":"narration","text":"下楼的时候我在楼道里数脚步，数到一半忘了自己数到几，索性不数了。"},{"type":"narration","text":"街还是那条街。裂缝的事没有人提，报上没有，广播里没有，连一句多余的话都没有。"},{"type":"narration","text":"我在早点摊前站了一会儿。摊主问我吃什么，我说豆浆油条，他说今天油条细，我说细的也行。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"细的也行。这句话我一个月都说不出来。"},{"type":"narration","background":"bg_library_day","text":"到图书馆是八点四十。老周在登记台后面，台面上摊着那张在职与在册人员动态核对表。"},{"type":"narration","text":"表上十一个格子，每个格子里都有名字。字是他写的，一笔一笔，写得很慢，也很稳。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你来啦。正好，帮我数一遍。我数了四十年，怕自己数花眼。"},{"type":"narration","text":"我从头数。苏禾，阿灰，阮宁，第七排和第八排之间那一位。十一个，一个不多，一个不少。"},{"type":"narration","text":"数到最后一个的时候，老周把笔搁下，念了两个字。"},{"type":"narration","text":"他念得很顺。那两个字他四十年念不顺，去年还不行，今天早上顺了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"周叔，你把他的名字说出来了。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"嗯。原来就这么两个字。我绕了四十年，绕到昨天才绕直。"},{"type":"narration","text":"他摆摆手，没让我往下问。他把印泥盒推过来，在十一个格子上各盖了一个章，核。"},{"type":"fx","fx":"wait","text":"章落下去的声音一下一下，像有人在很远的地方收东西。"},{"type":"narration","text":"盖完，他把纸角抚平，从抽屉里又抽出一张新表。新表上十二个格子。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"第十二行给你留着。研究所那边要名单，说这次总得有个人记进去。"},{"type":"narration","text":"我知道那一行是给谁的。井底那道门要收一个人才能合，收的名字该写哪儿，谁都明白。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"周叔，那一行空着吧。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"空着？"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"空着。我的名字在我自己身上，不用填进纸里。"},{"type":"narration","text":"老周看了我一会儿，用铅笔在第十二行轻轻划了一道，划完说了半截话。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"行。空着……空着比填上好看。"},{"type":"narration","text":"上午十点艾莉丝来了。她穿着研究所的灰外套，抱着平板，进门先找的是我。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我来交账。八块碎片，编号我念给你听，你帮我看看有没有念错。"},{"type":"narration","text":"她念编号念得很快，念完把平板转过来对着我。八行记录，每行后面都标着去向：封存。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"碎片不是我们的东西，是从时间里借的。借了八块，还了八块，账上清零。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"这个也要记账啊。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"都要记。不记的账早晚回来收人。这条规矩今天作废，我亲手划的。"},{"type":"narration","text":"她划掉最后一行的时候笔停了一下，像是舍不得那个作废的动作，划完才松手。"},{"type":"narration","text":"小雅下午来的。录音机抱在怀里，进门先按了播放。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"你听。我在井口录的那盘，本来想留个证据，回来一听，里面全是街道。"},{"type":"narration","text":"磁带里没有墙里那个声音了。有的是洒水车，有排风扇，有人喊谁家孩子回来吃饭。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我以前录到的都是别人丢掉的。现在录到的都是活人的，这盘值钱多了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"值钱就拿去卖，换两顿肉。"},{"type":"narration","text":"雷恩扛着两箱归档的卷宗从我们身边过去，箱子落地的时候他补了半句。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"四楼那口钟……我上午看了一眼。还是那两个孔。"},{"type":"narration","text":"钟体还在，指针没有回来。它不响也不走，安安静静挂着，像一件终于退了休的东西。"},{"type":"narration","text":"我没觉得遗憾。有些东西回来是好消息，有些东西不回来也是。"},{"type":"narration","text":"中午我们四个人在馆里吃饭。老周多摆了一副碗筷，摆完又自己收走，说人都在，不用多。"},{"type":"narration","text":"下午我在四楼还书车旁边站了一会儿。第七排和第八排之间那条缝，现在就是两排书架。"},{"type":"narration","text":"光从窗户斜着进去，照见的是书脊，不是空隙。站过人的地方，现在停着一辆还书车。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你下午在这儿站了十一次，我数了。你要是没事，帮我核对这批归还记录。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"有事。我在确认这里不需要我了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"确认完了？"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"确认完了。"},{"type":"narration","text":"她多解释了一句：晚上基地开会，讨论的是以后谁来看着这些表，不是看着裂缝。"},{"type":"narration","background":"bg_dorm_night","text":"傍晚我回宿舍。楼道还是暗的，我走到一半停下来，听了一会儿。"},{"type":"narration","text":"没有钟表声。胸口那块地方很安静，安静得像我欠了它一场觉，它今天还给我了。"},{"type":"cg","background":"cg_ending_e17","text":"桌上摊开今天的记录，日期一栏我写：四月十一号，晴，无事。"},{"type":"narration","text":"无事这两个字，从三月十二号起我就没资格写。今天我写了，写完还盖了个章。"},{"type":"narration","text":"十一个名字都清了。第十二行空着，我的名字在我自己胸口，哪儿也不用去。"},{"type":"narration","text":"明天早上七点的闹钟我已经定好。第一个普通早晨过完了，明天还有下一个。"}]},"3-e18":{"sceneId":"3-e18","chapter":"第三幕·最终决战","title":"结局·钟重新走起来","background":"cg_ending_e18","bgm":"bgm_warm","next":"","kind":"ending","lines":[{"type":"narration","background":"bg_library_day","text":"四月十三号上午，我在图书馆四楼等艾莉丝。说好九点，她八点五十就到了，比我还早十分钟。"},{"type":"narration","text":"她现在管图书馆这条线的回访核对，批文贴在一楼公告栏，期限写着长期。这两个字她特意跟我强调过一遍。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你来这么早。是不是又睡不着。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"睡得着。我就是想早点来。"},{"type":"narration","text":"她手腕上那块表还在。还给她那天是在井口，她低头看了一眼，戴回去，之后它一直没动。"},{"type":"narration","text":"一点四十，四月九号夜里停的，停到今天一格没走。她也不提，我也没问。"},{"type":"narration","text":"上午她核对归还记录，我在旁边递单子。两个人隔一张桌子，谁也没说话，但不吵。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"三楼的架子归位了。地下书库那批卷宗要重排编号，我下午做。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"你安排得挺满。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"满了好。空出来的地方容易进风。"},{"type":"narration","text":"中午小雅来了，录音机往桌上一放，说要录四楼的声。她管这叫留档。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"这口钟以前一点声音都没有。我现在把它录下来，以后它要是变了，我好对比。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"变不了。它坏了四年，摆都锈死了。"},{"type":"narration","text":"雷恩是来修书架的。他扛着工具箱在门口站住，回头补了这半句，说完自己先上楼了。"},{"type":"narration","text":"四楼那口钟挂在老位置。钟面上还是两个孔，指针三月里就没了。钟体底下垂着那根摆，四年没动过。"},{"type":"narration","text":"下午三点，屋里只剩我和她。她在我对面写报告，笔尖很轻。"},{"type":"narration","text":"先听见声音的不是我，是她。她的笔停了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你听。"},{"type":"narration","text":"很轻的一声，像有人在钟体里面用指头弹了一下挂摆的销子。"},{"type":"narration","text":"然后那根摆动了。不是风吹的，风吹不动它。它自己往前送出去半寸，又荡回来。"},{"type":"fx","fx":"wait","text":"我们两个人都没动，谁也没敢出声，怕把它吓回去。"},{"type":"narration","text":"摆越荡越顺。它的节奏不快，一送一回，一送一回，像照着谁呼吸的节拍在走。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这个节奏……三月里有人让我照着呼吸的节拍睡。就是它。"},{"type":"narration","text":"她没接这句，她在听。她听东西的时候下巴会微微偏一点，这一个月我学会了看这个。"},{"type":"narration","text":"然后她抬起左手腕。那块停着的表，秒针动了。"},{"type":"narration","text":"它没有跳一格就停。它越过一点四十那一格，往前，又往前，跟着摆的节奏一格一格走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cry","text":"它过了。它过了那一格。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"它没停。"},{"type":"narration","text":"她把表贴在耳朵上听了很久。她听表的样子，像听一个病人的心跳。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"走得不准。比标准时间慢，慢很多。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"但它是自己走的。没上弦，没修，没人碰它，它自己走的。"},{"type":"narration","text":"她说完这句，多解释了一句：这四年她把它修过三次，三次都走不住，这一次没人动它。"},{"type":"narration","text":"四楼的钟在走，她腕上的表在走，两个节奏对在一起，屋里像多了一颗很大很大的心。"},{"type":"cg","background":"cg_ending_e18","text":"西窗的光照在钟体上，铜面反出来的亮斑落在她手腕上，跟着摆一晃一晃。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"艾莉丝。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你讲。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"这块表，从今往后归谁管。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"归我。它在我手腕上，就归我管。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"那走不准这件事呢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"就让它走不准。我不赶时间了，它也不用替我赶。"},{"type":"narration","text":"她这句说完没有停，又往下说了一句，说的是晚上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"驻点批下来了，办公室在四楼，靠窗那张桌归我。白天在这儿，晚上回基地。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"白天在这儿，那我白天也在。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你本来就在。这句话不用批文。"},{"type":"narration","text":"我不太会接这种话。我低头把还书车推过来，假装在理单子。"},{"type":"narration","text":"她把她的本子放到我本子旁边。两本一样厚，摞在一起刚好对齐。谁也没说这一下是什么意思。"},{"type":"narration","text":"傍晚老周上楼来，站在楼梯口听了半分钟。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"它响了。四年……不，比四年久。我年轻那会儿，它就是这动静。"},{"type":"narration","text":"他没下来，也没上去，就在楼梯口站着，听够了才走。走的时候背比平时直。"},{"type":"narration","text":"小雅把下午那段录进了磁带，雷恩给它编了号。他们说这叫留档，我说这叫过日子。"},{"type":"narration","background":"bg_library_night","text":"锁门前我们又上了一趟四楼。钟还在走，摆还在晃，表还在她手腕上走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"明天九点我在这儿。你不用等我，你到了就是我在。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"行。那我明天八点五十到。"},{"type":"narration","text":"下楼的时候她在前面，我在后面。两层楼梯，谁也没牵谁的手，脚步声并得很齐。"},{"type":"narration","text":"钟重新走起来。它走的不是四月九号，也不是三月十二号，是四月十三号，是我们俩往后要过的那种日子。"},{"type":"narration","text":"那种日子没有名字要念，没有账要平。它一格一格，跟着呼吸，慢慢走。"}]},"3-e19":{"sceneId":"3-e19","chapter":"第三幕·最终决战","title":"结局·醒着的城市","background":"cg_ending_e19","bgm":"bgm_warm","next":"","lines":[{"type":"narration","text":"四月十一号上午十点，我在自己的床上醒过来。闹钟响过一遍，是七点，我自己没听见。"},{"type":"narration","text":"从夜里十一点到上午十点，这中间是一整块空白。这块空白是我的，谁也没有借走。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"我睡过去了，而且我知道自己睡过去了。这两件事能同时成立，我等了三十天。"},{"type":"narration","text":"下楼的时候，巷口的早点摊正在收摊。老板娘隔着炉子跟一个扫地的老头说话，嗓门比平时高。"},{"type":"narration","text":"老头把扫把拄在地上，听一句应一句，扫得很慢，一下一下，像在数这条街的门牌。"},{"type":"narration","text":"新闻说，四月十号早上六点四十，全城的闹钟一个都没响，但所有人都同时醒了。主持人把这当成一次普通集体失眠，后面接了天气。"},{"type":"narration","text":"只有我知道那不是失眠。那一分钟里，全城的人一起想起了一批人，想起的就是他们回来的日子。"},{"type":"narration","text":"被删掉的人回来了。没有人去接他们，他们自己走到自己该去的地方，像下班回家一样自然。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"总坐角落写作业的男孩回来了。他进门先找座位，找到了就坐下。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你还记得他以前坐在哪儿？"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"记得。全城都记得。摊上老板娘记得他欠了两天豆浆钱，他今天早上特意来还了。"},{"type":"narration","text":"中午店里不忙。小雅把架子最里面那只空了三年的杯子收下来，说从今天起拿来装吸管。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"以前摆着，是怕有人回来没得喝。现在人都在，杯子就该干杯子的活。"},{"type":"narration","text":"下午我回图书馆。老周在登记台后面填核对表，一格一笔，比三月里还快。","background":"bg_library_day"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你回来啦。这张表我断了一个月，前面填的都在，就是手生。"},{"type":"narration","text":"他记得每一张表。开门数座位，年初换新格纸，这些他全记得，记得一点不打折。"},{"type":"narration","text":"我上楼还书。借书卡最上面那张的名字是苏禾。卡片是新的，日期是今天。"},{"type":"narration","text":"她在三楼靠窗的位置找书，找了很久。她回头看我那一眼很平静，像看一个常来的读者。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"苏禾，你回来了。"},{"type":"narration","text":"她应了一声，问她的借书证还算不算数。我说算。她笑了一下，低头继续找她的书。"},{"type":"narration","text":"书架第三层，我三月十二号夜班看见的那撮灰，四月十一号落了，趴在书顶上，一层薄薄的、正常的灰。"},{"type":"narration","text":"我伸手把它抹掉，抹的时候停了一下。这一停是习惯，不是预感。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"对着一把灰发什么呆。擦了就是擦了，灰又不是什么稀罕东西。"},{"type":"narration","text":"傍晚雷恩来了，不是一个人来的。他妹妹站在他身后半步，拎着一袋橘子，站姿跟他一模一样。","background":"bg_cafe_evening","bgm":"bgm_hope"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"小满。她叫雷小满。档案上她的名字一直在，现在人对上了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你手背上那块疤……"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"还在。它替我记过事。现在不用记了，我也不赶它走。"},{"type":"narration","text":"雷小满开口说的第一句就让大家不知道该怎么接：院子里的藤今年开得很好，她哥每天数花。雷恩瞪了她一眼，她低头剥橘子，不理。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"数花好啊。我耳朵最闹的那阵子，就是靠数花活下来的。"},{"type":"narration","text":"艾莉丝最后到。她进门先看的是我，看的不是脸，是眼睛。她看了两秒，点点头坐下。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"瞳孔的颜色退干净了。你昨晚那一觉，比任何一份报告都管用。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你还打算接着给我测吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"不测了。数字这个东西，从今天起让它歇着。"},{"type":"narration","text":"研究所这次没有删名字。结案报告写了二百多页，附了三千多个证人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我写了七年报告，第一次写一份不需要谁签字也成立的。全城都记得，它就是成立。"},{"type":"narration","text":"维拉来过一次。她站在门口把店里的人扫了一圈，合上一份四十年的旧档案。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"名单上最后一个名字，有人念对了。守望者的账今天平了。你们往后过自己的日子。"},{"type":"narration","text":"她说走就走。小雅追出去，喊她下次来喝杯热的。她摆了摆手，步子一点没慢。"},{"type":"narration","text":"打烊以后我们留在店里。雷小满替她哥值班，冲的第一杯太苦，所有人都喝完了。"},{"type":"narration","text":"那天夜里我走回家。一路的窗户亮着一半。亮着的那些人不是在熬夜，是在跟回来的人说话。"},{"type":"narration","text":"我在路口站了一会儿。这座城市从来不睡觉。以前我觉得那是它吵，现在我知道，那是它记性好。"},{"type":"fx","fx":"wait","text":"走到楼下，我回头看了一眼。"},{"type":"narration","text":"上楼，开门，洗手。那本硬皮账我交给了图书馆，跟老周的核对表放在一起。"},{"type":"narration","text":"交出去之前我把最后一页撕了下来，那一页空着：十一个名字都回到了该在的地方，纸上只剩笔尖的印子。"},{"type":"narration","text":"空页我留着。我在上面写了明天的安排：七点起，八点上班，下班去咖啡馆，路上买两个橘子。"},{"type":"cg","background":"cg_ending_e19","text":"那天夜里十一点我关了灯。窗外还亮着一半的窗，每一扇亮着的窗里都有人在说话，在吃饭，在记着同一批回来的人。"},{"type":"narration","text":"我在那一半灯光里睡着了。睡着之前我想，奇迹不是从井底爬上来的那一下。"},{"type":"narration","text":"奇迹是第二天早上，全城的人一起记得，而我睡得着。"},{"type":"narration","text":"偶尔我还是会有一次既视感，走到路口愣半秒。但那半秒里，没有人被拿走。"},{"type":"narration","text":"四月十二号早上七点，闹钟响之前我自己醒了。牙刷到一半我照镜子：眼睛是黑的，只装得下一个人。"},{"type":"narration","text":"楼下传来扫把的声音，一下一下。老板娘的摊子出得比平时早，她说最近大家都爱早起，早起的人多，生意就好。"},{"type":"narration","text":"上班路上我数了一遍：艾莉丝在补她那二百页报告，雷恩在院子里数花，小雅在擦那只装吸管的杯子，老周在给新书贴条码，苏禾在三楼靠窗找她那本没找完的书。"},{"type":"narration","text":"墙根下那个扫地的老头还在数门牌，数到四十号，就从头再数一遍。"},{"type":"narration","text":"他们记得自己少了三十天，也记得四月十号早上忽然全想了起来。至于为什么，没人说得清。这样挺好。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"今天书还得挺齐。你最近气色好，是睡觉睡出来的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"周叔，我睡得着。我每天都睡得着。"},{"type":"narration","text":"这就是所有人都在的一天。它普通得没有任何一句话值得被引用，而我打算把这样的日子一直过下去。"},{"type":"narration","text":"第二天晚上十一点，我又关了灯。城市醒着，替所有人记着。我睡得着，因为没有人需要我替他们记。"}],"kind":"ending"},"3-e20":{"sceneId":"3-e20","chapter":"第三幕·最终决战","title":"结局·把借来的记忆当成自己的","background":"cg_ending_e20","bgm":"bgm_insomnia","next":"","lines":[{"type":"narration","text":"四月十三号，我在别人的清晨里醒来。江上雾很大，喊船的是我，等船的也是我。"},{"type":"narration","text":"船老大撑篙用的是右手，食指缺了半根。这个细节我知道得清清楚楚，可我从来没去过任何渡口。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"昨晚又梦见渡河。票价是两个包子，要热的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你梦里哪来的江。这座城市里你连河都没见过。"},{"type":"narration","text":"我说不上来。醒来的时候手心是潮的，凑近了闻，有一股鱼腥气。"},{"type":"narration","text":"早点摊上我拿了两个包子，递出去的是一张船票。老板娘捏着那张票看了很久，什么也没说，把蒸笼往我这边推了推。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"白天我进城还东西。要还的一共六样：渡口，棉袄，阳台，黑板，柳树，绿皮火车。"},{"type":"narration","text":"每一样都有一个地方对应着。我到门口站一站，看别人过那一天，看着看着就跟过自己的一样。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"林晓哥，你今天没来店里？周叔说你一早就出去了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"出门还点东西。晚上回来。"},{"type":"narration","text":"傍晚我回图书馆接班。老周在登记台后面等我，把一张借书卡推到台面上。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"借阅人写的是阮宁。日期是昨天。这笔迹是你的，我认了你三年了。"},{"type":"narration","text":"我说是我签的，阮宁也是我。老周张了张嘴，最后把自己的老花镜摘下来擦了擦，没再问。"},{"type":"fx","fx":"timeline","text":"出馆的时候天黑了。路灯底下我挨个跟过去的人打招呼，用的都是别人的名字。"},{"type":"narration","text":"名字出口比自己的名字顺。有人应我，有人绕开我走，有人回头看了两次。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"晓。跟我来，我给你念点东西。"},{"type":"narration","text":"雷恩把那本硬皮账摊在台阶上，就着路灯念十一个名字。苏禾。阿灰。老周。阮宁。陈。他念得很慢。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"陈是在渡口走的。那天我在。"},{"type":"narration","text":"话说出口，我觉得这张嘴不是我的。雷恩没抬头，接着往下念。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"行，能接话就好。你听着，听到你自己的名字，人就回来了。"},{"type":"narration","text":"可我的名字是林晓。这两个字最近听见了，我也要先想一想，才知道叫的是谁。"},{"type":"narration","text":"小雅找来了。她先去了宿舍，又去图书馆，又去研究所，最后在楼梯间找到我们三个。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你在楼下站了十几分钟。你在等谁？"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"等阮宁下晚自习。她学得晚。"},{"type":"narration","text":"小雅没接这句话。她跟着我走到阮宁住的那条巷子。三号楼底下，我冲着一扇窗户喊了一个小名。"},{"type":"narration","text":"那个小名我不知道自己是从哪儿学来的。窗户里亮了灯，一位老太太扶着门框想了想。"},{"type":"narration","text":"她说，小伙子，我家没有这个人。她说得很客气，然后把门关上了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"林晓。阮宁走了很久了。你把她还给别人吧。"},{"type":"narration","text":"我反过来安慰她。安慰的话是别人从前用来安慰我的，我用得很熟。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"研究所来人评估过一次。结论写在三行字里：长期睡眠剥夺，记忆来源混淆，无痛感，无攻击性。"},{"type":"narration","text":"最后一行是：暂不建议强制干预，当事人状态平静。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"报告是我签的。签字的时候手很稳。签完我在走廊里站了很久，久到护士来劝我回去。"},{"type":"narration","text":"维拉来收走了那本硬皮账，给我换了一个空白的新本子。新本子封面上贴着归档标签：一个人的集体回忆。"},{"type":"narration","text":"旧账已经写满了。几百个名字，每个名字后面都跟着同一个后缀：我在。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_sleep","text":"那本账是我的。每一个我在场，都是我。"},{"type":"narration","text":"维拉把账本装进箱子里，箱子放进柜子，柜子上锁。她做得很快，快得像怕慢一点就得多看我们一眼。"},{"type":"narration","text":"七月里艾莉丝给我做了最后一次检查。瞳孔没有再变色，只是里面盛着的人太多，盛不下她。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"别再照镜子了。这不是医嘱，是我个人的请求。"},{"type":"narration","text":"我照了。镜子里那张脸熟，可不亲，像多年没联系的老同学，还得先想想叫什么名字。"},{"type":"narration","text":"雷恩把账本从维拉那儿要了回来。他说别人替他念，这些名分不算落定，得他自己念给我听。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"我念到陈就卡。你替我记着这个卡，卡也是活人留下的东西。"},{"type":"narration","text":"八月，小雅在店里给我留了靠窗的座位。她说我每回从渡口回来都坐这儿，说这儿亮堂，看得清路。"},{"type":"cg","background":"cg_ending_e20","text":"有天傍晚我们四个一起下楼。路灯把影子铺在地上，三道影子里叠着许多淡淡的、不属于我们的轮廓。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"明天你就算变成谁，我也给你留门。门不锁。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"今天的记录写完了。今天，你是林晓。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"下礼拜我还来念。本子你拿好，丢了我就再抄一份。"},{"type":"narration","text":"九月里我空过一夜。那一夜没有别人的日子进来，只有我自己的黑。"},{"type":"narration","text":"第二天我把那一夜忘得干干净净。它是我唯一的一页，我连它也没保住。"},{"type":"narration","text":"属于我自己的二十二年，薄得像一张纸，夹在几百个厚厚的白天中间。"},{"type":"fx","fx":"wait","text":"后来的事，是小雅讲给我听的。她说那天她们三个没上楼。"},{"type":"narration","text":"她们站在路口，看着我自己走回宿舍，一路上跟熟人打招呼，用别人的名字，笑得比谁都安稳。"},{"type":"narration","text":"小雅说，她没忍住，问了一句：他现在，算林晓吗。没有人答她。"},{"type":"narration","text":"他不再需要分清哪一段记忆是自己的。这是最疼的地方，也是最后留给他的那点宽厚。"},{"type":"narration","text":"那天夜里他十一点躺下，照旧在别人的清晨里闭眼。他把借来的记忆当成自己的，从这天起，他夜夜好睡。"}],"kind":"ending"}},"order":["1-1","1-1a","1-1b","1-2","1-3","1-3a","1-4","1-5","1 function setImage(node, src, fallbackText) {

  if (!fb) {
    fb = document.createElement('div');
    fb.className = 'art-fallback';
    node.appendChild(fb);
    node.__fallback = fb;
  }
  fb.textContent = fallbackText || '';
  if (!src) {
    if (node.__img && node.__img.parentNode) node.__img.parentNode.removeChild(node.__img);
    node.__img = null;
    fb.style.opacity = '1';
    return;
  }
  const img = new Image();
  img.className = 'art';
  img.onerror = () => { fb.style.opacity = '1'; };
  img.src = src;
  node.appendChild(img);
  const old = node.__img;
  node.__img = img;
  requestAnimationFrame(() => {
    img.className = 'art in';
    fb.style.opacity = '0';
  });

    const v = Number(state.affection[CAST_ORDER[i]] || 0);

/** §8.3 when 判定；数值 0 = 未给出该约束（与 Unity JsonUtility 口径一致）。 */
function whenSatisfied(w) {
  if (!w || typeof w !== 'object') return true;
  if (Array.isArray(w.flags)) { for (const f of w.flags) if (!flagsHas(f)) return false; }
  if (Array.isArray(w.notFlags)) { for (const f of w.notFlags) if (flagsHas(f)) return false; }
  if (typeof w.insomniaMin === 'number' && w.insomniaMin !== 0 && state.insomnia < w.insomniaMin) return false;
  if (typeof w.insomniaMax === 'number' && w.insomniaMax !== 0 && state.insomnia > w.insomniaMax) return false;
  const shards = Array.isArray(state.memoryShards) ? state.memoryShards.length : 0; // 预览暂无碎片状态
  if (typeof w.shardsMin === 'number' && w.shardsMin !== 0 && shards < w.shardsMin) return false;
  if (typeof w.flagCountMin === 'number' && w.flagCountMin !== 0 && state.flags.length < w.flagCountMin) return false;
  const top = topAffection();
  if (typeof w.topAffection === 'string' && w.topAffection !== '' && top.who !== w.topAffection) return false;

}

function resolveEnding() {
  if (!ENDINGS || !Array.isArray(ENDINGS.rules)) return null;
  for (let i = 0; i < ENDINGS.rules.length; i++) {
    const r = ENDINGS.rules[i];
    if (r && whenSatisfied(r.when)) return { sceneId: r.scene, title: r.title || '', index: i };
  }
  const fb = typeof ENDINGS.fallback === 'string' ? ENDINGS.fallback : '';
  return fb ? { sceneId: fb, title: ruleTitleFor(fb), index: -1 } : null;
}

function playLine() {
  if (pendingChoice) return;
  const lines = sceneObj.lines || [];
  if (state.lineIndex >= lines.length) return endScene();
  const line = lines[state.lineIndex];
  applyLineOverrides(line);
  el.dialog.className = '';

  switch (line.type) {
    case 'choice': {
      showChoices(line);
      break;
    }
    case 'fx': {
      playFx(line.fx);
      // fx 行不显示文本，短暂停顿后自动前进
      typing = false; typingDone = true;
      el.dialog.style.display = 'none';
      setTimeout(() => { if (pendingChoice) return; state.lineIndex++; playLine(); }, line.fx === 'wait' ? 500 : 380);
