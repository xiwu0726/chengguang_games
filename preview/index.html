去再说」，先收队","affectionWho":"","affection":0,"insomnia":-1,"flag":"deferred_the_talk","next":""},{"text":"点点头，让他知道这句被听见了","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"acknowledged_his_apology","next":""},{"text":"心里那股堵还没散，先记着","affectionWho":"","affection":0,"insomnia":1,"flag":"kept_the_lump","next":""}]},{"type":"narration","text":"我们收拾东西的时候，天已经暗了。那块碎片最后还是没取成，它被雷恩挡过一次以后就黯了，往外溢的东西也停了。"},{"type":"narration","text":"上车之前，小雅忽然拉住我。她的手指很凉，抓着我袖口不放。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"在那边我听见的东西，还有一件我没说。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我听见有一个老头在站台上说话，声音很清楚。他说：把票拿好，别落下东西。"},{"type":"narration","text":"我的胃往下沉。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我听见的站台，是明天早上的。我数过声音，是早班。"},{"type":"narration","text":"回城的路上，雷恩一直看着窗外。他那只包着绷带的手放在膝盖上，像一件他不认识的东西。"},{"type":"choice","text":"","prompt":"小雅听见的是明天的站台。上车前你安排什么？","options":[{"text":"明早先去车站，把那个早班盯住","affectionWho":"","affection":0,"insomnia":1,"flag":"planned_station_watch","next":""},{"text":"先问雷恩：四天后的西区怎么办","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"asked_raine_about_west","next":""},{"text":"把小雅听见的话原样记下来","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_xyas_heard_words","next":""}]},{"type":"narration","text":"我翻开笔记本，把那张照片夹回去，又在旁边写了一行。"},{"type":"narration","text":"我写的是：「守望者的烙印就是被记住的代价。雷恩替人挡了一次，他的妹妹就被换走了。这条规则不是关于力量的，是关于谁来付账的。」"},{"type":"narration","text":"写到这里我又停下来，加了一句。"},{"type":"narration","text":"「所以我如果继续往里走，最后被换走的会是谁。」"},{"type":"choice","text":"","prompt":"接下来怎么安排？","options":[{"text":"先按雷恩的线索查西区，把四天后的那场大事压下去","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"followed_raine_westward","next":""},{"text":"先把小雅的能力和自己记得的那个人告诉艾莉丝","affectionWho":"艾莉丝","affection":8,"insomnia":1,"flag":"told_alice_about_xya","next":""},{"text":"谁都不说，明早一个人去车站看看那个早班站台","affectionWho":"小雅","affection":3,"insomnia":1,"flag":"went_station_alone","next":""}]},{"type":"narration","text":"当晚我把那张照片从本子里抽出来，放在灯下看。"},{"type":"narration","text":"正面还是那个笑得很随意的男人和半个后脑。背面那行字还在：别让他变成没有人记得的那种人。"},{"type":"narration","text":"我把照片翻过来对着灯。灯从背面照过去的时候，我看见纸里还有东西——不是字，是一层很淡的压痕，像有人在上面又写过一遍，然后被擦掉了。"},{"type":"narration","text":"我把灯挪近，把那层压痕看清楚了。上面是两个字，笔画很重，是「哥哥」。"},{"type":"choice","text":"","prompt":"压痕里是「哥哥」两个字。这个发现你今晚告诉谁？","options":[{"text":"谁都不告诉，明天当面问艾莉丝","affectionWho":"艾莉丝","affection":4,"insomnia":1,"flag":"kept_brother_secret_till_morning","next":""},{"text":"先告诉小雅，让她别在饭桌上说漏","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"told_xya_first","next":""},{"text":"写进本子，写完就后悔写了","affectionWho":"","affection":0,"insomnia":1,"flag":"wrote_the_brother_line","next":"#l08"}]},{"type":"narration","text":"我坐回椅子上，心里那根线终于连上了。照片上站着的那个人，是艾莉丝的哥哥。而艾莉丝在那一边说过一句话，她说那个男人「活到了二十七岁」。","label":"l08"},{"type":"narration","text":"活到二十七岁。她说这句话的时候用的不是「在」，是「活到」。"},{"type":"narration","text":"我把本子合上，闭上眼。窗外的雨还在下，地下室那台机器散热的细响一直持续到天亮。"},{"type":"choice","text":"","prompt":"天快亮了。明天那一问，你想清楚了吗？","options":[{"text":"想清楚了：问「怎么被抹掉」，不问「是谁」","affectionWho":"","affection":0,"insomnia":-2,"flag":"fixed_the_question","next":""},{"text":"没想清，可手已经把本子合上了","affectionWho":"","affection":0,"insomnia":1,"flag":"closed_book_unsure","next":""},{"text":"想清楚了，顺便把雷恩的份也一起问","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"bundled_raines_question","next":""}]},{"type":"narration","text":"我在天亮之前想清楚了一件事：明天要问艾莉丝的问题，不是那张照片是谁的，而是她失去的人是怎么被抹掉的。这个问题必须我问，因为只有我记得的那个人，和她失去的那个人，是被同一种东西拿走的。"}]},"2-4":{"sceneId":"2-4","chapter":"第二幕·深入探索","title":"艾莉丝的过去","background":"bg_base_room","bgm":"bgm_mystery","dense":true,"next":"2-5","lines":[{"type":"narration","text":"第十五天，三月二十六号，上午十点。我坐在作战室的长桌这头，桌上放着两个本子：我的，和艾莉丝的。"},{"type":"narration","text":"她把她的那本摊开的时候我愣了一下。她的本子比我的厚，边角还贴了三种颜色的标签。标签的位置按月份排，最早那批已经磨白了。"},{"type":"narration","text":"「借来的时间要还。」她指着本子第一页的标题念了一遍，念得很平，像在给我读一条使用说明。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"三年记录，四百一十七起。我列的是所有能查到的人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"能查到的是多少。"},{"type":"choice","text":"","prompt":"四百多起里只有三十七个名字。这个「能查到」你敢信几分？","options":[{"text":"追问：剩下的人是被查不到，还是被查无此人","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"pressed_on_unfindable","next":""},{"text":"先翻到写满名字的那几页","affectionWho":"","affection":0,"insomnia":0,"flag":"flipped_to_named_pages","next":""},{"text":"心里咯噔一下，想起老周的那道短横","affectionWho":"","affection":0,"insomnia":0,"flag":"thought_of_zhous_dash","next":"#l01"}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"三十七个人。剩下的四百多起只有时间和地点，没有名字。","label":"l01"},{"type":"narration","text":"她把本子推给我。我看见每一页的左边是日期，中间是坐标，右边那一栏她写的是「对象」。有些对象后面写着完整的姓名、年龄和职业，另一些后面只有一道短横。"},{"type":"narration","text":"一道短横，意思是那里曾经有过一个人，但已经没有任何东西能证明那个人是什么样。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这些短横，都是跟老周一样的人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"都是。区别只在于有没有人还记得他们。"},{"type":"choice","text":"","prompt":"「有没有人还记得」——这句话把你钉在原地。你想接什么？","options":[{"text":"接：我们四个就是还记得的那批","affectionWho":"","affection":0,"insomnia":0,"flag":"claimed_the_rememberers","next":""},{"text":"接不动，低头翻到三月十六号","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_mar16_row","next":""},{"text":"问她：被记得有没有优先级","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"asked_remembering_order","next":""}]},{"type":"narration","text":"我翻到最近几页。翻到三月十六号那一行的时候，我的手指停了一下——那一行的地点是城际车站，对象栏上写着「一名，男性，老年，姓名不详」。"},{"type":"narration","text":"那是站台上那七秒钟的人。他的身份在她的本子里只是一个「男性，老年」。"},{"type":"narration","text":"小雅端着两杯水进来，把一杯放在我手边，另一杯放在桌上没人坐的那一侧。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"这杯是给雷恩的。他去修车了，说十一点前回来。"},{"type":"narration","text":"她说完就站在旁边看那本本子。她看得很认真，看到第二条短横的时候，她伸手把它按住了。"},{"type":"choice","text":"","prompt":"小雅按住了第二条短横。你让她按多久？","options":[{"text":"让她按着，先记下页码","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_xyas_page","next":""},{"text":"轻声问：那个人在说什么","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"asked_whats_being_said","next":""},{"text":"把本子往她那边推一点","affectionWho":"小雅","affection":3,"insomnia":-1,"flag":"slid_book_to_xya","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"这页上有人。很轻，但有人在。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"哪一个。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"第四行。他在说他要找的东西在下面一层。"},{"type":"narration","text":"艾莉丝抬头看了她两秒。她把笔放下，把那一页往小雅那边挪了挪，没有问她怎么知道的。"},{"type":"narration","text":"这几天的规矩是这样的：小雅报，我们记。她不解释，我们也不追问。这是我提的，因为一提她就会开始怀疑自己。"},{"type":"narration","text":"快到十一点的时候，雷恩回来了。他手上那只包扎好的手还只用左手干活，进门的时候把一叠复印纸夹在腋下。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"研究所的旧档，我托人抄了一份。不用问是谁抄的。"},{"type":"choice","text":"","prompt":"雷恩抄回研究所旧档。「不用问是谁抄的」这句你追不追？","options":[{"text":"不追。他的渠道问了也不会说","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"let_raines_channel_be","next":""},{"text":"追一句：这份档案会不会害到他","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"worried_for_raines_source","next":""},{"text":"先翻目录，找「编号规则」那一页","affectionWho":"","affection":0,"insomnia":0,"flag":"opened_the_index","next":"#l02"}]},{"type":"narration","text":"那叠纸放在桌上，比艾莉丝的本子更旧。纸边发黄，最上面那张是目录，第二行写着「实验对象分类与编号规则」。","label":"l02"},{"type":"narration","text":"艾莉丝拿过去，从中间开始翻。她翻得很快，快得像早就知道要找的东西在哪儿。翻到第三十几页的时候，她的手突然停住了。"},{"type":"narration","text":"停下来那一下非常明显地让整张桌子安静了。小雅把水杯放下，雷恩把身子从门框上直起来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"找到了？"},{"type":"narration","text":"她没有回答。她只是把那一页转过来，推到我面前。"},{"type":"choice","text":"","prompt":"她把那一页推过来了。接之前你想做什么？","options":[{"text":"先看表头，再看编号，最后才看名字","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_table_slowly","next":""},{"text":"直接看名字那一栏","affectionWho":"","affection":0,"insomnia":0,"flag":"jumped_to_the_name","next":""},{"text":"先抬头看她一眼——她的手也在发抖","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"glanced_at_her_hand","next":""}]},{"type":"narration","text":"那是一张名单表。表头写着「第一批志愿受试者」，共六行。第六行的编号是 A-三一七。"},{"type":"narration","text":"上一个月，我在研究所的旧记录里见过这个编号。她问我怎么会知道它，我没说。现在它又出现了，出现在一张纸质名单上。"},{"type":"narration","text":"编号后面是一个名字。名字是「叶嘉」。我盯着那两个字看了几秒——这是她的姓。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"叶嘉。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我哥。"},{"type":"narration","text":"她说得很稳。稳到我以为她接下来会解释，可她什么都没说，只是把手放在那张纸上，像怕它被风吹走。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"艾莉丝姐姐，你的手在抖。"},{"type":"choice","text":"","prompt":"「我哥。」两个字落地。这一刻谁的话都不该先说？","options":[{"text":"让小雅别出声，可自己也没词","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"silenced_the_room_gently","next":""},{"text":"把椅子往她那边挪半尺","affectionWho":"艾莉丝","affection":5,"insomnia":-1,"flag":"moved_chair_closer","next":"#l03"},{"text":"替她把那一页按住，纸角在抖","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"held_the_page_steady","next":""}]},{"type":"narration","text":"她把手收了回去，交叠着放在膝盖上。她的手指还在动，一下一下地敲着自己的指节。","label":"l03"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"三年前，他报名做受试者。研究所有一期项目，测人能不能带着记忆穿过裂缝。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"第一期伤了两个人，项目停掉。第三个月，他的档案就没了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"没了是什么意思。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"户籍里销了。研究所说查无此人。我妈现在记得她有两个孩子，一个是我，一个是他。可她说不清他叫什么。"},{"type":"choice","text":"","prompt":"「我妈不承认生过第二个孩子」——这句你昨天才听过。要不要点破？","options":[{"text":"点破：雷恩的母亲也说过同样的话","affectionWho":"","affection":0,"insomnia":0,"flag":"linked_two_families","next":""},{"text":"先不说，等她自己听见这个重合","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_for_her_to_notice","next":""},{"text":"在本子上把两句话并排记下来","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_both_lines_side","next":""}]},{"type":"narration","text":"这句话我听得很熟。因为三年前，另一个男人用另一种说法讲过同一件事。他说他母亲不承认生过第二个孩子。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"跟雷恩的妹妹一模一样。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我一开始以为是巧合。这一年里出现过七次类似的情况，我都归到「裂缝事故」。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"但今天这一张名单告诉我，他不是事故里的倒霉人。他在名单上。"},{"type":"narration","text":"她说完这句话以后往后靠在椅背上，闭了一下眼。她睁开眼的时候，眼睛里已经不是平常那种干净的冷。"},{"type":"choice","text":"","prompt":"她闭眼再睁开，冷眼里有了别的东西。你担心她撑不住吗？","options":[{"text":"担心，把水杯往她那边推了推","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"pushed_water_to_alice","next":""},{"text":"不担心，她比这间屋里任何人都稳","affectionWho":"艾莉丝","affection":2,"insomnia":-1,"flag":"trusted_alices_steadiness","next":""},{"text":"担心的是她接下来要说的话","affectionWho":"","affection":0,"insomnia":0,"flag":"braced_for_next_words","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"研究院有规定：名单上的人不能在正式文件里出现。所以他的名字只能躺在这种复印件上。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"是谁定的规定。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"上面没有署名。只有一枚盖章，章是圆的。"},{"type":"narration","text":"那枚章在纸角上，颜色很淡，图案是一个圈，圈里有一道断掉的线。这个图案我前天在雷恩的手背上见过，用另一种方式刻在皮肤里。"},{"type":"narration","text":"雷恩走过来，低头看了一眼那枚章。他没有说话，只是把手插进了口袋。他把那只手收进去的时候，动作很自然，自然到像做过几百次。"},{"type":"choice","text":"","prompt":"雷恩把盖章的手收进口袋。这个回避你记不记？","options":[{"text":"记下来，回头单独问他","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"noted_raines_flinch","next":""},{"text":"当场问：你认识这枚章","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_about_the_seal","next":""},{"text":"不问他，先把照片放上名单","affectionWho":"","affection":0,"insomnia":0,"flag":"placed_photo_on_list","next":""}]},{"type":"narration","text":"我把自己的本子翻到夹层，把那张照片拿出来，放在名单上。"},{"type":"narration","text":"照片上是那个人，站着的那个，笑得很随意。名单上是那两个字。两样东西摆在一起的时候，我第一次觉得这张照片有了重量。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这张照片是以后的你留在那一边的。背面那行字是写给之后的人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"别让他变成没有人记得的那种人——写这句话的人，是你自己。"},{"type":"narration","text":"艾莉丝把照片拿起来，翻到背面。她读那行字的姿势很慢，读完以后她没有把照片还给我，而是握住它，握到手背上的青筋都显出来。"},{"type":"choice","text":"","prompt":"她把照片握到青筋都起来了。这照片还拿不拿得回来？","options":[{"text":"不拿，让它先在她手里待一晚","affectionWho":"艾莉丝","affection":5,"insomnia":-1,"flag":"left_photo_with_alice","next":""},{"text":"拿回来，夹进本子夹层","affectionWho":"","affection":0,"insomnia":0,"flag":"took_photo_back","next":""},{"text":"开口说一句「写这话的人不丢人」","affectionWho":"艾莉丝","affection":6,"insomnia":0,"flag":"defended_future_alice","next":"#l04"}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cry","text":"我二十七岁那年也不会承认自己会写这种话。","label":"l04"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cry","text":"「别让他变成没有人记得的那种人」。听上去像求人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那就是求人。求一个以后能记住他的人。"},{"type":"narration","text":"她把照片放下，脸转开，看向作战室那面没有窗的墙。她肩膀的动作很轻，可我看见她眨眼的次数变多了。"},{"type":"narration","text":"小雅轻轻把一张便利贴推到我手边。上面写着一行小字：「她刚才在数呼吸，数到三十七就重来。」"},{"type":"narration","text":"我把便利贴捏在手里，没有出声。这半年她一直在给别人做计量，今天轮到别人替她数了。"},{"type":"choice","text":"","prompt":"便利贴上写着她在数呼吸。这张贴你收不收？","options":[{"text":"收进本子，让她知道有人接住了","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"kept_the_sticky_note","next":""},{"text":"当面道谢，声音放得很轻","affectionWho":"小雅","affection":5,"insomnia":-1,"flag":"thanked_xya_quietly","next":""},{"text":"捏在手里捏到纸边都湿了","affectionWho":"","affection":0,"insomnia":0,"flag":"crumpled_the_note","next":""}]},{"type":"narration","text":"过了一会儿，她自己转回来了。她伸手把名单表抚平，把那张复印纸对齐，重新叠进那沓旧档里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"讲一下我原本的打算。我进研究所的时候，是想查这条线，查完就走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我的规则是不卷进人。卷进人以后，结论就不干净了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"前天你在雨里不是这么做的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我知道。所以今天我要把这件事说出来，不然我会接下来一直照昨天的做法走。"},{"type":"choice","text":"","prompt":"她要圈三个点了。这一晚之后她打算一个人扛吗？","options":[{"text":"先说好：三个点，四个人一起跑","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"joined_her_three_points","next":""},{"text":"看她怎么圈，先不插话","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"watched_her_mark","next":""},{"text":"提醒她：前天破的那条例也写进今天","affectionWho":"","affection":0,"insomnia":0,"flag":"reminded_her_broken_rule","next":""}]},{"type":"narration","text":"她说完这句，从椅子上站起来，走到那块挂着城市草图的白板前面。她拿起笔，在图上圈了三个点，然后在那三个点旁边各写了一个日期。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这是我能确定的三起。城际车站，西区塌方，还有这里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"三起都不是自然发生的。它们在同一条线上，而且间隔在缩短。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"缩短说明什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"说明做这件事的东西在加快，或者在按一种我们还没看懂的名单往外划。"},{"type":"narration","text":"她放下笔，转过来看我们三个。她看了一圈，最后停在我身上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"林晓。你记得的那个人，我一直没有问你。"},{"type":"choice","text":"","prompt":"她终于要问那个问题了。你预备怎么答？","options":[{"text":"先想清楚再答：有关系吗，有多大","affectionWho":"","affection":0,"insomnia":0,"flag":"weighed_the_answer","next":""},{"text":"打算实话全说，包括旧校舍","affectionWho":"","affection":0,"insomnia":1,"flag":"planned_full_truth","next":""},{"text":"想反问：为什么是现在才问","affectionWho":"艾莉丝","affection":3,"insomnia":1,"flag":"asked_why_now","next":"#l05"}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"现在问：他跟名单上这些人有关系吗。","label":"l05"},{"type":"narration","text":"我想了很久。我想起那张贴在玻璃上的校服，想起那间教室最后一排的那张脸，想起她说「你终于来了」的时候，用的是小雅的声音。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"有关系。我看见他的地方，是六年前的旧校舍。那不是我的学校。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"而且我记得他，可我记不住他的脸。"},{"type":"narration","text":"屋子里很静。艾莉丝拿起笔，在我的本子封面边上写了一行字。她用的是蓝笔，写的是「对象仍在缺失中」。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"那就记着。记着比什么都便宜，也比什么都难。"},{"type":"choice","text":"","prompt":"「记着比什么都便宜，也比什么都难。」这句你怎么过中午？","options":[{"text":"把这句话抄在本子扉页","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_her_line","next":""},{"text":"吃饭时谁都不提上午，照她的话做","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_noon_quiet","next":""},{"text":"忍不住想：那被记的人知不知道","affectionWho":"","affection":0,"insomnia":1,"flag":"wondered_if_they_know","next":""}]},{"type":"narration","text":"中午我们吃的是便利店的饭团。没人提上午那件事，四个人坐得很松散，两个在桌边，两个在窗台边。"},{"type":"narration","text":"雷恩吃完饭把那只手翻过来看了一遍。绷带下面渗了点血，他没管它。他看的是手背那个圈，看了很久。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"你哥是在名单上被划掉的。我是被盖了章以后自己走掉的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"同一条路，两种走法，最后都归到一个地方。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那就别再往后走了。至少今天别。"},{"type":"narration","text":"下午她把旧档按日期重排了一遍，排到晚上的时候，她忽然抬头问小雅一个问题。"},{"type":"choice","text":"","prompt":"艾莉丝重排完旧档，忽然要试小雅。这个「试」你怎么看？","options":[{"text":"是好事，她的能力终于被当线索","affectionWho":"小雅","affection":5,"insomnia":0,"flag":"xya_became_lead","next":""},{"text":"有点被当样本的感觉，替她不平","affectionWho":"小雅","affection":4,"insomnia":1,"flag":"resented_the_testing","next":""},{"text":"先答应陪她去人多的地方","affectionWho":"小雅","affection":6,"insomnia":0,"flag":"agreed_to_crowd_test","next":"#l06"}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你前天说你能听见人声。这个能力，明天在别的地方还响吗。","label":"l06"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"响。今天早上我在楼下也听见了，是两个人在吵架，一个嗓门很大。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我想找个有很多人的地方试试。我有种感觉，那里会有人叫我的名字。"},{"type":"narration","text":"她说这话的时候很兴奋。她的手上还拿着便利贴，指尖沾着蓝色的墨。我看着她的眼睛，忽然有点不敢答应。"},{"type":"choice","text":"","prompt":"小雅想去有人喊她的地方，你怎么安排明天？","options":[{"text":"陪她去旧东线的公交总站，那里是这条线上人最密的一处","affectionWho":"小雅","affection":8,"insomnia":1,"flag":"xya_to_east_terminal","next":""},{"text":"先让艾莉丝做一天数据记录，把她当观测对象而不是当同伴","affectionWho":"艾莉丝","affection":5,"insomnia":1,"flag":"xya_as_subject","next":""}]},{"type":"narration","text":"那天晚上十一点，作战室只剩我一个人。我把名单表上的三个日期抄到自己的本子上，抄完又把照片夹回夹层。"},{"type":"narration","text":"夹层里那张站台收据还在。它的字已经淡了，我用铅笔沿着原来的字迹描了一遍。"},{"type":"narration","text":"我描得很慢，描完把本子合上。我合上本子的时候，屋里那盏长条灯管刚好闪了一下。"},{"type":"narration","text":"我没有抬头。我现在很怕抬头，因为我不知道自己想看见谁。而我确实已经有三百三十六个小时没睡过觉了。"}]},"2-5":{"sceneId":"2-5","chapter":"第二幕·深入探索","title":"小雅的潜能","background":"bg_street_night","bgm":"bgm_mystery","dense":true,"next":"2-6","lines":[{"type":"narration","text":"第十六天，三月二十七号，凌晨四点。我又是醒着过的。这一夜我数自己的心跳数到四千多次，数到后来连数字都开始没有意义。"},{"type":"narration","text":"五点二十分，小雅发消息说她已经在基地门口。她从来不起这么早。她说她整夜都听见有人在叫她，声音不急，就一直在叫。"},{"type":"choice","text":"","prompt":"她整夜被人叫，一早只说自己到了。先问哪一句？","options":[{"text":"问她那声音是从几点开始叫的","affectionWho":"小雅","affection":4,"insomnia":-1,"flag":"asked_when_the_voices_began","next":""},{"text":"先不问，把她那台旧录音机看一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_recorder_before_asking","next":"#l01"},{"text":"问她昨晚有没有把宿舍的门关上","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_she_had_closed_the_door","next":"#l01"}]},{"type":"narration","text":"她想了想，说从两点半开始。叫她的不止一个，声音都不大，像怕吵醒谁。"},{"type":"narration","text":"我问她为什么这么早来。她说，不来这些声音就没人接了。"},{"type":"narration","label":"l01","text":"我们六点出发。她背着那个洗得发白的帆布包，包里塞了三本新买的笔记本、两支笔、一台旧录音机。录音机是她从寄卖店淘的，按键很硬，按下去会弹回来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"今天不管听见什么，我都写下来。写下来就不会没了。"},{"type":"choice","text":"","prompt":"她说写下来就不会没了。你信这句话吗？","options":[{"text":"信，把她的话原样抄进自己的本子","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_her_vow_into_my_notebook","next":""},{"text":"不信，但提醒她抄错一个字就是改过别人的遗言","affectionWho":"","affection":0,"insomnia":-1,"flag":"warned_her_about_miswriting","next":""},{"text":"不答，只要求她每页都写上时间","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_for_a_timestamp_on_every_page","next":""}]},{"type":"narration","text":"我们坐的电车往东走。一路上经过四个还在运营的站，站台上的人挤得很规矩。过了第四站以后，车上只剩我们和两个打盹的清洁工。"},{"type":"narration","text":"第七站开始，站名牌下面多了一块小铁牌，写着「临时停用」。铁牌有三种字体，钉在不同年份，最新那块钉得最浅。"},{"type":"choice","text":"","prompt":"三种字体，钉在不同年份。先查哪一块？","options":[{"text":"数最旧那块铁牌周围的锈圈","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_rings_of_rust","next":""},{"text":"三块都拍下来，回去再比对","affectionWho":"","affection":0,"insomnia":0,"flag":"photographed_all_three_plates","next":""},{"text":"去问站台上打盹的清洁工","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_the_dozing_cleaner","next":""}]},{"type":"narration","text":"我们要去的是旧东线的总站。那条线路在六年前被停掉，理由是客流不足。可是沿着铁轨往东看，一路都有新的修补痕迹——碎石是新的，枕木也是新的，有些地方甚至打了补丁桩。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"停用的线不用修得这么勤。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"有人在给它做维护。我查过拨款记录，这条线的养护费六年没断过。"},{"type":"choice","text":"","prompt":"养护费六年没断过。这条线是谁在养？","options":[{"text":"请艾莉丝去查拨款单上的签字","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"asked_alice_to_trace_the_signatures","next":""},{"text":"自己记一笔，先不声张","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_funding_note_quiet","next":""},{"text":"猜是信徒在替这座城市修路","affectionWho":"","affection":0,"insomnia":0,"flag":"guessed_the_believers_kept_the_line","next":""}]},{"type":"narration","text":"七点四十分，电车停在一段临时站台外面。再往前，铁轨被两道水泥墩封住，墩上贴着褪色的公告。"},{"type":"narration","text":"我们从站台侧面的斜坡走下去。斜坡下是一片很大的空地，空地尽头是一栋两层的候车厅，屋顶塌了一角，玻璃全没了，露出里面一排排空着的座椅。"},{"type":"narration","text":"这就是旧东线的总站。这里没有车，没有乘客，连雨都在上个月停了。可它不安静。"},{"type":"choice","text":"","prompt":"这里没有车，却比车站还吵。怎么进去？","options":[{"text":"走在小雅前面，替她挡一下","affectionWho":"","affection":0,"insomnia":0,"flag":"walked_ahead_into_the_noise","next":""},{"text":"走在她后面，看她往哪儿走","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_xya_into_the_hall","next":""},{"text":"让艾莉丝带着仪器先进去","affectionWho":"","affection":0,"insomnia":0,"flag":"sent_alice_in_with_the_instrument","next":""}]},{"type":"narration","text":"我一走进空地就听见了那种底噪——像很多人同时在很远的地方说话，音量被压得很低，只有轮廓没有词。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你在这里还听得见吗。"},{"type":"narration","text":"小雅没有立刻答。她把手指按在嘴唇上，站在原地听了半分钟。然后她往前走，走得很有目标，像在一间关着灯的房间里摸自己的路。"},{"type":"choice","text":"","prompt":"她在关着灯的房间里认路。要不要打断她？","options":[{"text":"不打断，跟着她的步子走","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_xyas_pace","next":""},{"text":"拉住她的手腕，问她听见几个","affectionWho":"","affection":0,"insomnia":0,"flag":"stopped_her_to_count_the_voices","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"这里的人比昨天多。多得数不过来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"而且他们不是在喊。他们是在排队。"},{"type":"narration","text":"我们跟着她走进了候车厅。大厅中央立着一块很大的出发时刻板，是老式的翻牌机，白色的小牌子一块压着一块。板上停着一行字，日期是六年前的那一天。"},{"type":"narration","text":"小雅走到板下，抬头。她看了很久，然后指着最下面那块翻牌。"},{"type":"choice","text":"","prompt":"板停在六年前那一天。要不要抄下来？","options":[{"text":"整版抄进本子，连错字一起","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_the_whole_board_with_its_typos","next":""},{"text":"只抄她指的那一块","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_only_the_row_she_pointed_at","next":""},{"text":"先问这块板这些年通没通电","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_the_board_had_power","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"这块是给一个提着行李的女人。她在跟我说话。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"她说的是什么。"},{"type":"narration","text":"她闭上眼。她念的时候语速跟平时完全不一样，慢、平，中间会在不该停的地方停一下。她自己听不见她自己念得像什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"「六点五十那班，麻烦你帮我看一眼，我儿子会来送我。」"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"「他要是来了，你告诉他我在二号口。我包里有给他的东西，别让他等我太久。」"},{"type":"choice","text":"","prompt":"她托人看一眼六点五十那班。这句话怎么处理？","options":[{"text":"一字不改地记进名单","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_mothers_words_verbatim","next":""},{"text":"追问她儿子后来来了没有","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_whether_the_son_came","next":""},{"text":"请小雅先别替任何人答应","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_her_not_to_answer_for_others","next":""}]},{"type":"narration","text":"她念完睁开眼，眼圈已经红了。她不是替那个人难过，她是替自己听见了这些却接不住而难过。"},{"type":"narration","text":"我打开录音机。红灯亮起来的一瞬间，大厅里的底噪忽然变了——从很远的轮廓变成了很近的句子，一句一句叠在一起，像几十个人同时在对着这台机器讲话。"},{"type":"choice","text":"","prompt":"红灯一亮，声音就凑近了。要不要关掉机器？","options":[{"text":"关掉，它们不该被录下来","affectionWho":"","affection":0,"insomnia":-1,"flag":"switched_the_recorder_off","next":""},{"text":"让它继续录，录到带子用完","affectionWho":"","affection":0,"insomnia":0,"f :"「告诉他，往里走。」"},{"type":"narration","text":"整间候车厅的温度好像掉了一度。我听见自己问话的时候，声音是哑的。"},{"type":"choice","text":"","prompt":"那句「往里走」不是她的声音。你往哪边走？","options":[{"text":"往里走，走到站台尽头","affectionWho":"","affection":0,"insomnia":0,"flag":"walked_to_the_end_of_the_platform","next":""},{"text":"不走，握住小雅的手","affectionWho":"","affection":0,"insomnia":-1,"flag":"held_her_hand_instead_of_going","next":"#l02"},{"text":"先问艾莉丝的意见","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_alice_before_moving","next":"#l02"}]},{"type":"narration","text":"我往里走了三步，鞋底踩到一块碎玻璃，玻璃没有响。"},{"type":"narration","text":"小雅跟在我后面，伸手扶了一下我的袖子。"},{"type":"dialogue","label":"l02","speaker":"林晓","sprite":"linxiao_shock","text":"他是谁。他为什么一直跟着你。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他不给我看。他只说了一遍，说得很慢，像怕我记不住。"},{"type":"narration","text":"她说完这句就往后退，退到了检票台边上。她低头看自己写的那些句子，看了几秒，忽然把那页撕了下来。"},{"type":"choice","text":"","prompt":"她把那一页撕了下来。要不要拦？","options":[{"text":"拦住，撕下来的也算证据","affectionWho":"","affection":0,"insomnia":0,"flag":"stopped_her_from_tearing_the_page","next":""},{"text":"不拦，帮她把纸屑收干净","affectionWho":"","affection":0,"insomnia":-1,"flag":"swept_up_the_torn_page","next":""},{"text":"自己把那一页重新抄一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"recopied_the_torn_page","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"这些不是他们说的原话。是我听成这样的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我要是听错了，那这些字就是把别人的话改掉了。"},{"type":"narration","text":"她把那张纸攥在手心，攥成很小一团。她怕的不是这些声音，她怕的是自己。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你没听错。至少没全错。"},{"type":"narration","text":"艾莉丝把那台监测仪翻过来，指着屏幕底下那串记录。屏幕上那条线还是干净的，可线下面多了一行时间戳，是我们进来以后的二十七分钟。"},{"type":"choice","text":"","prompt":"线很干净，下面却多了一行时间戳。你信哪个？","options":[{"text":"信那行时间戳","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_the_timestamp","next":""},{"text":"信那条干净的线","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_the_flat_line","next":""},{"text":"两个都记下来，回去再吵","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_both_readings","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"仪器测不到内容，但它测到了「有东西一直在场」。二十七分钟里没断过。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"所以你听到的不是你的想象。你听到的是我们测不到、但确实在那里的东西。"},{"type":"narration","text":"小雅抬起眼看她。那一眼里有感激，也有一种更难看懂的东西——像一个人第一次确认自己不是坏掉了，而是变成了别的什么。"},{"type":"choice","text":"","prompt":"她第一次确认自己没坏掉。要不要给她看记录？","options":[{"text":"把监测仪的记录抄给她看","affectionWho":"","affection":0,"insomnia":0,"flag":"showed_her_the_instrument_log","next":""},{"text":"什么也不说，让她自己决定","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_her_decide_alone","next":"#l03"},{"text":"把机器转过去，屏幕对着她","affectionWho":"","affection":0,"insomnia":0,"flag":"turned_the_screen_toward_her","next":"#l03"}]},{"type":"narration","text":"她看完只问了一句：那这些声音是不是也算有人证。"},{"type":"narration","label":"l03","text":"她把手里那团纸慢慢展开，抚平，重新贴回本子上，用胶带粘了四条边。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那我不撕了。我抄的每一个字都留下。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"要是有哪一个抄错了，以后总有人能看出来。"},{"type":"narration","text":"接下来一个小时，她一直在写。她写满了五页，写完把本子递给我，说她要去外面透口气。"},{"type":"choice","text":"","prompt":"她把本子递给你就出去了。要不要翻开？","options":[{"text":"当场翻开，从第一页读起","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_pages_at_once","next":""},{"text":"先合上，等她回来一起看","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_to_read_it_with_her","next":""}]},{"type":"narration","text":"她走出候车厅以后，我把她写的东西从头看了一遍。那些句子我一句都不认识，可我读到第三页的时候，鼻子忽然一酸。"},{"type":"narration","text":"因为那五页里面，有十一句是「你别来找我」。十一句，用十一种说法，写给十一个不同的人。"},{"type":"choice","text":"","prompt":"十一句都是「你别来找我」。要不要念给她听？","options":[{"text":"念给她，一句不剩","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_eleven_lines_aloud","next":""},{"text":"不念，把这一页折个角","affectionWho":"","affection":0,"insomnia":-1,"flag":"folded_the_corner_of_that_page","next":""},{"text":"抄一份收进自己口袋","affectionWho":"","affection":0,"insomnia":0,"flag":"pocketed_a_copy_of_the_eleven","next":""}]},{"type":"narration","text":"她推门进来的时候头发上沾了灰。她说外面有一条野狗蹲在水泥墩上，看了一会儿就走了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"还有一件事。刚才那个女声说完那句话以后，他停了一下。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"然后他又补了三个字。我听得很清楚。"},{"type":"choice","text":"","prompt":"她话说到一半停住。要不要替她说出那三个字？","options":[{"text":"不替她说，等她自己开口","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_her_to_say_it","next":""},{"text":"先猜一个：第三层","affectionWho":"","affection":0,"insomnia":0,"flag":"guessed_the_third_floor_out_loud","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"哪三个字。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"「在第三层。」"},{"type":"narration","text":"我脑子里那根线又绷了一次。老周第一次见我的时候说的也是层数。他让我别回头，那之后就再没露过面。"},{"type":"narration","text":"我在本子上写了「第三层」三个字，写完在旁边打了一个圈。圈打得很用力，笔尖把纸划破了。"},{"type":"choice","text":"","prompt":"这个圈把纸都划破了。要不要给艾莉丝看？","options":[{"text":"给她看，问她档案里有没有层数","affectionWho":"","affection":0,"insomnia":0,"flag":"showed_alice_the_circled_words","next":""},{"text":"先不给她，自己去图书馆查","affectionWho":"","affection":0,"insomnia":0,"flag":"planned_to_check_the_library_alone","next":""},{"text":"把圈涂掉，当没写过","affectionWho":"","affection":0,"insomnia":-1,"flag":"scribbled_out_the_circle","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"今天把这些带回去。明天我要做一件更狠的事。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"多狠。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"把这些点和裂缝的位置叠起来看。如果它们是同一件事的两面，图会告诉我们往哪边走。"},{"type":"narration","text":"中午我们在大厅里吃了带的面包。小雅一边吃一边在本子封面上写字，写完给我看。她写的是：「我不是听鬼的人。我是听没被算进去的人。」"},{"type":"choice","text":"","prompt":"她把那句话写在本子封面上。要不要抄？","options":[{"text":"原样抄进自己的本子","affectionWho":"","affection":0,"insomnia":0,"flag":"copied_the_line_from_her_cover","next":""},{"text":"不抄，记在心里","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_her_line_unwritten","next":""},{"text":"问她借这个本子用一天","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_to_borrow_her_notebook","next":""}]},{"type":"narration","text":"我觉得这句话说得比我写过的任何一句都准。我把它原样抄进了自己的本子。"},{"type":"narration","text":"离开之前，我最后看了一眼那块出发时刻板。它停着的那行字我看了两遍，第二遍的时候我的眼睛忽然跳了一下。"},{"type":"narration","text":"那行字的日期没变。但下面的滚动时间从六点五十变成了六点四十。八十分钟里，这块死了六年的板子往前挪了十分钟。"},{"type":"choice","text":"","prompt":"死了六年的板子往前挪了十分钟。先告诉谁？","options":[{"text":"告诉艾莉丝，让她拍照","affectionWho":"","affection":0,"insomnia":0,"flag":"had_her_photograph_the_board","next":""},{"text":"告诉小雅，问她那些声音还在不在","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_the_voices_remained","next":""},{"text":"谁也不告诉，自己记下时间","affectionWho":"","affection":0,"insomnia":-1,"flag":"logged_the_board_time_alone","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"艾莉丝。这块板在走。"},{"type":"narration","text":"她回来看了一眼，把相机举起来拍了三张。她拍的时候没有出声，拍完把相机收进口袋，说了句很短的话。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"它在倒计时。"},{"type":"choice","text":"","prompt":"小雅今天听到的东西要不要上报？","options":[{"text":"先不上报，只把五页记录和倒计时照片留在队内","affectionWho":"小雅","affection":8,"insomnia":1,"flag":"kept_xya_log_internal","next":""},{"text":"按流程把监测原始数据交回研究所，换取更大权限","affectionWho":"艾莉丝","affection":4,"insomnia":2,"flag":"handed_data_to_institute","next":""}]},{"type":"narration","text":"回程的电车上，小雅把录音机还给我。她说机器里什么都没录到。"},{"type":"narration","text":"我把带子倒回来放了一遍。前三十秒是空的，只有电流的杂音；然后是十秒的风声；最后那几秒里，有一个很轻的声音在数数，从一数到七。"},{"type":"choice","text":"","prompt":"带子里有人在数数，从一数到七。要不要重放？","options":[{"text":"倒回去，再放一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"replayed_the_counting","next":""},{"text":"不放，把带子收进包里","affectionWho":"","affection":0,"insomnia":-1,"flag":"packed_the_tape_unplayed","next":""},{"text":"记下格数，回去在安静地方放","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_the_counter_before_replaying","next":""}]},{"type":"narration","text":"我把机器关了。我合上盖子的时候，小雅已经靠着窗睡着了。她的手还压在那本贴满胶带的本子上。"},{"type":"narration","text":"车窗外是下午的城市，灯还没亮。我看着那些楼一栋栋往后走，忽然想到一件事：如果这块地方的板子在倒计时，那别的死人地方是不是也在倒计时。"},{"type":"choice","text":"","prompt":"你写下「问艾莉丝」。现在问还是回去问？","options":[{"text":"现在发消息问","affectionWho":"","affection":0,"insomnia":0,"flag":"sent_the_question_now","next":""},{"text":"回去当面问，看着她问","affectionWho":"","affection":0,"insomnia":0,"flag":"saved_the_question_for_face_to_face","next":""},{"text":"先不问，自己把地图摊开对","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_the_map_before_asking","next":""}]},{"type":"narration","text":"我在本子上记下这个问题，然后画了一条横线。横线下面我写了三个字：问艾莉丝。"}]},"2-6":{"sceneId":"2-6","chapter":"第二幕·深入探索","title":"时间的真相","background":"bg_institute_night","bgm":"bgm_tension","dense":true,"next":"2-7","lines":[{"type":"narration","text":"第十九天，三月三十号，深夜十一点。我们在研究所那间小实验室里坐了整整十六个小时，桌上摊着三样东西：艾莉丝的名单，小雅的本子，还有从旧东线带回来的那三张照片。"},{"type":"narration","text":"白板上打了一张城市底图，图钉压着四角。图上的红点是这四年里所有能定位的裂缝，蓝点是小雅听见过人声的地方，黑点是我们四个亲自走过的地方。"},{"type":"choice","text":"","prompt":"三样东西摊在桌上。先从那一份下手？","options":[{"text":"先核小雅的本子，把蓝点一个一个对上","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"cross_checked_xyas_notebook_first","next":""},{"text":"先核艾莉丝的名单，从日期排到位置","affectionWho":"","affection":0,"insomnia":0,"flag":"cross_checked_the_roster_first","next":"#l01"},{"text":"先看那三张照片，别的等会儿再说","affectionWho":"","affection":0,"insomnia":-1,"flag":"looked_at_the_three_photos_first","next":"#l01"}]},{"type":"narration","text":"我把本子按页码摊开，她在旁边报地名，我报日期，两列数字第一次对上。"},{"type":"narration","text":"对到第七页的时候，她的手指开始发抖，不是冷。"},{"type":"narration","label":"l01","text":"白天我们把红点一个一个敲进坐标系，敲到第一百个的时候，艾莉丝停下了手。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"它不是一条线。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那是什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"是一圈一圈往外走的螺旋。每转一圈，半径大一点，间隔短一点。"},{"type":"choice","text":"","prompt":"它不是线，是螺旋。要不要把图层全打开？","options":[{"text":"要求把所有能定位的裂缝叠进同一张图","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_for_every_rift_on_one_map","next":""},{"text":"只保留最近三个月的点，先看形状","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_only_the_last_three_months","next":""},{"text":"关掉图层，先听小雅说","affectionWho":"","affection":0,"insomnia":0,"flag":"turned_the_layers_off_to_listen","next":""}]},{"type":"narration","text":"她把图层打开，把一百个红点从最早连到最近。连完以后，白板上出现的不是一条街、不是一条轨道，是一张很薄的、往外扩张的螺纹。"},{"type":"narration","text":"第一圈出现在三个半月前，半径很小，集中在城北；第二圈落到西区，第三圈扫过车站与东线，第四圈已经开始逼近市中心。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"第一圈在哪儿。"},{"type":"choice","text":"","prompt":"雷恩问第一圈在哪儿。敢不敢让他先知道？","options":[{"text":"让他一起看，不瞒他","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"let_raine_see_the_center_first","next":""},{"text":"先不说，等图画完再讲","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_until_the_map_was_done","next":""}]},{"type":"narration","text":"艾莉丝用红笔把螺纹的最里面那一小圈圈出来。那一圈里只有一个点。点被标在一个很旧的位置上，位置的名字是历史图书馆。"},{"type":"narration","text":"屋里安静了几秒。我没有出声，因为我第一次走进那栋楼的时候，只是去查一本借出去的书。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"第一起在图书馆。我是从我上班的地方开始的。"},{"type":"choice","text":"","prompt":"中心是你上班的地方。这一句你怎么接？","options":[{"text":"承认我第一天就是从那儿开始的","affectionWho":"","affection":0,"insomnia":0,"flag":"admitted_i_started_at_my_workplace","next":""},{"text":"闭嘴，让艾莉丝把话说完","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_alice_finish_the_sentence","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"不是从你开始。螺旋的中心在那栋楼，你只是最后走到那里的人。"},{"type":"narration","text":"小雅坐在角落里，把那三本笔记本摊开在膝盖上。她的拇指一直停在某一行的位置，没有动过。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我把蓝点和红点对了一遍。有十一个地方两个点重合。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"十一个地方都是我听见过人声的地方。也都是图上出过裂缝的地方。"},{"type":"choice","text":"","prompt":"十一个重合点。要不要当场把名单念一遍？","options":[{"text":"念出来，一个点一个点对名字","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_eleven_points_aloud","next":""},{"text":"不念，先把重合点抄进自己的本子","affectionWho":"","affection":0,"insomnia":-1,"flag":"copied_the_overlapping_points_silently","next":""},{"text":"只念我认得的那几个","affectionWho":"","affection":0,"insomnia":0,"flag":"read_only_the_names_i_knew","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那就不是巧合了。"},{"type":"narration","text":"她把白板擦掉一半，重新画了一张更简单的图：左边写「人」，右边写「裂缝」，中间画了一个箭头。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我一直在按顺序算：先有裂缝，然后有人不见了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"今天这张图告诉我，顺序反了。先有人被删掉，然后他消失的那个位置才裂开。"},{"type":"choice","text":"","prompt":"顺序反了。这个结论敢写在白板上吗？","options":[{"text":"写上去，字写大一点","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_reversed_order_on_the_board","next":""},{"text":"不写，只在纸上记一笔","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_reversed_order_on_paper","next":""},{"text":"先问雷恩同不同意再写","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_raine_before_writing_it","next":""}]},{"type":"narration","text":"我盯着那个箭头看了很久。它很小，很普通，可它把这一年我信过的所有东西翻了个面。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"裂缝不是灾难。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"裂缝是删除留下的伤口。"},{"type":"narration","text":"雷恩把椅子往后推了一下。他站起来走到白板前面，用那只没受伤的手指着螺旋最外那几圈。"},{"type":"choice","text":"","prompt":"雷恩站起来走到白板前面。要不要让他接手讲？","options":[{"text":"让他讲，外圈他走得最多","affectionWho":"","affection":0,"insomnia":0,"flag":"handed_the_explanation_to_raine","next":""},{"text":"不让，这一晚必须把图做完","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_explanation_for_alice","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"这些圈在往市中心收。照这个速度，多久到中间。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我从第一圈到现在算了三遍。七十天、二十三天、八天、三天、一天。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"每一次间隔都是上一次的三分之一。下一次间隔已经不到一天。"},{"type":"choice","text":"","prompt":"间隔已经不到一天。要不要把倒计时写上白板？","options":[{"text":"写：下一次不到一天","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_countdown_on_the_board" lm","text":"这句话是这一晚最重要的结论。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"仪器测不到删除，测得到的只有残留的裂缝。我们能看见删除，是因为队伍里有两个人不带仪器。"},{"type":"choice","text":"","prompt":"一个听得见，一个记得住。这是能力还是伤口？","options":[{"text":"说破：这是伤口，不是本事","affectionWho":"","affection":0,"insomnia":0,"flag":"called_it_a_wound_not_a_gift","next":""},{"text":"不说，把监测仪推到一边","affectionWho":"","affection":0,"insomnia":-1,"flag":"pushed_the_instrument_aside","next":""}]},{"type":"narration","text":"她说完这句话，看了小雅一眼，又看了我一眼。她的意思很清楚：一个听得见，一个记得住，这两样东西不是能力，是伤口。"},{"type":"narration","text":"小雅把这个意思接了下去。她说的时候语气很淡，像在替我们两个人念一份病历。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"被删掉的人如果还有人在找，他就不会彻底没。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我一个人都还没找回来过。我听见了他们的名字，可我不知道该往哪儿去捞。"},{"type":"choice","text":"","prompt":"小雅说她一个人都没捞回来。你怎么接？","options":[{"text":"告诉她抄下来的每一页都算数","affectionWho":"","affection":0,"insomnia":-1,"flag":"told_her_every_page_counts","next":""},{"text":"不接话，把她的本子推回她手里","affectionWho":"","affection":0,"insomnia":-1,"flag":"handed_the_notebook_back_to_her","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我来找的这三年里，唯一一次差一点捞到的，是东侧那块碎片。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"那块碎片里有五个小时。我妹妹最后那五个小时。"},{"type":"narration","text":"他说这话的时候没有看我们。他把那只包着绷带的手在身侧握了握，握完松开，又握。"},{"type":"narration","text":"我忽然想到一件事，这件事一想出来我的手就凉了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"裂缝如果是伤口，那里面装着东西就不是意外。"},{"type":"choice","text":"","prompt":"裂缝里装着东西。要不要当场提出进去取？","options":[{"text":"提出进去取，哪怕只取一个小时","affectionWho":"","affection":0,"insomnia":0,"flag":"proposed_to_retrieve_from_the_rift","next":""},{"text":"不提，今晚只把图做完","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_night_to_the_map","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"有人在删人的时候，把删掉的那一段留在裂缝里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"留着的目的是什么。"},{"type":"dialogu
