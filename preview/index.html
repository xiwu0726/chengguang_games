ed_to_her_reading_back","next":""},{"text":"不说话，把笔递给她。","affectionWho":"","affection":0,"insomnia":-1,"flag":"handed_her_the_pen","next":""},{"text":"请她把字写小一点。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_for_smaller_writing","next":""}]},{"type":"narration","text":"笔已经在她手里了。笔上还留着我手心的温度。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"小雅，你在外面记，别跟着我进去。"},{"type":"narration","text":"她没答应，也没摇头。她只是把桌上那支笔拿起来，别在自己上衣口袋里，像是先占住一个位置。"},{"type":"narration","text":"小雅笑了一下。她笑的时候眼睛下边还有没睡好的青，但那一下是真的笑。这是这一天里唯一像样的东西。"},{"type":"choice","text":"","prompt":"唯一像样的东西是她的笑。要留住么？","options":[{"text":"说：留着，明天还要用。","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_smile_for_tomorrow","next":""},{"text":"不说话。把它记下来。","affectionWho":"","affection":0,"insomnia":-1,"flag":"memorized_the_short_smile","next":""},{"text":"问她完事以后想吃什么。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_about_meals_afterwards","next":""}]},{"type":"narration","text":"我把它记下来了。笑是这几天里唯一不用上交的东西。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那我把剩下的部分说清楚。三条路线摆在这儿，你们选。"},{"type":"narration","text":"她把管网图铺开，用三颗图钉钉住两个方案的位置，一个留着让第三个人自己决定。第一颗钉在核心正上方，第二颗钉在外环的检修井。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"走正上方快，四十分钟能到门；被发现的概率最高。走检修井慢，要绕两个半小时，但守望者那条旧路在井下面。"},{"type":"choice","text":"","prompt":"三条路，各带一个代价。要问她的意见么？","options":[{"text":"问她自己要走哪条。","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"asked_alices_own_choice","next":""},{"text":"问哪条最难回来。","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_which_was_no_return","next":""},{"text":"说旧路你走过一段。","affectionWho":"","affection":0,"insomnia":0,"flag":"claimed_the_old_road","next":""}]},{"type":"narration","text":"三颗图钉各有一小片影子。影子都很短，方向是一样的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"还有一种，是我们谁都不动，先把名单和记录送出去。今晚就送。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"第三条不算方案。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"它算。它只是不好看。"},{"type":"narration","text":"我拿着笔在图上看了一会儿。纸上那颗钉在正上方的图钉，钉帽上有一道划痕，是艾莉丝今天上午刚弄出来的。"},{"type":"choice","text":"","prompt":"四月九号进门的方案，怎么定？","options":[{"text":"走正上方，快、直接，把三分钟干扰器用在最需要的地方","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"plan_direct_assault","next":"3-2"},{"text":"走检修井，绕两个半小时，用守望者那条旧路线保全部队形","affectionWho":"艾莉丝","affection":8,"insomnia":1,"flag":"plan_maintenance_shaft","next":"3-2"},{"text":"两条都走，我今晚留在档案间把三条路线对着图纸再核一遍","affectionWho":"","affection":0,"insomnia":1,"flag":"plan_final_draft_alone","next":"3-1a"}]},{"type":"narration","text":"方案定下来的时候是下午两点。雨还没停。我们把图纸分了三份，一份压在桌角，一份塞进车里的工具袋，第三份卷起来用胶带缠好，交给小雅。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"这份我贴身带着。哪怕我把今天全忘光，它还在。"},{"type":"narration","text":"散会之后每个人去了不同的地方。艾莉丝去整理读取口的参数，雷恩去下面清点干扰器，小雅上街买明天开始要吃的干粮。"},{"type":"choice","text":"","prompt":"每个人都有了去处。你去哪儿？","options":[{"text":"去档案间。","affectionWho":"","affection":0,"insomnia":0,"flag":"went_to_the_archive_room","next":""},{"text":"先去街上走一圈。","affectionWho":"","affection":0,"insomnia":-1,"flag":"walked_the_changed_streets","next":""},{"text":"回去看那把空椅子。","affectionWho":"","affection":0,"insomnia":0,"flag":"went_to_see_the_chair","next":""}]},{"type":"narration","text":"档案间的灯是暗的。四张纸还在原来的位置上。"},{"type":"narration","text":"我留在档案间。我把三条路线重画了一遍，又在旁边画了第四张：如果进去以后出事，谁能从哪儿退出来。"},{"type":"narration","text":"那张图我画到晚上十一点四十。画完我趴在桌上，本子摊在左手边，笔掉在地上，没去捡。"}]},"3-1a":{"sceneId":"3-1a","chapter":"第三幕·最终决战","title":"深夜的两个人","background":"bg_base","bgm":"bgm_ambient","next":"3-2","lines":[{"type":"narration","text":"第二十六天，四月六号，深夜十一点五十七分。基地里的人走空了以后，我才发现这地方其实很吵。"},{"type":"narration","text":"不是人吵。是管道。基地是拿旧地铁的检修层改的，头顶每隔几分钟就有一班空车碾过去，碾过去的时候整间屋子的灯会跟着抖一下。"},{"type":"choice","text":"","prompt":"空车一班接一班。这几天的觉，你打算怎么熬？","options":[{"text":"把每班车的时间记在图纸边上","affectionWho":"","affection":0,"insomnia":-2,"flag":"logged_the_empty_train_times","next":""},{"text":"不记。图要紧","affectionWho":"","affection":0,"insomnia":0,"flag":"skipped_logging_the_trains","next":""}]},{"type":"narration","text":"档案间在走廊最里面，一扇铁门，门锁坏了很久，只能用一根铁丝别着。我在这里铺了三条路线图，把第四张画在它们的边上。"},{"type":"narration","text":"第四张画的是退出路线。画到一半我发现，四条路有三条要经过同一段楼梯。这意味着一旦那一段被堵住，进去的人不是任务失败，是出不来。"},{"type":"choice","text":"","prompt":"那一段楼梯一堵，进去的人就出不来。这个发现怎么处理？","options":[{"text":"单独抄一份，贴身带着","affectionWho":"","affection":0,"insomnia":-2,"flag":"kept_the_stair_note_alone","next":"#l01"},{"text":"写进明天的方案里","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_stair_risk_into_plan","next":""},{"text":"也许是我多虑了","affectionWho":"","affection":0,"insomnia":-1,"flag":"doubted_the_stair_risk","next":""}]},{"type":"narration","text":"我把笔尖在那段楼梯上点了点，没有写字。写上去是个说法，不写，它至少还是个秘密。"},{"type":"narration","text":"我把这个发现圈了三遍，圈完看了一眼表：十一点五十七分。然后我听见走廊里有脚步。","label":"l01"},{"type":"narration","text":"那脚步很轻。走两步停一下，像是不确定要不要走到头，又像是怕吵醒什么。基地的走廊尽头只有这一间屋子还亮着灯。"},{"type":"choice","text":"","prompt":"门外的人走两步停一下。要不要先出声？","options":[{"text":"出声，省得她在门口站着","affectionWho":"","affection":0,"insomnia":0,"flag":"called_out_before_the_door","next":""},{"text":"不出。让她自己决定","affectionWho":"","affection":0,"insomnia":-2,"flag":"let_the_visitor_choose","next":""}]},{"type":"narration","text":"脚步声在我门口停住了。停了三秒。然后门上的铁丝被人从外面拨开，拨得很有耐心，一下一下，没有发出多余的响。"},{"type":"narration","text":"门开进来一条缝，走廊的冷气先挤进来。接着有个人侧着身子进来，进来的时候一只手扶着门框，另一只手里端着一个杯子。"},{"type":"choice","text":"","prompt":"她端着热的进来，一手扶着门框。你先接哪样？","options":[{"text":"先接杯子","affectionWho":"","affection":0,"insomnia":-1,"flag":"took_the_cup_first","next":""},{"text":"先问她怎么还没睡","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_why_she_was_up","next":""}]},{"type":"narration","text":"那杯东西冒着白气。杯壁上有一层水汽，手指按上去会留下印子。她把杯子放在我图纸的角上，压住了正上方那条线。"},{"type":"narration","text":"然后她坐下来。不是坐在对面，是坐在我旁边，椅子拉过来的时候花了点力气，那声铁腿刮地板的响在夜里特别刺耳。"},{"type":"choice","text":"","prompt":"她把椅子拉到你旁边。桌这边要不要让？","options":[{"text":"把图纸往她那边推一推","affectionWho":"","affection":0,"insomnia":-2,"flag":"slid_the_blueprint_toward_her","next":""},{"text":"不动。让她看我这边的乱","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_table_as_it_was","next":""}]},{"type":"narration","text":"我看见她肩上的外套有一片深色的水迹。今晚雨不小，她进来的时候没把水擦掉。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你画了三个小时了。炉子上的水烧干了两回。"},{"type":"narration","text":"我抬头看她。她没有看我，她在看那张图，看得很认真，眉头那里的褶子和白天开会时一模一样。"},{"type":"choice","text":"","prompt":"她不看你也知道你在画什么。要不要解释？","options":[{"text":"解释：退路总得有人画","affectionWho":"","affection":0,"insomnia":0,"flag":"explained_the_exit_route","next":""},{"text":"不解释，她看得懂","affectionWho":"","affection":0,"insomnia":-2,"flag":"let_the_drawing_speak","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你们不是都睡了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"睡了一会儿。醒了以后发现你的门缝还亮着。"},{"type":"narration","text":"她伸手把我画歪的那条线往正了一点。指尖碰到纸的时候我才发现，她的手也是凉的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你在画退出来的路，是不是。"},{"type":"choice","text":"","prompt":"她一眼看穿了退出路线。承认吗？","options":[{"text":"承认，瞒她没意思","affectionWho":"","affection":0,"insomnia":-2,"flag":"admitted_the_exit_plan","next":""},{"text":"先反问她在看哪条线","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_which_line_she_saw","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你怎么看出来的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你在入口那条线上画了两个箭头。进去一个，出来一个。今天下午的方案里没有出来那一段。"},{"type":"narration","text":"我愣了一下。白天铺图的时候，她一直在桌子末端，我没想到她把图看得这么细。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"三条路里有三条走同一段楼梯。我不想把这件事写在明天的方案上，写上去会有人不肯去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"所以你先自己记住了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"总得有人记住。"},{"type":"choice","text":"","prompt":"这段楼梯只你一个人记着。要不要多拉一个人记？","options":[{"text":"拉她一起记，两个人不容易丢","affectionWho":"","affection":0,"insomnia":-3,"flag":"shared_the_stair_memory","next":""},{"text":"不拉，这是我该自己背的","affectionWho":"","affection":0,"insomnia":0,"flag":"carried_the_stair_note_alone","next":""}]},{"type":"narration","text":"她把杯子往我这边推了一点，推到我的手边。我没喝，但杯子贴着我的小指，那一小块地方很快就热了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你知道你今天下午答应的时候，我在想什么吗。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"想我是不是又在逞能。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我在想，四月九号那天要是门只能开一次，我们四个人里最先没的会不会是你。"},{"type":"choice","text":"","prompt":"她把最狠的那句说出口了。你怎么接？","options":[{"text":"先接住这句再说话","affectionWho":"","affection":0,"insomnia":-2,"flag":"caught_her_worst_question","next":"#l02"},{"text":"岔开，先说图纸","affectionWho":"","affection":0,"insomnia":0,"flag":"dodged_into_the_blueprint","next":""}]},{"type":"narration","text":"我想先把这句接住，又怕一开口就把它说小了。"},{"type":"narration","text":"她这句话说得很轻，轻到我差点没接住。我听懂了她的意思：她下午点过头的那份方案里，第一个要念名字的人是我，第一个可能出事的人也是我。","label":"l02"},{"type":"narration","text":"她没有再往下说。她低头把自己摊在桌上的左手看了一眼。她这只手白天一直握着那台仪器，握出了两道浅浅的印子。"},{"type":"choice","text":"","prompt":"她低头看手，不说话了。要不要先开口？","options":[{"text":"先说她手上的印子","affectionWho":"","affection":0,"insomnia":-1,"flag":"spoke_about_her_hands","next":""},{"text":"等她先抬头","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_for_her_to_look_up","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你手上的印子，是仪器压出来的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"握久了就这样，明天早上会消。"},{"type":"narration","text":"她说这句话的时候终于抬头。屋里的灯管抖了一下，她的脸在那一抖里暗了半秒。"},{"type":"choice","text":"","prompt":"灯抖的那半秒，你在看她还是在看图？","options":[{"text":"在看她","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_her_in_the_flicker","next":""},{"text":"在看图","affectionWho":"","affection":0,"insomnia":-1,"flag":"watched_the_map_in_the_flicker","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你在想什么。今天下午四点以后你就没正眼看过我。"},{"type":"choice","text":"","prompt":"她问你在想什么。说实话还是打折？","options":[{"text":"说实话","affectionWho":"","affection":0,"insomnia":-2,"flag":"said_what_he_was_thinking","next":""},{"text":"说一半，留一半","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_half_the_thought","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我在想你说的那句话。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我在想你有没有在想我。"},{"type":"narration","text":"我想了一个很没出息的回答，说了一句比它更没出息的话。"},{"type":"narration","text":"我张了张嘴，本来想说我这两年一直在等一件值得等的事，话到嘴边觉得太像遗言，就把它咽回去了。咽回去以后我从嘴里出来的是一句很没出息的话。我说我不太会怕东西，我只是有点舍不得。"},{"type":"choice","text":"","prompt":"「舍不得」三个字出了口。要不要补一句？","options":[{"text":"补一句：舍不得的里面有她","affectionWho":"","affection":0,"insomnia":-2,"flag":"named_what_he_missed","next":""},{"text":"不补，话出去就出去了","affectionWho":"","affection":0,"insomnia":0,"flag":"left_the_words_as_said","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你别这么说。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你说得像在提前给自己写结尾。我最听不下去的就是这种话。"},{"type":"narration","text":"她说完这句自己停了。她大概也听出来自己这句话说得不太像平时的她。"},{"type":"narration","text":"她把杯子拿起来晃了晃，水面转了半圈。她看水面的时候比看我久，像是在那儿想措辞。"},{"type":"choice","text":"","prompt":"她难得词穷，看着水面想措辞。等不等？","options":[{"text":"等，把杯子替她扶正","affectionWho":"","affection":0,"insomnia":-2,"flag":"steadied_the_cup_and_waited","next":""},{"text":"不等，自己先开口","affectionWho":"","affection":0,"insomnia":0,"flag":"spoke_before_she_did","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我十五岁那年学会了一件事：凡是重要的话都留到第二天说。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我留到第二天的那句话，最后没人听到。所以我现在不留了。"},{"type":"narration","text":"屋子里安静了一会儿。头顶过去一班空车，声音从远到近，再从近到远。等那声音彻底没了，她才开口。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我今天来，不是为了劝你。方案定都定了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我是来问一件事。这件事我三个月前就想问了，一直没找着机会。"},{"type":"choice","text":"","prompt":"她三个月没问的那件事现在要问了。先应一声吗？","options":[{"text":"应一声：你问，我在听","affectionWho":"","affection":0,"insomnia":-1,"flag":"told_her_he_was_listening","next":""},{"text":"不答声，点头","affectionWho":"","affection":0,"insomnia":0,"flag":"nodded_before_the_question","next":""}]},{"type":"narration","text":"她把手从图纸上拿开，放在膝盖上。她的手指在膝盖上敲了两下，敲得没有节奏。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"四月九号那天，如果我们真的把那些人提出来了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你有没有想过，提出来以后，你自己会剩下什么。"},{"type":"narration","text":"我没想过。这个问题一出来，我第一个反应是去看我的本子。本子摊在图纸底下，露出一角，上面有十几个名字。"},{"type":"choice","text":"","prompt":"提出来以后你自己会剩下什么——这题怎么答？","options":[{"text":"看着本子上的名字答","affectionWho":"","affection":0,"insomnia":0,"flag":"answered_while_reading_names","next":""},{"text":"不绕弯，直接答","affectionWho":"","affection":0,"insomnia":-2,"flag":"answered_without_hesitation","next":"#l03"}]},{"type":"narration","text":"炉子上的水响了一声。我把本子往她那边推了推，让她看见那一角。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我想过了。我会少一些东西。","label":"l03"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我认了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你不能认。"},{"type":"narration","text":"她这次没有停。她往前坐了一点，椅子腿在地板上划出很短的一下。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你认了以后，谁来记得我们。你把别人的名字抱在身上，那你自己的呢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你要是真的少到只剩半个人，我到时候找谁去要你。"},{"type":"choice","text":"","prompt":"她说「找谁去要你」。这句你听出几层？","options":[{"text":"听出两层，都接住","affectionWho":"","affection":0,"insomnia":-2,"flag":"heard_both_layers_of_it","next":""},{"text":"只听表层，打个岔","affectionWho":"","affection":0,"insomnia":0,"flag":"heard_only_the_surface","next":""}]},{"type":"narration","text":"这句话说完，我听见自己心里那根一直绷着的弦响了一下。这三个月里我怕过很多东西，怕失眠，怕删掉的人，怕三号那天的黄带子。"},{"type":"narration","text":"但我从来没怕过「别人会找不着我」这件事。因为在这之前，我一直以为只有我会找别人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那我答应你一件小事。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"四月九号以后，不管剩下多少，我都先回来一次。回到这间屋子里。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"哪怕我不记得为什么回来。"},{"type":"choice","text":"","prompt":"你答应「先回来一次」。要不要立个凭证？","options":[{"text":"立：回来先念那三个数字","affectionWho":"","affection":0,"insomnia":-3,"flag":"sealed_the_promise_with_numbers","next":""},{"text":"不立，话说了就算","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_the_words_alone","next":""}]},{"type":"narration","text":"她没有马上答。她伸手把杯子拿起来，试了一下温度，觉得凉了，又放回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那我也说一件。有一句话我本来想留到以后再说。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"现在我不想留了。你也别问我现在为什么说。"},{"type":"narration","text":"我等着。我能听见自己的心跳，很慢，一下一下。外走廊那台旧除湿机在墙里一下一下地排水，节奏居然和我的心跳对上了。"},{"type":"choice","text":"","prompt":"除湿机的节奏和你的心跳对上了。催她吗？","options":[{"text":"催一句：你说吧","affectionWho":"","affection":0,"insomnia":0,"flag":"hurried_her_gently","next":""},{"text":"不催，等她自己坐稳","affectionWho":"","affection":0,"insomnia":-2,"flag":"waited_for_her_to_sit_down","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你说吧。"},{"type":"narration","text":"她在我对面站了一会儿，又坐回去。她坐下的时候把图纸往里推了推，给我那边留出半张桌子的地方。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"三月十二号那天晚上，值班的人把一段记录报上来。我看了三遍。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"照规定我应该在第二天早上把那段记录归档。我没有。"},{"type":"choice","text":"","prompt":"她承认违反了归档规定。这事守不守？","options":[{"text":"守，出不了这间屋","affectionWho":"","affection":0,"insomnia":-2,"flag":"kept_her_breach_secret","next":""},{"text":"不守，明天当众问一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"planned_to_ask_it_publicly","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你把它留下了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我留了。留下来的东西放在我抽屉最底下，压着一本别人的实验手册。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"我做了七年这行，第一次做这种往回藏东西的事。我到现在也没想清楚为什么。"},{"type":"choice","text":"","prompt":"她七年来的第一次往回藏。你怎么回？","options":[{"text":"告诉她：藏得对","affectionWho":"","affection":0,"insomnia":-1,"flag":"told_her_she_was_right_to_hide","next":""},{"text":"不说话，把她按住的纸角抚平","affectionWho":"","affection":0,"insomnia":-2,"flag":"smoothed_the_blueprint_corner","next":""}]},{"type":"narration","text":"我想说点什么，但我知道她还没说完。她的手指又去找图纸的边角，找到以后就按在那儿。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"从三月十二号那天起，我做的每一件事都跟你有关系。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这件事我从来没跟别人说过。现在我说完了。"},{"type":"narration","text":"她说完这句就站起来。她站起来的动作太快，膝盖碰到了桌沿，桌上那张纸滑出一寸。"},{"type":"narration","text":"她没有去看纸，也没有看我。她去拎门口墙上挂着的那件干外套，穿上的时候有一边袖子翻了。"},{"type":"choice","text":"","prompt":"她拎包就走，袖子都没翻好。叫不叫？","options":[{"text":"叫，把「等等」说出口","affectionWho":"","affection":0,"insomnia":0,"flag":"called_her_to_wait","next":""},{"text":"先站起来再开口","affectionWho":"","affection":0,"insomnia":-1,"flag":"stood_before_speaking","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"等等。"},{"type":"narration","text":"我在那张退出路线图上撕了一角下来，撕成很小的两块，一块塞进她的外套口袋，一块我自己留着。那角上面有我在栏杆线旁边写的三个数字，是那段楼梯到出口的步数。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"拿着这个。九号那天你要是走到那段楼梯上，就数着步子走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你留着另一半干什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"对个号。你要是把它丢了，我就知道你那天没听见我说话。"},{"type":"choice","text":"","prompt":"半角纸对个号，这约定算不算数？","options":[{"text":"算数，复述一遍","affectionWho":"","affection":0,"insomnia":-2,"flag":"restated_the_deal","next":""},{"text":"不说出口，记在心里","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_deal_silent","next":""}]},{"type":"narration","text":"她低头把口袋按了一下，按了两次。然后她把手放在门框上，回头看了我一眼，那一眼很短，短到像是有意控制过的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"图收起来。睡两个小时。明天你把那三个数字念给我们听。"},{"type":"choice","text":"","prompt":"这一句，你要接住还是往后放？","options":[{"text":"接住：告诉她你也一样，从三月十二号开始就一样","affectionWho":"艾莉丝","affection":10,"insomnia":-8,"flag":"said_it_back_tonight","next":"3-2"},{"text":"往后放：把这句留到四月九号以后再答","affectionWho":"艾莉丝","affection":4,"insomnia":6,"flag":"kept_it_for_after","next":"3-2"}]},{"type":"narration","text":"我把那句话说出口以后，她伸手按住我的肩膀，按得很实在，像是要把我按回地面。"},{"type":"narration","text":"那口气松下来的时候，我耳朵里响了一整晚的蝉鸣第一次低了一层。原来有些话不是用来换东西的。"},{"type":"narration","text":"门关上以后，我没有立刻去收图。我先把她放下的那只杯子拿起来，喝了一口。水已经不烫了，但还温。"},{"type":"choice","text":"","prompt":"她走了，杯子还温。这杯水怎么处理？","options":[{"text":"喝完，倒掉可惜","affectionWho":"","affection":0,"insomnia":-1,"flag":"drank_the_warm_cup","next":""},{"text":"留着，明早再喝","affectionWho":"","affection":0,"insomnia":0,"flag":"saved_the_cup_till_morning","next":""}]},{"type":"narration","text":"我把那半角纸夹进本子的最后一页，夹在写满名字的那一页后面。这样它不会掉，也不容易被别人看到。"},{"type":"narration","text":"桌上那张纸被她碰歪的那一寸我没有推回去。我留着它歪着，留到明天早上。"},{"type":"narration","text":"我躺下的时候是十二点四十。我闭上眼睛，脑子里只有一个念头：九号那天，我要先回到这间屋子里。"}],"dense":true},"3-2":{"sceneId":"3-2","chapter":"第三幕·最终决战","title":"最后的训练","background":"bg_base_room","bgm":"bgm_insomnia","next":"3-3","lines":[{"type":"narration","text":"第二十八天，四月八号，晚上九点。距离开门还有二十五个小时。今天我们没有开会，也没有再看图纸。今天只做一件事。"},{"type":"narration","text":"我们把作战室中间清空了。地上用胶带贴出三条并排的线，每条线前面放一只铁皮箱。铁皮箱里是六十根木签，签子上写的都是名字。"},{"type":"choice","text":"","prompt":"六十根签，全是别人抄的名字。先检查哪一样？","options":[{"text":"先数一遍签，确认六十根","affectionWho":"","affection":0,"insomnia":-2,"flag":"counted_the_slips_before_starting","next":""},{"text":"先看三条胶带线贴得正不正","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_tape_lines_first","next":""}]},{"type":"narration","text":"那些名字不是在场的任何一个人写的。它们是这一年里从报废的记录、注销的档案、被剪掉姓名的封面上抄下来的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"规则我再说一遍。你抽一根签，把名字念出来，停三十秒，再放回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"中间出现任何反应，你只有一件事要做：按我给你的呼吸节拍，四拍吸，八拍呼。"},{"type":"choice","text":"","prompt":"四拍吸八拍呼。这节拍你熟不熟？","options":[{"text":"当场跟她对两拍","affectionWho":"","affection":0,"insomnia":-2,"flag":"synced_the_breath_beat","next":""},{"text":"不说话，心里过一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"rehearsed_the_beat_silently","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我计时。二十秒的时候我叫一次，三十秒我叫一次。你听见我叫，就说明你还挂在这儿。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我干什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你不抽签，也不念。你负责听。他要是念错一个字，你告诉我。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"记住了。我听得出来。真名和错的名字在我这儿不一样。"},{"type":"choice","text":"","prompt":"小雅负责听错字。要不要再叮嘱她一句？","options":[{"text":"叮嘱她：听出不对就喊停","affectionWho":"","affection":0,"insomnia":-1,"flag":"told_xya_to_call_stop","next":""},{"text":"不叮嘱，她本来就懂","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_xya_without_words","next":""}]},{"type":"narration","text":"我脱了外套。这个动作是艾莉丝要求做的，她说要看着我身上有没有乱的地方。她拿着一台仪器的传感头贴在我手腕上，数据线拖到桌边那台笔记录仪。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"基线先走五分钟。你什么都别想，想墙，想天花板。"},{"type":"narration","text":"前五分钟我盯着天花板看。天花板上有一块水渍，形状像一只踩扁的鞋。我看着那只鞋，心率一点一点落下来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"基线稳。开始。"},{"type":"choice","text":"","prompt":"基线稳了。第一根签，怎么抽？","options":[{"text":"随手就抽","affectionWho":"","affection":0,"insomnia":0,"flag":"drew_the_first_slip_blind","next":""},{"text":"先闭眼三十秒","affectionWho":"","affection":0,"insomnia":-2,"flag":"steadied_before_the_draw","next":""}]},{"type":"narration","text":"第一根签是随手抽的。签子是竹的，边上有一道旧裂，摸起来比其他的轻。签面上是一行钢笔字，写得很端正，末尾还带一个句点。"},{"type":"narration","text":"我把那个名字念了出来。念的时候我听见自己的声音比平时低，像从胸腔里出来的。"},{"type":"narration","text":"仪器没有响。笔记录仪上的针只是抖了一下，抖完就回去了。艾莉丝在纸上写了一笔，那一笔很短。"},{"type":"choice","text":"","prompt":"反应窗口比预估窄。要不要先叫停？","options":[{"text":"叫停，重定窗口","affectionWho":"","affection":0,"insomnia":-1,"flag":"paused_to_reset_the_window","next":""},{"text":"不停，继续下一根","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_reading_after_the_gap","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"反应窗口七秒。比我们预估的窄。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"七秒是什么意思。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"意思是你有七秒钟会不舒服。七秒以后如果撑住了，那个名字就算被读出来，删除会松一下，但不会破。"},{"type":"choice","text":"","prompt":"七秒不舒服。这七秒你怎么熬？","options":[{"text":"一秒一秒数呼吸","affectionWho":"","affection":0,"insomnia":-2,"flag":"counted_breaths_in_the_window","next":""},{"text":"盯住胶带线不放","affectionWho":"","affection":0,"insomnia":0,"flag":"fixed_on_the_tape_line","next":""}]},{"type":"narration","text":"第二根签我抽得慢一点。这根签上只有两个字。念出来的时候我的太阳穴跳了一下，眼前有一段很细的亮线从左边扫到右边。"},{"type":"narration","text":"我照她说的呼吸。四拍吸，八拍呼。吸进去的时候喉咙里有一股铁锈味，呼出去的时候那股味淡了一半。"},{"type":"choice","text":"","prompt":"铁锈味淡了一半。要不要歇一口再抽？","options":[{"text":"歇十秒","affectionWho":"","affection":0,"insomnia":-3,"flag":"rested_ten_seconds_between_slips","next":""},{"text":"不歇，趁状态还在","affectionWho":"","affection":0,"insomnia":0,"flag":"rode_the_momentum","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"二十秒。"},{"type":"narration","text":"他的声音很平。这三天里他对着秒表练过太多次，练到能把「二十秒」这三个字念得跟报站名一样。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"三十秒过了。这个我没问题。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你刚才念的时候手在抖。是那种很小的抖，杯子放在桌上会响的那种。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"那你就当我在给这屋子打拍子。"},{"type":"choice","text":"","prompt":"小雅听见你手在抖。承认还是打岔？","options":[{"text":"打岔糊过去","affectionWho":"","affection":0,"insomnia":0,"flag":"joked_the_trembling_away","next":""},{"text":"承认手确实在抖","affectionWho":"","affection":0,"insomnia":-2,"flag":"admitted_the_trembling","next":""}]},{"type":"narration","text":"第三根签我摸到的时候就知道不对。它比别的签厚，边缘毛糙，像是从木板上硬掰下来的，而且它是唯一一根反面有字的。"},{"type":"narration","text":"我把签翻过来。反面是两个字，写得很急，笔压大得把木纹都压白了。那两个字我一个都不认识。"},{"type":"narration","text":"可我的拇指在那个位置上停了两秒，像是有过肌肉记忆。我认得这两个字的写法，只是不认得它们念什么。"},{"type":"choice","text":"","prompt":"拇指认得这两个字的写法。要不要说出来？","options":[{"text":"说出来：我认得这个写法","affectionWho":"","affection":0,"insomnia":0,"flag":"said_he_knew_the_script","next":"#l01"},{"text":"不说，先翻回正面","affectionWho":"","affection":0,"insomnia":-1,"flag":"said_nothing_about_the_script","next":""}]},{"type":"narration","text":"我把签按在桌上，指腹压着那两个字，没吭声。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这根不是我们抄的。","label":"l01"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"放回去。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"明天晚上我要念的，本来就不是我们抄得出来的名字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"林晓。那根签你想清楚再念。"},{"type":"choice","text":"","prompt":"她让你想清楚再念。想清楚了吗？","options":[{"text":"想清楚了，念","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_slip_after_thinking","next":""},{"text":"没想清楚，也念","affectionWho":"","affection":0,"insomnia":-1,"flag":"read_it_without_being_sure","next":""}]},{"type":"narration","text":"我没有放回去。我把那根签举到嘴边，照着上面那两个字念了出来。念第一个字的时候，屋子里的灯闪了一次。"},{"type":"narration","text":"念第二个字的时候，我听见的不是自己的声音。我听见的是很多人在很远的地方一起把一个音收住，收得像有人同时把几十扇门关上。"},{"type":"fx","fx":"shake","text":"整间屋子晃了一下。铁皮箱倒了，六十根木签散在地上，撒得到处都是。"},{"type":"fx","fx":"insomnia","text":"我的太阳穴像被人从里面顶了一下。眼前的亮线不是一条了，是一整片，从中间往两边烧。"},{"type":"choice","text":"","prompt":"亮线从中间往两边烧。现在喊不喊停？","options":[{"text":"喊停，把签扔了","affectionWho":"","affection":0,"insomnia":-2,"flag":"called_stop_in_the_burn","next":""},{"text":"不喊，撑到三十秒","affectionWho":"","affection":0,"insomnia":0,"flag":"held_on_through_the_burn","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"艾莉丝！读数！"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"超了。超了三倍。我正在拉。"},{"type":"narration","text":"我想说一句「我没事」，但那句话卡在胸口。我的鼻子一热，血先出来了，滴在胶带上，把那条黄线染成了深色。"},{"type":"fx","fx":"flash","text":"有很短的一瞬间，作战室不见了。我看见一间教室，黑板上写着日期，日期是四月八号，可那间教室里坐着的人我一个都不认识。"},{"type":"choice","text":"","prompt":"教室日期是今天，人你一个不认识。先看黑板还是先退出？","options":[{"text":"把日期记住再说","affectionWho":"","affection":0,"insomnia":0,"flag":"memorized_the_classroom_date","next":""},{"text":"闭眼，把自己拽回来","affectionWho":"","affection":0,"insomnia":-2,"flag":"pulled_his_eyes_shut","next":""}]},{"type":"narration","text":"再睁开眼的时候，我是躺着的。天花板还是那盏灯，灯管上有一只飞蛾在撞。"},{"type":"narration","text":"第一个回到身上的感觉是手腕被按住了。有人把我的手压在地板上，压得很紧，紧到指节发麻。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"别动。你刚才抽了两次。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我抽了几分钟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"十分钟四十秒。"},{"type":"choice","text":"","prompt":"十分钟四十秒。这个数敢不敢再听一遍？","options":[{"text":"再听一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"heard_the_lost_minutes_twice","next":""},{"text":"不听了，先问身体","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_about_his_body_first","next":""}]},{"type":"narration","text":"她说话是贴在我耳朵边说的，可我听的时候像隔着一层水。我看着她的嘴一张一合，延迟了半拍才听懂。"},{"type":"narration","text":"我的左耳什么都听不见。右耳只有一层高频的蝉鸣。我抬手想揉一下，被她按了回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"耳朵是暂时的，两天内会回来。额头撞在桌角上，缝了两针。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那算是失败了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"是失败。而且是我算错的那种失败。"},{"type":"choice","text":"","prompt":"她承认是她算错。要不要替她找补？","options":[{"text":"找补：谁都没料到","affectionWho":"","affection":0,"insomnia":-1,"flag":"covered_for_alices_miscalculation","next":""},{"text":"不找补，让她说完","affectionWho":"","affection":0,"insomnia":0,"flag":"let_her_own_the_mistake","next":""}]},{"type":"narration","text":"她说完这句就站起来。她走到桌边，把笔记录仪上那一段纸撕下来，折了三折，塞进自己的口袋，没有给我看。"},{"type":"narration","text":"三个人把我抬到墙角，让我靠着墙坐。小雅拿了湿毛巾按在我鼻子上，按得比需要的更用力。"},{"type":"choice","text":"","prompt":"湿毛巾按得过重。要不要躲？","options":[{"text":"不躲，让她按完","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_xya_finish_pressing","next":""},{"text":"躲一下，缓过来再说","affectionWho":"","affection":0,"insomnia":0,"flag":"dodged_the_towel_once","next":"#l02"}]},{"type":"narration","text":"湿毛巾的凉意从鼻梁漫到眼眶，屋里的声音等我缓过来才回来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"刚才你念那两个字的时候，屋子里的声音全停了一秒。","label":"l02"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"然后有一百多个人一起开口。我从来没听过这么多人同时说话。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"他们说什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"他们在念同一个名字。就是你手里那两个字。"},{"type":"choice","text":"","prompt":"一百多个人在念你手里那两个字。要不要把签摸出来？","options":[{"text":"摸出来，攥在手里","affectionWho":"","affection":0,"insomnia":-1,"flag":"brought_the_slip_into_his_hand","next":""},{"text":"不摸，先问小雅细节","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_xya_for_the_details","next":""}]},{"type":"narration","text":"我把手伸进外套口袋，摸到那根厚签。它还在。边缘有一小块被血浸过，木纹变成了暗红色。"},{"type":"narration","text":"艾莉丝回来的时候手里多了一张纸。那不是记录纸，是我们明天要带进门的名单。她用铅笔在最上面写了一行字，写完把它推到我面前。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"明天晚上的规则改两条。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"第一，念名字的人不查签面，只念我点到的。第二，我点到谁念，谁就得把右手空出来。"},{"type":"choice","text":"","prompt":"右手空出来给她拉着。这规则你答应吗？","options":[{"text":"答应，把手空出来","affectionWho":"","affection":0,"insomnia":-2,"flag":"agreed_to_the_handhold_rule","next":""},{"text":"答应，但要求她也念几个","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_her_to_read_too","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"空出来干什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"让我拉着。你一乱我就拉一下，你只要记住那一下的力度，就知道自己该停。"},{"type":"narration","text":"我看着那张纸。名单上第一个名字前面画了一个很小的小点，那是今天下午定下来的顺序。我们能背下来的名字一共有三十七个。"},{"type":"choice","text":"","prompt":"三十七个名字，能念的只有三个。先核顺序吗？","options":[{"text":"核一遍顺序","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_the_reading_order","next":""},{"text":"不核，信她定的","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_the_order_she_set","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"三十七个名字，一个四十秒，加上反应窗口。时间够吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不够。所以不是三十七个。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"进去以后，你只念三个。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"那剩下的三十四个呢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"剩下的三十四个，是我和小雅在外面念的。我们没有你那种反应，念一百遍也没用，但至少能让它们在纸上活着。"},{"type":"choice","text":"","prompt":"她在外面念那三十四个。你能替她做什么？","options":[{"text":"把她的份也抄进本子","affectionWho":"","affection":0,"insomnia":-1,"flag":"copied_her_share_into_the_book","next":""},{"text":"不说话，记下分工","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_the_split_in_silence","next":""}]},{"type":"narration","text":"我这才明白今天她为什么不肯让我多念。她不是怕我受伤，她是怕我把三分钟里唯一能用的那点力气花在没用的名字上。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"剩下三个是哪个。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"明天在门口决定。顺序第一的那个还没定。"},{"type":"narration","text":"雷恩把秒表放到桌上。他从四点起没吸过一支烟，今天破例了。他抽的时候背对着我们，肩膀塌下去，像一堵被拆了一半的墙。"},{"type":"choice","text":"","prompt":"雷恩破例抽烟，背对着你们。要不要收走？","options":[{"text":"收走，替他拿着","affectionWho":"","affection":0,"insomnia":-1,"flag":"took_raines_cigarette","next":""},{"text":"不收，让他抽完这根","affectionWho":"","affection":0,"insomnia":0,"flag":"let_him_finish_the_cigarette","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"守望者那边最后一次联系是今天中午。维拉说她不再回话了，名单她收了。"},{"type":"choice","text":"","prompt":"维拉不回话了。这条线还留不留？","options":[{"text":"留，把频道记下来","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_vera_channel","next":""},{"text":"不留，收了名单就算答应","affectionWho":"","affection":0,"insomnia":-1,"flag":"took_veras_silence_as_yes","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"三月十二号那天，队伍里要是有个人能念出我记得的人，我也不用自己一个人跑三年。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那明天你把自己的名字也算进去。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"什么意思。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"如果你出不来，我就在纸上写你。这算我提前收的一份债。"},{"type":"narration","text":"他看了我三秒，然后笑了一下。那一下不出声，只是嘴角动了动，比我见过的任何一次都难看，也比任何一次都真。"},{"type":"choice","text":"","prompt":"雷恩那一下笑得太真。这份债你怎么记？","options":[{"text":"记到最贵的一页","affectionWho":"雷恩","affection":5,"insomnia":-1,"flag":"booked_raines_debt_on_the_last_page","next":""},{"text":"当面说不用还","affectionWho":"","affection":0,"insomnia":0,"flag":"told_raine_no_debt","next":"#l03"}]},{"type":"narration","text":"我把他这一下笑记在本子最后一页，压得很实。"},{"type":"narration","text":"九点四十的时候，我们把散在地上的签一根一根捡起来。六十根，捡完点了两遍，还是六十根。那根厚签单独收进了我的外套内袋。","label":"l03"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"今晚的记录我改了。训练结果写「部分失败，方案已调整」，不写你抽了两次。"},{"type":"choice","text":"","prompt":"记录改了，不写你抽了两次。厚签要不要交出去登记？","options":[{"text":"交出去登记","affectionWho":"","affection":0,"insomnia":0,"flag":"handed_the_thick_slip_in","next":""},{"text":"自己收着","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_thick_slip_himself","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那他为什么要躲着我。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"因为明天进去的人是你，他们需要你认为自己能行。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"至于我这边记的是真的。真的那一份我给你留着，等回来再看。"},{"type":"narration","text":"十点，小雅煮了一锅面。她煮面的时候一直在小声数数，数到七就重来。我没有告诉她这个习惯是从哪儿来的，她大概也不需要知道。"},{"type":"choice","text":"","prompt":"小雅数到七就重来。要不要告诉她为什么？","options":[{"text":"告诉她：那是在数名字","affectionWho":"小雅","affection":4,"insomnia":-1,"flag":"told_her_why_she_counts","next":""},{"text":"不问也不说，吃面","affectionWho":"","affection":0,"insomnia":0,"flag":"ate_the_noodles_in_silence","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"面里我放了两个蛋。你们谁不吃谁就是看不起我。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"这次没人敢。"},{"type":"narration","text":"我们四个人围着那张长桌吃面。桌上的图纸收起来了，仪器盖上了布，六十根签装回铁皮箱。这一夜屋子里没有一件在提醒我们明天要做什么。"},{"type":"narration","text":"吃完面，艾莉丝把笔记录仪重新校准了一次。她把零点当成新的起点，然后在纸上写了一个很长的时间轴，时间轴的末端画了一个圈。"},{"type":"choice","text":"","prompt":"时间轴末端画了一个圈。要不要问圈里是什么？","options":[{"text":"问：圈里写的是谁","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_the_circle_held","next":""},{"text":"不问，让她自己说","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_her_close_the_circle","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"明天早上七点集合，八点出发，下午到外围。晚上十点，门开。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"在那之前，每个人都睡六个小时。这是命令，不是建议。"},{"type":"narration","text":"我躺在行军床上的时候，左耳还是只有那层蝉鸣。我按了按耳朵，能听见一点自己的呼吸，很闷。这大概是今天唯一变好的消息。"},{"type":"choice","text":"","prompt":"今晚仅剩的六个小时，怎么用？","options":[{"text":"把那根厚签拿出来，一个人把它看明白","affectionWho":"艾莉丝","affection":4,"insomnia":8,"flag":"studied_the_thick_slip","next":"3-3"},{"text":"照着练习的呼吸节拍睡，真正睡满一整段","affectionWho":"艾莉丝","affection":7,"insomnia":-14,"flag":"rested_before_final","next":"3-3"},{"text":"去找小雅，请她再听一遍那两个字","affectionWho":"小雅","affection":7,"insomnia":6,"flag":"asked_xya_to_listen","next":"3-3"}]},{"type":"narration","text":"我把白天练的那套节拍又做了一遍：四拍进，七拍停，八拍出。数到第三轮的时候，左耳那层蝉鸣退到了很远的地方。"},{"type":"narration","text":"那一夜我睡了一整段，从熄灯睡到集合，中间没有醒过，也没有看见别人的记忆。这是三月十四号以来的第一次。"},{"type":"narration","text":"熄灯之前我最后看了一眼那根厚签。我把它放在枕头底下，不是藏，是压。"},{"type":"choice","text":"","prompt":"厚签压在枕头底下。睡前最后一件事做什么？","options":[{"text":"再走一遍呼吸节拍","affectionWho":"","affection":0,"insomnia":-3,"flag":"ran_the_breath_beat_once_more","next":""},{"text":"把那三个数字默念一遍","affectionWho":"","affection":0,"insomnia":-1,"flag":"mouthed_the_three_numbers","next":""}]},{"type":"narration","text":"我告诉自己，明天要是真的轮到我念这两个字，我要睁着眼睛念完。今天那十分钟太黑了，黑得我什么都没看见。"},{"type":"narration","text":"灯灭以后，屋子里的三个人都没有说话。我能听见雷恩翻身，能听见艾莉丝在本子上写字，能听见小雅把湿毛巾晾在椅背上。"},{"type":"narration","text":"这些声音我一个都不想忘。它们是我这一年里唯一没被删掉的东西。"}],"dense":true},"3-3":{"sceneId":"3-3","chapter":"第三幕·最终决战","title":"最终决战","background":"bg_corridor","bgm":"bgm_lord","next":"3-4","dense":true,"lines":[{"type":"narration","text":"四月九号，凌晨两点四十。今天是第二十九天。"},{"type":"choice","text":"","prompt":"两点四十，院子里四个人。出发前你做什么？","options":[{"text":"按单子把包过一遍","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_bags_against_the_list","next":""},{"text":"不查，这些东西收过一百遍了","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_the_repeated_packing","next":""},{"text":"只查名字那一页","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_only_the_name_page","next":"#l01"}]},{"type":"narration","text":"包不用一件件数。碎片拿两层袜子包着，胶带没松。"},{"type":"narration","text":"艾莉丝的单子贴在包盖内侧，一行一项，每项后面打了一个勾。"},{"type":"narration","label":"l01","text":"单子最后一项是记录本。我拍了拍胸口，它在。"},{"type":"narration","text":"我们在基地院子里站成一排，四个人，四只包。包里的东西加起来还是那几样：一块碎片、一台录音机、一把裁纸刀、一卷胶带。"},{"type":"narration","text":"我把记录本塞进内袋。本子比上个月厚了一倍，最后那几页上全是我自己写的名字。"},{"type":"choice","text":"","prompt":"最后那几页全是你写的名字。出门前这本子怎么处理？","options":[{"text":"把最前面四个再读一遍","affectionWho":"","affection":0,"insomnia":-1,"flag":"reread_the_four_names","next":""},{"text":"合上，回来再读","affectionWho":"","affection":0,"insomnia":0,"flag":"closed_the_ledger_for_now","next":""},{"text":"把一片碎片夹进名字那页","affectionWho":"","affection":0,"insomnia":0,"flag":"tucked_the_shard_by_names","next":""}]},{"type":"narration","text":"出门之前，我在本子最上面新写了一行。四个人，四个名字：林晓、艾莉丝、雷恩、小雅。写名字是我这一个月给自己立的规矩，写下来的人我才认得回来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"把那一行读出来。在这个城市里，读出来才算数。"},{"type":"narration","text":"我读了一遍。念自己名字的时候，我听见自己的声音比别人慢了半拍。"},{"type":"choice","text":"","prompt":"自己的名字，读出来慢了半拍。这半拍怎么办？","options":[{"text":"再读一遍，读慢","affectionWho":"","affection":0,"insomnia":-2,"flag":"reread_my_name_slower","next":""},{"text":"不读了，上车","affectionWho":"","affection":0,"insomnia":0,"flag":"got_in_the_car_directly","next":""},{"text":"把这半拍记下来","affectionWho":"","affection":0,"insomnia":-1,"flag":"noted_the_half_beat","next":"#l02"}]},{"type":"narration","text":"我没再说话，把刚才那半拍在心里又过了一遍。"},{"type":"narration","text":"艾莉丝看了我一眼，没问。"},{"type":"narration","label":"l02","text":"然后我上车。半拍跟着我一起走。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我的名字你写对了。上礼拜你还把雅字写错。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"今天写对了。"},{"type":"narration","text":"雷恩什么也没说。他把那块碎片从口袋里掏出来掂了一下，又放回去，放的时候按了按。"},{"type":"narration","text":"艾莉丝最后看了一眼仪表。针指着 2.70，一秒一格，一格不差。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"从这里开始，仪表只能当手表用。里面的时间不属于它。"},{"type":"choice","text":"","prompt":"仪表只能当手表用。读数你还要不要？","options":[{"text":"把进去前最后一个正常读数记下来","affectionWho":"","affection":0,"insomnia":-1,"flag":"logged_the_last_normal_reading","next":""},{"text":"不记了，里面没有时间","affectionWho":"","affection":0,"insomnia":0,"flag":"stopped_trusting_the_meter","next":""},{"text":"问她二点七〇到底是什么意思","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_270_meant","next":"#l03"}]},{"type":"narration","text":"没有人再提这个数。车里的安静比读数更长。"},{"type":"narration","label":"l03","text":"我把二点七〇跟四个名字记在同一个地方。"},{"type":"narration","text":"雷恩拉开驾驶座的门。他没有回头看基地。这一个月里他从来没有回头看过任何一扇已经关上的门。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"进去以后，谁在我后面，就贴着我的背走。"},{"type":"narration","text":"小雅抱着录音机坐在最后一排。她今天话很少，手指一直在录音机的按键上来回摸。"},{"type":"choice","text":"","prompt":"她今天话很少，手指一直没停。你打破沉默吗？","options":[{"text":"问她现在在听什么","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_xya_was_hearing","next":""},{"text":"不问，让她摸着","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_her_stay_with_the_recorder","next":""},{"text":"把水壶递给她","affectionWho":"","affection":0,"insomnia":0,"flag":"passed_her_the_water_bottle","next":""}]},{"type":"narration","text":"车出城的时候，路两边一盏灯也没有。这个时间的新东京本该有两万盏灯亮着，我数不出确数，但我记得它亮。"},{"type":"narration","text":"两点五十八分，车停在第三区。"},{"type":"narration","text":"第三区是老管网区。二一一年秋天以后，这里的地图上多了一块空白，空白长四百米，宽两百米。"},{"type":"choice","text":"","prompt":"地图在这里空了一大块。老周的管网图怎么用？","options":[{"text":"摊开图，照着断线走","affectionWho":"","affection":0,"insomnia":-1,"flag":"walked_the_blank_with_the_map","next":""},{"text":"把图折回本子里，信自己的脚","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_feet_over_the_map","next":""},{"text":"让雷恩先停车","affectionWho":"","affection":0,"insomnia":0,"flag":"had_raine_stop_before_the_blank","next":""}]},{"type":"narration","text":"这块空白是我认出来的。苏禾最后一天走的就是这一段。"},{"type":"narration","text":"老周给我的那张地下管网图还夹在本子里。图上这一块是画到一半停住的，铅笔线在空白边缘断掉。"},{"type":"narration","text":"我沿着那条断线走。图纸上的空白，在脚底下就是这条管道。"},{"type":"choice","text":"","prompt":"图纸上的空白，在脚底下就是这条管道。进去前做什么？","op :"bgm_hope","next":"3-5","dense":true,"lines":[{"type":"narration","text":"我把笔放回桌面。木头碰到账页，没有声音。"},{"type":"narration","text":"桌子的那一头，他停了。"},{"type":"narration","text":"从他开口到现在，他说过的每一句话都卡在同一个节拍上。这一停，是第一次。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你不签。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我不签。这笔账我们不签。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"不签，账替你选。你不要以为放下笔就没事。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"六十三分钟走完，纸最薄的那一行会自己落下去。到时候是谁，你连问的机会都没有。"},{"type":"choice","text":"","prompt":"他第一次停下来。这个停顿你打算怎么接？","options":[{"text":"等他重新开口","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_the_lord_to_resume","next":""},{"text":"自己把这段静默填上","affectionWho":"","affection":0,"insomnia":0,"flag":"filled_the_lords_silence","next":""},{"text":"看账页，不看他的脸","affectionWho":"","affection":0,"insomnia":-1,"flag":"watched_the_ledger_page_not_him","next":""}]},{"type":"narration","text":"我回头看了一眼我身后那三个人。我这一回头，用了不到一秒钟，但这一秒钟里我做了一个决定。"},{"type":"narration","text":"我不想让这笔账替我们选任何人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"你的账要的是一个名字的份量。一个人的份量，能不能由四个人分。"},{"type":"narration","text":"他又停了一次。这一次比上一次长。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"规矩上没有这一条。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"规矩上也没有人说，签的人必须是同一个。你刚才说过，账认的是被人记得。那我们四个人一起记得一件事，这件事算谁的。"},{"type":"choice","text":"","prompt":"话已经顶到墙上了。他要是真应了，你先交什么？","options":[{"text":"交那借来的最后一天","affectionWho":"","affection":0,"insomnia":-1,"flag":"offered_borrowed_last_day","next":""},{"text":"交二一一〇年的冬天","affectionWho":"","affection":0,"insomnia":0,"flag":"offered_the_winter_of_2110","next":""},{"text":"先不定，听他说完条件","affectionWho":"","affection":0,"insomnia":-2,"flag":"waited_for_his_terms","next":""}]},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"算四个人的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那就往这一页上写我们四个人的东西。凑够一个人的份量，名字你自己找。"},{"type":"narration","text":"我说这句话的时候，心里其实没有底。这是我这一个月里第一次在没有底的时候把话说满。"},{"type":"narration","text":"静了几秒。桌上的账页自己动了一下，页角翘起来又落下去，像在称一个东西的重量。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"可以。你们四个人的份量加起来，要够一个名字。够，我就拿它去补城市的窟窿。不够，剩下的由纸最薄的那一行补齐。"},{"type":"choice","text":"","prompt":"他应了，还给你加了重量。这算好事吗？","options":[{"text":"算。能讲价，就说明有缝","affectionWho":"","affection":0,"insomnia":-2,"flag":"glad_the_ledger_can_be_haggled","next":""},{"text":"不算。他答应得太快了","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_the_lord_agreed_too_fast","next":""},{"text":"不去想，先回头招呼另外三个","affectionWho":"","affection":0,"insomnia":-1,"flag":"waved_the_three_to_step_in","next":""}]},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"这不是宽容。这是你替自己选的加重量。"},{"type":"narration","text":"我听见艾莉丝在我右边把本子打开了。她翻页的速度和平时一样快，一页不多，一页不少。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我先来。我的那一份是我二一一〇年冬天的一段。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"那一段本来就在名单上。它不是被我保住的东西，是迟早要没的东西。拿它来算，最省。"},{"type":"choice","text":"","prompt":"她交的是「迟早要没」的那段。你接不接？","options":[{"text":"接，并且跟她说一声谢","affectionWho":"","affection":0,"insomnia":-1,"flag":"thanked_alice_for_her_share","next":""},{"text":"接，但不道谢，她不吃这套","affectionWho":"","affection":0,"insomnia":0,"flag":"took_alices_share_without_thanks","next":""},{"text":"先问她那段冬天里是哪一段","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_which_part_of_that_winter","next":""}]},{"type":"narration","text":"我没有追问。有些东西说出口了，就够她受的了。"},{"type":"narration","text":"她说最省的时候，手指在本子边缘敲了两下就停了。这是她第一次主动把自己的一部分拿出来，也是她第一次说完一句话以后不看我的反应。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你确定你舍得。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我不是舍得。我是不想再看有人替别人签字。那六次里有一次，就是我替你们签的。"},{"type":"choice","text":"","prompt":"她终于把替我们签过字的事说出来了。要追问吗？","options":[{"text":"不追问。说出来就够了","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_alices_confession_land","nex ype":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"记得这件事，跟着我一起拿出来。他们那边就能多一分。"},{"type":"narration","text":"他说完就把手合上。那一下之后，他的手里空了。"},{"type":"narration","text":"不是手空了，是手里那件他背了一个月的东西不在了。他站得很直，像什么事都没有，可他的呼吸乱了半拍。"},{"type":"fx","fx":"shake","text":"","sfx":"sfx_breath"},{"type":"choice","text":"","prompt":"他手里那件东西没了。你说什么吗？","options":[{"text":"说：他手里不是空的","affectionWho":"","affection":0,"insomnia":-1,"flag":"told_raine_hands_not_empty","next":""},{"text":"什么都不说，站到他旁边","affectionWho":"","affection":0,"insomnia":-2,"flag":"stood_beside_raine_silently","next":"#l03"},{"text":"把自己的外套脱下来递过去","affectionWho":"","affection":0,"insomnia":0,"flag":"handed_raine_his_own_jacket","next":"#l03"}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你手里不是空的。这里还有四个人。"},{"type":"narration","label":"l03","text":"账页上那四行字里，第一行浅了一层半。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"一份的三分之二。差一点。"},{"type":"narration","text":"还差的那个人不是我，也不是艾莉丝。"},{"type":"narration","text":"小雅一直站在我后面半步的地方。她把手里的录音机举起来，看了一眼红灯，然后把它关掉了。"},{"type":"choice","text":"","prompt":"三分之二份，还差最后一块。下一个是谁？","options":[{"text":"等小雅，她把录音机举起来了","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_xya_to_step_up","next":""},{"text":"不动。让纸最薄的那行去补","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_the_ledger_choose_next","next":""},{"text":"回头看艾莉丝，她还有没有剩的","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_if_alice_had_more_left","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我这份最难算。因为我这段东西，我自己也不知道是从哪来的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我第一次听见被抹掉的人说话，是三月二十七号下午。那天我以为是耳朵坏了，我还去药店买了滴耳液。"},{"type":"narration","text":"她说到滴耳液的时候笑了一下。她是我们四个人里唯一会在这种地方笑的人。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"交出去以后，我可能就听不见他们了。以后你们要是有人被划掉，我就不知道了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你可以不交。我们三个人再凑。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined", 书馆，从图书馆走到地下废架，看着她走进光里。"},{"type":"narration","text":"那一天不属于我。我拿着它，就像拿着一件不知道主人是谁的东西。"},{"type":"choice","text":"","prompt":"你要把借来的那天还回去。留话吗？","options":[{"text":"说出口：那天，你不用背了","affectionWho":"","affection":0,"insomnia":-2,"flag":"told_suhe_the_day_is_returned","next":""},{"text":"写在页角上，不出声","affectionWho":"","affection":0,"insomnia":-1,"flag":"wrote_the_word_on_the_page_corner","next":"#l02"},{"text":"什么都不说，干净地还","affectionWho":"","affection":0,"insomnia":-1,"flag":"returned_the_day_in_silence","next":"#l02"}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那一天，你不用背了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","label":"l02","text":"我交这一天。另外我留一样东西。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你要留什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我这本子上写着的四个名字。交出去的这一天可以有，但我得记得我们四个人今天都做了什么。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"这一段不算份量。它没有过去，只有今天。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我知道。我不是拿它作价，我是拿它记人。"},{"type":"choice","text":"","prompt":"他没给「记人」定价。这条算不算写进交易里？","options":[{"text":"算。替他记着，不用他点头","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_clause_without_his_yes","next":""},{"text":"问他：这算不算一个条件","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_it_counted_a_condition","next":""},{"text":"不算就不算，写在自己本子上","affectionWho":"","affection":0,"insomnia":-2,"flag":"wrote_the_clause_in_his_notebook","next":""}]},{"type":"narration","text":"他把这一句放过去了。放过去的那两秒，比他说任何一句都长。"},{"type":"narration","text":"我把本子翻到苏禾那一页，把那一页连着折角一起交了出去。"},{"type":"narration","text":"交出去的一瞬间，我脑子里空了半格。我能记得苏禾穿什么颜色的外套，记得她的声音，但我记不起来她那天下午在教室黑板上写过什么。"},{"type":"narration","text":"那块空白很小。它小到可以放进一个人的日子里去，也小到能让我继续站着。"},{"type":"fx","fx":"insomnia","text":"","sfx":"sfx_heartbeat"},{"type":"choice","text":"","prompt":"四条线并成一条之前，你还认得自己吗？","options":[{"text":"认得，把四个名字默一遍","affectionWho":"","affection":0,"insomnia":-2,"flag":"whispered_the_four_names","next":""},{"text":"不敢默。怕默丢一个","affectionWho":"","affection":0,"insomnia":0,"flag":"afraid_to_say_the_four_names","next":""},{"text":"朝那半格空白伸手","affectionWho":"","affection":0,"insomnia":-1,"flag":"reached_toward_the_blank_slot","next":""}]},{"type":"narration","text":"指尖什么也没碰到。可那半格是空的。"},{"type":"narration","text":"四条线并成一条。并上去的时候没有一点重量压在谁身上，四个人各站一角，谁都没有倾斜。"},{"type":"cg","background":"cg_trade_ledger","text":"账页上那四行字并在一起，笔画互相让开，最后合成一行看不出是谁的字。四个人的影子落在同一张桌子上，长短不一，方向一致。"},{"type":"narration","text":"账页自己合上了一半，又停住。它没有把那一行字收进去。"},{"type":"narration","text":"墙上最里面那个空着的钉子，动了。"},{"type":"narration","text":"一声很轻的响。钉子上多了一根签，签面很新。"},{"type":"choice","text":"","prompt":"空钉上多了一根签。现在过去看吗？","options":[{"text":"过去。哪怕不是好事","affectionWho":"","affection":0,"insomnia":0,"flag":"walked_up_to_the_new_tag","next":""},{"text":"先回头看另外三个","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_the_three_before_the_tag","next":""},{"text":"停在半步外，等小雅先开口","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_xya_speak_about_the_tag","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"它挂上去了。刚才那格是空的。"},{"type":"narration","text":"我走过去看那根签。签上写着两个字。"},{"type":"narration","text":"苏禾。"},{"type":"narration","text":"我读了那两个字，没有像上次那样丢东西。这一次它落回来了，轻轻地落回我本子上。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"她被记住了。"},{"type":"narration","text":"我没敢说下一句。下一句是：因为我们四个人一起记得她。"},{"type":"choice","text":"","prompt":"下一句卡在喉咙里。咽下去，还是说出来？","options":[{"text":"说出来，声音压得很低","affectionWho":"","affection":0,"insomnia":-1,"flag":"whispered_why_she_came_back","next":""},{"text":"不说。留着路上说","affectionWho":"","affection":0,"insomnia":-2,"flag":"saved_the_answer_for_the_road","next":""},{"text":"不说，先看艾莉丝信不信","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_alice_instead","next":""}]},{"type":"narration","text":"那两个字是我自己写的。现在它挂在他的墙上。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我听见了。她刚才在那根签上说了声谢谢。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"你听得见就先别跟艾莉丝说。她要说这是幻觉，还会让我去趟医院。"},{"type":"narration","text":"桌子那头的人影站了起来。这是他第一次站起来。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们的份量够了。城市的窟窿今晚合上。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"但你把我的账弄脏了。"},{"type":"narration","text":"他说的弄脏，指的是我们把一个人的份量拆成了四份。这样分开的账，他算不清了。"},{"type":"choice","text":"","prompt":"他说账被弄脏了。这句话你认吗？","options":[{"text":"认。弄脏的是我们四个","affectionWho":"","affection":0,"insomnia":0,"flag":"took_the_dirt_for_all_four","next":""},{"text":"不认。是账自己变的","affectionWho":"","affection":0,"insomnia":-1,"flag":"blamed_the_change_on_the_ledger","next":""},{"text":"问他：干净的账长什么样","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_clean_looks_like","next":""}]},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"一个答案变成四个人的事，就再也不是一个答案。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_amused","text":"你做了一件我一百多年没有见过的事。"},{"type":"narration","text":"一百多年。我记住了这个数字。这是他从头到尾唯一一次提到自己的岁数。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"他站起来了。林晓，这不是好兆头。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"他要是过来，我先上。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"他背后有东西在动。不是影子。"},{"type":"narration","text":"我往前走了半步，站到他们三个人前面。这个动作我这一个月做过很多次，今天这一次是第一次不是因为害怕才做的。"},{"type":"choice","text":"","prompt":"艾莉丝说不是好兆头，雷恩说他先上。你站哪？","options":[{"text":"就站最前面，接他第一句","affectionWho":"","affection":0,"insomnia":0,"flag":"took_the_front_line_himself","next":""},{"text":"退半步，盯着那面签墙","affectionWho":"","affection":0,"insomnia":-1,"flag":"held_half_a_step_back_to_watch","next":""},{"text":"把小雅往身后拉一把","affectionWho":"","affection":0,"insomnia":-1,"flag":"pulled_xya_behind_him","next":""}]},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"账的事到此为止。我还有一件更早的事要跟你算。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"什么更早的事。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你丢了三十个小时。我一直知道那三十个小时在哪。"},{"type":"narration","text":"我手心里出了汗。这一个月我查过所有能查的地方，唯一没查到的就是那三十个小时去了哪。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你到里面来。我给你看我的名字。"},{"type":"choice","text":"","prompt":"他请你进第二层屋子。进吗？","options":[{"text":"进。他的名字我要亲眼看看","affectionWho":"","affection":0,"insomnia":0,"flag":"walked_into_the_second_room","next":""},{"text":"带上一个人，不单独进","affectionWho":"","affection":0,"insomnia":-1,"flag":"took_someone_into_the_second_room","next":""},{"text":"先问一句：拿什么换","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_the_price_before_entering","next":""}]},{"type":"narration","text":"三十个小时。我找过的数字，现在挂在他嘴上。"},{"type":"narration","text":"他抬起手，长桌的那一端裂开一条缝，缝后面还有第二层屋子。"},{"type":"narration","text":"第二层屋子里没有桌子，没有签，只有一面很高的墙，墙上刻着一行字。"},{"type":"narration","text":"我隔着那面墙看过去。第一行字还没看清，我的耳朵先听清楚了。"},{"type":"narration","text":"刻痕很旧。字口的缝里没有一点灰。"},{"type":"narration","text":"那三个字，是我自己的名字。"},{"type":"choice","text":"","prompt":"墙上第一行是你的名字。往里走之前先核对什么？","options":[{"text":"核对本子，四个名字还在","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_the_four_names_remained","next":""},{"text":"回头看，三个人还在身后","affectionWho":"","affection":0,"insomnia":-1,"flag":"confirmed_the_three_still_behind","next":""},{"text":"什么都不核对，直接进去","affectionWho":"","affection":0,"insomnia":0,"flag":"walked_in_without_checking","next":""}]},{"type":"choice","text":"","prompt":"墙上的第一行字是我的名字。往里走之前，先定一件事。","options":[{"text":"先开口，把自己那一段的份量说清楚，让他们三个都跟上","affectionWho":"艾莉丝","affection":8,"insomnia":1,"flag":"spoke_his_share_first","next":""},{"text":"先问雷恩一句：他妹妹那一段，他愿不愿意让别人替他拿","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"asked_raine_for_his_share","next":""},{"text":"把小雅往身后挡一步，她刚丢掉的那一份由我先替她记着","affectionWho":"小雅","affection":9,"insomnia":1,"flag":"covered_xya_share","next":""}]}]},"3-4b":{"sceneId":"3-4b","chapter":"第三幕·最终决战","title":"交易","background":"bg_lord_hall","bgm":"bgm_lord","next":"3-5","dense":true,"lines":[{"type":"narration","text":"我在那张长桌前站了很久，久到墙上的签一张都没有再响。"},{"type":"narration","text":"这是一笔交易，不是一场打架。来之前我们说好过：只要能带走那些名字，我做什么都可以。"},{"type":"narration","text":"领主把账往我这边推了一寸。那本账很旧，封面被反复摸过，摸得发亮。"},{"type":"narration","text":"他把账推过来的时候，桌上那盏灯跟着晃了一下。桌面是石头的，很凉，我的指节贴上去，凉气顺着骨头往上爬。"},{"type":"choice","text":"","prompt":"他把账推给你。先碰它吗？","options":[{"text":"伸手碰一下，按住封面","affectionWho":"","affection":0,"insomnia":0,"flag":"laid_hand_on_the_lords_ledger","next":""},{"text":"不碰，等他先说条件","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_before_touching_the_ledger","next":""},{"text":"把账往自己这边拉半寸","affectionWho":"","affection":0,"insomnia":0,"flag":"pulled_the_ledger_half_back","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"等一下。在你说条件之前，请把他的计数方式说清楚。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"一格就是一个人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不对。二百七十天前那次删除，城里有四个人同时消失。那一次你画了几格。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"一格。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"另外三个是你们自己补上去的。世界不愿意留空，它宁可编造，也不肯承认少了一个。"},{"type":"choice","text":"","prompt":"一格算四个人，世界自己补位。这句要核对吗？","options":[{"text":"要核对，让艾莉丝调档案","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_alice_to_verify_the_four","next":""},{"text":"不核对。他犯不着在这种事上撒谎","affectionWho":"","affection":0,"insomnia":-1,"flag":"took_the_lords_counting_at_face_value","next":""},{"text":"先问小雅：那四个人还在说话吗","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_xya_about_the_missing_four","next":""}]},{"type":"narration","text":"艾莉丝的笔盖在手里捏着，没有放下。"},{"type":"narration","text":"我听见艾莉丝把笔盖按上，那一声比平时重。她这一个月查过每一次异常事故，从来没有在档案里见过「四个人」这三个字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"所以我们一直在数错人。我们数的是补全之后的版本。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你刚才看见的那一格，是二百七十天前空出来的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"每一格空出来，城里就少一个人。每一格里的人和别人都没有关系，所以没有人会觉得疼。"},{"type":"choice","text":"","prompt":"没有人会觉得疼。这句扎到你了吗？","options":[{"t on","text":"我想起车站那天左手心里那一小把灰的温度。我想起老周说，全馆十一个人都记得那排书架本来就少一个位置。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那你告诉我一个数。你到现在删掉过多少人，只要一个数就行。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我删过四千七百一十二次。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"其中四千六百八十九次记为订正。剩下二十三次记为未决。"},{"type":"choice","text":"","prompt":"四千七百一十二。这个数字你抓哪一头？","options":[{"text":"抓那二十三次未决","affectionWho":"","affection":0,"insomnia":0,"flag":"grabbed_the_twentythree_unresolved","next":""},{"text":"问他：每一笔都是你亲手划的吗","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_if_every_stroke_was_his","next":""},{"text":"不抓。把数字原样放下","affectionWho":"","affection":0,"insomnia":-1,"flag":"put_the_number_down","next":""}]},{"type":"narration","text":"他报数像图书馆在报还书。"},{"type":"narration","text":"我原以为他会含糊过去。他说得很平，平到像是在报一张早就核对过十遍的清单。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你不必替那些人难过。难过是最没有用的一种记账。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你不必替那个人难过。难过是最没有用的一种记账。"},{"type":"narration","text":"雷恩在门口的暗处动了一下。他没有说话，但他把身体往门框上靠了靠，那是他要开口之前的习惯。"},{"type":"choice","text":"","prompt":"他改了一个字。要点破吗？","options":[{"text":"点破：哪一个是「那个人」","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_the_one_person_was","next":""},{"text":"不点破。把这个改动收进心里","affectionWho":"","affection":0,"insomnia":-1,"flag":"filed_the_word_change_quietly","next":""},{"text":"把这句复述给艾莉丝听","affectionWho":"","affection":0,"insomnia":0,"flag":"repeated_the_line_to_alice","next":""}]},{"type":"narration","text":"他改了一个字。从那些人改成那个人。我听见了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……你要谁的名字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我要的那个人，本来就不该在这张纸上。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们四个人里有一个是补上来的缺口。我上一次数过，这一次也数过，数出来的是同一个。"},{"type":"choice","text":"","prompt":"他说四人里有一个是补上来的缺口。回头吗？","options":[{"text":"回头，把三个人挨个看一遍","affectionWho":"","affection":0,"insomnia":0,"f tion","text":"我开口，只回了两个字：听见。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","label":"l02","text":"你在她的位置上听。这一点你自己也不知道为什么。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……空格子里那个人说的是哪三个字，你再说一遍。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"「别答应我。」她说完还笑了一下。笑的时候她嘴里缺了一颗牙。"},{"type":"narration","text":"雷恩听完没有吭声。他往账那边走了一步，把那本东西从头到尾翻了一遍，翻得很快，一页一页往下甩。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"这本东西没有年龄，没有地址。它只有名字和一行编号。"},{"type":"choice","text":"","prompt":"雷恩把整本账翻完了。问他找到什么了吗？","options":[{"text":"问：你找到你要的了？","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_raine_what_he_found","next":""},{"text":"不问。他翻页的手在抖","affectionWho":"","affection":0,"insomnia":-1,"flag":"noticed_raines_shaking_hand","next":""},{"text":"记住他停过的那一页","affectionWho":"","affection":0,"insomnia":0,"flag":"marked_the_page_raine_stopped_on","next":""}]},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"人不需要年龄和地址。人只需要被写下来。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们守望者的名册也一样，进册的子只写编号，不写姓。"},{"type":"narration","text":"雷恩把账合上了。他合得很轻，轻到没有声音，这个动作比他摔东西更让我心慌。"},{"type":"narration","text":"小雅退了半步。她退的时候没有看我，也没有看雷恩，她一直看着那面墙。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"那只格子里的人已经不在名单上了。她的话没有分量。"},{"type":"choice","text":"","prompt":"小雅一直盯着签墙。要把她拉回来吗？","options":[{"text":"拉她回来，站到墙和她中间","affectionWho":"","affection":0,"insomnia":-1,"flag":"pulled_xya_from_the_tag_wall","next":""},{"text":"不拉。让她把墙看完","affectionWho":"","affection":0,"insomnia":0,"flag":"let_her_finish_the_wall","next":""},{"text":"问她：还空着几格","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_how_many_cells_were_empty","next":""}]},{"type":"narration","text":"她退的那半步很轻。轻得像怕碰倒什么东西。"},{"type":"narration","text":"我看见艾莉丝的仪表指针轻轻碰了一下底。她把它扶起来，又看着它落回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"这里的等价关系不对。一页的删除，换一整座城市。这个比例太便宜了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried" ":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这一格没有名字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"这一格本来有。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"写它的人把名字先划掉了，然后把这一页交给下一任。我就是从这一页上出来的。"},{"type":"narration","text":"屋里静了一下。签墙上有三张签同时轻轻晃了晃，晃完就停了，像是有人从它们旁边走过去。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"所以要拿走的不是一个人的名字。你要替我把这一格补完：写上一个名字，让这一页看上去是完整的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"这样我就可以把它合上。"},{"type":"choice","text":"","prompt":"他要你把第一格补完。问写什么吗？","options":[{"text":"问：什么样的名字算数","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_name_would_count","next":""},{"text":"不问。他会自己说规则","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_his_writing_rule","next":""},{"text":"问：补不完会怎样","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_if_it_stayed_open","next":""}]},{"type":"narration","text":"补完。他用这两个字的时候，像在递一样很轻的东西。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"写谁。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"写一个已经没有人记得、但确实存在过的人。"},{"type":"narration","text":"我的笔尖碰到纸上。我本来想写老周。他教过我怎么在一栋楼里跟人打桩。"},{"type":"narration","text":"我又想写小雅。她今天一直在替我数那些签。"},{"type":"narration","text":"最后我打算写苏禾。我在图书馆的登记簿上见过自己的笔迹写下的这个名字，见过四楼那口不存在的钟，见过第三层那些没有名字的书。"},{"type":"choice","text":"","prompt":"你想过老周，想过小雅。这一笔怎么落？","options":[{"text":"写下去，手别抖","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_suhe_without_shaking","next":""},{"text":"写之前，把那个名字念出声","affectionWho":"","affection":0,"insomnia":-1,"flag":"said_the_name_before_writing_it","next":""},{"text":"闭着眼写完，再睁开","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_it_with_eyes_closed","next":""}]},{"type":"narration","text":"我在心里把她的名字写了一遍，又划掉。"},{"type":"narration","text":"所以我把那两个字写下去了。那个名字是我在图书馆的登记簿上见过的：苏禾。"},{"type":"narration","text":"写的时候我的手很稳，一笔也没有抖。我知道自己写的不是别人，是那个连自己都不记得有没有过生日的人。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我写完了。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我知道你会写这一个。你从三月十二号起就没有放下过它。"},{"type":"choice","text":"","prompt":"名字写完了。要不要跟她说一句？","options":[{"text":"说：这是我记得你的方式","affectionWho":"","affection":0,"insomnia":-1,"flag":"gave_her_his_remembrance","next":""},{"text":"不说，把页角按平","affectionWho":"","affection":0,"insomnia":0,"flag":"pressed_the_written_page_flat","next":""},{"text":"把那个名字轻声念一遍","affectionWho":"","affection":0,"insomnia":-1,"flag":"whispered_the_written_name_once","next":""}]},{"type":"narration","text":"最后一笔收住。手记得自己写过，胸口没有。"},{"type":"fx","fx":"timeline","text":"我在纸上写下的那两个字，和账上原来的墨迹并排着，像两条走了很久才碰上的线。"},{"type":"narration","text":"笔尖离开纸的那一秒，我听见的合页声比刚才更近。那声音从墙的方向来，从最里面那个空钉子那儿来。"},{"type":"narration","text":"我数了数墙上的签。我进来的时候数过一遍，现在少了一张。少了的那一张不是我写的名字，是另一个我一辈子没有见过的人。"},{"type":"choice","text":"","prompt":"签少了一张。告诉后面三个人吗？","options":[{"text":"告诉。一起数一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_missing_tag_with_them","next":""},{"text":"不说。把数目记在自己心里","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_the_tag_count_to_himself","next":""},{"text":"问领主：那张签去哪了","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_where_the_taken_tag_went","next":""}]},{"type":"narration","text":"我没有出声。墙上签的数目我记下了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你收的帐不止一笔。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"帐只收一笔。你写下的那一笔。"},{"type":"narration","text":"我把笔放回笔架上，用袖子把刚才写的那两个字按了一下。墨迹是干的，干得很快，像本来就在那儿的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你今天收的这一笔，是第三十一个。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"第四千七百一十三次。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"数字不重要。重要的是这一笔是你划的。"},{"type":"choice","text":"","prompt":"他说这一笔是你划的。认这个说法吗？","options":[{"text":"认。是我划的","affectionWho":"","affection":0,"insomnia":0,"flag":"admitted_the_stroke_was_his","next":""},{"text":"不认。是账借我的手","affectionWho":"","affection":0,"insomnia":-1,"flag":"blamed_the_stroke_on_the_ledger","next":""},{"text":"认，并且让他把日期记上","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_to_date_his_own_stroke","next":""}]},{"type":"narration","text":"我划的。这两个字落在我手上。"},{"type":"narration","text":"他把账合上，双手压着封面。我看见他的指关节都露出来了，那双手的样子和我自己的手重叠了一下。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"刚才那张签是你进来以前的旧账，它本来就松了，是你把它碰掉的。"},{"type":"narration","text":"写完，我听见很远的地方有东西轻轻合上了。"},{"type":"narration","text":"整面签墙上的签在同一瞬间安静下来。那种安静不是没人说话，是所有的名字同时闭了嘴。"},{"type":"choice","text":"","prompt":"整面签墙同时安静了。这一刻你信吗？","options":[{"text":"信。先把肩膀放下来","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_his_shoulders_drop","next":""},{"text":"信一半。眼睛盯着他的手","affectionWho":"","affection":0,"insomnia":0,"flag":"half_believed_the_ledger_was_balanced","next":""},{"text":"不信。手还压在笔上","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_his_hand_on_the_pen","next":""}]},{"type":"narration","text":"那一声合得很远。远得像别人家的门。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"账平了。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"从现在起，城里不会再多一道裂缝。你们今晚可以走出去。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"但你要记住一件事：你划掉的那个人，是刚刚被你选出来的。"},{"type":"narration","text":"门外传来很远的一阵刹车声。我这才发现，我们进来的时候有没有关门，我已经想不起来了。"},{"type":"choice","text":"","prompt":"他说你们今晚可以走出去。出门前先做什么？","options":[{"text":"回头数一遍身后的三个人","affectionWho":"","affection":0,"insomnia":-1,"flag":"counted_the_three_before_leaving","next":""},{"text":"先把笔放回笔架","affectionWho":"","affection":0,"insomnia":0,"flag":"returned_the_pen_to_the_holder","next":""},{"text":"问艾莉丝：第二笔账还在不在","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_alice_about_the_second_ledger","next":""}]},{"type":"narration","text":"我记得。不用你提醒我记得。"},{"type":"choice","text":"","prompt":"名字已经写上去了，笔还没放下。","options":[{"text":"把笔收好，什么也不解释，转身先出门","affectionWho":"雷恩","affection":6,"insomnia":3,"flag":"trade_kept_silence","next":"3-5"},{"text":"出门之前，当着他们三个把刚才写下的名字轻声念一遍","affectionWho":"艾莉丝","affection":8,"insomnia":6,"flag":"trade_spoke_name","next":"3-5"},{"text":"出门之前，再问领主最后一句：第一格上原来写的是谁","affectionWho":"小雅","affection":4,"insomnia":4,"flag":"trade_asked_first_line","next":"3-5"}]}]},"3-5":{"sceneId":"3-5","chapter":"第三幕·最终决战","title":"终极对抗","background":"bg_lord_hall","bgm":"bgm_lord","next":"3-6","lines":[{"type":"narration","text":"出了那道门，时间没有按我以为的方式往前走。"},{"type":"narration","text":"一分钟里我数了三次自己的心跳。三次都对不上脚步，中间有一次多跳了一下。"},{"type":"narration","text":"雷恩走在最前面，脚步很轻。他这一个月走路的姿势没变过：脚跟着地，脚掌先落，从来不拖。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我们刚才明明是从那道门出去的。这道门后面应该是大厅，不是走廊。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我们出去的时候没有人回头看。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"没有回头看过的地方，本来就不算走出去过。"},{"type":"narration","text":"我们四个人在一条走廊里走了一分钟，走廊两头的灯就跟进来的时候不一样了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我们没出去。刚才那扇门只是让我们从大厅的一头走到另一头。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"……我数着步子。三百四十一步，正常的楼里没有这么长的走廊。"},{"type":"narration","text":"走廊尽头是那面挂满签的墙。这一次它离得近，我能看清每一张签的边。"},{"type":"narration","text":"我抬头找那个空格子。它还在，钉子还在，只是钉子旁边多了一行铅笔写的小字。"},{"type":"narration","text":"那行字的写法我认得——笔画到最后一笔会往下拖，拖得很长，像写到一半就不想写了。那是我自己在图书馆登记簿上的写法。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你又回来了。这说明你把那一页补完了，也说明那笔账没有真的平。"},{"type":"narration","text":"他坐在原地，和刚才一样。可我这次看着他，看见的东西不一样了。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你一直在看我这张脸。你看不清，是因为你一直在找一张脸。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我没有脸。你们每一张脸都是我借来的，用完就还。"},{"type":"narration","text":"他说这话的时候，那张脸开始慢慢地、一层一层地换：先是一个中年女人的下颌，然后是灰外套老人提菜时微微前倾的姿势，接着是老周把手按在推车上的那半秒。"},{"type":"fx","fx":"insomnia","text":"我眨了两次眼。第二次数出来的东西多了一层，像同一句话被念了两遍。"},{"type":"narration","text":"换到最后，那张脸停在某个我不认识的样子上。五官都很淡，像铅笔被橡皮擦过好几遍的纸。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你不是神。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我不是。我从来没有说过我是。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们研究所把我写进事故类别第三级，守望者把我写进需要清除的名单。两边都写着，两边都没写清我是什么。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……我们所长说你是人。三年前他带队进来过，回去以后他就再没提过这件事。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"他提过。他回去的那天晚上一个人说了四个小时，旁边没有人听。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"没有人听的话不算说过。他现在死了，所以他说的东西也一起被收走了。"},{"type":"narration","text":"雷恩没有回嘴。他把手从腰上放下来，放得很慢，像是先把一件很重的东西放在地上。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我不是。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"我是这栋城市补不上的一块。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"二百七十天以前，是有人先删掉了名单上的第一个人。那个人被删得很干净，干净到他连自己都不记得自己有过名字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"剩下的东西没有地方去，就堆在一起，堆成了我。"},{"type":"narration","text":"他把手放在那本账的第一页上。我这才看清，那一格空出来的名字栏里，其实不是空的。"},{"type":"narration","text":"那儿有一道很浅的印子，是被橡皮擦过的痕迹。印子的形状能看出来，那里原来写过两个字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们一个名字一个名字地记，我就一个名字一个名字地长。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"所以这一个月我做得越多，你就越清楚。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你做得越准。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们四个人里，你最能听见被删掉的东西。这不是天赋，这是补偿：你身上的空缺比谁都多。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我身上哪来的空缺，我父母都活着，我没什么可丢的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你今年二十二。你记得自己七岁那年的事吗。"},{"type":"narration","text":"我张开嘴要答，答不出来。我记得七岁的夏天，记得那年的雨，可那一年在我记忆里只有六百多天那么长。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你自己去数。数完再来问我。"},{"type":"narration","text":"账页上那一格我看了很久。格子里没有照片，没有年龄，只有一个被划掉的名字栏和一行很小的说明。"},{"type":"narration","text":"那行说明是印刷体，只有六个字：余项，不退不补。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"这行字是谁写的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"制度。你们研究所归档的时候也这么写，只是你们换了一个听起来更干净的说法。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"研究所没有这种说法。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"那种编号只发给现场。我经手过二十六份。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"第二十份你写过批注。你在批注栏里写了三个字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我写的是「有人在」。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"对。那三个字后来被你自己划掉了。"},{"type":"narration","text":"艾莉丝没有否认。她把仪表攥得紧了一点，指节上那两道印子又浮出来。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"有的。你们的版本叫作无法定性的时间异常，后面跟一串编号。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我写过二十六份这样的报告。每一份最后都归档，每一份都没有结论。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你不是没有结论。你是把结论写在了别人不会读的那一页上。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"每多一个人记得，我就多一张脸可以借。你记得越多，我越像我。"},{"type":"narration","text":"这句话让我手心发凉。原来这一个月里我做的每一件事，都是在他身上添笔画。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你们看墙上那些签。它们在往中间挤。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"每一张签都在说同一句话：我不是第一个，别看我。"},{"type":"narration","text":"艾莉丝走到那面墙前面，把仪表贴在墙上。指针先是往上跳，跳到某个位置后死在那儿不动了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"这些签上的时间是同一个时刻。所有名字被删掉的时间是同一秒。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"那不可能。除非删除这件事本身只有一次，剩下都是重复。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你们的研究所给了它一个名字，叫时间裂缝。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"它真正的名字是纸。这张城市是一张写满字的纸，我只是替它把错的字擦掉。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"错的字是谁写的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"写的人已经不在了。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"所以没人能改这张纸，只能一页一页地擦。"},{"type":"narration","text":"雷恩往前走了两步，站在我和领主中间。他的右手背朝外翻着，那道烙印的颜色比上午更深了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……我妹妹的名字，是你在哪一年擦的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你自己心里有数。那天你挡了一下，被换走的就是她。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你一直以为你在找她。你其实是在找我。"},{"type":"narration","text":"雷恩没有动。他这个人从来不会在听懂之前动手。可这次他听懂了，他还是没有动。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"我妹妹的名字叫雷小满。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……我写在本子上写过三百多遍。今天第一次说给别人听。"},{"type":"narration","text":"他说这句话的时候在看我。我翻开记录本，找到那一页，把「雷小满」三个字写在最下面。"},{"type":"narration","text":"写的时候我发现一件事：这一页上别的名字都还是黑的，她的名字写下去就是灰的，像墨被纸吃掉了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"她的名字在这张纸上占不住。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"雷恩，你写的这三百多遍，都是写在一张会往外渗的纸上。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"……我知道。所以我才写了三百多遍。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"……我等这句话等了三年。"},{"type":"narration","text":"我忽然想起一件事。下午在基地里翻老周留下的那本旧借阅记录时，我看到过一行夹在中间的登记：一张借书卡，借期是四十年前，卡上的持卡人写着两个字，姓周，名字被人用铅笔涂掉了。"},{"type":"narration","text":"我当时以为那是老周自己。现在我知道不是。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"老周找的那个人，也是在这张账上被划掉的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"他在自己的柜子里留了一张借书卡。卡上的名字被铅笔涂掉，涂得很干净。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我一直以为那是他自己涂的。现在我知道不是。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"是他涂的。涂完他就把卡插回原位，插了四十年。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"他不是在找那个人。他是在给自己留一条以后能查回去的路。"},{"type":"narration","text":"我把本子翻回那一页，在那行登记下面加了一行小字：老周把卡插回去的那一年，是他四十一岁。"},{"type":"narration","text":"我忽然想起一件事。老周从来不借书。他在图书馆待了三十五年，一次都没在登记簿上写过自己的名字。"},{"type":"narration","text":"我小时候问过他为什么。他说，一个人要是老在一本书上写自己的名字，那本书就会认得他。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"他是在躲。他躲了三十五年。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"躲得掉的东西不叫名字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"他找了四十年，找到的是一层又一层的空白。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"所以你现在的选择不是救谁。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你要选的是这张纸以后由谁来写。"},{"type":"narration","text":"他把账推开一点，露出底下压着的东西：一支笔，笔杆上有三道磨平的指痕，正好对着我的三根手指。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你拿笔的姿势和他一样。你们和写字的人，用的是同一只手。"},{"type":"cg","background":"cg_lord_face","text":"我抬起头。那张一直不肯停下来的脸，第一次停住了。"},{"type":"fx","fx":"flash","text":"屋里所有的灯同时暗下去又亮起来，亮起来的时候，他的脸离我只有一臂的距离。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"看清楚了。看清楚以后，你再决定要不要接这支笔。"},{"type":"narration","text":"我看见了一张脸。那是一张很普通的、四十岁上下的男人的脸，眼下有很深的青，像是很多年没有睡过整觉。"},{"type":"narration","text":"隔着那张脸，我听见自己在心里说了一句很没出息的话：这张脸我在镜子里见过。"},{"type":"choice","text":"","prompt":"他等着我伸手。","options":[{"text":"接过那支笔","affectionWho":"时间领主","affection":0,"insomnia":1,"flag":"took_the_pen","next":"3-6"},{"text":"退后一步，先问他把艾莉丝的名字放在账上第几行","affectionWho":"艾莉丝","affection":7,"insomnia":1,"flag":"asked_for_alice_line","next":"3-6"},{"text":"不退也不接，问他苏禾这个名字是被谁划掉的","affectionWho":"小雅","affection":5,"insomnia":2,"flag":"asked_suhe_line","next":"3-6"}]}]},"3-6":{"sceneId":"3-6","chapter":"第三幕·最终决战","title":"最终对决","background":"bg_time_core","bgm":"bgm_battle","next":"3-7","lines":[{"type":"narration","text":"四月十号，凌晨。我们没有走出那栋楼，我们只是走到了楼的下面。"},{"type":"narration","text":"时间核心在井底，是一个不太亮的东西，形状像一枚被压平的钟。它每转一格，周围的空气就跟着少一点声音。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"外壳的周期是八分四十秒。前七分钟可以站人，最后一分四十秒必须退出去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这个数字是我用自己的表算的。它已经不准了，但方向是对的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"……外面归我。你进去以后，我数到七分钟就来拽你。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我站得比你们都近。它一开口我先听见，我喊一声你们就走。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我数了一下，井底到井口是四十七级铁梯。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我数这个不是为了跑。我是想在你们喊的时候知道你们在哪儿。"},{"type":"narration","text":"她从口袋里掏出一把咖啡店用的收银纸，撕成四条，一条一条塞给我们。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"一人一张。上面我写了字，你们现在就别说。等出去以后再看。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我算过了。外壳转完一圈是八分四十秒，八分四十秒里井底的空气会换三次。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"第三次换气的时候人会失重几秒。那几秒里谁都拉不住谁。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"……那就是说，最后一分四十秒谁也上不去。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……物理归物理。三年前那条路我也是这么算的，算到最后还是有人下来了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我们那次一共进去七个人。出来的是我，因为我走在最后，也因为我身上有一个烙印。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你今天又要走在最后。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"我走在最后不是因为我想当英雄。是因为我走得比你们熟。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"你上一次也这么说。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"谁也上不去。这是物理，不是胆量的问题。"},{"type":"narration","text":"她说这句话的时候没有看我们任何一个人，她在看自己的表。她这块表从三月十三号起就没有对过北京时间。"},{"type":"narration","text":"我把那一条纸折好塞进内袋。我这一件外套的内袋里已经有半张退路图、一片撕下来的纸，现在又多了一条。"},{"type":"narration","text":"我们四个人在井底分开了站。这个词我以前只在书里读到过，现在它变成了我们脚下的位置。"},{"type":"cg","background":"cg_final_choice","text":"那枚被压平的钟开始转。"},{"type":"fx","fx":"shake","text":"井壁上的灰一层一层地往下掉，掉得很有规律，像有人在很远的地方数着拍子。"},{"type":"narration","text":"我走到核心跟前，把记录本翻开。我要做的事情很笨：在它转完这一轮之前，把这一整本上的名字按顺序念一遍。"},{"type":"narration","text":"念一个名字，被删掉的人就回来一点。回来的人越多，我手里的东西越少。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你念到第三十一个的时候，会开始念错。念错的次数多了，你就不再是你。"},{"type":"narration","text":"我内袋里那片纸还在。三小时前我在长桌上念过一个自己编的名字：何寻。那本账当时动了一下，又停住了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"账不认我编的名字。那它认不认这张。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"它不认不存在的字。它认得被试过的纸。"},{"type":"narration","text":"我把那片纸抽出来，举到他面前。纸上是那两个字，笔画很干净，写的时候我一点也不慌。"},{"type":"narration","text":"领主看着那片纸看了很久。他移开视线的动作很轻，可他还是移开了。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你会变成另一页。这是我唯一提醒你的事。"},{"type":"narration","text":"我开始念。第一个名字是陈。第二个是阮宁。第三个是小雅外婆家那台收音机里报过的名字，我到现在也没弄清那是谁。"},{"type":"fx","fx":"timeline","text":"纸上的字开始有影子。每念一个名字，就有一条很细的线从纸上竖起来，往井壁上爬。"},{"type":"narration","text":"我念到第九个的时候，听见井口那边传来一声闷响。"},{"type":"narration","text":"雷恩没有喊。他喊的时候从来不用嗓子，他用脚步。"},{"type":"narration","text":"他上来之前把外套脱了，搭在铁梯最下面一级上。他这个人从来不脱外套，他说过穿着衣服挨打比较不疼。"},{"type":"narration","text":"我喊了一声他的名字。他没有回头，只是举起右手，朝下面摆了摆。那个手势的意思是：别管我，你念。"},{"type":"narration","text":"那段沉默里我想起一件事：我今天早上出门的时候，把记录本最后几页留了空白。"},{"type":"narration","text":"我这样做是因为我打算把回不来的人写在最后。当时我以为那是别人，现在我知道那几页是留给我自己的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你写字的时候手的声音我听见了。你写到第五行的时候停了很久。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我在想一个名字怎么写。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"写错了可以划掉，划掉的不算。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"划掉的不算。你说得对。"},{"type":"narration","text":"我低下头继续念。第十一个名字念到一半的时候，井口传来铁器撞石头的声音，然后是一段很长的沉默。"},{"type":"narration","text":"那段沉默比声音更让我数不清拍子。我对着本子数了三遍，三遍都数丢了同一个位置。"},{"type":"narration","text":"我抬头，看见他站在井口的铁梯上，左手背朝外，那道烙印正在发光，光把他的手骨照得透出来。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"……上面有三个人下来了。都是信徒。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"你们继续念。我把楼梯守到七分钟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"雷恩，你手上的烙印已经到极限了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我知道这一条。物理归物理，楼梯归楼梯。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"上一次换走的是我妹妹。这一次换我，账就平了。"},{"type":"narration","text":"他说完就上去了。我听见铁梯被踩得一下一下地响，声音越来越远，越来越轻，最后轻到像没有人在上面。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他在上面流血。我听见了，那种声音和墙上不一样，这种声音是从人身上出来的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"他手上的烙印撑到第八分钟就会收不住。现在是第六分十秒。"},{"type":"dialogue","speaker":"林晓","sprite"
