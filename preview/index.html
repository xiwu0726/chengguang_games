:"linxiao_tired","text":"那就把最后一段楼梯留给他。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你说得轻松。楼梯断了一节，他自己下不来。"},{"type":"narration","text":"我继续念。念到第十七个的时候，我发现自己漏掉了老周。"},{"type":"narration","text":"那本上的名字我按顺序写了一个月，从来不会漏。我停下来看那一页，那两个字就在那儿，写得清清楚楚，是我的笔迹。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你的手在抖。抖的位置跟你上次读数的时候一样。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"有人在这一页上把我写的东西抹淡了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"不是有人。是这本账自己在收账。你念出来的名字会从你写下的地方往回退。"},{"type":"narration","text":"我把那两个字重新描了一遍，描得很慢。描完，井壁上多了一条线，一直爬到最高的地方才断。"},{"type":"narration","text":"小雅忽然抓住我的袖子。她整个人往后退了一步，退到井壁边上，后背贴着石头。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"有人在你们后面。不是从上面下来的，是从墙上走出来的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他有名字。我一直能听见他的名字，可他一说话，那个名字就掉一个字。"},{"type":"narration","text":"他脸上的东西很平，平到我能看见他额角有一块旧疤。那块疤的形状我在图书馆的旧照片上见过一次。"},{"type":"narration","text":"那是一张八年前的合影，第七中学的六个人，最左边那个人脸被挡了一半。挡着的位置刚好是额角。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"照片上那个被挡住脸的人，是你。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"他的名字刚才掉了一个字。现在剩两个字了。"},{"type":"narration","text":"我举起本子对着那个影子。本子上没有他这一行，连一道浅印都没有，像是他从来没有被写进来过。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"他不在这本上。他在墙上。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"墙上那张签是他的。签上原来有三个字，现在一个都没了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你把那三个字听出来。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"我听不出来。字掉下去的时候会带走声音，先掉笔画，再掉声音。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"再过一会儿，他就会连脸都没有了。"},{"type":"narration","text":"我回头。井壁的阴影里站着一个我从来没有见过的人，穿的衣服是四十年前的样式，领子很硬。"},{"type":"narration","text":"我举起本子，想确认本上有没有他。本上没有。他这个人在纸上连一行都没有占过。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"老周找了四十年的那个人，是你。"},{"type":"narration","text":"他没有回答。他只是抬起手，指了指井底那枚转着的钟，又指了指我。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"他说，钟转完这一圈，就要收一个人。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他说他等了四十年，就是等有人替他数完这一遍。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你等四十年，是想让人替你数完这一遍。"},{"type":"narration","text":"他点头。他点头的时候用的力气很小，很小，小到我几乎没看见，但井壁上掉下来的灰却停了一下。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他不能自己数。他自己数出来的名字不算，因为他已经不在这张纸上了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"所以他要借一个人的手。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"谁替他数完，谁就顶替他的位置被折进纸里。"},{"type":"narration","text":"我明白了。这就是这个井底真正的结算方式：纸上的人一个一个回来，数名字的那个人一步一步往外走。"},{"type":"narration","text":"我把本子举高一点，让井壁上那条线落在名字上。我数到的最后一个名字就在那儿，写得比别的字小一号。"},{"type":"narration","text":"我低头看本子。本上最后一页还空着，那支笔就在我手心里，笔杆上三道磨平的指痕贴着我的手指。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"林晓，这一本从第一页念起，门就会认你当出口。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"最后留下来按开关的，只能是从第一页念起的那个人。后面谁接着念都不算数。"},{"type":"narration","text":"她说完这句，从口袋里掏出那半张纸——三月初我把退出路线撕成两半，一半在她那儿，一半在我这儿。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你留着的这半张，上面有三个数字。"},{"type":"narration","text":"我把那半张纸接过来，就着本子上的字对了一遍。三个数字我写得很潦草，潦草到只有我自己认得。"},{"type":"narration","text":"这半张纸在我内袋里放了一个月，边上磨毛了，纸上有两道折痕，折痕的位置刚好压着那三个数字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你留着这半张做什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"对号。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你说过，我要是把它丢了，你就知道我那天没听见你说话。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这一个月你一次都没丢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我丢过一次。三月十九号那天在基地，我把它落在图纸下面了，半夜回去找的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"八分四十秒减去七分钟，是一分四十秒。你给自己留的出口，本来就只有这么长。"},{"type":"narration","text":"井口那边又响了一下。这一次不是脚步，是铁梯断了一节的声音。"},{"type":"choice","text":"","prompt":"钟还剩最后一格，我得先决定这一格怎么用。","options":[{"text":"把最后一段楼梯让给雷恩，自己留下按开关","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"stay_for_raine","next":"3-6a"},{"text":"把本子交给艾莉丝念最后一段——第一页是我念的，按开关的还是我","affectionWho":"艾莉丝","affection":9,"insomnia":1,"flag":"gave_book_to_alice","next":"3-6a"},{"text":"先上去把雷恩换下来，再回来念最后一遍","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"traded_place_with_raine","next":"3-7"},{"text":"把小雅推到出口，自己站在钟前面把这一格走完","affectionWho":"小雅","affection":6,"insomnia":1,"flag":"pushed_xya_out","next":"3-7"}]}]},"3-6a":{"sceneId":"3-6a","chapter":"第三幕·最终决战","title":"谁留下来","background":"bg_time_core","bgm":"bgm_battle","next":"3-7","lines":[{"type":"narration","text":"钟还剩最后一格。最后一格走得很慢，慢到我能数清它经过的每一道齿。"},{"type":"narration","text":"铁梯断了一节，断口朝上翘着，像被谁从下面咬断的。"},{"type":"narration","text":"上面有三个人在往下走。雷恩把这三级楼梯守成了一堵墙。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"一分四十秒。这个数字现在是我脑子唯一还算准的东西。"},{"type":"narration","text":"本子在谁手里，这时候已经不重要了。重要的是上面还剩十一个名字。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"他又在说话了。他每次开口，名字就掉一个字。"},{"type":"narration","text":"墙里那个人没有走近。他站在阴影里，抬起手，先指了指井底那枚钟，又指了指我。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他说，钟转完这一圈要收一个人。收进去的那个才是出口。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"门认从第一页念起的人。本子可以往下传，按开关的只认念第一页的那个。这不是选择，是规则。"},{"type":"narration","text":"我翻开最后一页。十一个名字，我写了三十天，从三月十二号写到今天。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你念不完。你念到第三十一个就会开始念错，念错三遍，你就成了另一页。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那你就等着看。这本书上现在只有十一个名字，不是三十一个。"},{"type":"narration","text":"我说的这句话我自己也不确定。可说完之后，我握笔的手不抖了。"},{"type":"narration","text":"墙里那个人又抬了一次手。这一次他没有指钟，只指着自己。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"他说他等了四十年，等的就是有人肯把这一圈数完。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"他还说，如果没有人替他数，他就永远是一个没数完的人。"},{"type":"narration","text":"我这才听懂。他连一个完整的名字都没有。他说话时掉的不是字，是他剩下的那部分。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"他要是占掉那个出口，账上就多出一个人。账上的东西越少，他越轻。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"这一条，账上从来没写过。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"一个没有名字的人当不了出口。他没有被人记得过，他进不去。"},{"type":"narration","text":"他说这句话的时候，声音里少了一层东西。墙上的签在往两边退，露出后面空白的墙。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那就不让他一个人进。他有人记得。"},{"type":"narration","text":"我翻开本子第一页。硬皮上第一行是苏禾，第二行是阿灰——这两个名字都是我从别人嘴里捡回来的。"},{"type":"narration","text":"老周和阮宁写在后面的页上。再往后是陈，是雷小满，是别的还没念出口的名字。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你写了这么多。你都是什么时候写的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"每天晚上写一个。我怕我忘了，就写得慢一点。"},{"type":"narration","text":"我把本子举起来，对着井底那枚钟。"},{"type":"narration","text":"钟没有停。它转得更慢了，慢到每一格都像在称一本本子的重量。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"林晓，上面守不住了。铁梯还剩四节。"},{"type":"narration","text":"他的声音从井口滚下来，中间断了一次。这是他在这个月里第二次把话说断。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我算过很多次。八分四十秒减去七分钟，只剩一分四十秒。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我们这一个月所有的余地，都在这一个数字里。现在的问题是，这一分四十秒给谁。"},{"type":"narration","text":"井底安静了一秒。这一秒里我听见四个人的呼吸，还有一个不属于我们四个人的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"他说他不想要出口。他说他只想有人把他的名字念对一次。"},{"type":"narration","text":"她说完这句，看向我手里的本子。我懂了她的意思。"},{"type":"narration","text":"她要我在那十一个名字里，找出墙里那个人的位置。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"他不是没有名字。他是名字被擦过一次，剩下一个擦不掉的部分。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"擦不掉的部分也得有人念出来。念出来，它才算一个名字。"},{"type":"narration","text":"钟又走了一格。井壁上的灰开始往下掉，比刚才密。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你们四个人的名字我都借过。你们里谁从第一页念起，谁就留下来替我把这一页看住。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_angry","text":"这不是惩罚，这是位置。这个位置总要有人站。"},{"type":"narration","text":"我看着他。他脸上的东西在往下滑，像一层没有干透的字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"位置会有人站。但站谁，不是你说了算的那个。"},{"type":"narration","text":"我往前走一步，站到钟和井口之间。"},{"type":"narration","text":"这一步之后，我脚边多出半条影子。这半条影子比我的短，比我的浅。"},{"type":"fx","fx":"timeline","text":"我眼前的时间散开。井壁、钟、雷恩手背上的光，全都在同一张纸上排开。"},{"type":"narration","text":"纸上有一格是空的，写着出口两个字。它现在没有名字。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我听见了。它在等一个字。"},{"type":"narration","text":"我把笔从本子边上抽下来。笔杆上三道磨平的指痕贴着我的手指。"},{"type":"narration","text":"这一个月我用这支笔写了很多名字。今天这一笔，我要写得比所有名字都慢。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"林晓，你不管是站着还是上来，都别再耽误。上面还剩三节。"},{"type":"cg","background":"cg_crack_open","text":"井壁上裂开一条竖着的口子。口子里没有光，只有一层像纸背面的灰白。那枚被压平的钟停在最后一格上，等一个名字落进去。"},{"type":"narration","text":"我抬头看了一眼井口。天还没亮，井口那一圈天是深蓝色。"},{"type":"narration","text":"我想到的第一件事很没出息：我还没跟老周说一句谢谢。"},{"type":"narration","text":"我想到的第二件事是：本子上还有十一个名字，等着有人把它们念完。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你的手又在抖。抖得更厉害了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"这次不是因为账。这次是因为我在算一件很亏的事。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"算给我听。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"一个人站这个位置，能出去三个。如果这个位置不给我们四个人，它就能给所有名字。"},{"type":"narration","text":"我说这句话的时候，艾莉丝没有反驳。她只是把仪表从手腕上取下来，放进我外套的口袋里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"表停了。它记时间记到最后，停在这一格上。你带着它。"},{"type":"narration","text":"她说完就退回到小雅身边。她的动作很快，快到像怕自己改主意。"},{"type":"narration","text":"井口那边，铁梯又断了一节。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"还剩两节。你们快点决定。"},{"type":"narration","text":"我翻开最后一页，把笔尖放在第一个名字前面。"},{"type":"narration","text":"第一个名字是陈。我把它念出来的时候，井壁上的灰顿了一下。"},{"type":"narration","text":"第二个名字是阮宁。念出来的时候，我胸口那块借来的记忆响了一声，像有人在我身体里翻页。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"她的名字回来了。我听见她说冷。"},{"type":"narration","text":"我继续念。念到第四个的时候，我发现我念得比写下来的快。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你在着急。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我在赶时间。你让我们慢慢忘，我今天要让所有人一起想起来。"},{"type":"narration","text":"我念到第七个。井底那枚钟的齿开始往回收，像在把刚才走掉的格子还回来。"},{"type":"narration","text":"第八个。第九个。念到第十个的时候，我手里的本子轻了一页。"},{"type":"narration","text":"薄下去的是老周那一页。那两个字还在，是我今晚刚描过的那两个字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"还差一个。"},{"type":"narration","text":"最后一个名字很陌生。它不是人名，是一句很短的话。"},{"type":"narration","text":"那句话写的是：别把我记成你。"},{"type":"fx","fx":"insomnia","text":"我的耳朵里开始有第二层声音。很多人同时说话，说的都是同一句：别把我记成你。"},{"type":"narration","text":"我按住太阳穴，把眼睛睁到最大。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"林晓，你的耳朵在流血。"},{"type":"narration","text":"我看了一眼本子。那最后一行字在退色，退得很慢。"},{"type":"narration","text":"我把笔尖按住那一行，一笔一笔地把它描回去。"},{"type":"narration","text":"描完最后一笔，井底没有声音了。连那枚钟都不响了。"},{"type":"narration","text":"钟开始走最后一格。它走得比前面任何一格都慢，慢到我能数清每一道齿。"},{"type":"narration","text":"墙里那个人往前走了一步。他走出阴影的时候，我第一次看清他的脸。"},{"type":"narration","text":"他的脸没有缺什么，他只是很累。"},{"type":"narration","text":"他抬起手，把手掌按在那道口子边上，然后看着我手里的本子。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"他在念自己的名字。念得很慢，一个字一个字，念到最后一个字就没了。"},{"type":"narration","text":"我问小雅，他念的是哪几个字。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"她说她听得见音，抓不住字。他每念到最后一个字，那个字就从她耳朵里掉出去。"},{"type":"narration","text":"我低头看本子。最后一页上多出一行字，不是我写的，是这本账自己长出来的。"},{"type":"narration","text":"那行字只有七个字：没数完的人不算。"},{"type":"narration","text":"我把这七个字念了三遍，一遍比一遍慢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"他在等有人把他数完。他等了四十年。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"可门只认一个出口。它认从第一页念起的那个人，也只能认一个。"},{"type":"narration","text":"我把表从口袋里掏出来。表停在我没有见过的刻度上，指针不抖。"},{"type":"narration","text":"我抬头看井口。天快亮了，井口那一圈天已经从深蓝变成灰。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我听见外面有人在扫街。扫把一下一下的，很有规律。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那是环卫的早班。这个点出门的人，一辈子不会知道昨晚这里发生过什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那正好。他们知道了也帮不上忙。"},{"type":"narration","text":"我低头看了一眼本子。十一个名字挤在最后一页上，字迹一半是我的，一半是别人的。"},{"type":"narration","text":"这本硬皮本子是我三月十二号从图书馆地下室拿出来的，第一页第一行是我从别人嘴里捡回来的名字。"},{"type":"narration","text":"这三十天里它记过被删掉的人，记过借来的记忆，也记过我三个同伴的名字。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"林晓，你要是决定不了，就先把本子给我。我替你拿着，你空着手上去。"},{"type":"narration","text":"我把本子抱紧了一点，没有说话。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"上面还剩两节。我不催你，但我在数。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"钟的声音变了。它不是在走，它是在等人。"},{"type":"narration","text":"我握紧笔。笔杆上三道磨平的指痕贴着我的手指。"},{"type":"narration","text":"艾莉丝手腕上那只表还停在一点四十。从三月十九号起，它没有再替谁数过那一分四十秒。"},{"type":"narration","speaker":"","sprite":"","text":"她把表摘下来，托在掌心里递到我面前，像递一句不好当面问的话。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这只表从三月十九号起就没走过。你说，它现在该在谁的手腕上。"},{"type":"narration","speaker":"","sprite":"","text":"表归谁，这本子上最后一格该填谁的名字，两件事在这一刻是同一件。"},{"type":"choice","text":"这只停在一点四十的表，怎么办？","options":[{"text":"让她重新戴上。走不走是它的事，戴不戴是她的事，我不再替这只表保管谁的最后一分钟。","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"returned_watch","next":""},{"text":"我接过来揣回口袋。它停着的那一格还没走完，等它自己走完了，再还给她。","affectionWho":"","affection":0,"insomnia":0,"flag":"keep_the_watch","next":""}],"prompt":"这只停在一点四十的表，怎么办？"},{"type":"narration","text":"这一格走完之前，我得先定一件事：这一分四十秒，是留给我们四个人的，还是留给像他这样的名字的。"},{"type":"narration","speaker":"","sprite":"","text":"雷恩的手停在梯口，等我把话说完。本子摊在井底的石板上，十一行名字被水渍泡开了一角。"},{"type":"narration","speaker":"","sprite":"","text":"我这一路往里填过名字，也划掉过名字。哪一格该留白，哪一格该收口，只有数得清的人才说了算。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"你要念就一次念完。半途停下来的账，比不念还难收拾。"},{"type":"narration","speaker":"","sprite":"","text":"我把笔尖落到最后一页的最后一行，先定了这一笔，再定谁上去按开关。"},{"type":"choice","text":"这一本账，念不念得平？","options":[{"text":"十一个名字，一笔一笔核到底：谁被删、谁借过、谁还欠着，全部对上，不留一格空白。","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"ledger_balanced","next":""},{"text":"留最后一格空着。有些账对不上，硬凑平的账，回头还要再欠一次。","affectionWho":"","affection":0,"insomnia":0,"flag":"ledger_left_open","next":""}],"prompt":"这一本账，念不念得平？"},{"type":"choice","text":"","prompt":"最后一格正在走完。出口只有一个位置，我给谁。","options":[{"text":"把最后十一个名字念完，连墙里那位一起数进去：账归零，门就不再要人留下，我们四个一个都不留","affectionWho":"小雅","affection":8,"insomnia":1,"flag":"ending_miracle","next":"3-6w"},{"text":"我抢着留下按开关，让他们三个先上去：最后一格没数完，钟不认这笔账","affectionWho":"艾莉丝","affection":8,"insomnia":1,"flag":"stayed_at_switch","next":"3-7"},{"text":"上去把雷恩换下来，让他按开关：他把我推回井底，谁也没换成功","affectionWho":"雷恩","affection":8,"insomnia":1,"flag":"traded_with_raine_at_core","next":"3-7"},{"text":"把小雅按在出口那一格，本子跟着她：开关不吃她手里那本子，她也没出去","affectionWho":"小雅","affection":9,"insomnia":2,"flag":"gave_book_to_xya_at_core","next":"3-7"}]}]},"3-6w":{"sceneId":"3-6w","chapter":"第三幕·最终决战","title":"井外的第一夜","background":"bg_dawn_city","bgm":"bgm_warm","next":"@ending","lines":[{"type":"narration","text":"十一个名字念完的时候，井底没有塌。"},{"type":"narration","text":"我把第十一个名字念完的第二遍，声音在井壁上撞了一下，回来的时候比我预期的要轻。我以为念完这些名字会花掉很大的力气，实际上它像把一摞纸从左手换到右手。"},{"type":"narration","text":"名字落回原处的时候没有声音。老周后来非要说有——他说像抽屉合上。没有人拆穿他，那一晚上他有权力把任何事听成抽屉。"},{"type":"narration","text":"井底的空气开始变凉，凉得很规矩，像有人把季节调回了它本该在的刻度。雷恩把开关的护盖扣上，扣之前用袖子把金属面擦了一遍——那上面本来没有灰，他还是擦了一遍。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"「以后它归维拉管。她管东西比我们任何人都狠。」"},{"type":"narration","text":"没有人反对。我们四个在井底站了一会儿，谁都不急着走，像一间终于下了课的空教室。"},{"type":"narration","text":"雷恩的手从开关上拿开，指节抖得握不住那支笔。艾莉丝把本子摊在膝盖上，从第一页翻到最后一页，又翻回第一页，像在核对一个不该有错的答案。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"「都在。一个都不少。」"},{"type":"narration","text":"雷恩说这句话的时候，手还搭在开关上，像确认它真的不会再收人。过了几秒他才把手拿下来，拿下来的时候他自己的名字也在名单上，他念得最快，快得像怕自己反悔。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"「你念自己名字的时候，卡了一下。」"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"「没有。」"},{"type":"narration","text":"他否认得很快，快反而像承认。我没有再问。井底的光正在往中间收，收得不着急，像一个人收拾桌子，一件一件放回去，谁也没催他。"},{"type":"narration","text":"他说这句话的时候没有看我们任何一个人，他看的是井口那块正在合上的光。光合上以后，城市的声音回来了——先是电车，再是卷帘门，最后是谁家窗户里的电视。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"「你听。」"},{"type":"narration","text":"小雅把耳朵贴在井壁上，贴了很久。她抬起头的时候笑了，笑得像做了件很小的好事。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"「他在里面听着呢。他听见了。」"},{"type":"narration","text":"我们谁都没有问小雅「他」是谁。这几个月里我们学会了这件事：有些代词不需要先行词，全城都听得懂。"},{"type":"narration","text":"艾莉丝把本子往怀里收了收。本子现在比来的时候厚，厚出来的不是纸，是那些回到名字旁边的人。她说回去要给它换封皮，旧的这一张上头有井底的灰，她不想擦。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"「灰也留着。留着的都不是脏东西。」"},{"type":"narration","text":"艾莉丝手腕上那只表在走。她没有把袖口放下来盖住它，她让它走着，走给她自己看。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"「四点十七分。今天的第一分钟。」"},{"type":"narration","text":"那只表走得很正常，正常得像它这一个月停在一点四十才是毛病。艾莉丝让它走着，走给她自己看，也走给站在她对面的雷恩看。雷恩看了一眼，把眼睛挪开了，挪开之前喉结动了一下。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"「它肯走了。」"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"「它一直在等一个不亏欠的人戴它。」"},{"type":"narration","text":"这句话把雷恩钉在原地两秒钟。两秒钟以后他笑了一下，笑得很难看，也很难说出口。"},{"type":"narration","text":"上井的台阶比下来时长。雷恩走在最后，每上一级就回头数一次人数，数到四次才肯继续走。小雅笑他，他也不辩解。"},{"type":"narration","text":"台阶上没有人说话，但那种不说话是满的。小雅走在最前面，每上一级就报一次数，报到二十几就乱了，乱了就从头再报，谁也不纠正她。"},{"type":"narration","text":"雷恩在第七级台阶上停了一次，把外套从井壁上蹭掉的灰拍干净。那点灰他拍了很久，久到小雅回头看了他两次。"},{"type":"narration","text":"走到一半，小雅忽然停下来，把耳朵贴在侧墙上，听了两三秒，然后直起身说她听见水管里有水声。她说这话的时候眼睛亮了一下，像确认了一件很小的、但属于她的事。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"「水管在响。以后它想响就响，不用谁批准。」"},{"type":"narration","text":"井口外面是天亮。不是那种被谁让出来的天亮，就是普通的一天要开始了的那种天亮。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"「先找个能吃早饭的地方。」"},{"type":"narration","text":"这句话说出来的时候，我自己都愣了一下。这一个月我们说的都是「先确认」「先记下」「先别回头」，「先找个能吃早饭的地方」这种句子，像从很久以前的一个普通人嘴里借来的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"「你说『先』，后面跟的是包子。」"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"「『先』字终于能干好事了。」"},{"type":"narration","text":"四个人沿着街走。影子被初升的光拉得很长，四条，一条都没有断。"},{"type":"narration","text":"艾莉丝的本子还摊在最后一页。第十一格是空的，空得干干净净。她把它合上，抱在怀里，像抱着一个终于睡着的孩子。"},{"type":"narration","text":"我走在最外面，第一次觉得困得理直气壮。"},{"type":"narration","text":"那种困不是撑出来的困。它是身体在告诉我：你可以交班了，后面的钟会有别人来上。我把这句话听进去了，听进去的那一瞬间肩膀自己松下来，松得有点酸。"},{"type":"narration","text":"艾莉丝在旁边看着我，看了一会儿，把本子往我这边递了半寸，又收回去。她大概是想让我拿，又觉得今天不该再有任何人替我记账。"},{"type":"narration","text":"台阶口的风是凉的，凉里带一点早点铺子的味道。我在那阵风里站了两秒，忽然意识到今天没有任何一个数字需要我去守。这个认知来得很慢，像一句迟到的祝福。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"「明天开始，各人领走各人的明天。」"},{"type":"narration","text":"他说这话的时候在笑。这几个月里，我第一次看清他笑的时候眼睛是什么样。"},{"type":"narration","text":"小雅把「明天」两个字念了两遍，像在试这两个字结不结实。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"「明天见。」"},{"type":"narration","text":"她说完这三个字，自己先笑了，笑完又补了一句，声音小下去。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"「不对，应该说『早安』。明天见太远了，我们不等明天。」"},{"type":"narration","text":"「早安」从小雅嘴里出来的时候，是它本来该有的样子：一个不需要任何人证明存在的招呼。"},{"type":"narration","text":"街角有包子铺在开门。蒸汽升起来的时候，我把眼睛闭了一会儿——只一会儿——再睁开，他们三个都还在等我。"},{"type":"narration","text":"包子铺老板不认识我们。他给我们装了四个包子，多找了一次零钱，被小雅退回去。退回去的那枚硬币在柜台上转了半圈才立住，我们四个人一起看它立住，然后一起笑了。笑的原因谁也说不上来。"},{"type":"narration","text":"老板把蒸笼盖掀开的时候白汽糊了我们四个人一脸。小雅要了四个肉的，雷恩要了四个素的，最后谁也没数清桌上到底有几个包子，只数清了四个人都在。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"「账上写：今日早饭，四人，无遗漏。」"},{"type":"narration","text":"她说完真的在本子上写了一行。这一行不是名字，不是核对，是一句谁也不欠谁的记录。写完她把本子合上，合上的声音很轻。"},{"type":"narration","text":"写完之后她把本子推到我面前，让我看那一行。字是她的字，横平竖直，末尾没有画任何需要再核对的圈。我看了很久，久到包子铺的蒸汽把那一行字糊模糊了，又等它自己干回来。"},{"type":"narration","text":"往回走的路上经过图书馆。门开着，维拉在里面搬椅子，搬一把就在门口的登记板上划一笔。她看见我们，没有打招呼，只是把最后一把椅子放正了，像给我们让出一个能坐下的世界。"},{"type":"narration","text":"老周坐在台阶上晒太阳，核对表压在他膝盖上，纸角被风掀起一点，又落回去。他抬眼看了一下我们四个，低头在表上写了今天的第一笔，写完把笔帽扣上，扣得很轻。"},{"type":"narration","text":"账平了。名字都回到了该在的地方。而我困得刚刚好。"},{"type":"narration","text":"后来很多天，我都没能想起来那个早上的包子是什么馅。但我知道那天我睡了。不是撑到第二天早上的那种睡，是困意来了、我接住它、它把我放下的那种睡。"},{"type":"narration","text":"井把它的部分还完了。剩下的部分，是我们自己一天一天过出来的。"},{"type":"choice","text":"","prompt":"井口的风还在转。这个位置，给谁？","options":[{"text":"给雷恩。他记下的路，该由他走完。","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"ending_hero","next":"3-7"},{"text":"给小雅。她背下的名单，该由她念完。","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"ending_tragic","next":"3-7"},{"text":"谁也不给。空着，走出去。","affectionWho":"","affection":0,"insomnia":0,"flag":"ending_open","next":"3-7"}]},{"type":"fx","fx":"wait","text":""}]},"3-7":{"sceneId":"3-7","chapter":"第三幕·最终决战","title":"结局选择","background":"bg_time_core","bgm":"bgm_ending","next":"@ending","lines":[{"type":"narration","text":"最后一格走完了。钟停在我数不清的那一格上。"},{"type":"narration","text":"停下来之后，井底变得很大。没有声音的地方，听起来总是比有声音的地方大。"},{"type":"narration","text":"井壁上那道口子没有合。它开着，像一页被人翻起来又忘了放下的纸。"},{"type":"narration","text":"口子里没有路，只有一层灰白，像纸的背面。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"门开着。它认了谁我不知道，但它现在是开的。"},{"type":"narration","text":"她站在井口那边，一只脚已经踩在铁梯上。她的仪表在我口袋里，她手里空着。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"上面没人了。那三个信徒的名字我喊了三遍，一遍都喊不出来。"},{"type":"narration","text":"他手背上的光已经暗了，暗成一道很深的褐色。他站着，把重心压在撬棍上。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"我耳朵里现在很干净。干净得像下过雪。"},{"type":"narration","text":"她说话的时候把手从耳朵上拿开。她这个动作我见过很多次，这一次她的手是空的。"},{"type":"narration","text":"我们四个人站在井底，谁都没有往门口走。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你们还不走。"},{"type":"narration","text":"他的声音是从墙上来的。他不再是站在桌子那头的一个人，他成了一层薄薄的东西，贴在井壁靠里的那一块。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你原来待的那一格，是第一页。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"第一页上被人擦掉两个字。那两个字本来是我的。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"擦掉以后我没有地方去，就把后面所有被擦掉的字收起来，堆成了现在这个我。"},{"type":"narration","text":"他说到堆这个字的时候，墙上那些签同时晃了一下。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"那些签在往他那儿靠。它们在给他添笔画。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"他借出去的每一张脸都在还给他。林晓，他现在是真的在长。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"长起来也没用。他的第一页是空的。"},{"type":"narration","text":"我翻开本子的第一页。硬皮上有一道很浅的印子，是被橡皮擦过的痕迹。"},{"type":"narration","text":"印子的形状我能看出来：那里原来写过两个字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你可以把我念回来。你念回来，我就是一个有名字的人，不是一堆字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你念回来，我从此就站在你那一页上。"},{"type":"narration","text":"我把笔尖悬在那道印子上面。悬了很久。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我不念。你这一个月用名字换过太多东西。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_angry","text":"那你拿什么把这一页结掉。"},{"type":"narration","text":"他问这句话的时候，井壁上那道口子往里缩了一点，缩得像一张嘴在合。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"城市的窟窿还差最后一小块。它在等这一页上落一个字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这一页落什么字，外面就是什么结果。我算不出它会变成哪一种，我只能算出它有四种。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"四种。你说说看。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"第一种，把页合上，什么都不写。城市自己长回去，代价是这一个月像没发生过。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"第二种，写一个人的名字。城市补上，那个名字从此被所有人记得，但他自己得留在纸上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"第三种，把自己送进门里。门从里面合上，外面的人从此没有见过他。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"第四种，什么都不结。把这一页折起来带走，门留一条缝，永远差一个字。"},{"type":"narration","text":"她说完这四种，用手在空气里比了四个位置，像在实验室里给样本编号。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你这四种说法里，没有一种是把墙里那一位也算成一个人，五个人一起走回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"因为墙里那一位连名字都没有。账上只算我们四个活人，那个缺口总要拿一样东西补。"},{"type":"narration","text":"她说墙里那一位的时候没有往墙那边看。她这一个月里报过无数次人数，这一次报得最不准。"},{"type":"narration","text":"井口那边传下来一点声音。是外面路上的洒水车，走得很慢，音乐一遍一遍循环同一段。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"门在数数。它数得很轻，每数一次就少一点东西。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"它数的是什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"数的是名字。它不是数着一二三四，它数的是还没被人念过的那些。"},{"type":"narration","text":"她说完这句话，把手伸进外套口袋。那个口袋里装着一个已经不响的录音机。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我做过六次汇报。每一次的编号我都记得，最后一次的日期是四月三号。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那六份报告现在都在研究所地下的柜子里。我调不到它们，也删不掉它们。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那你打算怎么办。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"等我把手边这件事做完。做完我就回去，把它们一份一份抄出来。"},{"type":"narration","text":"她说抄的时候用的是工作语言。可我知道，她要抄的是六份她自己写下的错。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"别算我。我妹妹的名字我还没写完。"},{"type":"narration","text":"他从口袋里掏出一张折了很多次的纸。上面写着两个字：小满。"},{"type":"narration","text":"那张纸的边缘已经磨破了。他随身带了一个月，我从来没有见他打开过。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"雷恩哥，你写这个的时候手不抖。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"写的时候不抖，写完才抖。"},{"type":"narration","text":"他把纸重新折好塞回口袋，动作跟开战之前一样慢。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"把印子上那两个字念回来，我保你们四个今天都活着从井口出去。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_angry","text":"我说话算数。我只替你签过一样东西，就是你的那三十个小时。"},{"type":"narration","text":"他终于把那三十个小时说出来了。这一个月我找过很多地方，最后是在他要我签字的时候听见的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"三十个小时我不问了。它现在换不回我们四个人站在这里的理由。"},{"type":"narration","text":"我低头看最后一页。上面有十一个名字，最后一行是我今晚描过的那句话。"},{"type":"narration","text":"页脚还剩一小块空白。它不大，刚好够写一个人的名字。"},{"type":"fx","fx":"insomnia","text":"我的眼睛开始重影。纸上的字在游，游成一层浮在上面的灰。"},{"type":"narration","text":"我眨了两次眼。第二次眨完，我看见那十一个名字在往页脚挤。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"林晓，你眼睛的颜色又不对了。你先坐下。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"不能坐。坐下去，我怕我起来的时候不认识你。"},{"type":"narration","text":"这句话说出来的时候，我自己听着都不像是我说的。这一个月我记过太多别人的话，它们现在在我嘴里排队。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你昨晚又没睡。我已经连着看你三天没有真正合过眼了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"到这一步，你会开始把亲历的事和听来的事混在一起。再往上，你连自己都会念错。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那我就在念错之前把这一笔写完。"},{"type":"narration","text":"我把笔尖压在页脚那块空白上。压下去的一瞬间，整个井底都静了。"},{"type":"narration","text":"墙上那个东西也静了。他贴在那儿，像一个等判决的名字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"写吧。这一页总要落一个字。"},{"type":"narration","text":"我抬头看了一圈。四个人，四个位置，看我的眼神都不一样。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不管写什么，写完你都立刻退出去。门口只剩一分四十秒。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"你写完就往上跑。我在楼梯那儿等你，数到七分钟我就往下走。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你别写自己的名字。别的都行，就这个不行。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"为什么就这个不行。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"因为你的名字一落到这一页上，就没有人再从外面叫你了。"},{"type":"narration","text":"她说这句话的时候声音很稳。她这一个月说过很多不靠谱的话，这一句最靠谱。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"如果你写自己的名字，我不会拦你。但我会把你的名字在本子上再抄一遍。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我抄的那一遍不算账，只算我自己的私事。"},{"type":"narration","text":"我把笔尖往下压了半分。纸上出现一个很小的点。"},{"type":"narration","text":"那个点周围慢慢渗开，像墨滴进水里。"},{"type":"narration","text":"我忽然想起三月十二号那天晚上。我在图书馆四楼，看见楼梯口有一层灰在灯下浮着。"},{"type":"narration","text":"那时候我不知道那层灰是什么。现在我知道，那是等着被人念的名字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我写一个不一样的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"说清楚。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我不写名字，我写一句以后谁都能念的话。"},{"type":"narration","text":"我说完这句，抬笔看着那十一个名字，看着雷恩口袋里那两个字的形状。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你那句话得短。长的话，念到一半会喘不上气。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"短的话也得有人记得住。你要挑一句谁都背得下来的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我想好了。就七个字，跟账上那一行长的一样。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"那你先告诉我是哪七个字，我要写进结案文件。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"不用写进去。这句话得留在纸外面才管用。"},{"type":"narration","text":"我想到的是图书馆楼梯口那层灰。它每天浮在灯下面，没有人擦，也没有人念。"},{"type":"narration","text":"我还想到老周。他现在大概正坐在登记台后面盖章，盖章的动作还是三下，一下比一下重。"},{"type":"narration","text":"这一个月我一直在记别人的名字。到今天，我手里只剩一个问题：谁的名字该被写下，谁的该被念出来。"},{"type":"narration","text":"天从井口漏下来。四月十号的早上，光先照到井壁，再照到我们四个人的脚边。"},{"type":"narration","text":"光照到脚边的时候，门里那层灰白变得亮了一点。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你还有时间。这一格还没走完。"},{"type":"narration","text":"我把笔举起来。笔杆上三道指痕贴着我的手指，比他第一天递给我时更平。"},{"type":"narration","text":"然后我把手停在空中。"},{"type":"narration","text":"这一个月我做过很多选择，前面每一个都是在选一个人。"},{"type":"narration","text":"这一次我要选的是：这一页最后落什么字。"},{"type":"narration","text":"井底安静下来。裂缝合上的地方退了风，石板上只剩摊开的本子和那支笔。"},{"type":"narration","text":"我两只手都空了出来，刚好够握一支笔。"},{"type":"narration","text":"井口的风把最后一页吹得抬了一抬。十一行名字压在我手底下，页脚还空着一格。"},{"type":"narration","text":"按开关的人要念完这一页。念完的人，名字会自己长进空格里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"决定了吗？这一页，是烧掉，还是带走。"},{"type":"choice","text":"","prompt":"这一页纸怎么办？","options":[{"text":"把纸折成四折，塞进左边的口袋，贴着肋骨。空着的那一格，我自己慢慢填。","flag":"kept_the_page","affectionWho":"","affection":0,"insomnia":0,"next":""},{"text":"把纸交回艾莉丝，压进记录本封皮内侧。册子记的账，该由册子自己收着。","flag":"page_returned_to_ledger","affectionWho":"艾莉丝","affection":2,"insomnia":0,"next":""}]},{"type":"choice","text":"","prompt":"笔停在页脚那一小块空白上。这一页最后落什么字，由我定。","options":[{"text":"按下去。念完这一页，让名字回到该在的地方。","flag":"ending_normal","affectionWho":"","affection":0,"insomnia":6,"next":""},{"text":"把开关交出去，自己留在井底念完最后一页。","flag":"ending_hero","affectionWho":"","affection":0,"insomnia":4,"next":""},{"text":"谁都不按。把裂缝留着，进去找还困在里面的人。","flag":"ending_tragic","affectionWho":"","affection":0,"insomnia":9,"next":""},{"text":"砸掉开关。这一夜之后，城市自己决定记不记得。","flag":"ending_open","affectionWho":"","affection":0,"insomnia":5,"next":""}]},{"type":"narration","text":"井底最后一段路，是没有人说话的那一段。"},{"type":"narration","text":"按开关之前还剩一个小时。这一个小时，睡不睡得着，决定了我明天站在哪一档精神里做这个选择。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你可以先眯一会儿。我数着呼吸，到点叫你。"},{"type":"choice","text":"","prompt":"最后一小时，怎么过？","options":[{"text":"闭上眼，让艾莉丝数呼吸。那一个小时不属于任何人。","affectionWho":"艾莉丝","affection":3,"insomnia":-12,"flag":"slept_before_the_switch","next":""},{"text":"不睡。把这一个小时用来把十一个名字再念一遍。","affectionWho":"","affection":0,"insomnia":6,"flag":"stayed_awake_to_the_end","next":""}]}]},"3-e01":{"sceneId":"3-e01","chapter":"第三幕·最终决战","title":"结局·归途","background":"cg_ending_e01","bgm":"bgm_warm","next":"","lines":[{"type":"narration","text":"四月十号早上六点四十，我们从那栋楼里走出来。天是灰白的，路上已经有洒水车。"},{"type":"narration","text":"楼下停着一辆修路的车。两个工人蹲在井盖边上，一个人说昨晚这一段又断了一次电。"},{"type":"narration","text":"他们说断了一次电，就像在说一件每天都发生的事。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"他们什么都不知道。他们旁边昨天晚上裂开过一条那么大的缝。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"知道的人越少越好。这条规矩是我写的，现在我自己也觉得它难听。"},{"type":"narration","text":"我们四个人在路口分开之前，谁都没有说话。分开这件事本身，比昨晚那一格钟还难走。"},{"type":"narration","text":"雷恩先走的。他往西边走，那是守望者的方向。"},{"type":"narration","text":"小雅第二个走。她走之前把录音机留给了我，说里面的东西她已经没有用了。"},{"type":"narration","text":"最后剩下我和艾莉丝。她站在路口看了一会儿那辆修路的车，然后转过来看着我。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你的失眠值，我明天给你测一次。站在你那个位置上的人，不能一个人住。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那你测完以后，打算把我搬到哪里去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"研究所的观察室。那里有床，有窗，还有一个很吵的换气扇。"},{"type":"narration","text":"她说这句的时候，脸上第一次没有那种把话说完就收回去的表情。"},{"type":"narration","text":"四月十一号，我在研究所的观察室睡了十一个小时。"},{"type":"narration","text":"醒过来的时候，我分不清哪一段是梦里听来的，哪一段是我自己记得的。这是因为失眠值还在高位。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"比昨天低了一点。这一点是你自己睡出来的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"那我多睡几天，是不是就能睡回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"回不去了。你丢掉的三十个小时不会回来，这跟失眠是两件事。"},{"type":"narration","text":"她说得很直接。这一个月我听她说过很多直接的话，这一句听着最不难受。"},{"type":"narration","text":"研究所把这件事结掉了。结案文件上写的是设备故障引起的区域停电，附了七页数据。"},{"type":"narration","text":"那七页数据是艾莉丝写的。她写数据从来不掺假，只有这一次，她在里面删掉了我们四个人的名字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你把我们写掉了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我写过很多份报告。这一份是我第一次签完字以后坐了很久的一份。"},{"type":"narration","text":"结案之后她被调去做档案整理。她的工位换到了地下二层，那里没有窗，只有一个很吵的换气扇。"},{"type":"narration","text":"我说这像是被发配。她说这样也好，档案室里有的是纸，她可以慢慢看。"},{"type":"narration","text":"她的表一直没有修。停在一分四十秒的秒针上，她戴着它上班，戴着它吃饭。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不修。修好了它就是一块普通的表。"},{"type":"narration","text":"四月十五号，我回图书馆上班。三楼还是那排书架，四楼还是那口坏了的钟，灰还是没人擦。"},{"type":"narration","text":"老周还在登记台后面。他看见我，先问的是我这几天去哪了，账面上一本没还的书都没有。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"老周，你那张核对表还在吗。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"核对表。哪张核对表。"},{"type":"narration","text":"他问得很自然，自然到我一瞬间以为自己记错了。"},{"type":"narration","text":"我看了他一会儿，没有把话往下说。他这四十年一直在等一个人，现在他不等了。"},{"type":"narration","text":"被删掉的是他自己那段日常：每天早上开门先数一遍座位，每年年初换一叠新格纸，一笔一笔填同一张表。这些他现在一个都想不起来。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"你这么看着我干什么。我脸上有灰。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"没事。你今天气色挺好。"},{"type":"narration","text":"他笑了一下，低头继续盖章。他盖章的动作还是三下，一下比一下重。"},{"type":"narration","text":"那天晚上我在书架后面站了很久。楼梯口的灰还在灯下面浮着，只是比三月的时候薄。"},{"type":"narration","text":"我伸手在那个位置比了一下。什么也没有碰到。"},{"type":"narration","text":"城市自己长回去了。它长得很干净，干净到只剩我们四个人记得那一个晚上。"},{"type":"narration","text":"雷恩那边我去看过两次。守望者的院子在老城区，墙上爬满了那种开小白花的藤。"},{"type":"narration","text":"他手上的烙印成了一块褐色的疤，天冷的时候会疼。他说疼的时候好，疼说明那块肉还认得他。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我周末还去西边那条路。走到头就回来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那边现在什么都没有。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"我知道。我就是去走一遍，走完再写一遍她的名字。"},{"type":"narration","text":"他从口袋里掏出那张纸给我看。上面的小满两个字被他描过很多次，描得纸都快透了。"},{"type":"narration","text":"他说这一个月我教了他一件有用的东西：记一个名字就少一个缺口。"},{"type":"narration","text":"我说这不是我教的，是那本账教的。"},{"type":"narration","text":"小雅的耳朵慢慢回来了一点。她还能听见，但不像三月那样铺天盖地。"},{"type":"narration","text":"现在她听见的声音一次只有一个，而且大多是活人。她说这样挺好，至少能分清楚谁在说话。"},{"type":"narration","text":"她回咖啡馆上班了，围裙上还是那片洗不掉的咖啡渍。她一天能走两万多步，晚上倒头就睡。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"你那个本子还写着吗。你别停啊，停了我会听出来的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"还写。现在一个晚上写不了那么多，一般只写一个。"},{"type":"narration","text":"我确实还在写。四月十号以后，本子上新添的名字越来越少，因为想起来的人越来越少。"},{"type":"narration","text":"第一页上的字在退色。苏禾那两个字我描过五次，阿灰那两个字我描过三次。"},{"type":"narration","text":"描的时候我会念出声。念出声的时候，图书馆那个位置的灰会顿一下，像有人在很远的地方应了一声。"},{"type":"narration","text":"我的失眠值一个月里降了一截。艾莉丝说这是她见过的最慢的一次恢复。"},{"type":"narration","text":"降下来那一段是浅眠。浅眠有一个好处：我还能记住自己记得什么。"},{"type":"narration","text":"五月中旬，我们四个人在咖啡馆聚了一次。那是分开以后第一次四个人都在。"},{"type":"narration","text":"小雅点的单，她报得很顺：三杯黑咖啡，一杯热牛奶，还有一杯放在桌子最里面，谁都不喝。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"最里面那杯是给谁的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"给还没回来的人。我每个月都会多点一杯，习惯了。"},{"type":"narration","text":"她说这句话的时候在擦杯子，没有抬头。她擦杯子的动作跟以前一模一样。"},{"type":"narration","text":"雷恩拿出来一张收据，在背面写了两个字，推给艾莉丝。他写的字很大，笔画压得很深。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你写她的名字给我做什么。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"你不是有本子吗。你抄一遍，我这边就轻一点。"},{"type":"narration","text":"艾莉丝看了他两秒，把收据折起来放进外套内侧的口袋里。"},{"type":"narration","text":"她那个口袋我知道，里面放着她的硬皮本子。本子的第一页是空的，第二页上写着我的名字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"抄可以。抄完这一页我就要换个新本子，字写满了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"你那本子上写了什么，能看吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不能。这一页是私事，跟研究所没有关系。"},{"type":"narration","text":"她拒绝得很干脆。这一个月我听她拒绝过很多次，这一次听着最舒服。"},{"type":"narration","text":"那天下午我们聊的都是些没用的事。雷恩说他院子里的藤开花了，小雅说她学会了拉花。"},{"type":"narration","text":"没有人提那个晚上。不是不能说，是说出来以后，桌上的那杯牛奶会凉。"},{"type":"cg","background":"cg_ending_e01","text":"四杯喝完，一杯还满着。窗外的天开始暗下去，咖啡馆的灯一盏一盏亮起来，我们四个人的影子落在同一张桌子上。"},{"type":"narration","text":"散场的时候，小雅把那杯凉了的牛奶端起来，倒进了水池。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"明天再来一杯。倒了不可惜，放着才可惜。"},{"type":"narration","text":"我在回家的路上绕了一段，去了图书馆。那天不是我值班，四楼没有开灯。"},{"type":"narration","text":"我在楼梯口站了一会儿。这一层楼的灰不多，风从楼梯井里往上走，带着纸的味道。"},{"type":"narration","text":"我小声念了两个名字。念完以后什么也没发生，只是那层灰薄了一点。"},{"type":"narration","text":"回到家我把本子放进抽屉。抽屉没有锁，我从来不给它上锁。"},{"type":"narration","text":"我知道哪天晚上要是忘了写，第二天早上我会在抽屉缝里看见一层很薄的灰。"},{"type":"narration","text":"那也是提醒。提醒我有人还在等一个名字被念对。"},{"type":"narration","text":"六月初，城市里下了一场很大的雨。新闻里说那是一次普通的降雨过程，附了两页气象图。"},{"type":"narration","text":"雨停的第二天，图书馆来了一批新书。我和老周一起把它们上架，从三楼搬到四楼，来回走了十一趟。"},{"type":"narration","text":"搬完最后一趟，他坐在台阶上喘气，说了句今年夏天来得早。"},{"type":"narration","text":"我说是啊。他说完这句就下去了，登记台那边有人在喊他盖章。"},{"type":"narration","text":"我一个人站在四楼。窗户开着，雨后的风把书架上的纸页吹得轻轻响。"},{"type":"narration","text":"我伸手把最上面一排书推正，推的时候看见书脊上有一层很薄的灰，被我的手指按出一个印子。"},{"type":"narration","text":"那个印子很小，太阳下去以后就看不见了。"},{"type":"narration","text":"我下楼去还钥匙。这一个月我丢过三十个小时，丢过一个同事，丢过一段借来的记忆。"},{"type":"narration","text":"可我每天还能走路，能上班，能记得我们四个人坐在同一张桌子前面的样子。"},{"type":"narration","text":"这就是我们选的那一种日子。它不响亮，也不值得写进任何一份报告。"},{"type":"narration","text":"晚上七点，我关上图书馆的门。钥匙在锁孔里转了两圈，第二圈比第一圈重。"},{"type":"narration","text":"回去的路上我买了一份面包，一杯热牛奶。牛奶是给小雅的，我明天早上带给她。"},{"type":"narration","text":"走到楼下的时候我抬头看了一眼。四楼那扇窗黑着，跟这一带所有的窗一样。"},{"type":"narration","text":"我从口袋里摸出笔，在面包袋的背面写了一个名字，写得很快。"},{"type":"narration","text":"写完我把袋子折好，塞进口袋，上楼，开门，洗手，把本子从抽屉里拿出来。"},{"type":"narration","text":"然后我坐下来，翻开新的一页，等着想起今天该写的那个名字。"}],"kind":"ending"},"3-e02":{"sceneId":"3-e02","chapter":"第三幕·最终决战","title":"结局·两个人的研究所","background":"cg_ending_e02","bgm":"bgm_warm","next":"","lines":[{"type":"narration","text":"四月十号中午，研究所送来一份结案通知。上面写着设备故障四个字，盖了三个章。"},{"type":"narration","text":"我把通知翻过来。背面是空的，空得还能再写一整份。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"空的地方留着，就是留给别人写假的。"},{"type":"narration","text":"他说完把一支笔搁在桌上。那是守望者的旧货，笔帽上有一道刀痕。"},{"type":"narration","text":"我们俩都清楚，这一夜要是只写成设备故障，下一条裂缝再开的时候，还是会有人在里面被少掉。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那就别写设备故障。我们写名字。"},{"type":"narration","text":"被删掉的记录锁在地下三层的机房。守望者的卡刷不开研究所的门，研究所的人也不会替守望者按指纹。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"行政楼有一间旧档案室。钥匙在门框上面，很多年没人动过。"},{"type":"narration","text":"他说这句话的语气像在报一个班次，不像是在说偷东西。"},{"type":"fx","fx":"wait","text":""},{"type":"narration","sfx":"sfx_door","text":"四月十二号夜里十一点半，我们进了那间屋子。七排铁柜贴着年份，最里面一排是二十九年前的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"从最里面开始。越靠里的越少人翻。"},{"type":"narration","text":"第一晚我们只做了一件事：把每个柜子里的夹子按日期排好，抄在一张纸上。"},{"type":"narration","text":"雷恩抄得很慢，一格一格地写。他写字的时候左手压在纸上，手腕内侧那圈细线露在外面。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"我妹的名字我写过很多遍。写别的名字太快，不习惯。"},{"type":"narration","text":"纸上有一份清单，十一行名字被人一笔一笔划掉了。划痕是同一个人留下的。"},{"type":"narration","text":"我把十一行抄进自己的本子。抄到第六行的时候笔尖顿了一下，像有人从纸背后按住它。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"雷恩。这不是我记错。这是有人一笔一笔删的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"那就一笔一笔写回来。"},{"type":"narration","text":"第二天早上，艾莉丝在复印间门口等着我们。她手里那叠纸，纸角对得很齐。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"地下三层昨晚的灯亮了四十分钟。值班记录我改过了，写成设备自检。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你可以不替我们改。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我改是因为那份结案通知是我签的。签错的东西，我自己修。"},{"type":"narration","text":"她把那叠纸递过来。是档案室的索引，每页右下角都有她标的编号。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"索引我重排过。原件在编号里，复印件也能查。别把原件拿出研究所。"},{"type":"narration","text":"她转身回档案室。走到楼梯口的时候停了一下，没有回头。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你们要做，就做能被人查的那种。锁在柜子里的东西救不了人。"},{"type":"narration","text":"四月十五号，我们在东楼三层挑了一间空办公室。门牌是零三零七，窗户朝北，一年到头没有太阳。"},{"type":"narration","text":"我们把铁柜推进去，把十一份复印件按编号装订。装订第一份的时候，雷恩的手在抖。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"干净点。别人翻的时候，别把手弄脏。"},{"type":"narration","text":"门口那块牌子是我用钢笔写的：公开档案室，任何人可查，登记姓名即可。"},{"type":"narration","text":"第一天没有人来。第二天来了一个退休的铁路职工，他要查他师傅的名字。"},{"type":"narration","text":"他师傅在三十年前那场事故里被划掉了，家里连一张合影都没有留下。"},{"type":"narration","text":"我们在索引里找到那一行。名字后面盖着一个很小的作废章。"},{"type":"narration","text":"雷恩把复印件取出来递给他。他看了很久，说这个名字对，就是少了一个点。"},{"type":"narration","text":"那天下午他坐在椅子上抄了两页纸，抄完把笔还给我，说他师傅的字也这么难看。"},{"type":"narration","text":"老周是第三天来的。他坐了三站公交，围巾上都是雨。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"上回你说的那张核对表，我回去翻了。柜台底下真有半张。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"半张？"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"半张。上面有字，不是我写的。那些人我一个都不认得，可我的手认得那支笔。"},{"type":"narration","text":"他把那半张纸压在登记本下面，说放在这里，比放在他自己的抽屉里安心。"},{"type":"narration","text":"维拉来过一次。她没有进门，站在走廊上看了三分钟，看的是那排铁柜。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"守望者不做档案。我们只做交易。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"那这次算交易。你们出钥匙，我们出名册。"},{"type":"narration","text":"她看了我一眼，从口袋里摸出一张守望者的通行条，压在牌子下面，转身走了。"},{"type":"narration","text":"小雅来得最勤。她下班以后坐地铁过来，在窗边坐着，什么也不查。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你们这里安静。安静到能听见有人在小声念名字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"念的是哪个名字。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"念不全。念到一半，后面那一截像被什么东西吃掉了。"},{"type":"narration","text":"她说这话的时候在抠桌上的胶带印，抠得很慢。她说完也不安慰我们，这是她的习惯。"},{"type":"narration","text":"我们请她做一件事：每天把听见的名字写在便条上，贴在索引柜侧面。"},{"type":"narration","text":"半个月下来，便条贴满了半面柜子。十一个名字能对上原件，剩下的那些是空的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"空的先留着。留着就还有人来填。"},{"type":"narration","text":"研究所没有承认我们，也没有关门。通报里多了一句：东楼三层有一间对外查询室，由研究所与志愿者共同管理。"},{"type":"narration","text":"志愿者那一栏是雷恩报的名。他在身份那里写了守望者，人事看了两遍，最后还是收了。"},{"type":"narration","text":"他要把守望者的烙印盖在登记表上当签名。人事说这个不行，他就用笔把自己的名字写了一遍。"},{"type":"narration","text":"五月，来查的人排到了走廊。我们一天查不完十一份，只能发号。"},{"type":"narration","text":"发号的本子一开始是新的，写到第七天就卷了角。雷恩在封面上画了一条横线，说这就是我们的表。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"那这张表的表头写什么。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_grin","text":"写查得到。"},{"type":"narration","text":"我见过很多张表格。这一张是我第一次不想把它交上去的。"},{"type":"cg","background":"cg_ending_e02","text":"六月的一个下午，阳光从北窗斜进来一小块，落在两张并排的桌子上。左边是原件，右边是复印件，中间只隔着一支笔。"},{"type":"narration","text":"雷恩坐在左边。他还是慢慢地写，写他妹妹的名字。现在他写一遍就够了，不用再描。"},{"type":"narration","text":"我坐在右边，登记来查的人。每写下一个名字，就在索引柜上贴一张便条。"},{"type":"narration","text":"有人问我们这是什么地方。我说，这是研究所的一间办公室，现在谁都能进来。"},{"type":"narration","text":"问的人多半点点头就走了。他们不知道那十一个名字原来在哪个柜子里，也不需要知道。"},{"type":"narration","text":"他们只要知道，这里的抽屉是拉得开的。"}],"kind":"ending"},"3-e03":{"sceneId":"3-e03","chapter":"第三幕·最终决战","title":"结局·重新学睡","background":"cg_ending_e03","bgm":"bgm_hope","next":"","lines":[{"type":"narration","text":"四月十号下午，我把她的表放在研究所的桌上。那天夜里她摘下来交给我保管，表针停在一点四十。"},{"type":"narration","text":"她没有马上拿。她先看了一眼表，又看了我一眼。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我以为你会把它留下。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"它不认我。它认你。"},{"type":"narration","text":"她把表戴回左手腕。扣带扣上的声音很轻。"},{"type":"narration","text":"就在扣上的那一下，秒针动了一格。"},{"type":"fx","fx":"wait","text":""},{"type":"narration","sfx":"sfx_clock","text":"一格，很小的一格。她低头看了三秒，才把手腕抬起来给我看。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"它动了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你不是说，修好了它就是一块普通的表。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"我没有修它。是它自己要走的。"},{"type":"narration","text":"她说完把袖子往下拉了半寸，又拉回去。她没有笑，可那一句话我记住了。"},{"type":"narration","text":"四月十一号早上八点二十，我醒过来。窗帘缝里透进来的是白天的光。"},{"type":"narration","text":"我躺着没动，先把昨天的事想了一遍，怕自己记错。昨天在，前天在，上礼拜也在。"},{"type":"narration","text":"我睡了八个钟头。这是我自己看表看出来的。从三月十四号那天起，我没有睡够过八个钟头。"},{"type":"narration","text":"坐起来的时候，床垫上有一个我压出来的人形凹。以前那个位置总是平的。"},{"type":"narration","text":"这一个月我住在研究所的观察室。有床，有窗，还有一个很吵的换气扇。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"七点四十我来看过一眼。你呼吸很慢，我就没叫你。"},{"type":"narration","text":"她说这句话的时候在翻手上的记录板，翻了两页才抬头。"},{"type":"narration","text":"我把八块碎片装在一个铁盒里交给她登记。一块比一块小，最后一块只有指甲盖那么大。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"八块。你捡这些东西的时候，每一块都少睡一夜。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"现在捡完了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"捡完了就得还。你先把它睡回来。"},{"type":"narration","text":"她把登记表推给我。表上有碎片编号和上交日期，签名那栏我写了自己的名字。"},{"type":"narration","text":"登记表下面压着一张纸条，是她画的睡眠记录表。第一列写日期，第二列写睡了几个钟头。"},{"type":"narration","text":"那张表后来填了一个多月。最长的一格是五月三号，九个钟头。"},{"type":"narration","text":"四月十七号，我回图书馆上班。三楼的书架还在，靠墙那一排往里挪了半米。"},{"type":"narration","text":"老周在登记台后面盖章。他看见我，先问的是我这些天去哪了，账面上一本没还的书都没有。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你来得正好。四楼那口钟，昨天晚上自己响了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"响了？"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"响了一声。就一声。我上去看，钟摆是动的。"},{"type":"narration","text":"那口钟坏了四年。四年前换季的时候停的，修过两次，师傅说里面的轴磨了，换不了。"},{"type":"narration","text":"我上到四楼。楼梯口的灰还浮在灯下面，比三月薄，薄到能看清地板的纹。"},{"type":"narration","sfx":"sfx_clock","text":"钟摆一下一下地摆。指针走在两点十分上，走过的时候有一点卡，但没有停。"},{"type":"narration","text":"我站在钟底下听了一会儿。这个声音我在三月十二号夜里听过一次，那次是错觉，这次不是。"},{"type":"narration","text":"我给艾莉丝发了一条消息：四楼的钟在走。她回得很快：收到，我记一下。"},{"type":"narration","text":"过了十分钟她又发来一条：你今晚几点睡。"},{"type":"narration","text":"我盯着那两条消息看了很久。认识她一个月，这是她第一次问跟工作没有关系的事。"},{"type":"narration","text":"四月二十号晚上，我十点关灯。换气扇转到十点半，之后我就什么都不记得了。"},{"type":"narration","text":"再睁眼是早上六点五十。外面在下雨，雨点砸在空调外机上，一下一下很整齐。"},{"type":"narration","text":"我在床上躺了一分钟，把梦里的东西捋了一遍。梦里是一间教室，课桌是新的，黑板上写着值日生的名字。"},{"type":"narration","text":"那个名字我不认得。但我记得自己在那间教室里坐了很久，一点也不害怕。"},{"type":"narration","text":"起床以后我在睡眠记录表上填了第二十七格。填完把它折起来，夹在登记表后面。"},{"type":"narration","text":"五月，图书馆开始有人来问那口钟。老周跟每一个问的人说，坏了四年，前天自己好了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"你们那口钟很吵啊。我隔着两条街都能听见。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"隔着两条街听不见钟声。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那就是我听见的别的东西。反正它跟以前不一样了，以前它是停着的。"},{"type":"narration","text":"小雅说她现在听见的声音一天比一天少。她说安静下来有点像失重，走了几步才发现脚底下没有东西。"},{"type":"narration","text":"六月，艾莉丝的表走到了两点四十。她给它上过一次弦，上弦的时候手很稳。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"表快了十一分钟。我每天拨回来一分。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"为什么不直接送去校准。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"校准它会变准。准了就没有那十一分钟了。"},{"type":"narration","text":"她说这话的时候在看表。表针走过一点四十的那一下，她抬头看了我一眼。"},{"type":"narration","text":"她什么也没说。这一点我们已经不用说了。"},{"type":"narration","text":"七月，我的记录表上连着二十天都是六个钟头以上。有一次我睡到中午，醒来天是亮的，人是空的。"},{"type":"narration","text":"我把这件事讲给艾莉丝听。她听完在本子上写了一行，写完说这是好现象。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"睡眠会回来得很慢。它会一次还你一格，不会一次还你一整个晚上。"},{"type":"narration","text":"我说那我就一格一格地收。她说行，反正表在她手上走。"},{"type":"cg","background":"cg_ending_e03","text":"八月的一个早晨，四楼的钟走到八点整。钟声落下来的时候，整栋楼的窗玻璃都跟着轻轻震了一下。"},{"type":"narration","text":"我在登记台后面抬起头。老周正把核对表的纸往外抽，抽了一半又推了回去。"},{"type":"narration","text":"她腕上那块表还在走。它不会再停在一点四十，除非有人想让它歇一会儿。"},{"type":"narration","text":"那天晚上我十点关灯。关灯之前我拉开抽屉看了一眼，本子和记录表都在。"},{"type":"narration","text":"我躺下去，听见换气扇转起来。这一次我没有数它转了几圈。"}],"kind":"ending"},"3-e04":{"sceneId":"3-e04","chapter":"第三幕·最终决战","title":"结局·没人记得的门","background":"cg_ending_e04","bgm":"bgm_sad","next":"","lines":[{"type":"narration","text":"四月十一号，市政的人来封旧街区那口井。水泥车停在巷口，泵管一直伸到井沿。"},{"type":"narration","text":"我站在警戒线外面看了两个钟头。他们灌了十四车，最后一车倒下去的时候，井口平了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"底下什么都没有。你别站在这里看。"},{"type":"narration","text":"他说这句话的时候在看我的手。我的手在抖，抖得他自己都看出来了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"底下有一扇门。铁的，边缘有一条焊缝，门把手是横着的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我下去过三次。底下是砖，是石头，是谁家倒的旧家具。"},{"type":"narration","text":"他说得很确定。他不是在骗我，他是真的没有见过那扇门。"},{"type":"narration","text":"我把门的尺寸说给他听：一米九高，八十公分宽，门槛上有一道被踢出来的凹。"},{"type":"narration","text":"他听完看着我，看了很久，最后说了一句：你记得住这么多，是因为你睡不着。"},{"type":"narration","text":"这个解释他不是第一个给我的。医生也这么说过：长期缺觉的人会把梦里见过的和真见过的缝在一起。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"梦里的人不会去数门槛上的凹。"},{"type":"narration","text":"雷恩没有接这句话。他掐了烟，说送我回去。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"那天夜里两点，我在宿舍听见时间在重叠。楼上有人走路，走路的节奏是两个人的。"},{"type":"narration","text":"深眠的时候我会捡到别人的东西。捡到的不是物件，是记忆。"},{"type":"narration","text":"有人记得小时候的棉袄收在衣柜最下层，有人记得楼下早点摊的面汤有多咸。"},{"type":"narration","text":"这些记忆不是我的。它们的气味很陌生，像别人家厨房里的饭。"},{"type":"narration","text":"我试过把它们写下来。写下来它们就变成我的了，这让我有点怕。"},{"type":"narration","text":"四月十四号，艾莉丝给我做了一次测量。她把电极贴在我额头上，让我盯着一盏灯看。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"还在能恢复的那一段。再往下就是崩解，我不建议你去那里。"},{"type":"narration","text":"她撕电极的时候有一片胶粘在我眉毛上。她伸手把那片胶抹掉了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你为什么还管我。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你是我这份报告里的数据。数据坏了，我的报告就不成立。"},{"type":"narration","text":"这是她回答人的方式。我听完居然觉得很踏实。"},{"type":"narration","text":"五月，旧街区拆了两排房子，铺了新的路面。那口井的位置成了一个花坛。"},{"type":"narration","text":"花坛边上有一条长椅。夜里十一点以后那里没有人，只有高架上的车灯一排一排扫下来。"},{"type":"narration","text":"我差不多每个礼拜都去。我不是去找门，门已经没有了。我是去看一眼它不在的地方。"},{"type":"narration","sfx":"sfx_footstep","text":"站在那个位置上，我能听见自己的心跳。我知道那扇门在第几块砖下面。"},{"type":"narration","text":"准确地说，它在水泥下面。跟这块地上的其他地方没有区别。"},{"type":"narration","text":"有一次小雅陪我去了。她在长椅上坐了一会儿，说她什么也听不见。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"这里很平。平得像刚拖过的地。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你以前能听见底下有人说话。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"以前？这里以前是什么？"},{"type":"narration","text":"她不是在开玩笑。她是真的不记得这里以前是什么。"},{"type":"narration","text":"我那天没有再说下去。再往下说，她回去会做噩梦，她的耳朵刚安静下来。"},{"type":"narration","text":"老周的核对表上也没有这一格。他把四十年填的纸装订成一沓，装订线压得很齐。"},{"type":"narration","text":"六月，高架上加了一条新的匝道。新闻里说，旧城区的改造提前完成了。"},{"type":"narration","text":"井底那件事在档案里变成了回填工程，编号后面跟着一长串数字。我查过一次，查完就走了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"你那本子还在写吗。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"写。写不写我都记得。写下来是为了以后能有别人记得。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你这个样子，是打算一个人记着。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"一个人记着，比没有人记着好。"},{"type":"narration","text":"她把随身本子拿出来，翻到第二页。她的第二页上写着我的名字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"门的事我记不住。但你说的这个，我替你记。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"记什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_smile","text":"记你每周三晚上十一点在花坛边上坐着。"},{"type":"narration","text":"她把这一句写在本子上。字很小，写得很工整，像一份要交上去的东西。"},{"type":"narration","text":"那天以后我把时间改到了周四。她知道以后，又把她的记录改了。"},{"type":"narration","text":"我的睡眠一直没有回来。一个夜里睡三个钟头是常事，睡满四个我就觉得那天很轻。"},{"type":"narration","text":"深眠里我还是会捡到别人的记忆。有一次是一个老头在阳台上晾被子，被角对得很齐。"},{"type":"narration","text":"这些记忆我写在本子最后几页，标上日期。它们不能进那本账，账是给被删掉的人留的。"},{"type":"narration","text":"秋天的时候，花坛那排灌木开了小白花。有一次我在长椅边上遇见一个老太太。"},{"type":"narration","text":"她问我这下面以前是不是有口井。我说是。她说她小时候在这里打过水。"},{"type":"narration","text":"她说这话的时候很确定，比我确定那扇门还确定。我们两个人在长椅上坐了一会儿，谁也没提别的。"},{"type":"narration","text":"走的时候我很想告诉她底下还有一扇门。我没有说。说了她也只会觉得我脑子坏了。"},{"type":"fx","fx":"timeline","text":""},{"type":"cg","background":"cg_ending_e04","text":"秋风起的夜里，路灯照在花坛上，地上的影子摊开一块，形状像一扇门。"},{"type":"narration","text":"我蹲下去摸了摸那块地。水泥很凉，凉得很实在。"},{"type":"narration","text":"我知道门在下面。城市在它上面照常运转，车照常过，人照常走。"},{"type":"narration","text":"只有我一个人记得它。这件事我说不给别人听，也没打算说。"},{"type":"narration","text":"临走时我从花坛里捡了一片花瓣，夹进本子。花瓣很薄，第二天就干了。"},{"type":"narration","text":"然后我回家，关灯，躺下，等着看今晚会捡到谁的记忆。"}],"kind":"ending"},"3-e05":{"sceneId":"3-e05","chapter":"第三幕·最终决战","title":"结局·写进页脚的名字","background":"cg_ending_e05","bgm":"bgm_ending","next":"","lines":[{"type":"narration","text":"四月十号早上六点二十，我把笔尖放在最后一页最下面那一行上。那一行是页脚，空了很久。"},{"type":"narration","text":"页脚一般留来写版本号和归档号。我写下去的是两个字：林晓。"},{"type":"narration","text":"写完最后一笔，井底那枚被压平的钟没有立刻动。它停了一格的时间，像在称这两个字的重量。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"页脚是落款项。你把名字写在那一格，等于让账把你当成付方。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你把这件事说得像一份报销流程。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"它本来就是流程。只有流程才会这么安静地吃掉一个人。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"你呼吸的声音变轻了。刚才你说话还带着潮气，现在没有了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"林晓，往后退。退到我这边来。"},{"type":"narration","text":"我退了半步，又站回去。手还按在那页纸的边上，指头能摸到页脚那两个字的凹痕。"},{"type":"fx","fx":"flash","text":"井底闪了一下。那一下的光是从纸上出来的，白得没有一点温度。"},{"type":"narration","text":"闪完以后井里安静下来，安静到我能听见上面有人在收铁梯。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你把自己写进了页脚。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"你知道这一笔落下去以后，剩下的事情由谁收尾。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"不用谁收尾。这笔账从今天起挂在两个字的下面。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_broken","text":"名字不是盾。名字是账上的一个数，数一样会被用掉。"},{"type":"narration","text":"他说这句的时候往墙里退。他退得很慢，一边退一边变薄，最后成了一层贴在墙上的印子。"},{"type":"narration","text":"井底那枚钟开始往回收。它每收一格，井壁就落一层灰，灰底下露出来的是今天的水泥。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"八分四十秒走完了。井口那一圈天已经亮了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"钟在退。它在把刚才走掉的时间还给这条街。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"别看了。上去。铁梯还剩最后一节。"},{"type":"narration","text":"我把本子合上，塞进外套内袋。内袋里那半张退路图已经软得像一块布。"},{"type":"narration","text":"我们四个人一个跟着一个往上走。我走在最后，这是这个月里我第一次走在最后。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你走前面。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"最后一个人要把门带上。你们先上去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这句话不该由你来说。"},{"type":"narration","text":"她没有再坚持。上梯子的时候她回头看了我一眼，那一眼很短，短到像在核对一个数字。"},{"type":"fx","fx":"wait","text":"铁梯在我脚下响了一声。响完我们四个都站在了上面。"},{"type":"narration","text":"井口外面是四月十号早上的老城区。路面上有水，扫街的车刚过去，刷子的印子还在。","background":"bg_dawn_city","bgm":"bgm_hope"},{"type":"narration","text":"那栋楼里什么都没有了。墙上那块被撕掉一角的告示板还在，板子上贴的是三个月的排班表。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"出来的时候我数了一遍。我们四个人都在。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"都在。"},{"type":"narration","text":"我说这两个字的时候心里有一点不对。它听起来不像是我说的话。"},{"type":"narration","text":"后来我知道哪里不对了。从那天早上起，这条街上「林晓」两个字不再只属于我。"},{"type":"narration","text":"四月十一号，研究所来了一辆没有标志的车。艾莉丝被叫回去做说明，说明做了六个小时。","background":"bg_institute_day","bgm":"bgm_ambient"},{"type":"narration","text":"她回来的时候把结案文件放在我桌上。七页数据变成了九页，最后多出来的那页只有半页字。"},{"type":"narration","text":"那半页的最下面有一行页脚，写着归档人，后面跟着两个字的落款：林晓。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我没有签过这个。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我知道你没有签。这一栏是账按落款落的，不是你按手印。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那它凭什么叫我的名字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"因为昨晚你把名字写进了那一栏。账只认一笔钱一个出处。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"所以从今天起我这个人归这两个字管。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"比这个难听一点。是你这个人成了这两个字的出处。"},{"type":"narration","text":"她收文件的时候动作很慢。她收东西从来不慢，这是这个月里第一次。"},{"type":"narration","text":"四月十二号早上我回咖啡馆。小雅在台子后面给我倒了一杯黑咖啡，没有问我要什么。","background":"bg_cafe_evening","bgm":"bgm_warm"},{"type":"narration","text":"旁边那桌坐着一男一女，男的在手机上看新闻。他念了一句，说本市老城区一处工程隐患已经排除。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你听。他们说的是同一件事，只是换了词。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"他们不会知道那口井里有什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"他们不用知道。他们只要记得一个名字就够了。"},{"type":"narration","text":"她说这句话的时候，那个男人抬头看了我一眼，又低头看手机。"},{"type":"narration","text":"他看我的那一眼我很熟。不是认出一个人，是念到一个词。"},{"type":"narration","text":"四月十三号我去图书馆还那本硬皮本子。登记台后面是老周，他先问的是我这一个月去了哪。","background":"bg_library_day","bgm":"bgm_mystery"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"借出去的书一本没少。你这孩子还算守规矩。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"老周，最近有人来问过我的名字吗。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"问的人多了。前天有个穿西装的小伙子在这儿站了半个钟头。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"他站在那儿问的是什么。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"他问这个馆里有没有一个叫林晓的。我说有。他又问那个人做过什么，我说不上来。"},{"type":"narration","text":"老周说不上来的时候一点也不为难。他把我这件事说成一件馆里的事，说完就去盖章。"},{"type":"narration","text":"他盖章还是三下，一下比一下重。这个动作我看了二十年，这一刻忽然觉得是别人的。"},{"type":"narration","text":"四月十五号，艾莉丝给我测了一次失眠。仪器放在地下一层的档案室，她现在的工位在那里。","background":"bg_institute_night","bgm":"bgm_ambient"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"比上个月低了三个点。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"三个点算好消息。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"算。但我今天要记的不是这个。"},{"type":"narration","text":"她把记录本翻到新的一页。那一页上她写了两行抬头，第一行是林晓，第二行也是林晓。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你把同一个名字写了两遍。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"一遍是人的名字，一遍是账上的名字。这两个在记录上必须分开。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你在研究所干了这么多年，第一次要把一个人分开来记。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"是。我不知道该怎么把这两个写在同一格里。"},{"type":"narration","text":"她说这句话的时候没有看我。笔尖停在第二行上，停了大概三秒，她最后写了一个逗号。"},{"type":"narration","text":"那个逗号右边的位置空着。她没有补。"},{"type":"narration","text":"四月十七号小雅来找我。她说这两天她听见的东西变了。","background":"bg_cafe_evening","bgm":"bgm_tension"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我现在听见两个人说同一句话。声音一样，前后差半秒。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你说的那两个人分别是谁。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"一个是你。另一个也是你。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"另一个我到底跟你说了什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"另一个话少一点。他只在你说完以后补一个尾音，像盖章。"},{"type":"narration","text":"她说盖章这两个字的时候，我想起老周。我说这件事先别告诉艾莉丝。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我不告诉她。可是你要记着，你这两个声音已经开始分家了。"},{"type":"narration","text":"四月二十号我在西边的路口碰见雷恩。他手里拿着一张收据，背面写着雷小满三个字。","background":"bg_street_night","bgm":"bgm_sad"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"你今天看着比上回瘦。别老不吃东西。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"你还记得三月的时候我长什么样吗。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"记得。就是记得得慢一点。我得先想起你说过的话，才想起你的脸。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那也算记得。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"不算。我以前记得你，是不用想的。"},{"type":"narration","text":"他把收据折起来放回口袋。放得很轻，轻到像在放一件借来的东西。"},{"type":"narration","text":"那天晚上我在宿舍把本子翻了一遍。第一页的苏禾退色了，阿灰那两个字也退了一点。"},{"type":"narration","text":"我描了两遍。描完发现自己在页脚的位置上多看了几秒。"},{"type":"narration","text":"那个位置现在写着我的名字。每天晚上我都要看它一眼，像核对一个不属于我的门牌号。"},{"type":"narration","text":"五月初我回过一次老城区。那口井上面的楼已经拆完了，围档上印着市政的施工公示。","background":"bg_ruins","bgm":"bgm_mystery"},{"type":"narration","text":"公示上的工期是三个月，开工日期写的是一九九八年。我问过工地上的人，他说这块牌子挂了二十年。"},{"type":"narration","text":"公示牌旁边有一段白色的护栏。护栏的高度正好比我的腰低一点。"},{"type":"narration","text":"我站在那儿看了十分钟。十分钟里有七个人从我身后走过去，没有人往围档里面看。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"你现在一个人出门，别人叫你名字的时候你会回头吗。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"会。这两天我回头的次数比前面一个月加起来都多。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"那你回头以后看见的是谁。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"看见的是我。可是我总觉得他在等我先动。"},{"type":"narration","text":"小雅问完就去擦杯子了。她擦杯子的动作还是那样，只是她现在不再听错人。"},{"type":"narration","text":"六月的最后一天，我回图书馆上晚班。三楼那排书架没人动，四楼的灰薄得快要看不见。","background":"bg_library_night","bgm":"bgm_ambient"},{"type":"narration","text":"我在四楼站了一会儿。那口坏掉的钟还在，钟面上没有指针，只剩两个孔。"},{"type":"narration","text":"老周上楼来锁窗。他看见我，先愣了一下，然后很客气地问我有没有事。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"你是新来的吧。这个点不该有人上来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"周叔，你记得我叫什么名字吗。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"林晓。这名字这两天我在纸上见过好几回。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"你认得刚才说的那个人吗。"},{"type":"narration","text":"我说不认得。说这句话的时候我心里很平静，平静得像在回答一道做熟了的选择题。"},{"type":"narration","text":"他锁好窗就下楼了。楼道里他的脚步声一下一下往下走，走到三楼就听不见了。"},{"type":"cg","background":"cg_ending_e05","text":"四楼只剩我一个人。我把本子从口袋里拿出来，翻到最后一页。页脚那两个字很黑，黑得像刚写上去的。"},{"type":"narration","text":"我伸手在楼梯口的空气里比了一下，什么也没有碰到。"},{"type":"narration","text":"城市补上了。它补得很干净，干净到所有人都记得有一个叫林晓的人做过一件事。"},{"type":"narration","text":"只有认识我的那几个人记得的那个林晓，和这条街上流传的那个林晓，不是同一个人。"},{"type":"narration","text":"这两个人都是现在的我。这件事不需要写进任何一份报告。"}],"kind":"ending"},"3-e06":{"sceneId":"3-e06","chapter":"第三幕·最终决战","title":"结局·被纪念的陌生人","background":"cg_ending_e06","bgm":"bgm_ending","next":"","lines":[{"type":"narration","text":"四月十号凌晨三点，井底只剩下我们四个，和一本账。"},{"type":"narration","text":"那几天我一天睡两个钟头，人是清楚的。最坏的那一段已经过去了，我没有变成它的一部分。"},{"type":"narration","text":"账上还有十一行名字。每一行后面都盖着作废章，章是旧的，红色已经发黑。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"账要平，就得有一个人的名字进去抵。程序我看了三遍，只有这一条路。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"填我的。我这条命本来就是捡回来的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"填我的行不行。我什么都不会，就耳朵好。"},{"type":"narration","text":"他们三个人说的话我都听见了。我听的时候在看账页最下面那一行，那一行是空的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"别争了。这一个月是你们把我从井里弄上来的。这回我自己填。"},{"type":"narration","text":"艾莉丝把手按在账上，压了大概十秒。她的手很凉，纸被压出一道折痕。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你会被删掉。不是死，是从来没有过。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_smile","text":"那就当我是个错字。错字就该划掉。"},{"type":"narration","text":"我把笔拿过来，在最后一行写自己的名字。写的时候笔尖没有抖，这让我有点意外。"},{"type":"narration","text":"两个字写完，账页上那十一个作废章开始一个一个退掉。退得很慢，像潮水往下退。"},{"type":"narration","sfx":"sfx_breath","text":"退到最后一个的时候，我听见有人在很远的地方应了一声。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"然后所有人都从我这一段里退了出去。跟我想的不一样，不是黑，是变轻。"},{"type":"narration","text":"剩下的是灰。图书馆那排书架上的灰，旧街区花坛上的灰，还有我自己书房里的灰。"},{"type":"narration","text":"我以为删掉就是什么都没有。不是。删掉的人是一句被念到一半的话。"},{"type":"narration","text":"碑是十月立起来的，立在旧街区那个花坛旁边。碑身是深灰的石头，正面刻了十一行名字。"},{"type":"narration","text":"那十一行都是账上的名字。我从头到尾看过一遍，每一个字都对着我写的那一页。"},{"type":"narration","text":"第十二行在碑的右下角，刻得比别的都小。石匠说那一行是照着账上的最后一行刻的。"},{"type":"narration","text":"他刻的时候问过经办的人这是谁。经办的人翻了两天名册，回了一句：查不到。"},{"type":"narration","text":"查不到也刻上去了，因为账上写着。那一行两个字：林晓。"},{"type":"narration","text":"碑落成那天来了不少人。工作人员把十一行名字念了一遍，没有念第十二行。"},{"type":"narration","text":"老周来了三次。他站在碑前把每一行都念出声，念到第十二行的时候停住了。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"这个字我好像在哪里见过。"},{"type":"narration","text":"他说完就走了，走到公交站又折回来，把碑座上的落叶扫干净了。"},{"type":"narration","text":"艾莉丝只来过一次。她带着那块表，也带着她那个硬皮本子。"},{"type":"narration","text":"她把本子翻到第二页。那一页上有一个名字，是她自己的笔迹，人她却认不出来。"},{"type":"narration","text":"她在碑前站了二十分钟，最后把手腕上的表拨快了一分钟。"},{"type":"narration","text":"从那以后她每年四月都拨快一分钟。这件事成了她的习惯，她自己也不知道为什么。"},{"type":"narration","text":"雷恩每个礼拜都来。他不念名字，他擦碑。"},{"type":"narration","text":"他擦得很慢，擦到右下角第十二行的时候会多擦两遍。"},{"type":"narration","text":"他手腕内侧那圈细线还在。他说擦碑的时候那圈线会发热，像有人在很远的地方拍他的肩。"},{"type":"narration","text":"小雅来得最多。她每次都坐在碑座上，一坐就是一整个下午。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"有人在念自己的名字。念得很小声，像怕吵到人。"},{"type":"narration","text":"有一次她是对着碑说这句话的，那时候碑前只有她一个人。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你念吧。我听着呢。"},{"type":"narration","text":"她说完这句话，碑上没有声音。可她说她听见了后半截。"},{"type":"narration","text":"她后来把这件事讲给艾莉丝听。她说那半句话的后面是一个日期，四月十号。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"四月十号那天研究所报过一次设备故障。档案里有，签字的人是我。"},{"type":"narration","text":"她说这句话的时候在翻档案。她翻得很仔细，翻到最后一页也没有找到第二个签字的人。"},{"type":"narration","text":"四月十号，全城的灯在凌晨四点同时亮了一下，又稳住了。"},{"type":"narration","text":"新闻里说那是一次电压波动。市政为这件事立了一块碑，碑文是志愿者的名字。"},{"type":"narration","text":"那十一个人后来怎么样，档案上没有写。账面上他们是清的，清得干净。"},{"type":"narration","text":"雷小满这个名字在第十一行。雷恩每个月摸一遍，摸的时候不用再隔着纸了，石头比纸硬。"},{"type":"narration","text":"我这一段写在这里。写它的是灰，是名字被念到一半时的那半口气。"},{"type":"narration","text":"没有人认得碑上第十二行是谁。这是对的。"},{"type":"narration","text":"他们记得的是那十一个名字。他们记得这座城少过一次东西，后来补回来了。"},{"type":"narration","text":"只有名字记得名字。所以那一行留在石头上，谁也擦不掉。"},{"type":"cg","background":"cg_ending_e06","text":"碑立在花坛旁边，朝向旧街区的巷口。石面上十一行名字被摸得发亮，右下角那一行还是新的。"},{"type":"narration","text":"每天傍晚有放学的孩子从碑前跑过去。他们念得出前面十一个，念到最后一个就跳过去了。"},{"type":"narration","text":"跳过去的那两个字，是我。"},{"type":"narration","text":"石头很凉的时候，我会想起四月十号凌晨那支笔，笔帽上有一道刀痕。"},{"type":"narration","text":"那支笔现在在雷恩的口袋里。他擦碑的时候会把它放在碑座上，走的时候再收回去。"},{"type":"narration","text":"他不知道为什么要带一支笔来擦碑。他只是每次都带。"},{"type":"narration","text":"这就够了。"}],"kind":"ending"},"3-e07":{"sceneId":"3-e07","chapter":"第三幕·最终决战","title":"结局·图书馆的新管理员","background":"cg_ending_e07","bgm":"bgm_warm","next":"","lines":[{"type":"narration","text":"四月底，历史图书馆换了管理员。老周办退休，手续只用了三天。"},{"type":"narration","text":"他走的时候把登记台的抽屉清空，清出来一沓装订好的纸，厚得像一本小字典。"},{"type":"narration","text":"那沓纸是他四十年填的核对表。他一张都不认得，可他把它们扎得很齐。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"这个你收着吧。我看着它有些年头了，眼熟，又说不出是干什么用的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"我收下。我看着也眼熟。"},{"type":"narration","text":"小雅那天穿着咖啡馆的围裙就来了。她把围裙解开，叠成四方的一块，放进包里。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我跟店长讲好了，早上还在咖啡馆，下午到这儿来。两头都跑得动。"},{"type":"narration","text":"她抱着那沓纸往地下书库走。我跟在后面，走了两段楼梯，一段比一段凉。"},{"type":"narration","text":"地下书库的灯是绿罩子的，只亮一半，另一半还在黑里。最里面那张桌子空着。"},{"type":"narration","text":"桌上摊着一本核对表。最后一行停在三月底，笔还压在纸上。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"这张表不好填。按天、按架号、按缺页数，一格一格对下去。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那你教我。你教一遍，我记性比你好。"},{"type":"narration","text":"我教了她一个下午。她学得快，快到我在旁边坐着像个多余的人。"},{"type":"narration","text":"她填第一格的时候字是歪的。填到第十格，字就正过来了。"},{"type":"narration","text":"她比我认真。每天填完，她把那一页折一个角，第二天从头对一遍。"},{"type":"narration","text":"咖啡馆那边她也没辞。早上七点在柜台，下午到书库，两边用同一支笔。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"你别盯着我。你一盯，我手就抖。"},{"type":"narration","text":"她说这句的时候在笑。我退到书架那边去，背靠在书脊上。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"那几天我一天睡不到两个钟头。醒着的时候，别人的记忆会从纸页里浮上来。"},{"type":"narration","text":"有一格她把架号填错了。我伸手要改，她按住了我的笔。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"错了就划掉。划掉不算改，划掉是记着它错过一次。"},{"type":"narration","text":"我看了她一会儿。这是核对表的规矩，也是老周填了四十年的规矩。"},{"type":"narration","text":"她还记得雷恩。她说雷恩上周来过一趟，在书库里翻了一整天。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"他在找一张借书卡。他说那姑娘姓雷。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"书库里没有她的卡。她的名字不在任何一本登记册上。"},{"type":"narration","text":"小雅把笔搁下，抬头看灯。绿罩子的光把她半张脸照得很清楚。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"我知道。可她来过的。我听见她还书的时候，书脊磕在桌角上。"},{"type":"narration","text":"她说这句很轻。她听得到被抹掉的人的声音，这件事她一直没跟别人讲过。"},{"type":"narration","text":"表填到第五十页的时候，她问我，最下面那一行是写什么的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"页脚。归档号，签字，落款。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那落款写谁。"},{"type":"narration","text":"我说不知道。她把笔尖移到页脚，写下两个字，比上面所有的格都工整。"},{"type":"narration","text":"那是我的名字。城市把这两个字补进了所有人的记忆里，她只是照着记忆写下来。"},{"type":"narration","text":"写完她把笔递过来，让我自己描一遍。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"为什么写我。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"因为这张表是你教我的。教的人在页脚，收的人在开头。"},{"type":"narration","text":"我描了。描完那两个字，书库里落下一层很薄的灰，落在我的手背上。"},{"type":"narration","text":"同一个月里，我把表还给了艾莉丝。那是一块停在一分四十秒的女表。"},{"type":"narration","text":"她接过去的时候手指抖了一下，然后把表扣回自己手腕上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"还回来了。你就是想让它有个地方待着。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"它本来就该待在你手上。"},{"type":"narration","text":"她没有把表拨回去。她说停着挺好，停着的表不用对时间。"},{"type":"narration","text":"五月，图书馆门口挂了一块新的牌子。铜牌上写着管理员，后面跟着小雅的名字。"},{"type":"narration","text":"我站在牌子底下看了一会儿。牌面上的字是铸的，摸上去有一点毛边。"},{"type":"narration","text":"有个学生从我旁边走过去。他念得出牌子上的名字，念不出我的。"},{"type":"narration","text":"城市补上了这件事。所有人都记得有一个名字在账上落过款。"},{"type":"narration","text":"他们记得那个名字，不记得那个人。这两件事在这里是分开的。"},{"type":"narration","text":"我把手插在口袋里。口袋里没有本子了，本子在书库那张桌上，归小雅管。"},{"type":"cg","background":"cg_ending_e07","text":"地下书库的灯亮到最里面一排。核对表摊在桌上，页脚那一格写着两个字，笔压在旁边，等着第二天接着往下填。"},{"type":"narration","text":"每天晚上十点，她关灯，锁门，把钥匙挂在腰上，走去赶末班车。"},{"type":"narration","text":"我在街对面看着那一层灯灭下去。灯灭了，那本书还摊在桌上，一个字都没有少。"}],"kind":"ending"},"3-e08":{"sceneId":"3-e08","chapter":"第三幕·最终决战","title":"结局·雕像下面的空位","background":"cg_ending_e08","bgm":"bgm_sad","next":"","lines":[{"type":"narration","text":"新东京靠西有一片空地，原先只有一根断了的电线杆。"},{"type":"narration","text":"六月，空地上立起一座石头像。石头脸朝着那口井的方向，井早就填了。"},{"type":"narration","text":"石头没有刻脸。眼窝里两道浅浅的横线，谁站在底下，都会被那两道线对着。"},{"type":"narration","text":"底座背面刻着立像的月份。刻工把月份刻在背面，正面留给了名字。"},{"type":"narration","text":"谁立的没人说得清。市里的记录上写着一座社团捐建，社团的名字查不到。"},{"type":"narration","text":"落成那天上午我去看了一次。天很亮，石头在太阳底下发白。"},{"type":"narration","text":"底座上刻着十一行名字。名字之间刻得很紧，没有留空当。"},{"type":"narration","text":"第十一行下面空着一块。石头凿平了，留着，没刻字。"},{"type":"narration","text":"有个孩子踮着脚摸那块空处，问那是不是留给别人的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"是。有人被划掉了，就得留一块地方给他。"},{"type":"narration","text":"孩子听不懂，跑开了。他跑的时候手在石头边上蹭了一下。"},{"type":"narration","text":"那块空处本来是给第十二个名字留的。刻字的人留了，没敢动笔。"},{"type":"narration","text":"我知道那块空处最后是给谁的。第十二个名字是我。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"那天我从早上站到中午。我的眼睛不太对，看东西会叠。"},{"type":"narration","text":"石头的眼睛叠成两只，井口叠成两个，我把手按住石头才把它们压回一个。"},{"type":"narration","text":"失眠到了这个份上，别人的记忆会自己找过来。"},{"type":"narration","text":"我站着的时候，身上多出了四十来个下午。"},{"type":"narration","text":"有一个下午是别人在下雨天修屋顶。瓦片从手里滑下去，声音很脆。"},{"type":"narration","text":"有一个下午是别人在柜台后数硬币，数到十七个，把其中一个放回口袋。"},{"type":"narration","text":"还有一个下午是苏禾的。她在图书馆四楼靠窗那张桌子，桌角写着一个字。"},{"type":"narration","text":"这些下午都不是我的。它们在我身上待一会儿，再走。"},{"type":"narration","text":"家里、学校、往后要去干什么，这些我从来没有过。"},{"type":"narration","text":"有过的只是一连串决定，四十来个，每个决定都少一点东西。"},{"type":"narration","text":"一块石头留了空处，还有记号。人的记忆里没有那一格。"},{"type":"narration","text":"十点有人来献花。来的人不多，十几个，都站在石头正面。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"这上头有十一个名字。我们图书馆也有一张表，上头也有十一格。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"表是空的。我填了四十年，最近才发现它一直是空的。"},{"type":"narration","text":"他站在第十一行前面看了很久。他没有看那块空处。"},{"type":"narration","text":"小雅也来了。她站着的时候头稍微往一边侧，像在听什么。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"他们在念自己的名字。念得很小声，一个一个来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"谁的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"名字在这块石头上的。还有几个不在上头，也在念。"},{"type":"narration","text":"她说完就不说了。她大概是听到那块空处也在念。"},{"type":"narration","text":"艾莉丝站在最后一排。她抬头看石头脸，看了很久。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我看了三遍登记册。捐建方那一栏是空的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"别查了。查到了也是别人的名字。"},{"type":"narration","text":"雷恩绕到石头背面，绕着底座走了半圈。"},{"type":"narration","text":"他蹲下来，用袖口擦底座上的灰。石头太硬，他擦不掉。"},{"type":"narration","text":"他盯着那块空处，手腕内侧那圈细线露在外面，一圈，很齐。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"这块地方留着是对的。总得有一个地方，是给没有名字的人站的。"},{"type":"narration","text":"我没有答。我看着那圈细线，看了很久。"},{"type":"narration","text":"献花的人一波一波来，又一波一波走。花堆在石头脚边，叶子开始发蔫。"},{"type":"narration","text":"有人认出老周，跟他打招呼，说图书馆的旧事。没人跟我打招呼。"},{"type":"narration","text":"他们从我身边走过去，眼睛会滑过去。不是不理，是滑过去。"},{"type":"narration","text":"这条街记得我干过的事。它记不住干这些事的人。"},{"type":"narration","text":"太阳往西偏，石头的影子倒到井口那一边，很长。"},{"type":"narration","text":"我走到石头底下，伸手摸那块空处。石头是热的，太阳晒了一整天。"},{"type":"narration","text":"空处边上刻着一行小字，是日期，四月十号。"},{"type":"narration","text":"这是留空处的人顺手刻的。刻字的人把日期也记住了。"},{"type":"narration","text":"散场以后广场上只剩花和石头。清洁车从街口开过去，没有停。"},{"type":"narration","text":"我把手从石头上拿下来，手上有一层灰。"},{"type":"narration","text":"我在石头上按了一个印子。印子很浅，谁也看不出是手印。"},{"type":"cg","background":"cg_ending_e08","text":"石头像站在旧街区的空地上，脸朝着井口。底座十一行名字下面，那块凿平的空处还空着，日头把石头影子拉过整条街。"},{"type":"narration","text":"那块空处就一直空着。刻字的人再没有回来补。"},{"type":"narration","text":"后来有人说，那是留给他自己的。"}],"kind":"ending"},"3-e09":{"sceneId":"3-e09","chapter":"第三幕·最终决战","title":"结局·钥匙在锁孔里","background":"cg_ending_e09","bgm":"bgm_sad","next":"","lines":[{"type":"narration","text":"四月十号凌晨四点四十，我把那一页从本子上撕下来。撕的时候纸的声音很干，像一片旧叶子。"},{"type":"narration","text":"那一页上写着十一个名字，最下面还留着一行空白的页脚。我没有在页脚上写任何东西。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你要把它送进门里。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"门要的那一页本来就是这一页。它要的是有人把这一页交回去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"交回去的那个人不算在出去的人数里。这一笔你算过。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"算过。所以本子留给你们，纸我带走。"},{"type":"narration","text":"我把硬皮本子塞给艾莉丝。她接的时候手在抖，这是这个月里我第一次看见她手抖。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"你带着那页纸进去，你会变成什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"变成这一页的一部分。以后有人翻到它，就会看见我这一行。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我以后天天翻，翻到纸烂了我还翻。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"林晓。上面还剩两节梯子，我一脚就能踹断，我们四个人挤一挤能过去。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"三个人挤过去，这口井就得再收一个人。你比我清楚这一笔怎么算。"},{"type":"narration","text":"雷恩没有说话。他把手背上的那块烙印举起来给我看，那里的光已经快要灭了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我这个月借过三次。再借一次，我连自己都换不回来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"所以你留着。留到有人真的需要的时候再用。"},{"type":"narration","text":"我走到井底那道口子边上。那不是门，是井壁上一道竖着的口子，里面是纸背面的颜色。"},{"type":"narration","text":"我把那一页折起来，折成一个手掌那么大，边角对齐，跟我在图书馆整理旧报纸一样。"},{"type":"narration","text":"然后我把纸送进去。纸进去的时候没有响声，像是被那一层灰白吸进去的。"},{"type":"fx","fx":"wait","text":"那一页进去以后，井底安静了半秒。半秒之后，那道口子往外吐了一口气，很凉。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"它开了。它在等一个人。"},{"type":"narration","text":"我把手撑在口子边上，回头看了他们三个人一眼。这一眼我看得很仔细，仔细到记住了他们站的位置。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cry","text":"林晓，你按着那一页要做什么。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"表你留着。别修。"},{"type":"narration","text":"我说完这句就进去了。里面很窄，窄到只够一个人侧着站。我在里面摸到了内侧那一面。"},{"type":"fx","fx":"flash","text":"门合上的时候，外面那一圈天闪了一下白。"},{"type":"narration","text":"我在门里听见的第一件事是钟声。那枚钟转完最后一格，然后停了。"},{"type":"narration","text":"我听见的第二件事是他们的脚步。三个人往上走，越走越远，最后只剩下铁梯的响动。"},{"type":"narration","text":"上面这些是我看见的。接下来的这些我没有看见。","background":"bg_black","bgm":"bgm_sad"},{"type":"narration","text":"它们是后来一点一点到我手边来的：从艾莉丝记录本的最后一页，从小雅每个月的账单，从雷恩口袋里的收据，从老周那张核对表。"},{"type":"narration","text":"我把它们按顺序放好，像放一叠借来的书。"},{"type":"narration","text":"那天早上他们从楼里出来的时候，天已经亮了。雷恩走在最前面，他没有回头。","background":"bg_dawn_city","bgm":"bgm_sad"},{"type":"narration","text":"他回到守望者的院子，先把那块烙印用凉水冲了一刻钟。冲完他把袖子放下来，没有处理伤口。"},{"type":"narration","text":"四月十三号他去了西边那条路。路的尽头原来是一所学校，现在只剩一段围墙。"},{"type":"narration","text":"他在围墙根下站了很久，从口袋里掏出那张收据，在背面重新描了一遍雷小满三个字。"},{"type":"narration","text":"他描得很慢，笔画压得很深。那张收据的纸已经很薄，薄到光能透过去。"},{"type":"narration","text":"描完他把纸折好，对着墙说了一句话。那句话后来没有人替他记下来。"},{"type":"narration","text":"五月他换了工作，去了守望者的登记组。登记组的活是给来登记的人写名字、编号、归档。"},{"type":"narration","text":"他做这份活做得很认真。他给每个人写完名字以后都要用指头按一下，像在压一个小小的坑。"},{"type":"narration","text":"登记组的门开在一楼最里面，门口挂着一块搪瓷牌子，上面漆着两个褪色的字。"},{"type":"narration","text":"来登记的人多半是老人。他们拿着一张旧照片，说一个名字，让雷恩写下来。"},{"type":"narration","text":"有一个老太太来过三次，每一次都带同一个名字。雷恩每次都替她写，写完给她念一遍。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"念一遍。念对了才归档。"},{"type":"narration","text":"老太太第一次听的时候哭了。第二次听的时候笑了。第三次她把照片留在桌上，人走了。"},{"type":"narration","text":"雷恩把那张照片夹进登记册的最后一页，夹在自己那一本的后头。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"名字写清楚。写清楚了，谁也拿不走。"},{"type":"narration","text":"小雅后来跟我说，雷恩现在写字写得很慢，写一个字要停一下。她说他停下来是在数笔画。"},{"type":"narration","text":"小雅回咖啡馆上班了。她把围裙洗了三遍，右边那片咖啡渍还是没有洗掉。","background":"bg_cafe_evening","bgm":"bgm_warm"},{"type":"narration","text":"从四月十号起，她每天早上会在单子上多写一行：一杯热牛奶，放最里面。"},{"type":"narration","text":"那杯牛奶没有人喝。她下班的时候把它倒掉，第二天再点一杯。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"这是我们这儿的规矩。点一杯不喝的，给还没回来的人。"},{"type":"narration","text":"有客人问过她那杯是给谁的。她说是一个熟客的。客人说不认识，她说你不认识很正常。"},{"type":"narration","text":"那杯牛奶她放在最里面靠窗的位置，杯底垫一张纸巾，杯把朝左。"},{"type":"narration","text":"有一次艾莉丝来喝咖啡，看见那杯牛奶，问是谁点的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"一个熟客。他喝牛奶，不喝咖啡。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"他今天会来吗，还是又一个人坐一下午。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"不来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"那我替他喝。凉了倒掉可惜。"},{"type":"narration","text":"她喝完那一杯，把杯子放回原来的位置，杯把还是朝左。走的时候她没有说下次还来不来。"},{"type":"narration","text":"第二个星期她又来了，还是坐那张桌子，还是把那杯牛奶喝掉。"},{"type":"narration","text":"六月她在账单背面写过几行字，艾莉丝把那几行字收进了记录本。"},{"type":"narration","text":"那几行写的是：门关上那天，我耳朵里的底噪没了。以前那些说话的人也不见了。我不知道这是好事还是坏事。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"要是哪天底噪回来了，我第一个告诉艾莉丝。"},{"type":"narration","text":"艾莉丝的表停在一点四十。她戴着它上班，戴着它做实验，戴着它签字。","background":"bg_institute_night","bgm":"bgm_ambient"},{"type":"narration","text":"她那份结案文件写到第七页就停住了。第七页上有一行是归档号，那一行她一直空着。"},{"type":"narration","text":"档案室没有窗。她每天上午把文件摆在灯下面，摆得很正，四边对齐。"},{"type":"narration","text":"她桌上那支笔换过三支。每一支都写到一半就没人再动，笔帽都还盖着。"},{"type":"narration","text":"她把记录本的最后一页压在那份文件下面，压了很久，纸角都翘起来了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"编号要等结论。结论不来，这一行就空着。"},{"type":"narration","text":"她说这句话的时候面对着一面空白的墙，那面墙上什么也没有挂。"},{"type":"narration","text":"有人催过她补那一行。她说这个编号要等一个结论，结论还没有出。"},{"type":"narration","text":"她的工位换到了地下一层的档案室，那里有一台很吵的换气扇。她说吵一点好，安静下来她会听见秒针。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"秒针不走了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"它停的那一格，是我们四个人最后一次看见同一个数字的时候。"},{"type":"narration","text":"她每个月来一次老城区。她不带仪器，也不写记录，就在围档外面站一会儿。"},{"type":"narration","text":"有一次她在围档前面碰到雷恩。两个人隔着半米站着，谁都没有先说话。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"你今天来这里到底想做什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"核对。三分钟。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"三分钟够了。超过三分钟就不像样了。"},{"type":"narration","text":"他们站满三分钟，各自往相反的方向走。这件事他们做过十一次，一次都没多过。"},{"type":"narration","text":"老周那边没有人跟他说过那口井。他这辈子知道的最大的事，是四楼那口钟坏了。","background":"bg_library_day","bgm":"bgm_silence"},{"type":"narration","text":"七月的一天下午，他上楼锁窗，在四楼的楼梯口站了一会儿。"},{"type":"narration","text":"他站的位置正好是我三月十二号站过的位置。他朝那个方向看了两眼，什么也没有看见。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_worried","text":"这儿怎么总有一层灰。上个月才擦过。"},{"type":"narration","text":"他说完就下楼了。走到三楼他停下来，回头看了一眼，然后又往下走。"},{"type":"narration","text":"他不知道自己为什么回头。他这一辈子回头看过很多东西，都是书。"},{"type":"narration","text":"老周的抽屉里有一张过了塑的核对表。他偶尔把它拿出来，看一眼，又放回去。"},{"type":"narration","text":"他自己也不知道那张表是干什么用的。他只是觉得这一张纸不能扔。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_grim","text":"馆里的东西，过了塑的都不能扔。"},{"type":"narration","text":"这句话他跟两个来借书的人说过。两个人听完都点了点头。"},{"type":"narration","text":"秋天的时候老城区那片围档拆了，那里修成了一个小广场，广场中间有一棵树。","background":"bg_street_night","bgm":"bgm_mystery"},{"type":"narration","text":"树是新的，根还没长开。风大的时候它会往一边倒一点，像在找一个能靠的方向。"},{"type":"narration","text":"我在这扇门里待着。门里没有白天也没有黑夜，只有一格一格往回收的时间。"},{"type":"narration","text":"我数不清过了多久。我唯一数得清的是，我进来的那一页还在，十一个名字都在。"},{"type":"narration","text":"我有时候会想他们三个人现在在做什么。想完我就把那一页折起来，再打开，让他们回到原来的位置上。"},{"type":"narration","text":"这一页上有一行空白的页脚。我没有写它，他们也没有写它。"},{"type":"narration","text":"空着的最好。空着就说明这本书还没有写完。"},{"type":"cg","background":"cg_ending_e09","text":"门里没有光。我能感觉到外面那座城市在走，走得又稳又慢，一格一格，像一块修好了的表。"},{"type":"narration","text":"它走得比我在外面的时候还要准。它准到不需要我给它的名字。"}],"kind":"ending"},"3-e10":{"sceneId":"3-e10","chapter":"第三幕·最终决战","title":"结局·留在井底的那个人","background":"cg_ending_e10","bgm":"bgm_ending","next":"","lines":[{"type":"narration","text":"四月十号凌晨三点四十，井底只剩下最后一格。"},{"type":"narration","text":"那枚压平的钟还在转。每转一格，周围的空气就少一点声音。"},{"type":"narration","text":"本子摊在墙角。最后一页十一个名字，前面七个已经念过了。"},{"type":"na
