ialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我把所里的公开档案过了一遍。那座观测站建得很早，停用也很多年了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"但有一条数据对不上：它停用以后的每一个月，用电量还在跳。"},{"type":"narration","text":"一个停用的地方，每个月用电。这让源头这两个字从比喻变成了一个地址。"},{"type":"choice","text":"","prompt":"停用的站，每月还在用电。这个地址现在定不定？","options":[{"text":"定。在地图上把观测站圈成第一目标","affectionWho":"","affection":0,"insomnia":0,"flag":"circled_the_station_target","next":""},{"text":"先不圈。等雷恩看过那道围栏再说","affectionWho":"雷恩","affection":3,"insomnia":-1,"flag":"waited_for_raines_look","next":""},{"text":"问艾莉丝：电量数据能不能造假","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"asked_about_the_power_data","next":""}]},{"type":"narration","text":"我口袋里的碎片在这时候烫了一下。不是警告的那种烫，是被叫到名字的那种烫。"},{"type":"narration","text":"我把它摸出来，眼前过了一段很短的画面：一条地下走廊，水泥墙，墙上有一块被水泡过的印子。"},{"type":"narration","text":"走廊尽头有人在走。背影很瘦，走得不快，一只手一直搭在包带上。"},{"type":"narration","text":"我认得那条走廊。我借来的那段记忆里，她走过一模一样的路。"},{"type":"choice","text":"","prompt":"走廊里那个背影。这个名字现在说出口吗？","options":[{"text":"说。把苏禾摆到桌上，让三个人一起接住","affectionWho":"","affection":0,"insomnia":0,"flag":"named_suhe_at_the_table","next":""},{"text":"咽回去。名字说一次，就少一次","affectionWho":"","affection":0,"insomnia":-2,"flag":"swallowed_the_name","next":"#l01"}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你说的是哪一个。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"苏禾。记录本第一页上那个。"},{"type":"narration","text":"我说出这两个字，桌上三个人都没有反应。一个人名说出口却像没说出口，这种感觉比忘掉更糟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"记录里有这个名字，是你昨天自己写上去的。别的地方都没有。"},{"type":"choice","text":"","prompt":"这个名字只有你自己写过。这条记录你还信吗？","options":[{"text":"信。我写的字比我的记性诚实","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_his_own_handwriting","next":""},{"text":"不信。可能是有人借我的手写的","affectionWho":"","affection":0,"insomnia":0,"flag":"suspected_a_borrowed_hand","next":""},{"text":"把本子翻回第一页，再核一遍笔迹","affectionWho":"","affection":0,"insomnia":0,"flag":"rechecked_the_handwriting","next":""}]},{"label":"l01","type":"narration","text":"早上八点，基地门缝底下塞进来一张纸。没有信封，没有署名。"},{"type":"narration","text":"纸上是老周的字，歪，最后一笔往下拖得很长。只有五个字：别去那个地方。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"背面还有字，很小。"},{"type":"narration","text":"我把纸翻过来。背面那行字是写给我一个人的：上次去过的人，一个也没有回来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"上次是什么时候。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"记录里没有那一次。所以我没法确认他说的是不是真的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"他没骗过人。"},{"type":"choice","text":"","prompt":"老周的警告压在桌上。出发还算不算数？","options":[{"text":"照走。他的警告正好说明方向是对的","affectionWho":"","affection":0,"insomnia":0,"flag":"took_the_warning_as_a_compass","next":""},{"text":"犹豫一分钟。一个也没回来，包括写信的人","affectionWho":"","affection":0,"insomnia":0,"flag":"hesitated_at_the_warning","next":""},{"text":"把纸折好收进口袋，留给回来的人看","affectionWho":"老周","affection":4,"insomnia":0,"flag":"kept_zhou_note_in_pocket","next":""}]},{"type":"narration","text":"我们开始算。补给三天。路线是城际列车到西郊，再走十二公里。"},{"type":"narration","text":"能用的东西少得可笑：雷恩一根撬棍，艾莉丝一台两百米内会叫的仪器，我的碎片，小雅的耳朵。"},{"type":"narration","text":"桌上还摆着一台旧仪器，谁也没有碰它。昨天回基地以后，它就一直放在那儿。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_hurt","text":"拿着。"},{"type":"narration","text":"他把仪器推到我面前。仪器侧面用记号笔写过一个字，写得很大，是「灰」。"},{"type":"narration","text":"我接过来的时候手在抖。他看着我抖，没有说别的。他在用这台仪器给我派一个位置：把那个人的地方站上。"},{"type":"choice","text":"","prompt":"仪器侧面写着一个「灰」。这个位置你接不接？","options":[{"text":"接。把这个字当成自己的工号","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"accepted_the_gray_post","next":""},{"text":"接，但问一句：上一个拿它的人是谁","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"asked_whose_instrument_it_was","next":""},{"text":"先不接。把它推回去，出了城再说","affectionWho":"雷恩","affection":-3,"insomnia":-2,"flag":"pushed_the_instrument_back","next":""}]},{"type":"narration","text":"然后轮到我说话。我站起来，说了我的判断：今晚走，不能再等。"},{"type":"narration","text":"我说这话的时候是真觉得不能再等。我的每一次心跳都在说快一点，快一点。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"给我三十秒。"},{"type":"narration","text":"她翻开一本薄手册，问了我三件事。第一件：今天几号。我说三月二十一号。她又问：日期呢。我说三月二十一号。"},{"type":"narration","text":"她看了我一眼，笔没有停。第二件：我们几个人。我说四个。"},{"type":"narration","text":"第三件：把昨天早上的顺序说一遍。我说了。说到封住缝那一段的时候，中间断了一秒半。"},{"type":"choice","text":"","prompt":"三件事答完，她的笔没有停。要不要打断这场考试？","options":[{"text":"不打断。答错的那一个，我自己知道","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"sat_through_the_test","next":""},{"text":"打断：把断掉的那一秒半原样补上","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"filled_the_broken_second","next":""},{"text":"反问：你在那本手册上记了什么","affectionWho":"艾莉丝","affection":-2,"insomnia":0,"flag":"asked_what_the_manual_said","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"日期你说了两遍，人数你说成了四个。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"人数本来就是四个——"},{"type":"narration","text":"我说到一半停住了。因为我知道，我坚持的那个第四个人，正是她昨天在记录、手套和仪器里都找不到的那个。"},{"type":"narration","text":"艾莉丝没有被我的话带走。她在手册上打了三个勾，然后抬起头。"},{"type":"choice","text":"","prompt":"三个勾打完了。要不要替那个第四个人说话？","options":[{"text":"说。她存在过，哪怕只剩我一个人记得","affectionWho":"","affection":0,"insomnia":0,"flag":"spoke_for_the_erased","next":""},{"text":"不说。争这个只会把人数再错一次","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_count_to_four","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"三次里你错了一次。错的是最要紧的那一次。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"按数据，你现在的判断力是这十天里最低的。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那你还打算让我去吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"源头那边的活动在往上走。再等三天，我们连出发的门槛都过不去。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"所以要去。但不是因为你的判断，是因为数据的判断。"},{"type":"narration","text":"这是她第一次在我面前把责任从人身上挪开。她没有说她怕，她只是把话换了一个主语。"},{"type":"choice","text":"","prompt":"她把出发的理由交给了数据。你信哪个？","options":[{"text":"信数据。它至少不会三天没睡","affectionWho":"艾莉丝","affection":3,"insomnia":-2,"flag":"trusted_her_data","next":""},{"text":"信她。主语换了，怕没有换","affectionWho":"艾莉丝","affection":5,"insomnia":0,"flag":"saw_her_fear_under_the_data","next":""},{"text":"都不信。只信雷恩那句「他没骗过人」","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"trusted_only_raines_word","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我去。我只想知道收时间的人长什么样。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我也去。今天早上那个声音清楚得像站在我旁边。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"它说了三个字。走吧。"},{"type":"narration","text":"她说完自己愣了一下。刚才确实是有人在耳边对她说这三个字的，现在她把它转述出来，像在替那个人说话。"},{"type":"choice","text":"","prompt":"那三个字不是从小雅嘴里来的。要不要问清来源？","options":[{"text":"问：那个声音还说了别的吗","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"asked_the_voice_for_more","next":""},{"text":"不问。它说走，我们就走","affectionWho":"小雅","affection":0,"insomnia":0,"flag":"took_the_voice_as_orders","next":""},{"text":"记下时间：它挑了所有人都在的时候开口","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_when_the_voice_spoke","next":""}]},{"type":"narration","text":"我们用了两个小时准备。这是我这辈子见过最不像准备的一次准备。"},{"type":"narration","text":"雷恩提了一句：走之前，要不要在门上给老周留一行字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不留。留了就是记录，记录会被人查到。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"他昨天把命折成一张纸塞进来，我们连一行都不给他。"},{"type":"narration","text":"两个人一起看向我。第四条规矩第一次被拿来用，可它问的是一件很别扭的事：还没出发，我们已经开始安排谁会少掉。"},{"type":"choice","text":"","prompt":"留不留这一行字？两个人都在等你。","options":[{"text":"留。写在里面，不留名字","affectionWho":"老周","affection":4,"insomnia":0,"flag":"left_the_note_inside","next":""},{"text":"不留。记录会被人查到，艾莉丝说得对","affectionWho":"艾莉丝","affection":2,"insomnia":-1,"flag":"obeyed_the_no_record_rule","next":"#l02"}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"留。写在里面，不留名字，只写一句：我们去了你说的地方。"},{"type":"narration","text":"艾莉丝照做了。她写字的手很稳，写完把笔帽按回去，按了两下才按上。"},{"label":"l02","type":"narration","text":"艾莉丝把记录本装进防水袋。第一页上的名字，现在有两个。"},{"type":"narration","text":"小雅煮了最后一锅汤，灌满保温桶，说要在车上喝，喝不完也不许倒。"},{"type":"narration","text":"雷恩在门口站了很久。他站的位置是风最大的地方，我知道他在想仪器上那个字。"},{"type":"choice","text":"","prompt":"出发前，你还剩半小时。这半小时你交给谁？","options":[{"text":"去找艾莉丝：请她把你每个小时的判断都记下来","affectionWho":"艾莉丝","affection":8,"insomnia":0,"flag":"asked_alice_to_log_him","next":""},{"text":"去找雷恩：告诉他你看见了谁，坐在床沿上","affectionWho":"雷恩","affection":8,"insomnia":0,"flag":"told_raine_about_vision","next":""},{"text":"去找小雅：让她把那个声音的每一句都复述给你","affectionWho":"小雅","affection":8,"insomnia":0,"flag":"collected_voice_lines","next":""}]},{"type":"narration","text":"那半小时过完的时候，我知道了一件事：他们三个都比我清醒，只有我还以为自己是带队的那个人。"},{"type":"narration","text":"下午四点，我们锁了基地的门。锁是新的——和观测站围栏上那把一样新。"},{"type":"narration","text":"爬出井口的时候天还没黑，城市正在下班，地铁口往外吐人，吐得很有秩序。"},{"type":"narration","text":"我站在路边数了一遍。数到第十七个的时候我停了，因为我想不起来自己为什么要数。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"别数了。我数着呢。"},{"type":"choice","text":"","prompt":"数到第十七个就忘了为什么数。还要自己数吗？","options":[{"text":"不数了。这一趟的数交给小雅","affectionWho":"小雅","affection":4,"insomnia":-2,"flag":"handed_the_counting_to_xya","next":""},{"text":"继续数。别人数的不算数","affectionWho":"小雅","affection":-2,"insomnia":0,"flag":"kept_counting_himself","next":""},{"text":"把每次数的结果写进本子里","affectionWho":"","affection":0,"insomnia":0,"flag":"logged_the_headcount","next":""}]},{"type":"narration","text":"晚上七点，城际列车。车厢里的灯有一半是坏的，人很少。"},{"type":"narration","text":"我们四个人占了两个对坐的位置。没有一个人说话，保温桶在中间晃，晃出一圈汤的味道。"},{"type":"narration","text":"我把额头贴在车窗上。窗外的城市一格一格往后退，退成一条发亮的带子。"},{"type":"fx","fx":"timeline","text":""},{"type":"narration","text":"玻璃上映出我的脸。我看见自己的眼睛——是蓝的。"},{"type":"narration","text":"不是那种透亮的蓝，是很深的蓝，像很早的天，也像很晚的天。"},{"type":"choice","text":"","prompt":"玻璃里那双眼睛是蓝的。叫醒对面的人看吗？","options":[{"text":"不说。把袖子拉下来挡住倒影","affectionWho":"","affection":0,"insomnia":0,"flag":"hid_the_blue_reflection","next":""},{"text":"敲一下车窗，让雷恩也看一眼","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"showed_raine_the_blue","next":"#l03"}]},{"type":"narration","text":"我没有告诉另外三个人。这是这十天里我第一次有事不说。"},{"label":"l03","type":"narration","text":"对座那边，雷恩把撬棍横在膝盖上，一直在用拇指擦同一个地方，擦得很慢。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"到了那里，要是我少掉一部分，你别拦我。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"为什么。你把自己算成可以丢的那一个。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"因为我是自愿的。自愿的人比被选上的人便宜。"},{"type":"narration","text":"我没有答应他。他也没有等我答应，擦了两下就把撬棍收进外套里。"},{"type":"choice","text":"","prompt":"他没等你答应就收了撬棍。那句话算不算数？","options":[{"text":"算。把这句话记进本子的最后一页","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"logged_raines_terms","next":""},{"text":"不算。下车之前当面告诉他","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"refused_raines_terms","next":""},{"text":"不答。有些事答了就是同意","affectionWho":"雷恩","affection":-1,"insomnia":0,"flag":"left_the_terms_unanswered","next":""}]},{"type":"narration","text":"列车到站是二十三点四十。西郊的站台没有灯，只有车头的那一盏，照出一段很短的水泥地。"},{"type":"narration","text":"我站起来的时候才发现，刚才有六分钟不属于我。车过了两站，我一站都不记得。"},{"type":"narration","text":"这是第一次，我失去的时间不是因为闭眼。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"站台出去往北。有一段路是碎石，不要踩边上的浮土。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"我走前面。林晓在最后。"},{"type":"choice","text":"","prompt":"六分钟在睁着眼的时候丢了。现在说出来吗？","options":[{"text":"说。从站台开始，不能再瞒","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"reported_the_open_eyes_loss","next":""},{"text":"不说。按队形走，把本子抱紧","affectionWho":"","affection":0,"insomnia":1,"flag":"walked_the_formation_silent","next":""},{"text":"只告诉小雅：让她听我的脚步数","affectionWho":"小雅","affection":3,"insomnia":1,"flag":"enlisted_xya_for_his_steps","next":""}]},{"type":"narration","text":"我把记录本抱在怀里。它现在是我们身上唯一一件能证明谁来过的东西。"},{"type":"narration","text":"我们出了站台，往北走。那条路上没有路灯，只有很薄的月光，照得石头一块黑一块白。"},{"type":"narration","text":"我走在最后，一直在数前面的人头。三个。走了一路，都是三个。"},{"type":"narration","text":"我数得很稳，稳得像是被别人教过。"},{"type":"narration","text":"走到第九公里的时候，我在路边捡到一枚扣子。金属的，边缘磨圆了，是工装外套上的那一种。"},{"type":"narration","text":"我把它收进口袋，和那副耳机放在一起。两样东西属于同一个人，而那个人现在谁都不记得。"},{"type":"choice","text":"","prompt":"扣子和耳机属于一个谁都不记得的人。给队伍看吗？","options":[{"text":"拿出来给三个人看，问谁认得这种扣子","affectionWho":"","affection":0,"insomnia":1,"flag":"showed_the_button_to_the_team","next":""},{"text":"不说。两样东西先替他保管","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_button_unshown","next":""},{"text":"夹进记录本，和苏禾写在同一页","affectionWho":"","affection":0,"insomnia":1,"flag":"filed_the_button_with_suhe","next":""}]},{"type":"narration","text":"我按了按口袋，然后跟着前面那三个影子，继续往西。"},{"type":"narration","text":"风从西边过来，带着铁和水的味道，和基地那间屋子里的味道一模一样。"}]},"2-1":{"sceneId":"2-1","chapter":"第二幕·深入探索","title":"历史重现","background":"bg_lab","bgm":"bgm_mystery","next":"2-2","dense":true,"lines":[{"type":"narration","text":"第十一天，三月二十二号，凌晨两点。我们站在新东京西北边的裂缝区里，脚下是一段被封锁了六年的旧马路。"},{"type":"narration","text":"那栋楼之后，城市好像被谁在中间裁了一刀。我们花了三天才走到这里——中间换了四种车，最后一段路是走过来的，因为封路的铁网只挡车，不挡人。"},{"type":"narration","text":"裂缝区看起来像什么都没发生过。路面平整，路灯的杆子还立着，有几棵行道树甚至很精神。如果没有那道弯弯曲曲的警戒胶带，这里就是一段普通的、没人走的街。"},{"type":"choice","text":"","prompt":"封了六年的路，看着什么都没发生过。先核对哪一处？","options":[{"text":"数步子。路灯之间那两步，一步不落地走","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_steps_between_lamps","next":""},{"text":"先看胶带。哪一段新换过，就是哪一段在动","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_fresh_tape","next":""},{"text":"什么都不核。雷恩说停，就停","affectionWho":"雷恩","affection":3,"insomnia":-1,"flag":"waited_for_raines_stop","next":""}]},{"type":"narration","text":"但它有一段路是错的。错得很小，小到只有走过才明白：从这根路灯到下一根路灯之间，实际步数比看起来少两步。"},{"type":"narration","text":"雷恩走在最前面。他的右手揣在外套口袋里，从我们出发就没拿出来过。他把左手举起来示意我们停，动作很轻，像在拦一把不确定的风。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"就这儿。"},{"type":"narration","text":"艾莉丝蹲下去，把仪器贴在地面上。屏幕的背光把她的下巴照得发白。她盯着数字看了半分钟，报出来的时候语气平得像在念菜价。"},{"type":"choice","text":"","prompt":"她盯着数字看了半分钟。这个读数你信吗？","options":[{"text":"信。她念数字的时候从来不抖","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"trusted_the_density_read","next":""},{"text":"自己再贴一次，亲手拿这个数","affectionWho":"","affection":0,"insomnia":0,"flag":"retook_the_reading","next":""},{"text":"不信。越太平的路，读数越会撒谎","affectionWho":"","affection":0,"insomnia":0,"flag":"doubted_the_quiet_street","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这一段的时间密度是旁边的三点二倍。同一米里，被塞进了三倍的时间。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"所以这里的东西比别处走得慢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不。是这里有东西没走完。它被折起来放在这一米里，等有人打开。"},{"type":"narration","text":"小雅站在我旁边，双手揣在袖子里，一直在看那几棵树。她是四个人里唯一还带着热饮的人，纸杯冒着白气，白气往上升，升到一半就散了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"这儿的树不摇。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"没有风。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"有风。我头发在动。就只有树不摇。"},{"type":"choice","text":"","prompt":"头发在动，树不摇。把手伸进那股风吗？","options":[{"text":"伸手。摸一摸六年前的风是什么温度","affectionWho":"","affection":0,"insomnia":0,"flag":"reached_into_the_still_wind","next":""},{"text":"不伸。它已经不需要摇动任何东西了","affectionWho":"","affection":0,"insomnia":0,"flag":"left_the_dead_wind_alone","next":""},{"text":"提醒小雅：别站在那边","affectionWho":"小雅","affection":3,"insomnia":-1,"flag":"warned_xya_off_the_wind","next":""}]},{"type":"narration","text":"我抬头看那棵树。它的枝条明显地朝着一个方向偏，偏得很硬，久了以后连树皮都跟着偏。风一直从那个方向来，只是它已经不再需要摇动了。"},{"type":"narration","text":"我们摆好设备。研究所的场发生器很重，艾莉丝一个人搬不动，我抬了另一头。雷恩把一块钢锭似的东西摆在地上，那是他带来的配重，用来压住裂缝边缘，防止我们进去的时候整段路被拖走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"规则说一遍。第一，进去以后不许个人行动。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"第二，谁先看见自己的记忆，谁先退出来。"},{"type":"choice","text":"","prompt":"规则说到第二条。要不要现在讨价还价？","options":[{"text":"讨。第三条「不做修改」我保留意见","affectionWho":"艾莉丝","affection":-2,"insomnia":0,"flag":"reserved_on_rule_three","next":""},{"text":"不讨。三条全认，先活下来再说","affectionWho":"艾莉丝","affection":3,"insomnia":-2,"flag":"accepted_all_three_rules","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"第三，不做任何修改。看，然后回来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"如果里面有人跟我说话。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"那说明它已经开始读你了。立刻退。"},{"type":"narration","text":"我点头。我其实想问第三个问题：如果里面那个人我认识，要不要告诉她以后会发生什么。这个问题我没问。我知道答案，也知道我会不会听。"},{"type":"choice","text":"","prompt":"没问出口的那句还在喉咙里。进去前补问吗？","options":[{"text":"补问：里面的人认出我，算不算修改","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"asked_the_recognition_case","next":""},{"text":"不补。他知道答案，问了也不会听","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_question_down","next":""},{"text":"只跟小雅说：数到二十就把我拽回来","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"gave_xya_the_count_of_twenty","next":""}]},{"type":"narration","text":"我把口袋里那块碎片拿出来。从那天在咖啡馆被按在桌上开始，它就一直在我身上，只是越来越轻。今天我们用的是研究所的另一块，编号被激光刻在侧面，很新。"},{"type":"narration","text":"新碎片被嵌进场发生器中央的一圈凹槽里。它跳得比我的那块快，跳得整台机器都在轻微地响。"},{"type":"narration","text":"雷恩走过来，把手按在我肩上。这是他这几天里第一次主动碰我。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"看见你认识的人，也别松开手。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"松开会怎么样。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"你就留在那一边了。这边会有人替你补一个空位，补得很齐。"},{"type":"choice","text":"","prompt":"他把手按在你肩上。这只手要不要握住？","options":[{"text":"握住。进去以后谁也不许松","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"held_raines_hand_back","next":""},{"text":"不握，只点头。他的手不是用来握的","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"nodded_at_raine","next":""},{"text":"反过来提醒他：他自己那只手也别松","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"reminded_raine_of_his_own_hand","next":""}]},{"type":"narration","text":"小雅忽然从后面伸手过来，握住了我的手腕。她的手很凉，比夜里的风还凉。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"那你抓紧我。我怕黑，我在这儿等你回来。"},{"type":"narration","text":"艾莉丝按下开关。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"白光从机器里出来的时候没有声音。光先到我的眼睛，再到我的耳朵——我听见的是自己心跳被放大了一百倍，一下一下，砸在耳膜上。"},{"type":"fx","fx":"timeline","text":""},{"type":"narration","text":"然后那条马路翻过来了。"},{"type":"narration","text":"不是翻转，是有人把这段路从底下掀开，露出了它的背面。背面不是泥土，是另一段时间：同样一条路，同样的树，只是灯的颜色暖一点，树上的叶子多一点。"},{"type":"choice","text":"","prompt":"马路翻出了背面。落地前先抓什么？","options":[{"text":"抓小雅的手腕。她说她怕黑","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"grabbed_xya_on_entry","next":""},{"text":"抓自己的手。先确认它还在","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_his_own_hand_first","next":""},{"text":"什么都不抓。让它知道我不是来抢的","affectionWho":"","affection":0,"insomnia":0,"flag":"entered_with_empty_hands","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……我进去了。"},{"type":"narration","text":"我的声音在那边听起来不一样。它有点闷，像隔着一件厚外套说话。我低头看自己的手，手是有的，光从指缝里透过来的时候会绕一下。"},{"type":"narration","text":"街上有人。六年前的傍晚，人行道边摆着几个修车的塑料凳，一个男孩蹲着拧链条；门口晾着衣服，风从巷子那头过来，带着饭菜味。"},{"type":"narration","text":"这些我都见过。我小时候住的街区也是这个样子。我不该有既视感，因为这是别人的记忆，我该像看一段录像一样看它。"},{"type":"choice","text":"","prompt":"这是别人的记忆，可你处处都熟。顺着熟走吗？","options":[{"text":"顺着走。熟就是这里的地图","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_the_false_deja_vu","next":""},{"text":"反着走。专挑没走过的巷子试它","affectionWho":"","affection":0,"insomnia":0,"flag":"tested_the_memory_against_itself","next":""},{"text":"站在原地。等它先动","affectionWho":"","affection":0,"insomnia":0,"flag":"stood_still_for_it_to_move","next":""}]},{"type":"narration","text":"可我没有。我走进那条巷子的时候，脚自己知道在第七块砖那里要抬高一点——那块砖翘起来了。"},{"type":"narration","text":"这不是看。这是回。"},{"type":"narration","text":"巷子尽头是那栋旧校舍。三四层高，外立面刷着很旧的白灰，底下有一块被学生们磨亮的墙裙。操场很小，一个篮球架歪着，架子上挂着半截铁丝。"},{"type":"narration","text":"门口站着一个穿灰外套的人。他背对着我，手里提着一个装菜的袋子。"},{"type":"narration","text":"我停住了。那一瞬间，站台那七秒钟从我胸口整个翻上来，翻得我一句话都说不出。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……是你。"},{"type":"choice","text":"","prompt":"灰外套的背影。现在就喊他吗？","options":[{"text":"喊。隔着六年也要喊这一声","affectionWho":"","affection":0,"insomnia":0,"flag":"called_the_gray_coat","next":""},{"text":"不喊。先看他在等谁","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_who_he_waited_for","next":"#l01"}]},{"type":"narration","text":"他转过身。那张脸很普通，皱纹很深，跟那天早上一样。只是这一次他没有在等我，他在等放学的钟。"},{"type":"narration","text":"他看了我一眼，开口说话。他的声音比那天早上清楚得多，清楚到我能听出他是哪里人。"},{"label":"l01","type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"小同学，你要找的人，还在后头。"},{"type":"narration","text":"我的舌头发麻。这个人的脸是那位老人，声音是老周的。两张东西叠在一起，叠得很生硬，可它就站在我面前，站得很稳。"},{"type":"narration","text":"我张了张嘴，想喊他。我喊不出来，因为我不知道该喊哪一个。"},{"type":"choice","text":"","prompt":"他已经走进校门了。跟不跟上去？","options":[{"text":"跟进去。他要找的人在后头","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_him_into_the_gate","next":""},{"text":"跟，但保持十步。不许个人行动","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"followed_at_ten_steps","next":""},{"text":"跟上去，绕到侧面看清他提的什么菜","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_grocery_bag","next":""}]},{"type":"narration","text":"他已经提着菜袋子走进校门了。背影跟那天早上一样，一样的不慌不忙。"},{"type":"narration","text":"我跟着进了校舍。走廊很暗，墙上贴着已经褪色的学生作品，塑料封皮反着光。楼梯间有一股粉笔和潮气混起来的味，这个味我记得很清楚，我记得自己闻过很多年。"},{"type":"narration","text":"二楼尽头那间教室的门虚掩着。我推开门的时候，门轴响了一下，那声「吱」我认得每一个音节。"},{"type":"narration","text":"教室里坐着几个人。三个女生挤在一张桌子上吃零食，一个男生趴在窗台上，还有一个人坐在最后一排，低着头写字。"},{"type":"choice","text":"","prompt":"最后一排有人一直在写。先看谁？","options":[{"text":"看最后一排。只有她一直在写","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_the_girl_writing","next":""},{"text":"看零食桌和窗台。先确认这是不是重播","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_replay_first","next":""},{"text":"看门口。确认退路还开着","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_exit_first","next":""}]},{"type":"narration","text":"写字的那个人抬起了头。"},{"type":"narration","text":"是个女孩，校服洗得发白，袖口有一点墨。她的脸很清楚，清楚得不像记忆——我甚至能看见她鬓角有一小撮头发翘着，没压下去。"},{"type":"narration","text":"我不认识她。可是我看着她的那一刻，鼻子发酸，酸得毫无道理。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你是谁。我为什么看着你想哭。"},{"type":"narration","text":"她笑了，说了一句我听得很清楚的话。她说完以后，整个教室的声音都退远了，只剩那句话浮在那儿。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"你终于来了。我等了很久了。"},{"type":"choice","text":"","prompt":"那句话是用小雅的声音说的。先回应谁？","options":[{"text":"回应那个女孩：把「你终于来了」接住","affectionWho":"","affection":0,"insomnia":0,"flag":"answered_the_girl_in_xyas_voice","next":""},{"text":"回头看身后的小雅。她还在不在","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"turned_to_check_on_xya","next":""},{"text":"不回应。它读我，我一个字都不给","affectionWho":"","affection":0,"insomnia":-2,"flag":"gave_the_memory_nothing","next":""}]},{"type":"narration","text":"那是小雅的声音。从那个女孩嘴里出来的时候，跟小雅一模一样，连笑气都一样。"},{"type":"narration","text":"我退了一步。我身后没有墙。"},{"type":"narration","text":"我又退了一步。这一次脚下空了，我整个人往下沉了半寸，像踩进一段没有铺好的路。"},{"type":"narration","text":"那些学生还是在原位。吃零食的、趴窗台的、写字的，全都在原位，只是他们开始被一层淡色的雾包住，边角变软了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"还没完。我还没看完。"},{"type":"narration","text":"我伸手去够黑板上的一行字。那是一句被写在角落里的公告，日期是六年前的某一天。我够到的时候，指尖是凉的。"},{"type":"choice","text":"","prompt":"指尖已经碰到黑板了。还要把那行字读完吗？","options":[{"text":"要。公告下面那一行，我要看清","affectionWho":"","affection":0,"insomnia":0,"flag":"read_the_blackboard_note","next":""},{"text":"不了。规则三说不做修改，退回去","affectionWho":"艾莉丝","affection":3,"insomnia":-3,"flag":"stepped_back_from_the_board","next":"#l02"}]},{"type":"narration","text":"凉得很明确。这不是录像，这是那天的温度。六年前的那一天，黑板的这一角就这么凉。"},{"type":"narration","text":"我想再往里走一步。我知道只要走进去，我就能看清那行字下面写的是什么。"},{"label":"l02","type":"narration","text":"有人的手在我背后收紧了。"},{"type":"narration","text":"那一下很突然，很疼。我整个人的重量被往后拽，教室像一张纸被抽走，走廊、校舍、巷子、那条街，全都在我眼前被往上翻。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"我再睁眼的时候，是在裂缝区的那段马路上，跪着。我的手撑着地，地上的石子硌得手心全是印。"},{"type":"choice","text":"","prompt":"回到马路上，膝盖还在抖。先说什么？","options":[{"text":"先问艾莉丝：我在里面待了多久","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"asked_how_long_he_stayed","next":""},{"text":"先找小雅的手。刚才攥着的那只还在不在","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"looked_for_xyas_hand_first","next":""},{"text":"什么都不说。把跪着的位置记下来","affectionWho":"","affection":0,"insomnia":0,"flag":"marked_where_he_kneeled","next":""}]},{"type":"narration","text":"小雅蹲在我旁边，两只手都还攥着我的手腕。她攥得太用力，指关节都白了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"你刚才差点没了。"},{"type":"narration","text":"艾莉丝的仪器在地上响个不停。她把它按停，看着我的时候，脸上的表情第一次不是「分析」。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你在里面停留了一百九十四秒。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"第四个规则我忘了说。碎片落地之后就会开始回收，回收的时候如果你还在里面，会被连着收走。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你为什么忘。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"因为我不相信有人能在里面待过九十秒还继续往里走。"},{"type":"choice","text":"","prompt":"她承认漏了一条规则。这句怎么接？","options":[{"text":"接住：下次把规则写下来，一人一份","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"asked_for_written_rules","next":""},{"text":"不怪她。漏的那条刚好救了我一次","affectionWho":"艾莉丝","affection":2,"insomnia":-2,"flag":"thanked_the_forgotten_rule","next":""},{"text":"追问：漏的是第四条，那还有第几条","affectionWho":"艾莉丝","affection":-2,"insomnia":0,"flag":"asked_how_many_more_rules","next":""}]},{"type":"narration","text":"雷恩最后一个走过来。他一直站在配重旁边没动，直到我站起来才开口。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"看见什么了。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"一间旧教室。里面有个人提着菜跟我说，我要找的人在后头。"},{"type":"narration","text":"我说到这儿停了。我没有说那个女孩。我不知道为什么，我就是不想在雷恩面前说。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"谁在后头。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"没说。他说完就走了。"},{"type":"narration","text":"雷恩看了我三秒。他的眼睛很干，什么都没有流露，可他点了一下头，点得像是在记一笔账。"},{"type":"choice","text":"","prompt":"关于那个女孩，你在雷恩面前咽了一次。现在呢？","options":[{"text":"继续不说。回车上再写进本子","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_girl_unsaid","next":""},{"text":"补一句：教室里还有个一直在写字的人","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"added_the_girl_to_raine","next":"#l03"}]},{"type":"narration","text":"我们收拾设备准备撤。新碎片从凹槽里拿出来的时候已经裂成两半，中间那点光也灭了。它用来了一次，就只能用一次。"},{"label":"l03","type":"narration","text":"小雅一直跟着我，走得很近。走到路口的时候她忽然停下来，把纸杯往垃圾桶边一放，杯底是空的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"问你一件事。你进去以后，有没有听见一个声音在数数。"},{"type":"narration","text":"我愣住了。我确实听见过。刚开始是心跳，后来心跳变成了一串很轻的数字。我以为是机器在计量。"},{"type":"choice","text":"","prompt":"她问的是数数的声音。你听见的那段怎么说？","options":[{"text":"说。从心跳变成数字那一段起","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"told_her_the_counting","next":""},{"text":"先反问：你怎么知道我会听见","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"asked_how_she_knew","next":""},{"text":"只说一半：承认听见，不说数字","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"told_half_the_counting","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"听见了。你怎么知道。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"因为我从外面也听见了。不是从机器里出来的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"是从我旁边那个人嘴里出来的。就站在我边上，一直在数。"},{"type":"choice","text":"","prompt":"她说声音就站在她旁边。顺着她指的方向看吗？","options":[{"text":"看。哪怕路口空空荡荡","affectionWho":"","affection":0,"insomnia":1,"flag":"looked_at_the_empty_crossing","next":""},{"text":"多看几秒。把胶带的抖记下来","affectionWho":"","affection":0,"insomnia":1,"flag":"studied_the_shaking_tape","next":""},{"text":"看一眼就牵她离开路口","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"walked_xya_off_the_corner","next":""}]},{"type":"narration","text":"我顺着她指的方向看过去。路口空空荡荡，只有那条警戒胶带在风里抖。"},{"type":"narration","text":"我把碎片收好，把裂缝区的坐标写在本子上。我写的时候手还在抖，字歪得很厉害。"},{"type":"narration","text":"回程的车上没有人说话。艾莉丝在整理数据，小雅靠着窗睡着，雷恩一直看着窗外。"},{"type":"narration","text":"我在膝盖上摊开本子，把看见的东西一件件写下来。写到那个女孩的时候，我停了一下，最后只写了一行。"},{"type":"choice","text":"","prompt":"本子摊在膝盖上，写到那个女孩了。笔停不停？","options":[{"text":"停一下，然后照实把那一行写完","affectionWho":"","affection":0,"insomnia":1,"flag":"paused_then_wrote_it_true","next":""},{"text":"不停。写完这一行，再添一句她袖口有墨","affectionWho":"","affection":0,"insomnia":1,"flag":"added_the_ink_detail","next":""},{"text":"写完就合本。多的一个字都可能害她","affectionWho":"","affection":0,"insomnia":1,"flag":"stopped_at_that_one_line","next":""}]},{"type":"narration","text":"「教室最后一排的那个人，我用小雅的声音听她说话，可我一点都不认识她。而她认得我。」"},{"type":"narration","text":"这一行我写完就合上了本子。车往城里开，天开始亮。第十一天的太阳从高架的缝里挤进来，光落在四个人身上，四个人谁都没有把脸转过去。"},{"type":"choice","text":"","prompt":"你手上有那两个还没说出口的发现。回城以后先做什么？","options":[{"text":"把「提菜的老人」这件事单独告诉艾莉丝，请她查六年前的记录","affectionWho":"艾莉丝","affection":6,"insomnia":0,"flag":"told_alice_oldman","next":""},{"text":"先不说，自己回图书馆查那间旧校舍的地址","affectionWho":"老周","affection":4,"insomnia":1,"flag":"checked_oldschool_alone","next":""}]},{"type":"narration","text":"车在研究所的侧门停下。艾莉丝先下去，抱着设备箱，走进门的姿势跟平时一样直。"},{"type":"narration","text":"我跟在她后面下车的。我在门口把她叫住了，这是我第一次主动叫她。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我在里面看见一个人。灰外套，提着菜，跟车站那天那个一样。可他的声音是老周的。"},{"type":"narration","text":"她抱着箱子的手紧了一下。她没有立刻回答，而是把我带到走廊尽头的长椅上，把箱子放下，才开口。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"同一个对象在两个人的记忆里留下痕迹，是裂缝的常见现象。它把几个人记的东西叠在一起，叠久了会串。"},{"type":"choice","text":"","prompt":"她把「串」说成常见现象。这个解释你收吗？","options":[{"text":"收。常见至少意味着有救","affectionWho":"艾莉丝","affection":3,"insomnia":-2,"flag":"took_the_overlay_explanation","next":""},{"text":"不收。不正常的是他出现在六年前","affectionWho":"艾莉丝","affection":2,"insomnia":1,"flag":"caught_the_uncommon_part","next":""},{"text":"先收下，回宿舍再查六年前的住户","affectionWho":"","affection":0,"insomnia":0,"flag":"filed_it_for_later_check","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"那就是正常？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"正常的是串。不正常的是——你进的那段是六年前的街区，而那个人不该出现在六年前。"},{"type":"narration","text":"她说完就把箱子抱起来走了。走了五步，她停下来，又补了一句。这是她第二次为我多解释。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我今晚查。你别一个人去那栋旧校舍。"},{"type":"narration","text":"我答应了。我答应的时候想得很清楚：我这几天答应过的事，没有一件做到过。"},{"type":"narration","text":"回宿舍的路上，我在便利店门口站了两分钟。玻璃门上倒着整条街，也倒着我自己的影子。我看着影子的眼睛，蓝色那圈又比昨天重了一点。"},{"type":"choice","text":"","prompt":"玻璃门上倒着自己的影子。这十天的账，谁来替你数？","options":[{"text":"认。让仪器替我数下去，它从不出错","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"let_the_machine_count","next":""},{"text":"不认。从今天起，自己数自己的","affectionWho":"","affection":0,"insomnia":1,"flag":"counted_his_own_hours","next":"#l04"}]},{"type":"narration","text":"我数到今天为止，清醒了二百四十个小时。这个数字我记得很准，因为仪器一直在替我数。"},{"label":"l04","type":"narration","text":"我推门进去买了一瓶水。店员找零的时候问我要不要袋子。我说不用。这个对话一共四秒，非常正常。"},{"type":"narration","text":"而这四秒里，我又听见了那个数数的声音。就在我背后，很轻，从一数到七，然后停了。"},{"type":"narration","text":"我没有回头。我知道回头也不会有人。我只是一边走一边把手里的碎片握紧，握到它在掌心发热。"}]},"2-2":{"sceneId":"2-2","chapter":"第二幕·深入探索","title":"平行世界","background":"bg_alt_city","bgm":"bgm_warm","dense":true,"next":"2-3","lines":[{"type":"narration","text":"第十二天，三月二十三号，下午四点。我们在研究所地下室把那台东西拼了三天，终于把它拼成能用的样子。"},{"type":"narration","text":"昨天拿回来的另一半碎片被清过一遍，数据比上一块干净。艾莉丝把两组信号合起来以后，机器上的第三条线终于亮了。第三条线不是回忆。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"回忆是单点的。这条线是连续的，而且它在动。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"动到哪儿。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"动到同一时间、同一座城市、但不同的地方。"},{"type":"choice","text":"","prompt":"同一时间、同一座城、不同的地方。这话你打算怎么接？","options":[{"text":"追问她：这个结论是从哪组信号里看出来的","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"pressed_alice_for_signal_evidence","next":""},{"text":"先不说话，等她把「不同的地方」说完","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_alice_to_finish","next":""},{"text":"问一句：那一边知不知道我们在这边","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_other_side_notices","next":"#l01"}]},{"type":"narration","text":"她说这句话的时候没有抬头。她把这句说得很轻，好像怕它被人听见似的。她这几天都是一副「已经知道结论但还不想承认」的样子。","label":"l01"},{"type":"narration","text":"雷恩靠在门框上，手里拿着一块抹布在擦一把小刀。刀不脏，他只是想手里有东西。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"说人话。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这就是裂缝的定义。不是时间被改了，是一座城被劈成了两半，两半都在走。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我们一直在这一边。裂缝的另一边，也有一个今天。"},{"type":"choice","text":"","prompt":"裂缝那边也有一个今天。这个「今天」让你想到什么？","options":[{"text":"想到那边也有一场没发生的事故","affectionWho":"","affection":0,"insomnia":0,"flag":"other_side_had_no_accident","next":""},{"text":"想到那边有人在过我们没过成的日子","affectionWho":"","affection":0,"insomnia":0,"flag":"envied_the_unbroken_today","next":""},{"text":"不敢往下想，先把这句话咽回去","affectionWho":"","affection":0,"insomnia":-2,"flag":"swallowed_the_thought","next":"#l02"}]},{"type":"narration","text":"小雅从楼梯上下来，抱着一袋刚买的包子。她听见了最后一句，站在梯口没动，袋子在她怀里慢慢凉下去。","label":"l02"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"那边也有我？"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"理论上，有。"},{"type":"narration","text":"地下室里安静了一会儿。然后小雅把包子放在桌上，拍了拍手上的面粉，走到机器前面，看着那条亮着的第三条线。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"那我们进去看看。反正我今天没什么事。"},{"type":"narration","text":"三点四十分，机器预热完成。这次的通道不是翻过去的，是「并」过去的——我们把两个世界对齐，然后沿着对齐的缝往旁边走一步。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"三分钟。三分钟以后通道自己关闭，不等人。"},{"type":"choice","text":"","prompt":"三分钟，不等人。跨过去之前，这句话你想不想问明白？","options":[{"text":"问。时间规矩必须当场问清","affectionWho":"艾莉丝","affection":3,"insomnia":0,"flag":"asked_about_time_limit","next":""},{"text":"不问。把三分钟记进心里就行","affectionWho":"","affection":0,"insomnia":0,"flag":"memorized_the_three_minutes","next":""},{"text":"先回头看看小雅怕不怕","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"checked_xya_before_crossing","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"为什么是三分钟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"因为超过三分钟，回来的那个人就不确定是不是原来那一个了。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"都别碰人。别说话。看就行。"},{"type":"fx","fx":"wait","text":""},{"type":"narration","text":"机器开始响。这一次的声音很像水在管子里流动，均匀、连续、没有起伏。然后我感觉到自己的右侧忽然多了一个方向——一个原本不存在的方向。"},{"type":"narration","text":"我朝那个方向迈了一步。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"我站在同一个地下室里，但地下室不是这个地下室。"},{"type":"choice","text":"","prompt":"同一个地下室，换了另一副样子。你先核对什么？","options":[{"text":"核对设备：哪些东西被换掉了","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_new_devices","next":""},{"text":"核对墙面：我们钉的草图还在不在","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_for_our_sketch","next":""},{"text":"先回头数人，确认四个都跟过来了","affectionWho":"","affection":0,"insomnia":-1,"flag":"recounted_the_four_inside","next":""}]},{"type":"narration","text":"这里亮得多。顶上装了新的灯管，墙刷成了浅色，地上铺了胶垫。原先堆在角落里的那些坏仪器不见了，取而代之的是三台我认不出型号的新设备，安静地开着。"},{"type":"narration","text":"墙上没有我们昨晚钉的那张城市草图。那面墙现在挂着一块白板，上面写着排班表，笔迹很工整。"},{"type":"narration","text":"小雅的手在我袖子上抓紧了。我回头看，她还在，艾莉丝和雷恩也在。四个人都进来了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我们的东西呢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这一边没有发生过那件事，所以这些东西不需要存在。"},{"type":"choice","text":"","prompt":"「不需要存在」——这套逻辑你要不要当场辩？","options":[{"text":"想辩，可楼梯上的脚步先到了","affectionWho":"","affection":0,"insomnia":0,"flag":"started_to_argue_logic","next":""},{"text":"认下这套逻辑，它冷得自洽","affectionWho":"艾莉丝","affection":3,"insomnia":-1,"flag":"accepted_alices_logic","next":""},{"text":"反过来问：那我们的世界是不是也不需要存在","affectionWho":"","affection":0,"insomnia":0,"flag":"inverted_the_existence_logic","next":"#l03"}]},{"type":"narration","text":"楼梯上传来脚步声，很随意，一边下一边还在跟楼上的人说话。","label":"l03"},{"type":"narration","text":"我们四个人同时往那面墙后面退。那地方原来堆着箱子，现在也是空的，正好够藏人。"},{"type":"narration","text":"下来的是两个人。走在前面那个穿着研究所的灰背心，头发很短，笑起来眼睛会弯。"},{"type":"narration","text":"我不认识他。可艾莉丝的手一下子掐住了我的手臂，掐得很重。她盯着那个人的侧脸，眼睛一动不动。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"……"},{"type":"narration","text":"她什么都没说。那不是「不想说」，那是喉咙不听使唤。她的呼吸变得很短，胸前一起一伏，像有人把她的气掐在胸口。"},{"type":"choice","text":"","prompt":"艾莉丝说不出话。这一刻你先顾哪边？","options":[{"text":"扶住她，别让她在这里垮下来","affectionWho":"艾莉丝","affection":6,"insomnia":0,"flag":"steadied_alice_silently","next":""},{"text":"不去碰她，给她留喘息的空","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"gave_alice_room","next":""},{"text":"顺着她的目光，看后面那个人是谁","affectionWho":"","affection":0,"insomnia":0,"flag":"followed_alices_gaze","next":"#l04"}]},{"type":"narration","text":"跟在他后面那个人就更让我站不住。","label":"l04"},{"type":"narration","text":"老周从楼梯上走下来，手里提着一个饭盒。他走得很快，脚步很稳，一点也不像那天早上那个把菜袋子提得很慢的人。"},{"type":"narration","text":"最不对的地方是头发。他是黑的。不是染的，是黑得油亮、只在鬓角有两根白的那种黑。"},{"type":"dialogue","speaker":"老周","sprite":"zhou_kind","text":"器材别动啊，我下午要收。你俩要是饿了先吃，我上去签个字。"},{"type":"narration","text":"他说完就上楼了。他的声音在这条楼道里回了两下，两下都很清楚。"},{"type":"choice","text":"","prompt":"黑头发的老周上楼了。这几秒你打算怎么过？","options":[{"text":"站在原地，把那两下回声听完","affectionWho":"","affection":0,"insomnia":0,"flag":"let_zhous_echo_finish","next":""},{"text":"想追上去说一句「这边也有人记得你」","affectionWho":"老周","affection":5,"insomnia":0,"flag":"wanted_to_tell_zhou","next":"#l05"},{"text":"把这一幕记下来，记进本子","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_zhou_in_book","next":""}]},{"type":"narration","text":"我站在原地，忽然想哭。这很荒唐，我跟他共事过一个月，认识他每一句说一半的话，可除此之外，我只看清过他七秒钟。","label":"l05"},{"type":"narration","text":"小雅忽然拉了我一把。她把我的手往她那边拽，拽得很急，我顺着她的目光看过去。"},{"type":"narration","text":"楼梯口下面那面墙上，贴着几张打印的通知。最上面那张是一份排班表，日期是今天。"},{"type":"narration","text":"我的目光往下挪，落在最底下那行小字上。那是一份「长期留驻人员」名单。"},{"type":"narration","text":"名单上第一行写着老周的名字，后面标注「第十四个月」。第二行写着林晓。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"……我在这儿？"},{"type":"choice","text":"","prompt":"名单第二行是自己的名字。你先看哪一行？","options":[{"text":"回头看第一行，确认那是不是老周","affectionWho":"","affection":0,"insomnia":0,"flag":"rechecked_zhous_line","next":""},{"text":"往下看还有没有别人的名字","affectionWho":"","affection":0,"insomnia":0,"flag":"scanned_rest_of_list","next":""},{"text":"盯住日期，看这份名单贴了几天","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_list_date","next":""}]},{"type":"narration","text":"小雅也看见了。她看得很慢，一个一个往下读，读完以后抬头看着我。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"还有我。还有艾莉丝。还有雷恩。四个人的名字，一个不少。"},{"type":"narration","text":"雷恩没有说话。他往前走了一步，把那面墙看了一遍，然后回头看我们进来的位置——我们刚才穿过来的那个位置，现在什么都没有。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"一分钟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"还不到。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我说一分钟，是提醒你。你现在的样子不适合继续走。"},{"type":"narration","text":"艾莉丝没有回他。她一直看着那两个灰背心的人把箱子搬来搬去。她的脸上没有表情，可她的眼睛在追着其中一个人的动作。"},{"type":"choice","text":"","prompt":"艾莉丝盯着一个陌生人看。你怎么处理？","options":[{"text":"陪她看，不打断","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"stayed_with_alices_gaze","next":""},{"text":"低声问雷恩：她认识那个人吗","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"asked_raine_about_alice","next":""},{"text":"先挡住通往那边的视线，免得被认出来","affectionWho":"","affection":0,"insomnia":0,"flag":"shielded_their_sightline","next":""}]},{"type":"narration","text":"那个人在搬箱子的时候，顺手把一杯水推向同伴。他说了一句「慢点」。就是这两个字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"他以前总说这两个字。他做什么都要先说慢点。"},{"type":"narration","text":"我这才明白。那个人是她认识的人。是她在这一边没有的人。"},{"type":"narration","text":"我们贴着墙根往外走。地下室的出口在这一边改成了一扇玻璃门，推开就是研究所的后院。"},{"type":"narration","text":"后院比记忆里大，也比记忆里干净。六年前的旧楼还在，但旁边多了一栋新楼，五层，浅灰色，窗子全是新的。"},{"type":"choice","text":"","prompt":"旧楼还在，旁边多了一栋新楼。你想到什么？","options":[{"text":"想到这一边的六年，事情都顺理成章地长","affectionWho":"","affection":0,"insomnia":0,"flag":"marveled_at_intact_years","next":""},{"text":"想到新楼里会不会也有一份我们的名单","affectionWho":"","affection":0,"insomnia":0,"flag":"wondered_about_new_building","next":""},{"text":"什么也不多想，跟着走","affectionWho":"","affection":0,"insomnia":-1,"flag":"walked_without_thinking","next":""}]},{"type":"narration","text":"院子里有七八个人。有人在抽烟，有人在争论一个公式，两个人在搬花盆。这个院子很吵，吵得很正常。"},{"type":"narration","text":"街上的车流是通的。三年前那天塌掉的那段匝道没有塌，还立在那儿，沥青很新。高架上的路灯整齐地亮着，往城市深处排过去。"},{"type":"narration","text":"路边有一家便利店，招牌是我们熟悉的那家。店门口摆着外带的桌椅，有个穿校服的女孩在写作业，一个老头在旁边陪着，两个人一起低头看同一本册子。"},{"type":"choice","text":"","prompt":"便利店门口，两个人共看一本册子。你要不要走近？","options":[{"text":"走近一点，看清那个老头是不是老周","affectionWho":"","affection":0,"insomnia":0,"flag":"stepped_closer_to_store","next":"#l06"},{"text":"不走近，怕看见更多「还在」的人","affectionWho":"","affection":0,"insomnia":0,"flag":"afraid_to_see_more","next":""},{"text":"记住这家店的位置，回头再说","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_the_store_location","next":""}]},{"type":"narration","text":"那本册子我们很眼熟。老周在图书馆里给人讲过的那本，封面上有个被磨掉的角。","label":"l06"},{"type":"narration","text":"小雅走过去几步，在那家店门口停下来。她盯着菜单看，看了很久。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"这家的豆沙包还在。我们那家上个月就换掉了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我以前的师父说，豆沙要熬到挂勺才算数。这家还在这么做。"},{"type":"narration","text":"她说到这里的时候笑了。那是这几天里她笑得最像原来的样子。她抬手想推门，手伸到一半停住了。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"我能进去买一个吗。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"不能。你在这边付的钱，回那边是空的。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我知道。你不用解释两遍。"},{"type":"choice","text":"","prompt":"小雅被一句「不能」拦在店门口。你怎么接？","options":[{"text":"记下这家店，答应以后光明正大带她来","affectionWho":"小雅","affection":7,"insomnia":0,"flag":"promised_xya_a_return","next":""},{"text":"不接话，这时候多说只会更疼","affectionWho":"小雅","affection":-2,"insomnia":0,"flag":"let_xya_stand_alone","next":""},{"text":"回头看艾莉丝，确认这个「不能」是谁定的规矩","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"questioned_the_cant_rule","next":""}]},{"type":"narration","text":"她把手收回来了。收回来以后，她把手插进袖子里，站得笔直。她没再看那家店。"},{"type":"narration","text":"我们又往前走。走到十字路口的时候，艾莉丝忽然停住了。"},{"type":"narration","text":"对面的人行道上站着一个年轻男人，背着包，正在打电话。他讲话的时候头会往右偏一点，笑起来眼睛也会弯。"},{"type":"narration","text":"他讲完电话，把手机放进口袋，抬头看了一眼天。然后他走进那栋新楼，脚步很快。"},{"type":"narration","text":"艾莉丝一直站在原地。我看着她的侧脸，第一次看到她咬着下嘴唇，咬得嘴唇都白了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"只是看一看。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"他是谁。"},{"type":"choice","text":"","prompt":"艾莉丝正要说出他是谁。这个问题你还追不追？","options":[{"text":"追。哪怕答案是一个不该知道的名字","affectionWho":"","affection":0,"insomnia":0,"flag":"pressed_for_the_name","next":""},{"text":"后悔问了，替她把话接住","affectionWho":"艾莉丝","affection":4,"insomnia":0,"flag":"took_the_question_back","next":""},{"text":"不问名字，只记住「二十七岁」这四个字","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_age_twentyseven","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"一个在这一边活到二十七岁的人。"},{"type":"narration","text":"她说完这句就往回走。她的步子很快，比来时快得多。雷恩跟上去，走在她外侧，没有问一句话。"},{"type":"narration","text":"我没有立刻跟上。因为我在那一刻发现了一件很冷的事。"},{"type":"narration","text":"这一边什么都好。这一边没有事故，没有塌掉的匝道，没有两个被忘掉的人。这一边的每个人都活着，活得还都不错。"},{"type":"narration","text":"可这一边没有人在找任何东西。老周提着饭盒上楼的姿势很平常，小雅走路的姿势很平常，连艾莉丝看着那个人的眼神，都不是这一边该有的东西。"},{"type":"choice","text":"","prompt":"这一边什么都不缺，缺的只是「在找」。你怎么想？","options":[{"text":"想：会找东西，人才是活着的","affectionWho":"","affection":0,"insomnia":0,"flag":"searching_means_alive","next":""},{"text":"想：那我们四个算什么，入侵者还是药","affectionWho":"","affection":0,"insomnia":0,"flag":"questioned_our_role","next":""},{"text":"掐断这个念头，先追上队伍","affectionWho":"","affection":0,"insomnia":-1,"flag":"cut_off_the_thought","next":""}]},{"type":"narration","text":"我回头再看那家便利店。刚才那个写作业的女孩已经不在了，老头也不在了。椅子还在，椅子上的册子还摊着。"},{"type":"narration","text":"橱窗的玻璃里映着我。玻璃上的我比这一边的所有人都淡，淡得能看见我背后的街。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我们不属于这儿。"},{"type":"narration","text":"有声音回答我。那声音很轻，很平，不像从街上来的，更像从我耳朵的里面来。"},{"type":"narration","text":"它说：还有四十秒。窗口关闭以后，留在这边的人不会有人来找。"},{"type":"choice","text":"","prompt":"四十秒，声音说得很平。你信它几分？","options":[{"text":"全信。跑就是了","affectionWho":"","affection":0,"insomnia":0,"flag":"ran_on_the_voice","next":""},{"text":"信七分，跑的路上把这条街再记一遍","affectionWho":"","affection":0,"insomnia":0,"flag":"memorized_street_while_running","next":""},{"text":"想再站一秒，就一秒","affectionWho":"","affection":0,"insomnia":0,"flag":"almost_stayed_one_second","next":"#l07"}]},{"type":"narration","text":"我跑起来。跑的时候我看见自己在那片玻璃上追着我跑——那不是影子，那是一个正在慢慢被擦掉的人。","label":"l07"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"林晓！"},{"type":"narration","text":"我抓住小雅的手，把她往来的方向带。四个人一起往回跑，跑过那条和这边一样又不一样的街。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"回到地下室的时候，机器还在响。计时器停在三分钟整的地方，灯刚灭。"},{"type":"narration","text":"脚下的胶垫是我俩前天铺的，歪着。堆在角落的坏仪器还在，落着灰。墙上那张手绘的城市草图还在，边缘用图钉压着。"},{"type":"narration","text":"我扶着膝盖喘。我回头数人：小雅、艾莉丝、雷恩，三个都在。"},{"type":"choice","text":"","prompt":"回来了，人齐了。你先确认什么？","options":[{"text":"确认计时器——有没有人超时","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_timer","next":""},{"text":"确认小雅——她那句包子话什么意思","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"asked_about_the_baozi","next":""},{"text":"什么都不确认，先让自己喘匀","affectionWho":"","affection":0,"insomnia":-2,"flag":"let_breath_settle","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_cry","text":"那个包子我再也吃不到第二家了。"},{"type":"narration","text":"她蹲在地上，眼睛红着，但没有哭出声。艾莉丝把机器关掉，坐在椅子上很久没有动。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"你刚才在那边看见了什么，至于跑成那样。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"看见我变淡了。还有——"},{"type":"narration","text":"我没有说完。因为我的目光这时候落在名单的位置上。"},{"type":"narration","text":"我们从那一边带回来一样东西。不是买的，也不是拿的：一张小纸片，折叠得整整齐齐，被我攥在手心里，纸边已经起了毛。"},{"type":"narration","text":"我把它展开。那不是名单，是一张照片的一角。"},{"type":"choice","text":"","prompt":"带回来的是一角照片。你先看哪一面？","options":[{"text":"看正面，把那张笑脸记住","affectionWho":"","affection":0,"insomnia":0,"flag":"memorized_the_smile","next":""},{"text":"翻背面，看有没有字","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_photo_back","next":""},{"text":"先对着灯，看这角纸还有没有别的东西","affectionWho":"","affection":0,"insomnia":1,"flag":"held_photo_to_light","next":""}]},{"type":"narration","text":"照片上有两个人，一个站着，一个坐在椅子上。站着的那个人穿着研究所的灰背心，笑得很随意。坐着的那个人背对着镜头，只看得见一个后脑。"},{"type":"narration","text":"而照片的背面用笔写着一行字，字迹跟艾莉丝在草图上写的一模一样。"},{"type":"narration","text":"那行字写的是：别让他变成没有人记得的那种人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"这张照片不是我的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"但这个字是我的。是未来的我。"},{"type":"narration","text":"地下室很静。只有那台刚关掉的机器在慢慢散热，发出一点很细的响。"},{"type":"choice","text":"","prompt":"「这个字是我的。是未来的我。」这句话你打算怎么接？","options":[{"text":"问她：未来的我是什么时候写的","affectionWho":"艾莉丝","affection":5,"insomnia":1,"flag":"asked_when_she_wrote_it","next":""},{"text":"先不接，让她把这句话自己消化完","affectionWho":"艾莉丝","affection":3,"insomnia":-1,"flag":"let_alice_digest","next":""},{"text":"把「未来的我」四个字记进本子","affectionWho":"","affection":0,"insomnia":1,"flag":"wrote_future_self","next":""}]},{"type":"narration","text":"我把照片翻回正面。那个站着的灰背心男人还在笑。我在心里给他记了一个编号，因为我不知道他的名字，而这个名字现在只存在于一个我们不认识的另一边。"},{"type":"narration","text":"当晚我们没有再开机。我们围着那张照片坐到半夜，谁也没说出一个像样的结论。"},{"type":"narration","text":"我自己的结论是：我们不是来救人的。我们是来替别人记着那些人曾经存在过。一想到这个，我胸口就沉得厉害，可我又说不清为什么。"},{"type":"choice","text":"","prompt":"那张照片该由谁保管？","options":[{"text":"交给艾莉丝，由她对照研究所的旧档案","affectionWho":"艾莉丝","affection":7,"insomnia":1,"flag":"photo_to_alice","next":""},{"text":"自己收着，先不告诉雷恩照片上的字","affectionWho":"雷恩","affection":5,"insomnia":1,"flag":"kept_photo_secret","next":""}]},{"type":"narration","text":"最后我把照片放进了本子的夹层里。夹层里原本只有那张站台上的收据，现在里面多了一张不知道属于谁的笑脸。"},{"type":"narration","text":"我合上本子的时候，手指碰到了夹层的边。那一下很轻，可我忽然听见了一声很熟的「吱」——是那间旧教室的门轴。"},{"type":"narration","text":"那扇门在六年前。它刚被我推开过一次，现在它又响了一声。"},{"type":"narration","text":"我抬起头。艾莉丝已经收了设备，小雅在收拾桌上的包子袋，雷恩把刀插回鞘里，靠着门框看我们。"},{"type":"narration","text":"四个人，一个都不少。这句话我数了两遍才安心。"},{"type":"choice","text":"","prompt":"雨夜里，这扇门谁都没关。今晚你还想做什么？","options":[{"text":"把名单和照片的疑点列成明天的问题","affectionWho":"","affection":0,"insomnia":0,"flag":"listed_tomorrows_questions","next":""},{"text":"守在机器旁边，等它彻底冷下来","affectionWho":"","affection":0,"insomnia":-2,"flag":"stayed_by_the_machine","next":""},{"text":"去跟小雅说一句「明天我陪你们」","affectionWho":"小雅","affection":5,"insomnia":0,"flag":"promised_to_continue","next":""}]},{"type":"narration","text":"地下室外面在下小雨。雨打在玻璃门上的声音很轻，我们谁都没有把这扇门关上。"}]},"2-3":{"sceneId":"2-3","chapter":"第二幕·深入探索","title":"雷恩的秘密","background":"bg_base_room","bgm":"bgm_tension","dense":true,"next":"2-4","lines":[{"type":"narration","text":"第十三天，三月二十四号，早上七点。我醒着，已经醒了十三个白天。"},{"type":"narration","text":"地下作战室的灯是那种老式的长条灯管，开久了会有一点嗡嗡的底噪。我坐在桌子这头，把昨天带回来的照片和站台收据并排摆着。"},{"type":"narration","text":"两个人，一张收据，两件都跟同一个人有关。而那个人在我这边只出现过七秒，在另一边活到了二十七岁。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"照片上根本没有她。"},{"type":"choice","text":"","prompt":"照片里没有她，可昨天你看见的是她。信哪一边？","options":[{"text":"信眼睛：我确实看见她在楼前站着","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_what_i_saw","next":""},{"text":"信照片：纸上的东西不会陪我演","affectionWho":"","affection":0,"insomnia":0,"flag":"trusted_the_photo","next":""},{"text":"把两者并排放着，先不裁决","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_both_unjudged","next":"#l01"}]},{"type":"narration","text":"照片上是一个灰背心的男人和半个后脑。可昨天在那边，我明明看见的是艾莉丝的背影，是她在楼前站了很久，是她咬着嘴唇说「只是看一看」。","label":"l01"},{"type":"narration","text":"我推门进来的时候，作战室里只有小雅。她趴在桌上，面前摊着一叠便利贴，每张上面都写着时间、地点和一句话。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你昨天回来以后一直在看那张照片吗。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_normal","text":"看了四个小时。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_smile","text":"我也没睡。我把这些东西写下来了，你要不要听。"},{"type":"narration","text":"她开始念她的便利贴。她念得很慢，每一条都像在数她自己身上的东西。"},{"type":"choice","text":"","prompt":"她要念她的便利贴了。你先做什么？","options":[{"text":"坐直，一条一条听完","affectionWho":"","affection":0,"insomnia":0,"flag":"listened_to_every_note","next":""},{"text":"先给她倒杯水，让她慢点说","affectionWho":"小雅","affection":5,"insomnia":-2,"flag":"poured_xya_water","next":""},{"text":"打开本子，准备逐条对","affectionWho":"","affection":0,"insomnia":0,"flag":"prepared_to_crosscheck","next":""}]},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"第一条。三月十六号，我在车站站台上没听见周围所有的声音，只听见一个数数的声音。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"第二条。昨天在那边，我靠近那家咖啡店，我能听见我师父在厨房里翻动锅铲。这不可能，她在另一座城。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"第三条。前天你睡觉的时候，我在外面坐着。我听见楼下的水管，听见楼顶的鸟，听见三条街以外有人在吵架。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我不是猜的。我是真的听见了。"},{"type":"narration","text":"她说这话的时候很平静。平静得让人后怕，因为她自己已经接受了这件事，只是还没找到词来形容它。"},{"type":"choice","text":"","prompt":"三条「听见」摆在一起。这算病，还是算能力？","options":[{"text":"不敢定性，先记成事实","affectionWho":"","affection":0,"insomnia":0,"flag":"recorded_as_fact","next":""},{"text":"心里偏向「能力」，但没说出口","affectionWho":"","affection":0,"insomnia":0,"flag":"leaned_toward_ability","next":""},{"text":"想到她一个人扛着这些没睡","affectionWho":"小雅","affection":6,"insomnia":0,"flag":"worried_for_xya_alone","next":"#l02"}]},{"type":"narration","text":"我装睡的那两个晚上，一直在数呼吸。我数自己，也数别人。原来她数得比我还多。","label":"l02"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"这件事先别告诉艾莉丝。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"为什么。她不是我们这边的人吗。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"她会先写一份报告，再决定要不要让你进现场。"},{"type":"narration","text":"话音刚落，门就从外面被推开了。雷恩站在门口，手里提着一个旅行袋，外套肩膀是湿的。外面在下雨。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"今天不要去裂缝区。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我们昨天才定好路线。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"路线我改了。改到今天下午，地点也换。"},{"type":"choice","text":"","prompt":"雷恩单方面改了路线。你跟不跟？","options":[{"text":"跟。他很少用这种语气说话","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"followed_raines_change","next":""},{"text":"先问一句：改成这样，是谁受益","affectionWho":"","affection":0,"insomnia":0,"flag":"questioned_route_change","next":""},{"text":"不表态，先看袋子里是什么","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_the_bag_first","next":""}]},{"type":"narration","text":"他把旅行袋放在桌上，拉开拉链。里面不是衣服，是一沓用塑料膜封着的纸，还有六瓶编号不同的碎片样本。"},{"type":"narration","text":"其中一瓶的标签上用黑笔写着一行字。字很小，很工整，写着「三月二十八日，市内西区」。这个日期在四天以后。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"这是什么时候的东西。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"我前天从北线带回来的。你不用问它怎么来的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"你只要知道一件事：四天以后，西区会出一次大的。规模比车站那次大三倍。"},{"type":"narration","text":"我看着他手里那瓶样本。它现在很暗，里面几乎不亮。可我知道它只是被提前封住了。"},{"type":"choice","text":"","prompt":"四天后的西区、提前封住的样本。这句话你问不问？","options":[{"text":"问。把「早就知道」四个字问出口","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_raine_knew","next":""},{"text":"不问，先记下瓶子上的日期","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_the_bottle_date","next":""},{"text":"问他：这次要不要我们分头行动","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"asked_about_split","next":""}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你早就知道车站那天会发生什么吗。"},{"type":"narration","text":"他停了两秒。这两秒里他的手一直按在旅行袋的拉链上，没有松开。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"知道一半。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"剩下的今天下午补上。废墟东侧有一段被压住的路，上周开始有反应。"},{"type":"narration","text":"他改了今天的计划。原本我们该去北线复查，现在改去废墟东侧。这不合逻辑，因为北线的那段是唯一一块我们还有数据的地方。"},{"type":"narration","text":"但雷恩说改就改，语气不像在商量，也不像在下命令。他有事要去东侧，而且他不想让人知道是什么事。"},{"type":"narration","text":"下午两点，雨小了一点。我们到了东侧。"},{"type":"choice","text":"","prompt":"下午两点，东侧到了。下车前你想确认什么？","options":[{"text":"确认撤退路线，塌方区不能只进不出","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_escape_route","next":""},{"text":"确认谁拿设备，别再出岔子","affectionWho":"","affection":0,"insomnia":0,"flag":"confirmed_gear_duty","next":""},{"text":"看一眼雷恩，他比谁都急着到这儿","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"noticed_raines_urgency","next":"#l03"}]},{"type":"narration","text":"那段路塌得很彻底。整条车道陷下去一层，陷口边缘露着白的路基，路基下面是一段被压扁的黑色管道。","label":"l03"},{"type":"narration","text":"塌方的中间嵌着一块碎片。那块碎片至少有两个拳头大，黑得发亮，边缘被雨冲得很干净。"},{"type":"narration","text":"我看到它的时候先注意到一件不对的事：那块碎片的位置太正了。塌方、管道、路面都歪着，只有它摆得端端正正，像有人把它放下来的时候仔细对过中心。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"这块不是自然生成的。它被人挪过。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"所以要快点收。"},{"type":"choice","text":"","prompt":"「被人挪过」的碎片，收它之前你担心什么？","options":[{"text":"担心挪它的人还会回来","affectionWho":"","affection":0,"insomnia":0,"flag":"feared_the_mover_returns","next":""},{"text":"担心雷恩太急，会一个人扛","affectionWho":"雷恩","affection":5,"insomnia":0,"flag":"worried_raine_overexerts","next":""},{"text":"什么都不担心，先搭手","affectionWho":"","affection":0,"insomnia":-1,"flag":"helped_without_worry","next":""}]},{"type":"narration","text":"他把配重钢锭从车上搬下来，一个人抬的。第一次抬的时候他的右手没有完全使上劲，钢锭歪了一下，磕在车框上，声音很闷。"},{"type":"narration","text":"他把右手往袖子里缩了一下才接着抬。我看清了那个动作，也看清了他袖口下面有什么。"},{"type":"narration","text":"但那一刻我没出声，因为我以为我看错了——那下面是一截不平的皮肤，像烙过什么东西。"},{"type":"narration","text":"设备布置好以后，艾莉丝让我们分成两组。她和小雅在外围，负责读数与回收；我和雷恩靠近那块碎片。"},{"type":"choice","text":"","prompt":"分成两组，你被分到雷恩身边。这一组你盯什么？","options":[{"text":"盯雷恩的手，他袖口下面有东西","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"watched_raines_hand","next":""},{"text":"盯碎片，探针数据出来就报","affectionWho":"","affection":0,"insomnia":0,"flag":"watched_the_probe_data","next":""},{"text":"盯外围的艾莉丝和小雅，离塌口太远反而慌","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"watched_the_perimeter","next":""}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"九十分钟的窗口，分两次。第一次三分钟，看结构。第二次再决定要不要取样。"},{"type":"narration","text":"第一次窗口很干净。我们没进去，只让探针贴着它转了一圈。回来的数据很怪：那块碎片里裹着一小段完整的时间，长度约五个小时，来自三年前的这条街。"},{"type":"narration","text":"第二次架设的时候，我们犯了一个错。设备要挪两米，绕到塌口的另一边。这两米里，艾莉丝把碎片样本盒递给了小雅拿着。"},{"type":"narration","text":"样本盒是金属的，密封的，看上去很安全。可它里面装的不是样本，是前天从那块黑碎片上敲下来的一小片。"},{"type":"choice","text":"","prompt":"样本盒转给了小雅拿。你要不要换人？","options":[{"text":"要换，盒子该由拿过的人抱着","affectionWho":"","affection":0,"insomnia":0,"flag":"tried_to_take_box_back","next":""},{"text":"不换，金属盒密封得很，出不了事","affectionWho":"","affection":0,"insomnia":-1,"flag":"trusted_the_sealed_box","next":""},{"text":"只提醒她退离塌口三步","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"asked_xya_to_step_back","next":"#l04"}]},{"type":"narration","text":"小雅把它们抱在胸前，站得离塌口很近。我回头喊她退远一点，她点头往后退。","label":"l04"},{"type":"narration","text":"她退第三步的时候，脚边的水坑里浮起一层白光。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"白光没有声音，但它把整条街的声音都吸走了。"},{"type":"narration","text":"我看见小雅站在那儿，两只眼睛睁得很大，瞳孔里有一点很淡的白。盒子从她手里掉在地上，盖子摔开了。"},{"type":"narration","text":"她没有尖叫。她只是站着，嘴唇在动，像是在跟谁对账。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"这里……死过很多人。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"我听见了。三年前的这条路上，有人喊了一整夜。"},{"type":"choice","text":"","prompt":"小雅说「这里死过很多人」。你先做什么？","options":[{"text":"先去看她的眼睛，那层白还没退","affectionWho":"小雅","affection":6,"insomnia":0,"flag":"checked_xyas_eyes","next":""},{"text":"先捡地上摔开的盒子","affectionWho":"","affection":0,"insomnia":0,"flag":"grabbed_the_dropped_box","next":""},{"text":"朝艾莉丝喊我们没事","affectionWho":"","affection":0,"insomnia":0,"flag":"signalled_all_right","next":""}]},{"type":"narration","text":"艾莉丝的仪器在三十米外开始报警。她往这边跑，一边跑一边喊让我退开。可我已经往小雅那边去了。"},{"type":"narration","text":"我伸手去抓她的时候，那只手穿过了一层很奇怪的东西——像穿过一层冷水，又像穿过一段被压缩的风。"},{"type":"narration","text":"然后整段塌方区开始动。"},{"type":"fx","fx":"shake","text":""},{"type":"narration","text":"不是地动，是「时间在动」。路边的树开始往一个方向倒，倒了又立起来；倒在地上的那块压缩管道像被倒带一样卷起来，再砸下去。"},{"type":"narration","text":"白光的边缘在往前推，推过的地方，雨滴停在半空，然后倒着往上飞。"},{"type":"choice","text":"","prompt":"时间在倒带，白光往前推。你往哪边退？","options":[{"text":"往艾莉丝那边退，把小雅先递出去","affectionWho":"小雅","affection":5,"insomnia":0,"flag":"pushed_xya_to_safety","next":""},{"text":"退到一半，回头去看那块碎片","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_back_at_shard","next":""},{"text":"不退。先数那个声音数到几","affectionWho":"","affection":0,"insomnia":0,"flag":"counted_the_voice","next":"#l05"}]},{"type":"narration","text":"我把小雅往艾莉丝那边推。她被我推出去一步，踩在实地上，然后回头看我——我看见她的眼睛已经恢复了。","label":"l05"},{"type":"narration","text":"我自己没有退出去。因为我离那块碎片只剩两米，而白光的边缘就在我脚前。"},{"type":"narration","text":"我听见一个声音。那个数数的声音，这次不快，很慢。它数到三，然后停在那儿等。"},{"type":"narration","text":"我在等它数到四。我知道数到四以后，我脚下这个东西会连着我一起收进去。"},{"type":"narration","text":"一只手从我左侧伸过来，抓住我的后领。"},{"type":"narration","text":"那一下的力很大，大得不讲道理。我整个人被甩出去三米，摔在艾莉丝脚边的泥水里。"},{"type":"choice","text":"","prompt":"被甩出去三米，抬头第一眼看谁？","options":[{"text":"看雷恩——他站的位置不对","affectionWho":"雷恩","affection":4,"insomnia":0,"flag":"saw_raine_step_in","next":""},{"text":"看小雅——她还在不在原地","affectionWho":"小雅","affection":4,"insomnia":0,"flag":"looked_for_xya","next":""},{"text":"看自己的手，刚才穿过的那层东西还黏在掌心","affectionWho":"","affection":0,"insomnia":0,"flag":"stared_at_his_hand","next":""}]},{"type":"narration","text":"我抬头的时候，雷恩已经站到那块碎片正前面了。"},{"type":"narration","text":"他把外套脱了，扔在一边。雨落在他身上，他伸出右手，手掌对着那块碎片。"},{"type":"narration","text":"他的右手完完整整地露在外面。手背到手腕之间，有一个印子。"},{"type":"narration","
