":"知道。三月二十号那个人也知道。"},{"type":"narration","text":"他说的是阿灰，十九岁。第一次封缝的时候他把手伸进缝里，之后这个世界上所有关于他的记录都被补齐成了没有这个人。"},{"type":"narration","text":"现在只有我记得他。我把他写在记录本的第二页，页角被我翻得起了毛。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_scared","text":"雷恩哥，你的手。"},{"type":"narration","text":"雷恩把手背朝外抬起来。那道烙印比平时黑，像一块刚离开火的铁正在凉下去。"},{"type":"choice","text":"","prompt":"烙印比平时黑。要不要问一句？","options":[{"text":"问。黑到什么程度必须撤下来","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"asked_the_brand_limit","next":""},{"text":"不问。他不想答的时候问了也白问","affectionWho":"雷恩","affection":-1,"insomnia":-2,"flag":"left_the_brand_unasked","next":""}]},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"它知道自己要派上用场了。它等这一天等得比我还久。"},{"type":"narration","text":"基地院子里的卡车已经发动。我们上车的时候，艾莉丝没有上。她要去研究所的主机机房。"},{"type":"narration","text":"上车之前我把记录本塞进外套内袋。三个人身上带的东西加起来只有四样：一块碎片、一台录音机、一把裁纸刀，还有艾莉丝塞给雷恩的一卷胶带。"},{"type":"narration","text":"小雅把录音机挂在脖子上，挂了两遍才挂稳。她的手在抖，抖的是手指，不是胳膊。"},{"type":"choice","text":"","prompt":"小雅的手指在抖。要不要替她减一样东西？","options":[{"text":"把录音机换成我的备用电池，让她只拿一件","affectionWho":"小雅","affection":3,"insomnia":-2,"flag":"lightened_xyas_load","next":""},{"text":"什么都不说。抖的手也按得下录音键","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"trusted_xya_shaking_hands","next":"#l04"}]},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"两条线要一起接。接上以后，撤线的手序在我这里，只有一次机会。","label":"l04"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你这是什么意思。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"意思是两条线里有一条会被留在缝里。机器余量只够撤一条，我不可能同时撤两条。"},{"type":"narration","text":"她说这句话的时候声音没有变。她一直是这样，把最难听的内容放进最平的句子里。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"撤哪一条由你决定。碎片在你手上，只有你能同时看见两条线。"},{"type":"choice","text":"","prompt":"她把撤线的决定权推给我。接不接？","options":[{"text":"接。碎片在我手里，决定就该在我手里","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"accepted_the_pull_decision","next":""},{"text":"接一半。要她答应最后一分钟之前不许自己拍板","affectionWho":"艾莉丝","affection":-3,"insomnia":-2,"flag":"demanded_alice_consult_first","next":""}]},{"type":"narration","text":"卡车开了。她站在院子里越来越小，最后喊了一句。风把句子切开一半，我听见的还是那半个：报准分钟。"},{"type":"narration","text":"城中心的路全堵着，北边的路空着，空得不正常。我们两点四十分到了塔下。"},{"type":"narration","text":"街上的车都停在原地，车门开着，人不见了。有一个穿校服的女孩站在路口举着手机拍天上那条线，拍完低头看屏幕，屏幕上什么都没有。"},{"type":"choice","text":"","prompt":"北边的路空得不正常。要不要停下来查？","options":[{"text":"停。空出来的路比堵着的路更危险","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_empty_road","next":""},{"text":"不停。十一分钟都要省着用","affectionWho":"艾莉丝","affection":2,"insomnia":-2,"flag":"saved_minutes_skipped_check","next":"#l05"}]},{"type":"narration","text":"我把她往地下通道的入口推了一把。她回头问我今天几号，没等我回答，她自己又说了一句：她记不清这个月是怎么开始的。","label":"l05"},{"type":"narration","text":"塔下的缝口比照片上大得多。它不是黑的，是那种水浸过纸的颜色。它张开的时候，周围的空气往里面走，衣服贴着人。"},{"type":"cg","background":"cg_collapse","text":"我抬头往北看。旧火车站那个方向的天被一条线分成两半，左边的楼还在，右边的楼少了三分之一，切口很平，平得像切开的豆腐。"},{"type":"fx","fx":"shake","text":""},{"type":"choice","text":"","prompt":"车站那边的天被撕开了口子。设备架在哪？","options":[{"text":"架在离缝口二十米外，留出退路","affectionWho":"","affection":0,"insomnia":-2,"flag":"set_gear_twenty_meters_off","next":""},{"text":"架到吸力边缘。看得清比躲得远要紧","affectionWho":"小雅","affection":2,"insomnia":0,"flag":"set_gear_at_the_edge","next":"#l06"}]},{"type":"narration","text":"小雅已经到了。她比我们早，站在缝口北边二十米的地方，外套脱下来叠好放在地上。","label":"l06"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"这边我守着。你回塔那边去。"},{"type":"narration","text":"通讯里先到的是雷恩的声音，然后是艾莉丝的。她报了两个坐标，又报了一个数字：还有十一分钟。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"十一分钟以后我不在机器边上了。主机撑不了更久。"},{"type":"narration","text":"我往塔下跑。跑到一半的时候，手心里那块碎片开始发烫，温度跟着天上那条线一起升。"},{"type":"fx","fx":"insomnia","text":""},{"type":"choice","text":"","prompt":"碎片在手心发烫。要不要攥紧它跑？","options":[{"text":"攥紧。发烫说明接上了","affectionWho":"","affection":0,"insomnia":0,"flag":"gripped_the_warming_shard","next":""},{"text":"先揣进兜里，让手心凉一秒再跑","affectionWho":"雷恩","affection":2,"insomnia":-3,"flag":"cooled_the_palm_briefly","next":""}]},{"type":"narration","text":"艾莉丝在通讯里数数。她数得很平，从一分钟起，每一分钟报一次。"},{"type":"narration","text":"数到第七分钟的时候，天上那条线变宽了。宽到能看见里面的东西：不是黑，也不是另一个地方，是一段被拿走的时间的形状。"},{"type":"narration","text":"里面的东西我认得。那是三月十二号傍晚的图书馆：我刚还完书，抬头看向四楼那口钟，钟体还在原位，指针早就没了，只剩两个孔。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"它在往回吃。"},{"type":"choice","text":"","prompt":"图书馆正在被折回去。要不要冲它喊？","options":[{"text":"喊。哪怕它听不懂人话","affectionWho":"","affection":0,"insomnia":0,"flag":"shouted_at_the_eating_crack","next":""},{"text":"不喊。把眼睛钉在那口钟上","affectionWho":"","affection":0,"insomnia":-2,"flag":"fixed_on_the_clock_holes","next":""}]},{"type":"narration","text":"艾莉丝在通讯里说我只说对了一半。它不是在吃这座城市，它是在把这座城市折回一个更早的版本，一个还没有我们的版本。"},{"type":"narration","text":"缝里慢慢浮出一个轮廓。这一次不需要屏幕，他就在那里站着，和空气一样高。"},{"type":"fx","fx":"flash","text":""},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"二十三天。你们比上一次多撑了二十三天。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"已经够了。现在请把你们借走的名字还回来。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"哪些名字。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"被你们记住的那些。"},{"type":"choice","text":"","prompt":"他要我们交还记住的名字。答不答他？","options":[{"text":"答：名字不是借的，是捡回来的","affectionWho":"","affection":0,"insomnia":-2,"flag":"refused_the_name_debt","next":""},{"text":"不答。先听他把条件说完","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_for_lord_terms","next":"#l07"}]},{"type":"narration","text":"我听明白了。他说的不是三万个陌生人。他说的是我们这二十三天里记住的每一样东西：一条街，一家店，一个女孩，一个把名字收进抽屉的人。","label":"l07"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"你的记性很好。这是你唯一的错。"},{"type":"dialogue","speaker":"时间领主","sprite":"lord_calm","text":"城可以留。人不行。两个锚点，你只能带走一个。"},{"type":"narration","text":"他说完这句，从缝里伸出一根手指，指了两个方向：一个指南边的火车站，一个指塔下的门洞。"},{"type":"choice","text":"","prompt":"他的手指指着两个方向。先看哪一头？","options":[{"text":"先看北边。车站那边没人守着","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"looked_north_first","next":""},{"text":"先看塔下。雷恩站在门洞里","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"looked_at_tower_first","next":""}]},{"type":"narration","text":"通讯里艾莉丝的声音开始断。她只剩最后一句有完整的音节，那三个字是：撤一条。"},{"type":"fx","fx":"shake","text":""},{"type":"choice","text":"","prompt":"两条锚线上的人，只能撤回来一条。","options":[{"text":"先撤北边车站那一条（小雅）","affectionWho":"小雅","affection":12,"insomnia":3,"flag":"pulled_xya_back","next":""},{"text":"先撤塔下门洞那一条（雷恩）","affectionWho":"雷恩","affection":12,"insomnia":3,"flag":"pulled_raine_back","next":""}]},{"type":"narration","text":"我的手按在碎片上。两条线一起进来，一条从南边，一条从北边，它们在我手心里合成一根。"},{"type":"narration","text":"我拉开了其中一条。拉的时候手心里是热的，像握住一杯刚倒满的水。另一条在我指缝里断了。"},{"type":"narration","text":"断的时候没有声音。缝口从两头往中间合，合得很慢，慢到我数清楚了七下心跳。"},{"type":"fx","fx":"wait","text":""},{"type":"narration","text":"合上的最后一下很轻，轻得像合上一本书。"},{"type":"choice","text":"","prompt":"缝合上了。通讯里先喊哪一头？","options":[{"text":"先喊北边那一个，不管有没有回声","affectionWho":"小雅","affection":3,"insomnia":-2,"flag":"called_the_north_first","next":""},{"text":"先报自己的坐标，让人找人有回声","affectionWho":"雷恩","affection":2,"insomnia":0,"flag":"broadcast_own_position","next":"#l08"}]},{"type":"narration","text":"城回来了。楼在原来的位置，影子重新指向太阳的背面。通讯里全是噪音，像一条被撕开的纸带。","label":"l08"},{"type":"narration","text":"我站在原地，把手举到自己眼前。五根手指，一块碎片，一个还在慢慢转的点。"},{"type":"narration","text":"然后我数人。数人是我现在唯一还做得稳的动作。"},{"type":"narration","text":"我数了一遍。又数了一遍。第二遍的时候，我嘴里出来的数字和心里的数字不一样。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"我们——"},{"type":"narration","text":"我用了三个字开一个句子，句子没说完。后半截的话在我嘴里变成了别的东西。"},{"type":"choice","text":"","prompt":"后半截话出不来。还要不要往下说？","options":[{"text":"要。说出来的哪怕错也行","affectionWho":"","affection":0,"insomnia":0,"flag":"forced_the_missing_name","next":""},{"text":"不要。错的比空的更像真的","affectionWho":"","affection":0,"insomnia":-3,"flag":"refused_a_wrong_name","next":""}]},{"type":"narration","text":"我记得那个人今天穿的外套颜色。我记那个人站在哪个点位上，记得喊的最后三个字是朝哪个方向喊的。"},{"type":"narration","text":"我说不出那个人的名字。"},{"type":"narration","text":"我张嘴，出来的是一句我自己听不懂的话。旁边两个人也张了嘴，他们说的句子和我一样通顺，内容也一样空。"},{"type":"narration","text":"这个世界很守规矩。少掉的人，周围的人会自动补上，补得连破口都对得齐。"},{"type":"choice","text":"","prompt":"世界在替我们补破口。让它补吗？","options":[{"text":"不让。破口我自己留着","affectionWho":"","affection":0,"insomnia":-2,"flag":"kept_the_gap_unfilled","next":""},{"text":"让它补。再拧下去我先站不稳","affectionWho":"","affection":0,"insomnia":0,"flag":"let_the_world_patch","next":"#l09"}]},{"type":"narration","text":"我伸手进口袋，摸到记录本。翻到第四页，上面有一行字，是我几分钟前写的，墨还没干。","label":"l09"},{"type":"narration","text":"我读了一遍。那三个字的笔画我认得，偏旁也认得，可我看不出它们合起来是谁。"},{"type":"narration","text":"我把本子合上了，没有再翻第二次。"},{"type":"narration","text":"过了一会儿我把它又打开，把那一页折了个三角形的角，折得很深。这是我给自己留的记号：这一页上有一个人，我读不出来是谁。"},{"type":"fx","fx":"insomnia","text":""},{"type":"choice","text":"","prompt":"你把那一页折了角。这个记号告诉别人吗？","options":[{"text":"告诉。两个人一起读，总比一个人快","affectionWho":"艾莉丝","affection":2,"insomnia":-2,"flag":"shared_the_folded_corner","next":""},{"text":"不告诉。这个记号由我一个人留","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_mark_private","next":""}]},{"type":"narration","text":"四点十五分，救护车和消防车才到。它们来的路上没有红灯，也没有堵车。这座城市已经不需要它们了。"},{"type":"narration","text":"回基地的时候天黑了。基地门口那盏灯亮着，屋里一把椅子是空的：本来能坐四个人的桌子，现在只有三个位置有人。"},{"type":"narration","text":"谁都没有把那把空椅子挪开。有人伸手把它往里推了推，推到和其他几把排齐。"},{"type":"narration","text":"艾莉丝是最后一个到的。她把一份打印好的记录放在桌上，说了今天最短的一句话。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我把今天录完了。"},{"type":"choice","text":"","prompt":"她把今天的记录放在桌上。当面翻不翻？","options":[{"text":"当面翻。趁她还在，问清楚缺了什么","affectionWho":"艾莉丝","affection":2,"insomnia":0,"flag":"read_alice_log_in_front_of_her","next":""},{"text":"先不翻。回屋自己一行一行看","affectionWho":"艾莉丝","affection":-1,"insomnia":-2,"flag":"read_alice_log_alone_later","next":"#l10"}]},{"type":"narration","text":"那份记录上写了很多行，时间精确到分钟。姓名那一栏是空的。","label":"l10"},{"type":"narration","text":"我在记录本的第五页写了一个词。我写的是「位置」，不是名字，因为名字我没有。"},{"type":"narration","text":"夜里我坐在那把空椅子对面。我想起一句话，是我在四月一号晚上听过的：明天再说。"},{"type":"narration","text":"明天到了。明天没有人再说。"},{"type":"narration","text":"我在第五页下面画了一条横线。横线下面什么都没有写，空着的那一格是留给那把椅子的。"}],"dense":true},"2-9":{"sceneId":"2-9","chapter":"第二幕·深入探索","title":"最终选择前夜","background":"bg_base_room","bgm":"bgm_sad","dense":true,"next":"3-1","lines":[{"type":"narration","text":"第二十五天，四月五号，晚上九点。基地二楼那间屋子，窗玻璃上有一道很旧的划痕，是三月十九号我们钉桌子的时候留下的。"},{"type":"narration","text":"桌子边有四把椅子。三把坐着东西，第四把空着。谁都没有把空椅子挪开，也没有人把腿伸到那把椅子下面去。"},{"type":"narration","text":"楼下坐着剩下的那个人。从下午三点开始就坐在楼梯口那一级上，没上来，也没说话。"},{"type":"choice","text":"","prompt":"他上来过一回又下去了。要下去叫他么？","options":[{"text":"下去，把他带上来。","affectionWho":"","affection":0,"insomnia":0,"flag":"went_down_to_fetch_him","next":""},{"text":"不叫。把他的椅子留在桌边。","affectionWho":"","affection":0,"insomnia":-1,"flag":"left_his_chair_in_place","next":""},{"text":"问艾莉丝他是不是一下午都在。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_he_sat_all_day","next":""}]},{"type":"narration","text":"楼梯口那级台阶是凉的。这个我知道。"},{"type":"narration","text":"艾莉丝把一台很旧的录音机放在桌中间。它的外壳裂了一道，用黑胶带粘着，胶带边上起了毛。"},{"type":"choice","text":"","prompt":"播放键按下去之前，先问什么？","options":[{"text":"问这带子里都有谁的声音。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_whose_voice_was_on_the_tape","next":""},{"text":"问她为什么留着这台机器。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_why_she_kept_the_recorder","next":""},{"text":"什么都不问。等她按。","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_the_play_key","next":""}]},{"type":"narration","text":"灯管在桌子正上方响了一声。屋子里比刚才更静。"},{"type":"narration","text":"我把两只手平放在桌上，准备好听一件我不想听的事。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"四月三号早上，我让每个人录了一段。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我说，如果今天有人回不来，剩下的录音就是那个人自己要说的话。"},{"type":"narration","text":"她按了播放键。磁带转动的第一秒有一声摩擦，像有人隔着纸咳了一下。"},{"type":"narration","text":"第一段是她自己的。录音里的她比平时慢，句子之间都留着半秒的空。"},{"type":"choice","text":"","prompt":"第一段是她自己的声音。你怎么听？","options":[{"text":"听她把话说完，不打断。","affectionWho":"","affection":0,"insomnia":0,"flag":"listened_without_interrupting","next":""},{"text":"一边听一边数她停了几次。","affectionWho":"","affection":0,"insomnia":-1,"flag":"counted_the_pauses_in_her_voice","next":""},{"text":"问这段录于什么时候。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_when_this_was_recorded","next":""}]},{"type":"narration","text":"磁带一格一格地转。转过去的每一格，都是她没当面说过的日子。"},{"type":"narration","text":"第一句是：我哥的名字叫叶嘉。编号 A-三一七。三年前他报名参加研究所第一期受试项目，项目测的是人能不能带着记忆穿过裂缝。"},{"type":"narration","text":"第二句是：第一期伤了两个人，项目停掉。第三个月，他的档案就没了。户籍里销了，研究所回答我四个字，查无此人。"},{"type":"choice","text":"","prompt":"名单上少了一个人。要问是谁么？","options":[{"text":"问被划掉的是谁。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_was_cut_first","next":""},{"text":"不问。让她把第三句说完。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_her_finish_the_third_sentence","next":""},{"text":"在本子上记下：少了一个。","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_missing_one_in_the_book","next":""}]},{"type":"narration","text":"我没有问。口袋里的笔挨着腿，有点热。"},{"type":"narration","text":"第三句是：我妈现在记得她有两个孩子。一个是我，另一个她说不出名字。她每次说到那里就停住，停的时间一年比一年长。"},{"type":"choice","text":"","prompt":"三句话，三件她没当面说过的事。先接哪一句？","options":[{"text":"把三个停顿都记住。","affectionWho":"","affection":0,"insomnia":0,"flag":"memorized_the_three_pauses","next":""},{"text":"不问。让录音自己站在那儿。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_the_recording_stand","next":"#l01"},{"text":"先在本子上记下编号。","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_the_number_in_the_book","next":"#l01"}]},{"type":"narration","text":"三句话，三个停顿。她是背过的，或者她是练过的。"},{"type":"narration","text":"我听得出来，那是念一张单子用的语气。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"这些你三月二十六号就知道了。","label":"l01"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我知道。我没有一次把全部告诉你。"},{"type":"narration","text":"她把手放在录音机上，没有按停止。录音里的她继续说下去。"},{"type":"choice","text":"","prompt":"录音里的她还在往下说。要拦住么？","options":[{"text":"拦住她，让她歇半分钟。","affectionWho":"","affection":0,"insomnia":0,"flag":"tried_to_stop_the_recording","next":""},{"text":"不拦。让她把话说完。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_her_finish_the_recording","next":""},{"text":"问后面还有几段。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_how_many_tapes_were_left","next":""}]},{"type":"narration","text":"放在机器上的那只手没有动，机器里的那个她也没有停。"},{"type":"narration","text":"她说：三月十九号，我收到一条不是研究所编号的消息。它没有署名，只有一个字母 A。它说，它可以把一个名字还回户籍。"},{"type":"narration","text":"她说：它要我做的事很简单，在每次行动前把落点和时间报给它。它不要我动任何人，也不要我打开任何一扇门。"},{"type":"choice","text":"","prompt":"报落点和时间，换一次名字。这买卖怎么接？","options":[{"text":"问那个字母A是什么的开头。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_the_letter_a_meant","next":""},{"text":"问她是怎么决定要报的。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_how_she_chose_to_report","next":""},{"text":"不说话。看她放在机器上的手。","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_quiet_about_the_report","next":""}]},{"type":"narration","text":"字母A。我在嘴里过了一遍，没有把它念出声。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我报了四次。第一次三月十九号，最后一次四月一号。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"四次以后它回了我一张纸。"},{"type":"narration","text":"她把那张纸从口袋里拿出来，放在桌上，推到桌子中间。纸很新，只折过一次，折痕是竖的。"},{"type":"narration","text":"上面是手写的三个字。字迹很齐，每一笔都收在同一高度，像照着什么东西描过。"},{"type":"choice","text":"","prompt":"三个字，笔画齐得不像人手写的。敢碰么？","options":[{"text":"拿起来，翻到背面看。","affectionWho":"","affection":0,"insomnia":0,"flag":"turned_alices_paper_over","next":""},{"text":"不碰。凑近了照着读。","affectionWho":"","affection":0,"insomnia":-1,"flag":"read_the_paper_from_where_it_lay","next":""},{"text":"请她把那三个字念出来。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_her_to_read_the_characters","next":""}]},{"type":"narration","text":"那三个字躺在灯底下。笔画很齐，齐得有了边。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"你验过么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_tired","text":"我拿去户籍窗口问过一次。窗口的人查了二十分钟，出来跟我说，系统里没有这个人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"然后他从抽屉里抽出一张手写的登记表，说，如果是老案子，要看纸的。"},{"type":"choice","text":"","prompt":"窗口说查无此人，抽屉里却有这张表。信哪边？","options":[{"text":"信那张手写的表。","affectionWho":"","affection":0,"insomnia":0,"flag":"believed_the_paper_form","next":""},{"text":"信窗口的系统。","affectionWho":"","affection":0,"insomnia":0,"flag":"believed_the_registry_window","next":""},{"text":"都不信。问她填进去的是什么。","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_what_she_filled_in","next":"#l02"}]},{"type":"narration","text":"系统和纸在抢一个人。抢来抢去，那个人本人不在场。"},{"type":"narration","text":"她说到这儿我才把两件事连上。对方给她的不是一份证明，是一个位置。","label":"l02"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"一个空着的位置。往里填什么名字，由我来决定。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"你填了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"我填了。"},{"type":"choice","text":"","prompt":"两个填了，一个出自你一个出自她。往下问么？","options":[{"text":"问她是什么时候填的。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_when_the_name_was_filled","next":""},{"text":"承认自己早该问这一句。","affectionWho":"","affection":0,"insomnia":-1,"flag":"admitted_the_question_was_late","next":""},{"text":"不问。等她自己把名字说出来。","affectionWho":"","affection":0,"insomnia":0,"flag":"waited_for_the_name_to_be_said","next":""}]},{"type":"narration","text":"灯管又响了一下，像是替我们把这句话说完了。"},{"type":"narration","text":"灯管响了一下。我看着她，忽然发现她已经不是三月十三号在实验舱里跟我说话的那个人了。"},{"type":"narration","text":"那天她说自己只有三块碎片，说她的工作是记录。今天我知道她还做另外一份工作：她给一个人递时间，那个人替她填一个名字。"},{"type":"choice","text":"","prompt":"她已经不是三月十三号那个人了。这话说不说？","options":[{"text":"说出来：你变了。","affectionWho":"","affection":0,"insomnia":0,"flag":"told_her_she_had_changed","next":""},{"text":"不说。把这个念头收好。","affectionWho":"","affection":0,"insomnia":-1,"flag":"filed_the_thought_away","next":""},{"text":"问她知不知道自己变了。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_she_knew_it_herself","next":""}]},{"type":"narration","text":"这句话我翻来覆去过了两遍。第二遍，它已经不是疑问句了。"},{"type":"cg","background":"cg_truth_reveal","text":"桌上三样东西摆在一起：我的手心里那块碎片，那张手写的登记表，还有我摊开的记录本。灯从上面照下来，三样东西的影子落在同一块桌面上，长短一样，像三份同一件事的抄本。"},{"type":"fx","fx":"flash","text":""},{"type":"narration","text":"她按了快进。磁带咔哒咔哒地走，走到第二段。"},{"type":"narration","text":"第二段一开始是人的声音，很平常的调子，说的是自己的事。说到第三句的时候，声音突然空了一下。"},{"type":"choice","text":"","prompt":"声音在第三句上突然空了。要不要按停？","options":[{"text":"按停，等它自己回来。","affectionWho":"","affection":0,"insomnia":0,"flag":"stopped_before_the_silence","next":""},{"text":"不按。把空白听完。","affectionWho":"","affection":0,"insomnia":-1,"flag":"listened_through_the_blank","next":""},{"text":"倒回去，重听前两句。","affectionWho":"","affection":0,"insomnia":0,"flag":"replayed_the_first_two_sentences","next":""}]},{"type":"narration","text":"空白不是杂音。空白是一个洞，洞有边，边上还挂着东西。"},{"type":"narration","text":"不是机器坏了。是那一段带子本身没有内容：十一秒的空白，连电流声都被抹掉了。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"十一秒。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"里面有名字。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"有两个。一个是他自己的，一个是他想告诉我们的人的。"},{"type":"choice","text":"","prompt":"两个名字被吃掉了。问不问他是谁？","options":[{"text":"问他想告诉我们的那个人是谁。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_he_meant_to_tell","next":""},{"text":"不问。把空白再听一遍。","affectionWho":"","affection":0,"insomnia":-1,"flag":"listened_to_the_blank_again","next":"#l03"},{"text":"在本子上写下：两个名字。","affectionWho":"","affection":0,"insomnia":0,"flag":"noted_two_names_lost","next":"#l03"}]},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_shock","text":"他想告诉我们的那一个，他说成了么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"没有。空白吃掉了后半句。"},{"type":"narration","text":"我把那十一秒从头听到尾。听的时候手心里那块碎片在转。空白里不是没有东西，是东西被拿走以后剩下的那个形状。","label":"l03"},{"type":"narration","text":"我在那个形状里看见一点画面：一个车站，早班车，站台上有一个人在等另一个人。等的是谁，被等的是谁，我都看不出来。"},{"type":"choice","text":"","prompt":"空白里你看见一个站台。这件事说么？","options":[{"text":"不说。把它压回自己这里。","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_station_vision","next":""},{"text":"问艾莉丝听出别的没有。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_if_she_heard_it","next":""},{"text":"摸一下口袋里的碎片，不说话。","affectionWho":"","affection":0,"insomnia":-1,"flag":"held_the_fragment_while_lying","next":""}]},{"type":"narration","text":"话到嘴边，排成一排，又一支一支退回去了。"},{"type":"narration","text":"这些我没有说出口。我说出口的是另外一句，句子通顺，和我想说的一点关系都没有。"},{"type":"narration","text":"第三段是剩下那个人的。艾莉丝把录音机推到桌子中间，让我自己按。"},{"type":"narration","text":"我按了。第三段很长，四分钟，说的都是自己的事，说的都是那种藏了很久、藏到自己都快忘了的小事。"},{"type":"choice","text":"","prompt":"四分钟的小事。要记多少？","options":[{"text":"记住声音，不记内容。","affectionWho":"","affection":0,"insomnia":0,"flag":"remembered_the_voice_only","next":""},{"text":"什么都不记，让它过去。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_the_words_pass","next":""},{"text":"决定完事以后当面问他。","affectionWho":"","affection":0,"insomnia":0,"flag":"planned_to_ask_him_afterwards","next":""}]},{"type":"narration","text":"我记住了那个屋顶。屋顶是谁家的我不知道，我只记住了颜色。"},{"type":"narration","text":"这四分钟我没有把它写下来，也没有转述给任何人。有些话说出来就变成证据了，这句话是四月一号学的。"},{"type":"narration","text":"录音放完，磁带自己停住。屋子里只剩下灯管的声音，还有楼下那扇门被风吹得轻轻碰了一下的声音。"},{"type":"fx","fx":"wait","text":""},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"今天我要把你量一遍。"},{"type":"narration","text":"她拿出一本很厚的本子。写我的那一页夹着一张折了很多次的纸，边角已经软了。她念的时候不看我。"},{"type":"choice","text":"","prompt":"她要量你。怎么配合？","options":[{"text":"袖子挽起来，让她量。","affectionWho":"","affection":0,"insomnia":0,"flag":"offered_the_arm_for_measuring","next":""},{"text":"先问她量的是哪几样。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_the_measuring_meant","next":""},{"text":"把本子推过去，让她从纸上量。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_the_book_be_measured","next":""}]},{"type":"narration","text":"本子比我想的厚。夹页的折痕，比我的记录本还多。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"三月十二号。第一天你在图书馆碰了碎片。那天晚上你睡了六个小时，是这二十五天里最后一个整觉。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"三月十四号到三月十八号，五天，你合起来睡了四个小时。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"三月二十号封缝以后到今天，十六天。你睡了两个小时四十分钟，是二十号回来那辆车里睡的，我掐了表。"},{"type":"choice","text":"","prompt":"她连你睡了几小时都计时。认不认？","options":[{"text":"认。让她把数字写下去。","affectionWho":"","affection":0,"insomnia":0,"flag":"accepted_the_timed_sleep","next":""},{"text":"问她这些数是谁让她记的。","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_who_asked_her_to_time","next":""},{"text":"纠正她：那不是睡，是昏过去。","affectionWho":"","affection":0,"insomnia":0,"flag":"corrected_it_was_fainting","next":""}]},{"type":"narration","text":"数字摊在桌上。它比我们谁都老实。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"二十五天里你丢掉的整段时长一共是三十小时零十四分钟。三十小时是第一次，剩下的十四分钟是每次过裂缝时被拿走的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"你记得的被抹掉的人，三个。你写在记录本上的名字，三个。第四个你写了，读不出来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你的瞳孔从三月十四号早上就是这个颜色。这二十五天里我没有见过第二个人撑这么久。"},{"type":"choice","text":"","prompt":"第四个名字读不出来。现在翻开看么？","options":[{"text":"翻开，当场再读一次。","affectionWho":"","affection":0,"insomnia":0,"flag":"opened_the_fourth_name","next":""},{"text":"不翻。让它盖着。","affectionWho":"","affection":0,"insomnia":-1,"flag":"closed_over_the_fourth_name","next":""},{"text":"把本子推给艾莉丝，请她读。","affectionWho":"","affection":0,"insomnia":0,"flag":"handed_the_book_for_reading","next":""}]},{"type":"narration","text":"封皮的角磨白了。写着我名字的那一页不用翻开，我也知道上面有什么。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"失眠曲线上的数字是七十四。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"八十是崩解。你还有六格。"},{"type":"narration","text":"她说完把笔合上。手指在笔杆上停了一秒，那一秒里她想说的不是这些数字。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"六格够做多少事。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"够做完一件事。做完之后你会变成什么，我不知道。没有人回来告诉过我。"},{"type":"choice","text":"","prompt":"没有人回来告诉过她。这句接不接？","options":[{"text":"接：我会回来告诉你。","affectionWho":"","affection":0,"insomnia":0,"flag":"promised_to_come_back_telling","next":""},{"text":"不接。让这句话躺在桌上。","affectionWho":"","affection":0,"insomnia":-1,"flag":"left_the_promise_unmade","next":""},{"text":"问她要是没人回来呢。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_if_no_one_returned","next":""}]},{"type":"narration","text":"这句话在空气里停了一会儿。没有人伸手去拿它。"},{"type":"narration","text":"她说的没有人里包括她哥。说这句话的时候她没有低头，可我看见她放下笔的动作被放得很慢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"所以明天那套方案要做到一件事：让你用手的次数降到最少。"},{"type":"narration","text":"明天是四月六号。我们要在这间屋子里定下一套方案，把下一步怎么走写死在纸上。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"我需要两样东西。"},{"type":"choice","text":"","prompt":"两样东西。要一口气说完么？","options":[{"text":"一口气说完。","affectionWho":"","affection":0,"insomnia":0,"flag":"named_both_things_at_once","next":""},{"text":"先说一样，看她脸色再说第二样。","affectionWho":"","affection":0,"insomnia":-1,"flag":"held_one_thing_back_to_watch","next":""},{"text":"请她先猜一样。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_her_to_guess_first","next":""}]},{"type":"narration","text":"这两样东西我在喉咙里排练了一下午。说出来的时候，比排练的平静。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_resolve","text":"第一样是这张登记表。我要用它填一个名字，填成真的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"第二样。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"第二样是把那把空椅子留在桌子边。明天开会的时候，谁也不许把它挪走。"},{"type":"choice","text":"","prompt":"空椅子的事，要给她一个理由么？","options":[{"text":"给：那把椅子是给谁的。","affectionWho":"","affection":0,"insomnia":0,"flag":"explained_the_empty_chair","next":""},{"text":"不给。让她自己推。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_the_chair_be_pushed","next":""},{"text":"改口说椅子谁也不给。","affectionWho":"","affection":0,"insomnia":0,"flag":"said_the_chair_was_for_no_one","next":""}]},{"type":"narration","text":"有些问题一开口就要答案。我们俩今晚的库存都不够。"},{"type":"narration","text":"她没有问为什么。她只是把那把空椅子往桌子边推了半寸，推到和另外三把一样齐。"},{"type":"narration","text":"九点四十分，她起身去关窗。关之前往外看了一眼，停了两秒。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"楼下那位在楼梯口坐了一整天。"},{"type":"choice","text":"","prompt":"他在楼梯口坐了一整天。这句怎么答？","options":[{"text":"说散会以后我下去。","affectionWho":"","affection":0,"insomnia":0,"flag":"promised_to_go_down_later","next":""},{"text":"不答。低头在本子上写日期。","affectionWho":"","affection":0,"insomnia":-1,"flag":"answered_with_the_pen","next":""},{"text":"问他坐的是哪一级台阶。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_which_step_he_sat","next":""}]},{"type":"narration","text":"楼下那级台阶没有灯。我知道那一级的形状，我坐过一次。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"我知道。他不用上来。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"你去吗。"},{"type":"narration","text":"我没有回答。我把记录本翻到最后一页，那一页上还什么都没写。"},{"type":"narration","text":"我在最上面写了一行日期：四月五号。日期下面留出一格空白。"},{"type":"choice","text":"","prompt":"留出的那一格，先放什么进去？","options":[{"text":"先写明天。","affectionWho":"","affection":0,"insomnia":0,"flag":"wrote_tomorrow_in_the_gap","next":""},{"text":"先画一道线，什么都不写。","affectionWho":"","affection":0,"insomnia":-1,"flag":"drew_a_line_instead","next":""},{"text":"空着。把本子合上再说。","affectionWho":"","affection":0,"insomnia":0,"flag":"left_the_gap_empty","next":""}]},{"type":"narration","text":"笔尖悬在格子上方。格子很小，能放进去的东西比格子大。"},{"type":"narration","text":"这一格本来该留给名字。三个名字已经写满了，第四个名字写在本子上，可我已经读不出来。"},{"type":"narration","text":"我把笔尖放进那一格里，停了很久。最后我写下的不是名字，是两个字：明天。"},{"type":"choice","text":"","prompt":"两个字，一格。要翻回第一页么？","options":[{"text":"翻回去，把三个名字再读一遍。","affectionWho":"","affection":0,"insomnia":0,"flag":"reread_the_three_names","next":""},{"text":"不翻。把笔帽按上。","affectionWho":"","affection":0,"insomnia":-1,"flag":"capped_the_pen_instead","next":""},{"text":"把碎片压在合上的本子上。","affectionWho":"","affection":0,"insomnia":0,"flag":"pressed_the_fragment_on_the_book","next":""}]},{"type":"narration","text":"写过的字在封皮底下发着一点热。那一页没有合严，它等着下一页。"},{"type":"narration","text":"写完我合上本子。手心里那块碎片是凉的，凉得像三月十二号那天我第一次在三楼摸到它。"},{"type":"narration","text":"楼下有脚步声响起来。那个人上楼了，走到门口，没有进来。影子从门缝下面伸进来一小截，停在三秒那么长的地方。"},{"type":"dialogue","speaker":"林晓","sprite":"linxiao_tired","text":"进来坐。"},{"type":"choice","text":"","prompt":"门没有开。要追出去么？","options":[{"text":"追出去，在楼梯口拦住他。","affectionWho":"","affection":0,"insomnia":0,"flag":"went_to_the_stairwell","next":""},{"text":"不追。对着门缝说：回头。","affectionWho":"","affection":0,"insomnia":-1,"flag":"said_later_to_the_shadow","next":""},{"text":"把刚才那两个字，隔着门说一遍。","affectionWho":"","affection":0,"insomnia":0,"flag":"spoke_tomorrow_to_the_door","next":""}]},{"type":"narration","text":"门保持着关着。屋子里比刚才又冷了一点。"},{"type":"narration","text":"门没有开。影子又停了三秒，然后顺着走廊往那头去了。"},{"type":"fx","fx":"insomnia","text":""},{"type":"narration","text":"十一点，屋子里只剩我一个人。灯还亮着。我把眼睛闭上试了一下，蓝色从眼睑后面透出来。"},{"type":"narration","text":"二十五天以前我以为失眠只是睡不着。现在我知道失眠是把醒着的时间一段一段交出去，交到某一天你连自己交了什么都说不出。"},{"type":"choice","text":"","prompt":"它不叫你的脑子停。你让它停在哪？","options":[{"text":"停在明天的路线上。","affectionWho":"","affection":0,"insomnia":0,"flag":"made_it_stop_on_the_route","next":""},{"text":"停在三个名字上。","affectionWho":"","affection":0,"insomnia":-1,"flag":"made_it_stop_on_the_names","next":""},{"text":"不管它。让它自己跑。","affectionWho":"","affection":0,"insomnia":0,"flag":"let_the_mind_run_free","next":""}]},{"type":"narration","text":"我从桌上的东西开始数。数到第七样，屋子还在转，但转得慢了一点。"},{"type":"narration","text":"我交出去的是三十二个小时和三个名字。第四个名字在我的本子上，我已经读不出那三个字拼起来是谁。"},{"type":"narration","text":"我把手放在记录本上，没有翻开。窗外的城市亮着灯，七分钟里没有一辆车经过。"},{"type":"choice","text":"","prompt":"今晚怎么过？","options":[{"text":"关灯躺两个小时，把数字压到七十以下","affectionWho":"艾莉丝","affection":5,"insomnia":-6,"flag":"slept_before_final_battle","next":""},{"text":"一夜不睡，把能读出来的名字背到天亮","affectionWho":"艾莉丝","affection":-2,"insomnia":5,"flag":"kept_awake_for_names","next":""}]},{"type":"narration","text":"我把灯关了。院子里有一盏路灯，光从窗帘的缝里进来，在地上落成一条细线。"},{"type":"narration","text":"躺下之前我把记录本放在枕头边。这个动作二十五天里做过很多次，只有今天放的时候手没有抖。"},{"type":"narration","text":"明天早上八点，我们三个人要坐在那张桌子前面。桌子边有四把椅子，那把空椅子会和另外三把排齐，等着看明天谁先坐下。"},{"type":"narration","text":"我在心里数了一遍椅子。四把。这一次我数得很慢，慢到每一个数字都落得住。"}]},"3-1":{"sceneId":"3-1","chapter":"第三幕·最终决战","title":"团队会议","background":"bg_base_room","bgm":"bgm_tension","dense":true,"next":"3-1a","lines":[{"type":"narration","text":"第二十六天，四月六号，上午九点。我们从三号那天起就没有回过研究所。这三天我们四个人睡在同一间地下室里，睡的时间加起来不到十个小时。"},{"type":"narration","text":"四月三号以后，城里的规则变了。地面上从晚上八点到早上六点宵禁，公交车减到三分之一，几条主干道围着黄带子，带子上印的不是「危险」，是「施工」。"},{"type":"choice","text":"","prompt":"规则变了。先检查什么？","options":[{"text":"检查本子里的名字还在不在。","affectionWho":"","affection":0,"insomnia":0,"flag":"checked_the_names_survived","next":""},{"text":"摸一下碎片还是不是凉的。","affectionWho":"","affection":0,"insomnia":-1,"flag":"checked_the_fragment_temperature","next":""},{"text":"什么都不查。先坐下。","affectionWho":"","affection":0,"insomnia":0,"flag":"sat_before_checking","next":""}]},{"type":"narration","text":"记录本在口袋里。它还在，我摸得到它的角。"},{"type":"narration","text":"大家都说那是煤气管道爆了。只有我们四个知道，那一段路上原来是有一整条街的。"},{"type":"narration","text":"今天早上我们要开会。会议的起因很简单：研究所已经把这件事列为「重大城市事件」，换句话说，他们准备自己动手。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"先说结论。昨晚我收到两份东西。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"第一份是研究所的内部通知，他们要在一周内对时间核心做一次「清空」。操作方式是直接把核心拆下来运走。"},{"type":"choice","text":"","prompt":"碎片要在四号前收走。你口袋里那块怎么办？","options":[{"text":"不上交。继续贴身带着。","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_the_fragment_unlisted","next":""},{"text":"问什么才算碎片。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_counted_as_a_fragment","next":""},{"text":"交小留大，先过今天。","affectionWho":"","affection":0,"insomnia":-1,"flag":"surrendered_the_small_pieces","next":""}]},{"type":"narration","text":"我按住口袋。里面那块没有动，我也没有动。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"拆下来以后呢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"运走，封存在城北的仓库。所有还没被删干净的东西，会跟着它一起被封起来。"},{"type":"narration","text":"地下室里有张长桌，桌上摊着这两天我们能弄到的全部东西：两套管网图、三块碎片残渣、艾莉丝的仪器、小雅的笔记本，还有我那个写满了名字的本子。"},{"type":"choice","text":"","prompt":"东西分成两堆。你的放哪边？","options":[{"text":"放她那堆，一起算。","affectionWho":"","affection":0,"insomnia":0,"flag":"put_things_on_alices_side","next":""},{"text":"放中间，谁也不属于。","affectionWho":"","affection":0,"insomnia":-1,"flag":"put_things_in_the_middle","next":""},{"text":"先不摆出来。","affectionWho":"","affection":0,"insomnia":0,"flag":"kept_things_put_away","next":""}]},{"type":"narration","text":"两堆各有各的排法。桌子中间空着一条，像一条河。"},{"type":"narration","text":"第二份东西是一张手写的便条，昨晚有人从地下室的门缝底下塞进来的。便条上只有一句话：明天上午，我来说清楚。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"署名呢。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"没有署名。但字的笔压和我们见过的一份文件一样。"},{"type":"choice","text":"","prompt":"没有署名的便条。要猜名字么？","options":[{"text":"把猜到的名字说出口。","affectionWho":"","affection":0,"insomnia":0,"flag":"spoke_the_guessed_name","next":""},{"text":"不猜。等人自己上门。","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_the_note_writer","next":"#l01"},{"text":"问这算谁的笔迹。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_whose_handwriting_it_was","next":""}]},{"type":"narration","text":"没有人说出名字。地下室静了两秒，让窗外的雨声填满了。"},{"type":"narration","text":"九点零七分，地下室的门被敲了两下。敲门的节奏很短，两下之间隔了半秒，像是有人在礼貌和着急之间取了个中间值。","label":"l01"},{"type":"narration","text":"门开进来的人是维拉。守望者的负责人，四十岁上下，穿着和雷恩一样的深色外套，外套上没有队标。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"便条是我写的。坐下说。"},{"type":"choice","text":"","prompt":"她承认便条。先逼她么？","options":[{"text":"问她为什么不署名。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_why_no_signature","next":""},{"text":"问她怎么找到这里的。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_how_she_found_the_base","next":""},{"text":"不逼。等她先把袋子放下。","affectionWho":"","affection":0,"insomnia":-1,"flag":"waited_for_her_to_open_up","next":""}]},{"type":"narration","text":"这句话把屋子按住了。没有人替她拉椅子。"},{"type":"narration","text":"她没有寒暄。她把一个很旧的牛皮纸袋放在桌上，袋口用线缠了三圈，缠得很紧，像是怕里面的东西自己跑出来。"},{"type":"choice","text":"","prompt":"她带着一个纸袋。先问袋子里是什么么？","options":[{"text":"问袋子里装的是什么。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_whats_in_the_paper_bag","next":""},{"text":"看袋子，不问。","affectionWho":"","affection":0,"insomnia":-1,"flag":"looked_at_the_bag_silently","next":""},{"text":"问她盯了我们多久。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_how_long_she_watched_us","next":""}]},{"type":"narration","text":"袋子放在桌子上。没有人伸手去拿它。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_smile","text":"守望者从三年前就在找时间核心的入口。找到过两次，两次都只差最后一步。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"第一次的队长姓雷恩。他带了七个人进去，回来一个。"},{"type":"choice","text":"","prompt":"七个人进去，回来一个。这句怎么接？","options":[{"text":"把手搭在雷恩的手腕上。","affectionWho":"雷恩","affection":3,"insomnia":0,"flag":"steadied_raine_under_the_table","next":""},{"text":"不动。把数字听完。","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_listening_to_the_count","next":""},{"text":"问那六个人叫什么。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_the_six_were","next":""}]},{"type":"narration","text":"数字七还挂在屋子里。没有人去把它摘下来。"},{"type":"narration","text":"雷恩的手在桌面上收了一下。他没有抬头，可他收手那一下的动静比任何一句话都响。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_smile","text":"第二次是去年冬天。那次连回来的都没有。所以守望者现在只剩我一个。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"我的立场很简单：核心必须有人亲手碰到。研究所那套清空的操作，成功率是零。"},{"type":"choice","text":"","prompt":"她要有人亲手碰核心。这句答不答？","options":[{"text":"问碰是什么意思。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_touching_meant","next":""},{"text":"说会有人去碰。","affectionWho":"","affection":0,"insomnia":-1,"flag":"said_someone_would_touch_it","next":""},{"text":"问她自己碰过什么。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_what_she_had_touched","next":""}]},{"type":"narration","text":"碰这个字在我嘴里太轻了。我不敢把它给任何人。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"你怎么知道是零。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"因为核心不认设备，只认同类。这是守望者用两条命换来的结论。"},{"type":"narration","text":"她把纸袋里的东西抽出来。里面是三块透明的小方块，每块里面都封着一样很普通的东西：一枚扣子、一段电线、半张车票。"},{"type":"choice","text":"","prompt":"三个小方块，编号磨浅了。要上手么？","options":[{"text":"拿起一个，对着灯看编号。","affectionWho":"","affection":0,"insomnia":0,"flag":"lifted_a_worn_cube","next":""},{"text":"不上手。凑近了看。","affectionWho":"","affection":0,"insomnia":-1,"flag":"read_the_cubes_from_above","next":""},{"text":"问编号是被谁的手磨浅的。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_whose_hands_wore_them","next":""}]},{"type":"narration","text":"编号上的磨损是别人过的日子。我没有权利借。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_smile","text":"这三个是三个人在裂缝里最后碰到的东西。它们现在还在这儿，是因为有人还记得他们。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"你早就知道删掉的人不会真的没有。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"我知道。但我没能力把人捞回来，所以我只能留着这些东西。"},{"type":"choice","text":"","prompt":"她把记录交给有能力的人。怎么接？","options":[{"text":"说我们可能也没有能力。","affectionWho":"","affection":0,"insomnia":0,"flag":"doubted_our_own_ability","next":""},{"text":"问她想要什么回报。","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_for_the_price_first","next":""},{"text":"说：你已经试过很多次了。","affectionWho":"维拉","affection":2,"insomnia":0,"flag":"thanked_her_for_trying","next":""}]},{"type":"narration","text":"我接下了话，没有接袋子。袋子要由她自己打开。"},{"type":"narration","text":"她说完这句，把三块小方块推到桌子中间，谁也没有碰。地下室的灯管响了一下，那声响把桌上的灰震下来一层。"},{"type":"narration","text":"会议是这时候才真正开始的。因为维拉把方案摊开以后，我们四个人第一次发现，我们并不在同一个方向上。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"我反对直接碰核心。核心是删除的执行端，碰它等于把自己写进删除名单。"},{"type":"choice","text":"","prompt":"她把结果指在墙上。要看墙么？","options":[{"text":"看那面墙。","affectionWho":"","affection":0,"insomnia":0,"flag":"looked_at_the_yellow_tape","next":""},{"text":"不看墙，只看她。","affectionWho":"","affection":0,"insomnia":-1,"flag":"kept_eyes_on_her","next":""},{"text":"问名单是谁第一个贴上去的。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_pinned_the_list","next":""}]},{"type":"narration","text":"黄带子的边已经翘起来了。翘起来的那一角，朝里。"},{"type":"narration","text":"艾莉丝说这话的时候，手里没有拿任何东西。她平时总是拿着仪器的。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_cold","text":"我的方案是先用核心的读取口，把被删掉的人从残留里提出来，一次一个。提出来的人有名字、有落点，删除就不成立。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"时间不够。读取口的功率你算过没有。"},{"type":"choice","text":"","prompt":"功率、时间，都是数字。要插你的数么？","options":[{"text":"说你能读得比四十秒快。","affectionWho":"","affection":0,"insomnia":0,"flag":"offered_faster_reading","next":""},{"text":"不说。让两个数字自己吵。","affectionWho":"","affection":0,"insomnia":-1,"flag":"let_the_numbers_argue","next":""},{"text":"问功率不够会怎么样。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_about_power_failure","next":""}]},{"type":"narration","text":"我没有加进去。两个数字在打架，加进我的那个只会多输一次。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_worried","text":"算过。一个名字要四十秒。按我手上的名单，全场提完要十一个小时。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_alert","text":"十一个小时以后，我们全在名单上。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我的方案不一样。我带两个人进去，把守卫的方向引开，剩下的人在读取口动手。"},{"type":"choice","text":"","prompt":"他把自己写成诱饵。先问哪一头？","options":[{"text":"问另两个名额给谁。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_the_two_would_be","next":""},{"text":"先记下来，回头再问。","affectionWho":"","affection":0,"insomnia":-1,"flag":"noted_the_lure_plan","next":"#l02"},{"text":"问他打算怎么引。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_how_he_would_lure","next":""}]},{"type":"narration","text":"方案摊在桌上。引开这个字，比读取那个字重。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_tired","text":"引开守卫这件事，守望者熟。我去过一次，知道那道门在哪儿。","label":"l02"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"你上次进去是被人拖出来的。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"所以我记得路。"},{"type":"choice","text":"","prompt":"他记得路。信这条信么？","options":[{"text":"信。让他带路。","affectionWho":"","affection":0,"insomnia":0,"flag":"believed_the_remembered_road","next":""},{"text":"请他把路画在图上。","affectionWho":"","affection":0,"insomnia":-1,"flag":"asked_him_to_draw_the_road","next":""},{"text":"说你也记得一段路。","affectionWho":"","affection":0,"insomnia":0,"flag":"claimed_the_same_memory","next":""}]},{"type":"narration","text":"记得路和走得脱是两回事。我把这两回事都记进了本子。"},{"type":"narration","text":"小雅一直没有说话。她坐在桌子的末端，把三个小方块摆成一排，从左到右看了很多遍。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_determined","text":"你们吵的其实不是方案。"},{"type":"dialogue","speaker":"小雅","sprite":"xya_curious","text":"你们吵的是先救谁。艾莉丝想先救那些人，雷恩想先救我们。"},{"type":"choice","text":"","prompt":"她把真正的问题说破了。撑她么？","options":[{"text":"朝小雅点头。","affectionWho":"小雅","affection":3,"insomnia":0,"flag":"nodded_at_xyas_question","next":""},{"text":"说这不是先救谁的问题。","affectionWho":"","affection":0,"insomnia":-1,"flag":"denied_the_order_question","next":""},{"text":"问她会先选哪一边。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_her_which_first","next":""}]},{"type":"narration","text":"小雅这句话比我们的都站得直。我没有把它接起来，我让它躺在地上。"},{"type":"narration","text":"她说得很平。她把这句话说完以后，桌边四个人都没有立刻接。"},{"type":"dialogue","speaker":"艾莉丝","sprite":"alice_calm","text":"不是先救谁的问题。是不提出来，我们就是在替他们做决定。"},{"type":"dialogue","speaker":"雷恩","sprite":"raine_serious","text":"我们替人做决定已经做了三号那天那一次。结果在黄带子里。"},{"type":"choice","text":"","prompt":"结果在黄带子里。这句怎么接？","options":[{"text":"说错的不是决定，是情报。","affectionWho":"","affection":0,"insomnia":0,"flag":"blamed_the_information_not_choice","next":""},{"text":"不接。让这句话落地。","affectionWho":"","affection":0,"insomnia":-1,"flag":"stayed_silent_at_the_tape","next":""},{"text":"问三号那天是谁做的决定。","affectionWho":"","affection":0,"insomnia":0,"flag":"asked_who_decided_on_the_third","next":""}]},{"type":"narration","text":"我想起艾莉丝在桌子底下的手指。这句话我不敢快答。"},{"type":"narration","text":"这句话落地的时候，我看见艾莉丝的手指在桌子底下收紧了一下。那个女人是她的母亲。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_smile","text":"你们吵得都对。但今天必须有一个能执行的东西。"},{"type":"narration","text":"她把那三块小方块收回去，放进纸袋，重新缠上线。她做这件事的时候很慢，像在为接下来的话留出位置。"},{"type":"choice","text":"","prompt":"桌上空出一个位置。要填么？","options":[{"text":"把手放在空位上。","affectionWho":"","affection":0,"insomnia":0,"flag":"laid_hand_on_the_empty_spot","next":""},{"text":"把本子压上去填了它。","affectionWho":"","affection":0,"insomnia":-1,"flag":"filled_the_spot_with_the_book","next":""},{"text":"不填。让它空着。","affectionWho":"","affection":0,"insomnia":0,"flag":"left_the_spot_empty","next":""}]},{"type":"narration","text":"空位是留着的东西。填得太快，会忘记它原来是谁。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_cold","text":"守望者能提供两样：一条不怎么体面的进入路线，和一次性的干扰器。干扰器只能响三分钟。"},{"type":"dialogue","speaker":"维拉","sprite":"vera_smile","text":"除此之外我给不了你们任何保证。进那道门以后，我不会替任何人回头。"},{
