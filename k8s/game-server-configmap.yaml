apiVersion: v1
kind: ConfigMap
metadata:
  name: game-server-config
  namespace: production
data:
  log.level: "info"
  app-config.json: |
    {
      "server": {
        "port": 3000,
        "env": "production"
      },
      "retry": {
        "maxRetries": 3,
        "initialDelayMs": 1000,
        "maxDelayMs": 4000
      },
      "logging": {
        "level": "info",
        "format": "json",
        "output": {
          "console": true,
          "file": true
        }
      }
    }
