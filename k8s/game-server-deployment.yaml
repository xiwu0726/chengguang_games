apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: production
  labels:
    app: game-server
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: game-server
      version: v1
  template:
    metadata:
      labels:
        app: game-server
        version: v1
    spec:
      containers:
      - name: game-server
        image: game-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: game-server-config
              key: log.level
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: game-server-config
          items:
          - key: app-config.json
            path: app-config.json
      restartPolicy: Always
