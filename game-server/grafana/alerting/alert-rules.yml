apiVersion: 1

groups:
  - name: game-server-alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
          /
          sum(rate(http_requests_total[5m])) by (job)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{job="game-server"} == "OPEN"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is OPEN"
          description: "Circuit breaker for game-service is OPEN"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "p95 latency is {{ $value }}s (threshold: 1s)"

      - alert: GameServerDown
        expr: up{job="game-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Game server is down"
          description: "Game server has been down for more than 1 minute"

      - alert: DegradedModeEnabled
        expr: degraded_mode_enabled{job="game-server"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Degraded mode is enabled"
          description: "Server is in degraded mode"
